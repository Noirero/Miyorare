plugins {
    id 'com.android.application' version '9.2.1'
}

def sdkAar = providers.gradleProperty('discordSocialSdkAar')
    .map { file(it) }
    .orNull
if (sdkAar == null || !sdkAar.isFile()) {
    throw new GradleException('Set -PdiscordSocialSdkAar to the official Android discord_partner_sdk.aar (Social SDK 1.10+).')
}

def discordApplicationId = providers.gradleProperty('discordPresenceAppId').getOrElse('1444242650067894303')
if (!(discordApplicationId ==~ /[1-9][0-9]{16,18}/) || !discordApplicationId.isLong()) {
    throw new GradleException('Set -PdiscordPresenceAppId to a registered Discord Application ID.')
}

android {
    namespace = 'org.noirero.miyorare.presenceprototype'
    compileSdk {
        version = release(37) {
            minorApiLevel = 0
        }
    }

    defaultConfig {
        applicationId = 'org.noirero.miyorare.presenceprototype'
        minSdk = 26
        targetSdk = 37
        versionCode = 1
        versionName = '0.1'
        buildConfigField 'long', 'DISCORD_APPLICATION_ID', discordApplicationId + 'L'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildFeatures {
        buildConfig = true
        prefab = true
    }
    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }
}

dependencies {
    implementation files(sdkAar)
}
