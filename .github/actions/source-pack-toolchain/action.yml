name: Source Pack build toolchain
description: Identical toolchain for the independent ID/EN and Global upstream builds
runs:
  using: composite
  steps:
    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.14.3'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
