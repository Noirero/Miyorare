// Loaded only by the immutable acceptance harness, never by a production build.
// SuspendToFutureAdapter was added in concurrent-futures-ktx 1.2.0:
// https://developer.android.com/jetpack/androidx/releases/concurrent#1.2.0
// The stable app resolves 1.1.0. Keep that graph unchanged and resolve ONLY the
// probe's compile/runtime classpaths independently, with shared modules aligned
// to the recorded production graph. No production dependency or R8 suppression.
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import java.util.zip.ZipFile
import java.util.zip.ZipInputStream

gradle.projectsEvaluated {
    def app = rootProject.project(':app')
    def evidence = new File(app.property('runtimeProbeEvidenceDir').toString())
    def production = app.configurations.getByName('releaseRuntimeClasspath')
    def graph = { configuration ->
        def result = configuration.incoming.resolutionResult
        def lines = result.allComponents.collect { "component ${it.id.displayName}" }
        result.allDependencies.each { dependency ->
            if (!(dependency instanceof ResolvedDependencyResult)) {
                throw new GradleException("Unresolved dependency: ${dependency.requested}", dependency.failure)
            }
            lines.add("edge ${dependency.from.id.displayName} -> ${dependency.selected.id.displayName} (${dependency.requested.displayName})")
        }
        lines.sort().join('\n') + '\n'
    }
    def baseline = app.findProperty('runtimeProbeBaseline') == 'true'
    if (baseline) {
        app.tasks.register('recordRuntimeProbeProductionGraph') {
            doLast {
                evidence.mkdirs()
                new File(evidence, 'production-before.txt').text = graph(production)
            }
        }
    } else {
        def before = new File(evidence, 'production-before.txt')
        if (!before.isFile()) throw new GradleException('Missing baseline production dependency graph')
        def productionVersions = [:]
        before.eachLine { line ->
            def component = line =~ /^component ([^ :]+):([^ :]+):([^ ]+)$/
            if (component.matches()) {
                productionVersions["${component[0][1]}:${component[0][2]}".toString()] = component[0][3]
            }
        }
        if (productionVersions.isEmpty()) throw new GradleException('Empty production module baseline')
        // Test Core needs SuspendToFutureAdapter (absent in production's 1.1.0).
        // AutoValue is a test annotation provider. These are the only exceptions.
        def testOnlyVersions = [
            'androidx.concurrent:concurrent-futures': '1.2.0',
            'androidx.concurrent:concurrent-futures-ktx': '1.2.0',
            'com.google.auto.value:auto-value-annotations': '1.11.0',
        ]
        def alignedVersions = productionVersions + testOnlyVersions
        // A declarable constraint bucket inherited ONLY by the two probe classpaths.
        // Constraints do not introduce modules missing from the probe graph.
        def alignment = app.configurations.create('runtimeProbeProductionAlignment') {
            canBeConsumed = false
            canBeResolved = false
            canBeDeclared = true
        }
        alignedVersions.each { module, selectedVersion ->
            app.dependencies.constraints.add(alignment.name, "$module:$selectedVersion") {
                version { strictly(selectedVersion) }
                because('Immutable Release probe: production baseline with explicit test-only exceptions')
            }
        }
        new File(evidence, 'probe-version-policy.txt').text = alignedVersions.collect { module, selectedVersion ->
            "$module:$selectedVersion ${testOnlyVersions.containsKey(module) ? 'test-only exception' : 'production baseline'}"
        }.sort().join('\n') + '\n'
        // Public Gradle API, scoped to the two resolvable AndroidTest configurations:
        // https://docs.gradle.org/current/kotlin-dsl/gradle/org.gradle.api.artifacts/-configuration/disable-consistent-resolution.html
        def probes = ['releaseAndroidTestCompileClasspath', 'releaseAndroidTestRuntimeClasspath'].collect {
            def configuration = app.configurations.getByName(it)
            if (!configuration.canBeResolved) throw new GradleException("Probe classpath is not resolvable: $it")
            configuration.disableConsistentResolution()
            configuration.extendsFrom(alignment)
            configuration
        }
        app.dependencies.add('androidTestImplementation', 'androidx.concurrent:concurrent-futures-ktx:1.2.0')
        app.dependencies.add('androidTestImplementation', 'com.google.auto.value:auto-value-annotations:1.11.0')

        def containsClass = { File artifact, String entry ->
            if (!(artifact.name.endsWith('.jar') || artifact.name.endsWith('.aar'))) return false
            def zip = new ZipFile(artifact)
            try {
                if (zip.getEntry(entry) != null) return true
                def classes = zip.getEntry('classes.jar')
                if (classes == null) return false
                def nested = new ZipInputStream(zip.getInputStream(classes))
                try {
                    def item
                    while ((item = nested.nextEntry) != null) {
                        if (item.name == entry) return true
                    }
                    return false
                } finally { nested.close() }
            } finally { zip.close() }
        }
        // Observe actual SDK/R8 inputs; do not add libraries or change R8 options.
        app.tasks.matching { it.name == 'minifyReleaseAndroidTestWithR8' }.configureEach { task ->
            doFirst {
                new File(evidence, 'r8-input-files.txt').text = task.inputs.files.files.collect {
                    "${it.absolutePath} ${it.isFile() ? it.length() : 'directory'}"
                }.sort().join('\n') + '\n'
            }
        }
        app.tasks.register('verifyRuntimeProbeClasspaths') {
            doLast {
                evidence.mkdirs()
                def after = graph(production)
                new File(evidence, 'production-after.txt').text = after
                if (before.text != after) throw new GradleException('Harness changed the production runtime dependency graph')
                def sdkComponents = app.extensions.getByName('androidComponents').sdkComponents
                def sdkEvidence = new File(evidence, 'sdk-bootclasspath.txt')
                sdkEvidence.text = 'Android SDK bootclasspath (AGP public SDK components API)\n'
                sdkComponents.bootClasspath.get().each { sdkFile ->
                    File artifact = sdkFile.asFile
                    sdkEvidence.append("${artifact.absolutePath}\n")
                    ['FingerprintManager', 'FingerprintManager$AuthenticationCallback',
                     'FingerprintManager$AuthenticationResult', 'FingerprintManager$CryptoObject'].each { name ->
                        def entry = "android/hardware/fingerprint/${name}.class"
                        sdkEvidence.append("  $entry ${containsClass(artifact, entry) ? 'PRESENT' : 'ABSENT'}\n")
                    }
                }
                def probeVersions = [:]
                probes.each { configuration ->
                    new File(evidence, "${configuration.name}.txt").text = graph(configuration)
                    def selected = [:]
                    configuration.incoming.resolutionResult.allComponents.each { component ->
                        if (component.id instanceof ModuleComponentIdentifier) {
                            selected["${component.id.group}:${component.id.module}".toString()] = component.id.version
                        }
                    }
                    probeVersions[configuration.name] = selected
                    def drift = selected.findAll { module, selectedVersion ->
                        alignedVersions.containsKey(module) && alignedVersions[module] != selectedVersion
                    }
                    new File(evidence, "${configuration.name}-alignment.txt").text = selected.collect { module, selectedVersion ->
                        "$module selected=$selectedVersion expected=${alignedVersions[module] ?: 'test-only module'}"
                    }.sort().join('\n') + '\n'
                    if (!drift.isEmpty()) throw new GradleException("Probe version drift in ${configuration.name}: $drift")
                    // Filter before artifact selection: :app exposes multiple AGP artifact types.
                    // The full graph above remains unfiltered; only external class providers are read.
                    def externalArtifacts = configuration.incoming.artifactView {
                        componentFilter { it instanceof ModuleComponentIdentifier }
                        lenient = false
                    }
                    def artifacts = externalArtifacts.artifacts.artifacts
                    new File(evidence, "${configuration.name}-artifacts.txt").text = artifacts.collect {
                        "${it.id.componentIdentifier.displayName} ${it.file.name}"
                    }.sort().join('\n') + '\n'
                    def classPresence = new File(evidence, "${configuration.name}-class-presence.txt")
                    classPresence.text = ''
                    ['androidx/concurrent/futures/SuspendToFutureAdapter.class',
                     'com/google/auto/value/AutoValue.class'].each { entry ->
                        def providers = artifacts.findAll { containsClass(it.file, entry) }
                        classPresence.append("${entry} ${providers.isEmpty() ? 'MISSING' : 'PRESENT'}\n")
                        if (providers.isEmpty()) {
                            throw new GradleException("Required probe class absent from ${configuration.name}: $entry")
                        }
                        classPresence.append(providers.collect {
                            "  ${it.id.componentIdentifier.displayName} ${it.file.name}"
                        }.sort().join('\n') + '\n')
                    }
                }
                def compile = probeVersions['releaseAndroidTestCompileClasspath']
                def runtime = probeVersions['releaseAndroidTestRuntimeClasspath']
                def drift = compile.findAll { module, selectedVersion ->
                    runtime.containsKey(module) && runtime[module] != selectedVersion
                }
                if (!drift.isEmpty()) throw new GradleException("Probe compile/runtime version drift: $drift")
                new File(evidence, 'classpath-verification.txt').text = 'production graph unchanged; shared module versions aligned; required probe classes present\n'
            }
        }
    }
}
