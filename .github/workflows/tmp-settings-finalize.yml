          git add app/src/main/kotlin/org/koitharu/kotatsu/settings/DownloadsSettingsFragment.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsItem.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsGroup.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/InlineSliderSettingsRow.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SegmentedSettingsItem.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsPreferenceItems.kt \
                  app/src/main/res/values/strings_private_favourites_theme.xml \
                  app/src/main/res/values-in/settings_language_cleanup.xml
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'Finalize settings cleanup and responsive polish'
            git push origin HEAD:beta
