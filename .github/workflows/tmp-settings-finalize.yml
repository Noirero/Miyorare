name: Temporary Settings Finalization Audit

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/tmp-settings-finalize.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply settings finalization
        shell: python
        run: |
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          # 1) Downloads maintenance: only split the visual group. Keep the original
          # rows, callbacks, preference keys, paths and rebuild implementation in place.
          downloads_path = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/DownloadsSettingsFragment.kt'
          downloads = read(downloads_path)
          keys_before = sorted(re.findall(r'AppSettings\.KEY_[A-Z0-9_]+', downloads))
          callback_counts_before = (
              downloads.count('onClick = onRebuildDownloadsIndex'),
              downloads.count('onClick = onIgnoreDoze'),
          )
          if 'R.string.settings_download_maintenance' not in downloads:
              marker = '''\t\t\t\titem { pos ->\n\t\t\t\t\tActionSettingsItem(\n\t\t\t\t\t\ttitle = stringResource(R.string.rebuild_downloads_index),'''
              split = '''\t\t\t}\n\t\t}\n\t\titem { Spacer(Modifier.height(8.dp).fillMaxWidth()) }\n\t\titem {\n\t\t\tSettingsGroup(title = stringResource(R.string.settings_download_maintenance)) {\n\t\t\t\titem { pos ->\n\t\t\t\t\tActionSettingsItem(\n\t\t\t\t\t\ttitle = stringResource(R.string.rebuild_downloads_index),'''
              downloads = replace_once(downloads, marker, split, 'Downloads maintenance split')
          keys_after = sorted(re.findall(r'AppSettings\.KEY_[A-Z0-9_]+', downloads))
          callback_counts_after = (
              downloads.count('onClick = onRebuildDownloadsIndex'),
              downloads.count('onClick = onIgnoreDoze'),
          )
          if keys_before != keys_after:
              raise RuntimeError('Downloads preference-key wiring changed')
          if callback_counts_before != callback_counts_after or callback_counts_after != (1, 1):
              raise RuntimeError(f'Downloads callbacks changed: {callback_counts_before} -> {callback_counts_after}')
          write(downloads_path, downloads)

          # 2) Responsive polish. Classic stays unchanged. Modern list values that are
          # too long move below the title instead of being truncated in the trailing chip.
          prefs_path = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsPreferenceItems.kt'
          prefs = read(prefs_path)
          if 'val useTrailingValue = modern' not in prefs:
              prefs = replace_once(
                  prefs,
                  '\tval itemEnabled = enabled && hasOptions\n\n\tSettingsItem(\n\t\ttitle = title,\n\t\tmodifier = modifier,\n\t\tsubtitle = if (modern) null else displayValue,',
                  '\tval itemEnabled = enabled && hasOptions\n\tval useTrailingValue = modern && !displayValue.isNullOrBlank() && displayValue.length <= 12\n\n\tSettingsItem(\n\t\ttitle = title,\n\t\tmodifier = modifier,\n\t\tsubtitle = if (useTrailingValue) null else displayValue,',
                  'Modern list-value fallback',
              )
              prefs = replace_once(
                  prefs,
                  '\t\ttrailing = if (modern && !displayValue.isNullOrBlank()) {\n\t\t\t{ ModernSelectedValue(displayValue) }\n\t\t} else null,',
                  '\t\ttrailing = if (useTrailingValue) {\n\t\t\t{ ModernSelectedValue(displayValue.orEmpty()) }\n\t\t} else null,',
                  'Modern list trailing fallback',
              )
          write(prefs_path, prefs)

          # Segmented controls: preserve >=48dp touch target and allow long Indonesian
          # labels to wrap to two lines in Modern only.
          segmented_path = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SegmentedSettingsItem.kt'
          segmented = read(segmented_path)
          if 'import androidx.compose.foundation.layout.heightIn' not in segmented:
              segmented = replace_once(
                  segmented,
                  'import androidx.compose.foundation.layout.height\n',
                  'import androidx.compose.foundation.layout.height\nimport androidx.compose.foundation.layout.heightIn\n',
                  'Segmented heightIn import',
              )
          if '.let { if (modern) it.heightIn(min = 48.dp) else it.height(48.dp) }' not in segmented:
              segmented = replace_once(
                  segmented,
                  '\t\t\t\t.height(if (modern) 46.dp else 48.dp)\n',
                  '\t\t\t\t.let { if (modern) it.heightIn(min = 48.dp) else it.height(48.dp) }\n',
                  'Segmented touch target',
              )
          if 'maxLines = if (modern) 2 else 1' not in segmented:
              segmented = replace_once(
                  segmented,
                  '\t\t\t\t\t\tmaxLines = 1,\n',
                  '\t\t\t\t\t\tmaxLines = if (modern) 2 else 1,\n',
                  'Segmented label wrapping',
              )
          write(segmented_path, segmented)

          # 3) Fix default-language inversion for Private theme strings.
          write('app/src/main/res/values/strings_private_favourites_theme.xml', '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="private_favourites_appearance_group">Appearance</string>
              <string name="private_favourites_theme_title">Private Favourites theme</string>
              <string name="private_favourites_theme_summary">Choose a dedicated visual identity for Private without changing Normal Favourites.</string>
              <string name="private_favourites_theme_follow_normal">Follow Normal theme</string>
              <string name="private_favourites_theme_miyorare">Private Miyorare</string>
              <string name="private_favourites_theme_sakura">Private Sakura</string>
              <string name="private_favourites_theme_violet">Private Violet</string>
              <string name="private_favourites_theme_cyan">Private Cyan</string>
              <string name="private_favourites_theme_emerald">Private Emerald</string>
              <string name="private_favourites_theme_amber">Private Amber</string>
              <string name="private_favourites_theme_preview">Preview Private theme</string>
          </resources>
          '''.replace('          ', ''))

          # Dedicated resource for the new visual-only Downloads group title.
          write('app/src/main/res/values/settings_finalization.xml', '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="settings_download_maintenance">Maintenance</string>
          </resources>
          '''.replace('          ', ''))

          # 4) Indonesian cleanup for the reorganized Settings. Generate only names
          # not already translated elsewhere to avoid duplicate resources.
          translations = {
              'auto_update': 'Pembaruan otomatis',
              'cancel': 'Batal',
              'chapter_jump_setting_summary': 'Tanyakan apakah ingin mengintip atau memindahkan progres saat membuka bab yang jauh dari posisi terakhir',
              'chapter_jump_setting_title': 'Popup lompat bab',
              'create_backup_summary': 'Simpan koleksi, riwayat, dan pengaturan ke sebuah berkas',
              'details_appearance': 'Tampilan layar detail',
              'details_appearance_summary': 'Gaya layar, gambar latar, dan efek buram',
              'details_backdrop': 'Gunakan sampul besar sebagai latar',
              'details_backdrop_blur': 'Keburaman latar',
              'details_backdrop_blur_default': 'Bawaan',
              'details_backdrop_blur_light': 'Ringan',
              'details_backdrop_blur_none': 'Tanpa buram',
              'details_backdrop_summary': 'Tampilkan gambar sampul besar di bagian atas sebagai gambar latar',
              'details_ui': 'Gaya layar detail',
              'details_ui_compact': 'Ringkas',
              'details_ui_expressive': 'Terpusat',
              'developer_testing_tools': 'Alat pengujian pengembang',
              'developer_testing_tools_summary': 'Uji ekstensi yang terpasang',
              'duplicates_check': 'Periksa duplikat',
              'duplicates_check_summary': 'Peringatkan jika judul yang ditambahkan sudah ada di koleksi',
              'export_to_mihon': 'Ekspor untuk Mihon',
              'export_to_mihon_summary': 'Simpan Disukai dan progres baca sebagai berkas cadangan Mihon',
              'ext_auto_update_summary': 'Perbarui ekstensi yang terpasang secara otomatis',
              'ext_auto_update_title': 'Perbarui ekstensi otomatis',
              'ext_update_notifications_summary': 'Beri tahu saat pembaruan ekstensi tersedia',
              'ext_update_notifications_title': 'Notifikasi pembaruan ekstensi',
              'extensions': 'Ekstensi',
              'feed_counter_dot': 'Titik alih-alih jumlah',
              'feed_counter_dot_summary': 'Tandai tab Feed dengan titik alih-alih jumlah pembaruan yang belum dibaca',
              'feed_swipe_gestures': 'Gestur geser Feed',
              'feed_swipe_gestures_summary': 'Geser item Feed untuk menandainya telah dibaca atau menghapusnya',
              'haptic_feedback': 'Umpan balik haptik',
              'haptic_feedback_summary': 'Getarkan perangkat saat mengetuk, mengubah sakelar, slider, dan gestur',
              'hide_status_bar': 'Sembunyikan bilah status',
              'hide_status_bar_summary': 'Sembunyikan bilah status sistem untuk memberi lebih banyak ruang pada aplikasi',
              'kotatsu_migration_progress': 'Memigrasikan… %1$d/%2$d',
              'kotatsu_migration_result': 'Mengonversi %1$d dari %2$d manga',
              'kotatsu_migration_running': 'Memigrasikan koleksi Kotatsu…',
              'kotatsu_migration_started': 'Memigrasikan koleksi Anda…',
              'manage_extensions': 'Kelola ekstensi',
              'manage_extensions_summary': 'Tambah, hapus, atau perbarui ekstensi',
              'manage_stores': 'Kelola repositori',
              'manage_stores_summary': 'Tambah, hapus, atau atur repositori ekstensi',
              'migrate_broken_sources': 'Pulihkan sumber bermasalah',
              'migrate_broken_sources_summary': 'Pindahkan judul dari sumber yang tidak lagi tersedia ke sumber pengganti',
              'migrate_from_kotatsu': 'Migrasikan koleksi Kotatsu',
              'migrate_from_kotatsu_confirm': 'Tindakan ini memindahkan koleksi Kotatsu yang dipulihkan ke ekstensi terpasang yang cocok serta membawa Disukai, riwayat, markah, dan pelacakan. Bab tiap manga akan dimuat saat pertama kali dibuka. Pasang ekstensi yang cocok terlebih dahulu. Lanjutkan?',
              'migrate_from_kotatsu_summary': 'Pindahkan koleksi hasil pemulihan Kotatsu ke ekstensi terpasang yang cocok',
              'miyorare_source_packs_manage': 'Kelola Source Pack Miyorare',
              'miyorare_source_packs_manage_summary': 'Pasang, perbarui, aktifkan, atau hapus Source Pack Miyorare',
              'not_set': 'Belum diatur',
              'nsfw_filter': 'Filter NSFW',
              'ok': 'OK',
              'other_apps': 'Migrasi dan kompatibilitas',
              'periodic_backups_summary': 'Buat cadangan otomatis sesuai jadwal',
              'private_favourites': 'Disukai Private',
              'private_favourites_appearance_group': 'Tampilan',
              'private_favourites_backup_group': 'Privasi pencadangan',
              'private_favourites_backup_title': 'Sertakan data Private?',
              'private_favourites_change_pin': 'Ubah PIN Private',
              'private_favourites_change_pin_summary': 'Ganti PIN lokal yang digunakan untuk Disukai Private',
              'private_favourites_disable_keep_done': 'Semua keamanan Private telah dinonaktifkan. Koleksi tetap berada di Private tanpa isolasi.',
              'private_favourites_disable_keep_private': 'Pertahankan koleksi Private',
              'private_favourites_disable_move_done': 'Semua keamanan Private telah dinonaktifkan dan koleksi telah dipindahkan ke Disukai Normal.',
              'private_favourites_disable_move_normal': 'Pindahkan ke Disukai Normal',
              'private_favourites_include_backup': 'Sertakan Disukai Private dalam cadangan',
              'private_favourites_include_backup_summary': 'Nonaktif secara bawaan. Aktifkan hanya jika kategori dan keanggotaan Private memang ingin disimpan dalam cadangan lokal.',
              'private_favourites_include_backup_warning': 'Data koleksi Private akan disimpan di berkas cadangan lokal. PIN dan metode keamanan tidak pernah disertakan.',
              'private_favourites_lock_now': 'Kunci Disukai Private sekarang',
              'private_favourites_lock_now_summary': 'Hapus sesi buka kunci yang sedang aktif dari memori sekarang juga',
              'private_favourites_security': 'Keamanan Disukai Private',
              'private_favourites_security_biometric': 'Biometrik / kunci perangkat',
              'private_favourites_security_biometric_pin': 'Biometrik dengan PIN cadangan',
              'private_favourites_security_disable_message': 'Disukai Private tetap disembunyikan dari navigasi normal, tetapi membukanya tidak lagi memerlukan autentikasi.',
              'private_favourites_security_disable_title': 'Nonaktifkan perlindungan Private?',
              'private_favourites_security_group': 'Perlindungan',
              'private_favourites_security_none': 'Tidak ada',
              'private_favourites_security_pin': 'PIN',
              'private_favourites_security_summary': 'Pilih cara membuka koleksi tersembunyi',
              'private_favourites_security_unavailable': 'Autentikasi biometrik atau kredensial perangkat tidak tersedia pada perangkat ini.',
              'private_favourites_theme_preview': 'Pratinjau tema Private',
              'private_favourites_theme_title': 'Tema Disukai Private',
              'private_favourites_theme_summary': 'Pilih identitas visual khusus Private tanpa mengubah tema Disukai Normal.',
              'private_favourites_theme_follow_normal': 'Ikuti tema Normal',
              'private_favourites_theme_miyorare': 'Private Miyorare',
              'private_favourites_theme_sakura': 'Private Sakura',
              'private_favourites_theme_violet': 'Private Violet',
              'private_favourites_theme_cyan': 'Private Cyan',
              'private_favourites_theme_emerald': 'Private Emerald',
              'private_favourites_theme_amber': 'Private Amber',
              'private_favourites_unlock': 'Buka kunci Disukai Private',
              'reader_controls_in_bottom_bar_summary': 'Pilih tombol dan urutannya',
              'reader_upscale': 'Peningkatan resolusi AI',
              'reader_upscale_summary': 'Pertajam halaman beresolusi rendah di GPU menggunakan shader berbasis Anime4K. Android 13+',
              'rebuild_downloads_index': 'Bangun ulang indeks unduhan',
              'rebuild_downloads_index_completed': 'Indeks unduhan selesai dibangun ulang: %1$d folder diperbarui',
              'rebuild_downloads_index_started': 'Membangun ulang indeks unduhan…',
              'rebuild_downloads_index_summary': 'Pindai folder unduhan untuk memverifikasi unduhan lama dan membuat berkas indeks kompatibilitas.',
              'rebuild_keep_on': 'Tetap di %1$s',
              'rebuild_migrate_to': 'Migrasikan ke %1$s',
              'rebuild_source_mismatch_message': 'Manga lokal "%1$s" berasal dari %2$s, sedangkan Disukai berasal dari %3$s. Migrasikan ke %2$s atau tetap di %3$s?',
              'rebuild_source_mismatch_title': 'Sumber tidak cocok',
              'require_unlock': 'Wajibkan buka kunci',
              'require_unlock_after': 'Wajibkan buka kunci setelah',
              'require_unlock_summary': 'Kunci aplikasi dengan autentikasi perangkat atau PIN khusus',
              'restore_from_tachiyomi': 'Pulihkan dari Tachiyomi/Mihon',
              'restore_report_restored_simple': 'Item dipulihkan: %1$d manga',
              'restore_tachiyomi_summary': 'Impor cadangan yang dibuat oleh Tachiyomi atau Mihon',
              'shizuku_not_installed': 'Shizuku belum terpasang',
              'shizuku_not_running': 'Shizuku tidak sedang berjalan',
              'shizuku_permission_denied': 'Izin Shizuku ditolak',
              'smart_update': 'Pembaruan pintar',
              'smart_update_summary': 'Kurangi pemeriksaan yang tidak perlu untuk judul yang kemungkinan belum memiliki bab baru',
              'sync_progress_from_tracking': 'Sinkronkan progres dari pelacakan',
              'sync_progress_from_tracking_summary': 'Perbarui progres baca lokal dari layanan pelacakan bila progresnya lebih baru',
              'title_tap_to_read': 'Ketuk judul untuk membaca',
              'title_tap_to_read_summary': 'Di Disukai dan Riwayat, mengetuk nama manga langsung membuka pembaca',
              'tsuki_plugins_manage': 'Kelola plugin Tsuki',
              'tsuki_plugins_manage_summary': 'Pasang dan kelola plugin sumber Tsuki',
              'ui_scale': 'Ukuran tampilan',
              'ui_scale_default': 'Bawaan',
              'ui_scale_larger': 'Lebih besar',
              'ui_scale_largest': 'Paling besar',
              'ui_scale_smaller': 'Lebih kecil',
              'ui_scale_smallest': 'Paling kecil',
              'use_legacy_navigation_bar': 'Gunakan bilah navigasi lama',
              'use_legacy_navigation_bar_summary': 'Gunakan gaya bilah navigasi lama sebagai pengganti navigasi modern',
              'webtoon_zoom': 'Zoom webtoon',
              'webtoon_zoom_summary': 'Izinkan gestur zoom atau ketuk dua kali dalam mode webtoon',
              'settings_download_maintenance': 'Pemeliharaan',
          }

          cleanup_path = Path('app/src/main/res/values-in/settings_language_cleanup.xml')
          existing_id = set()
          for path in Path('app/src/main/res/values-in').glob('*.xml'):
              if path == cleanup_path:
                  continue
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for node in root:
                  name = node.attrib.get('name')
                  if name:
                      existing_id.add(name)

          default_values = {}
          for path in Path('app/src/main/res/values').glob('*.xml'):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for node in root:
                  if node.tag == 'string' and node.attrib.get('name'):
                      default_values[node.attrib['name']] = ''.join(node.itertext())

          placeholder_re = re.compile(r'%(?:\d+\$)?[a-zA-Z]')
          generated = {}
          for name, translated in translations.items():
              source = default_values.get(name)
              if source is None:
                  continue
              if sorted(placeholder_re.findall(source)) != sorted(placeholder_re.findall(translated)):
                  raise RuntimeError(f'Placeholder mismatch for {name}: {source!r} -> {translated!r}')
              if name not in existing_id:
                  generated[name] = translated

          lines = ['<?xml version="1.0" encoding="utf-8"?>', '<resources>']
          for name in sorted(generated):
              lines.append(f'    <string name="{name}">{escape(generated[name])}</string>')
          lines.append('</resources>')
          cleanup_path.parent.mkdir(parents=True, exist_ok=True)
          cleanup_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # 5) Static regression assertions for the exact scope of this task.
          downloads = read(downloads_path)
          general_start = downloads.index('SettingsGroup(title = stringResource(R.string.settings_group_general))')
          maintenance_start = downloads.index('SettingsGroup(title = stringResource(R.string.settings_download_maintenance))')
          notifications_start = downloads.index('SettingsGroup(title = stringResource(R.string.notifications))')
          if 'rebuild_downloads_index' in downloads[general_start:maintenance_start]:
              raise RuntimeError('Rebuild index is still in Downloads > General')
          maintenance_slice = downloads[maintenance_start:notifications_start]
          if 'rebuild_downloads_index' not in maintenance_slice or 'disable_battery_optimization_summary_downloads' not in maintenance_slice:
              raise RuntimeError('Downloads > Maintenance is incomplete')
          if downloads.count('onClick = onRebuildDownloadsIndex') != 1 or downloads.count('onClick = onIgnoreDoze') != 1:
              raise RuntimeError('Downloads maintenance callback wiring is not unique')
          if 'val useTrailingValue = modern' not in read(prefs_path):
              raise RuntimeError('Long-value responsive fallback missing')
          if 'heightIn(min = 48.dp)' not in read(segmented_path) or 'maxLines = if (modern) 2 else 1' not in read(segmented_path):
              raise RuntimeError('Segmented responsive/accessibility guard missing')

          # Core-settings Indonesian coverage. Brand names and URLs are intentional exceptions.
          audit_files = [
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/RootSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/AppearanceSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/AppearanceAdvancedSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/FeedAppearanceSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/FavouritesSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/PrivacySecuritySettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/PrivateFavouritesSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/ReaderSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/ReaderAdvancedSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/StorageAndNetworkSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/AdvancedNetworkSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/DownloadsSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/DownloadPerformanceSettingsSection.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/DownloadStructureInfo.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/BackupSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/ServicesSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/sources/ExtensionsSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/tracker/TrackerSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/about/AboutSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/settings/appearance/PreviewSettingsFragment.kt',
              'app/src/main/kotlin/org/koitharu/kotatsu/backup/local/ui/periodical/PeriodicalBackupSettingsFragment.kt',
          ]
          used = set()
          for raw in audit_files:
              path = Path(raw)
              if path.exists():
                  used.update(re.findall(r'R\.string\.([A-Za-z0-9_]+)', path.read_text(encoding='utf-8')))
          localized = set()
          for path in Path('app/src/main/res/values-in').glob('*.xml'):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              localized.update(node.attrib['name'] for node in root if node.attrib.get('name'))
          intentional = {'about_brand_name', 'app_name', 'discord', 'url_discord_web', 'url_github', 'url_project_credits', 'url_project_license'}
          remaining = sorted(used - localized - intentional)
          print('Remaining untranslated core settings:', remaining)
          if remaining:
              raise RuntimeError('Core Settings still missing Indonesian strings: ' + ', '.join(remaining))

          print(f'Generated {len(generated)} Indonesian Settings overrides')
          print('Downloads maintenance grouping: PASS')
          print('Responsive/accessibility static audit: PASS')
          print('Indonesian core-settings coverage: PASS')

      - name: Compile and run debug unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Commit finalized settings
        run: |
          git config user.name 'LatishaLIFE'
          git config user.email '149634319+Noirero@users.noreply.github.com'
          git add \
            app/src/main/kotlin/org/koitharu/kotatsu/settings/DownloadsSettingsFragment.kt \
            app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsPreferenceItems.kt \
            app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SegmentedSettingsItem.kt \
            app/src/main/res/values/strings_private_favourites_theme.xml \
            app/src/main/res/values/settings_finalization.xml \
            app/src/main/res/values-in/settings_language_cleanup.xml
          if git diff --cached --quiet; then
