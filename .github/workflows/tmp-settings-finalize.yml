              'export_to_mihon': 'Ekspor untuk Mihon',
              'export_to_mihon_summary': 'Simpan Disukai dan progres baca sebagai berkas cadangan Mihon',
              'ext_auto_update_summary': 'Perbarui ekstensi yang terpasang secara otomatis',
              'ext_auto_update_title': 'Perbarui ekstensi otomatis',
              'ext_update_notifications_summary': 'Beri tahu saat pembaruan ekstensi tersedia',
              'ext_update_notifications_title': 'Notifikasi pembaruan ekstensi',
              'extensions': 'Ekstensi',
              'feed_counter_dot': 'Titik alih-alih jumlah',
              'feed_counter_dot_summary': 'Tandai tab Feed dengan titik biasa alih-alih jumlah pembaruan yang belum dibaca',
              'feed_swipe_gestures': 'Gestur geser Feed',
              'feed_swipe_gestures_summary': 'Geser item Feed untuk menandainya telah dibaca atau menghapusnya',
              'haptic_feedback': 'Umpan balik haptik',
              'haptic_feedback_summary': 'Getarkan perangkat saat mengetuk, mengubah sakelar, slider, dan gestur',
              'hide_status_bar': 'Sembunyikan bilah status',
              'hide_status_bar_summary': 'Sembunyikan bilah status sistem untuk memberi lebih banyak ruang pada aplikasi',
              'kotatsu_migration_progress': 'Memigrasikan… %1$d/%2$d',
              'kotatsu_migration_result': 'Mengonversi %1$d dari %2$d manga',
              'kotatsu_migration_running': 'Memigrasikan koleksi Kotatsu…',
              'kotatsu_migration_started': 'Memigrasikan koleksi Anda…',
              'manage_extensions': 'Kelola ekstensi',
              'manage_extensions_summary': 'Tambah, hapus, atau perbarui ekstensi',
              'manage_stores': 'Kelola repositori',
              'manage_stores_summary': 'Tambah, hapus, atau atur repositori ekstensi',
              'migrate_broken_sources': 'Migrasikan sumber rusak',
              'migrate_broken_sources_summary': 'Pindahkan judul dari sumber yang tidak lagi tersedia ke sumber pengganti',
              'migrate_from_kotatsu': 'Migrasikan koleksi Kotatsu',
              'migrate_from_kotatsu_confirm': 'Tindakan ini memindahkan koleksi Kotatsu yang dipulihkan ke ekstensi terpasang yang cocok serta membawa Disukai, riwayat, markah, dan pelacakan. Bab tiap manga akan dimuat saat pertama kali dibuka. Pasang ekstensi yang cocok terlebih dahulu. Lanjutkan?',
              'migrate_from_kotatsu_summary': 'Pindahkan koleksi hasil pemulihan Kotatsu ke ekstensi terpasang yang cocok',
              'miyorare_source_packs_manage': 'Kelola Source Pack Miyorare',
              'miyorare_source_packs_manage_summary': 'Pasang, perbarui, aktifkan, atau hapus Source Pack Miyorare',
