name: Temporary Settings Finalization Audit

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/tmp-settings-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
      - name: Finalize language, maintenance and responsive settings
        shell: python
        run: |
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # 1) Downloads: move maintenance-only actions out of General without
          # changing callbacks, preference keys, storage paths or rebuild logic.
          # ------------------------------------------------------------------
          downloads_path = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/DownloadsSettingsFragment.kt'
          downloads = read(downloads_path)
          prefs_before = sorted(re.findall(r'AppSettings\.KEY_[A-Z0-9_]+', downloads))
          callbacks_before = (downloads.count('onRebuildDownloadsIndex'), downloads.count('onIgnoreDoze'))

          rebuild_re = re.compile(
              r'\n\t\t\t\titem \{ pos ->\n'
              r'\t\t\t\t\tActionSettingsItem\(\n'
              r'\t\t\t\t\t\ttitle = stringResource\(R\.string\.rebuild_downloads_index\),.*?'
              r'\n\t\t\t\t\}\n',
              re.S,
          )
          doze_re = re.compile(
              r'\n\t\t\t\tif \(showDoze\) \{\n'
              r'\t\t\t\t\titem \{ pos ->\n'
              r'\t\t\t\t\t\tActionSettingsItem\(\n'
              r'\t\t\t\t\t\t\ttitle = stringResource\(R\.string\.disable_battery_optimization\),.*?'
              r'\n\t\t\t\t\}\n',
              re.S,
          )
          rebuild_match = rebuild_re.search(downloads)
          doze_match = doze_re.search(downloads)
          if rebuild_match is None or doze_match is None:
              raise RuntimeError('Downloads maintenance rows were not found in their legacy General location')
          rebuild_block = rebuild_match.group(0)
          doze_block = doze_match.group(0)
          downloads = rebuild_re.sub('', downloads, count=1)
          downloads = doze_re.sub('', downloads, count=1)

          notifications_marker = (
              '\t\titem { Spacer(Modifier.height(8.dp).fillMaxWidth()) }\n'
              '\t\titem {\n'
              '\t\t\tSettingsGroup(title = stringResource(R.string.notifications)) {'
          )
          maintenance = (
              '\t\titem { Spacer(Modifier.height(8.dp).fillMaxWidth()) }\n'
              '\t\titem {\n'
              '\t\t\tSettingsGroup(title = stringResource(R.string.settings_download_maintenance)) {'
              + rebuild_block + doze_block +
              '\t\t\t}\n'
              '\t\t}\n'
              '\t\titem { Spacer(Modifier.height(8.dp).fillMaxWidth()) }\n'
              '\t\titem {\n'
              '\t\t\tSettingsGroup(title = stringResource(R.string.notifications)) {'
          )
          downloads = replace_once(downloads, notifications_marker, maintenance, 'insert Downloads maintenance group')
          prefs_after = sorted(re.findall(r'AppSettings\.KEY_[A-Z0-9_]+', downloads))
          callbacks_after = (downloads.count('onRebuildDownloadsIndex'), downloads.count('onIgnoreDoze'))
          if prefs_before != prefs_after:
              raise RuntimeError('Downloads preference-key wiring changed unexpectedly')
          if callbacks_before != callbacks_after:
              raise RuntimeError('Downloads maintenance callbacks changed unexpectedly')
          write(downloads_path, downloads)

          # ------------------------------------------------------------------
          # 2) Responsive/visual polish. Modern gets full-width surfaces and a
          # safer long-value fallback; Classic rendering remains untouched.
          # ------------------------------------------------------------------
          item_path = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsItem.kt'
          text = read(item_path)
          if 'import androidx.compose.foundation.layout.fillMaxWidth' not in text:
              text = replace_once(
                  text,
                  'import androidx.compose.foundation.layout.heightIn\n',
                  'import androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.heightIn\n',
                  'SettingsItem fillMaxWidth import',
              )
          text = replace_once(
              text,
              'val surfaceModifier = modifier\n\t\t.onGloballyPositioned',
              'val surfaceModifier = modifier\n\t\t.let { if (modern) it.fillMaxWidth() else it }\n\t\t.onGloballyPositioned',
              'SettingsItem Modern width',
          )
          write(item_path, text)

          group_path = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsGroup.kt'
          text = read(group_path)
          if 'import androidx.compose.foundation.layout.fillMaxWidth' not in text:
              text = replace_once(
                  text,
                  'import androidx.compose.foundation.layout.height\n',
                  'import androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.height\n',
                  'SettingsGroup fillMaxWidth import',
              )
          text = replace_once(
              text,
              'Column(modifier = modifier) {',
              'Column(modifier = if (modern) modifier.fillMaxWidth() else modifier) {',
              'SettingsGroup Modern width',
          )
          write(group_path, text)

          slider_path = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/InlineSliderSettingsRow.kt'
          text = read(slider_path)
          text = replace_once(
              text,
              'modifier.miyorareSurface(visualPalette, shape)',
              'modifier.fillMaxWidth().miyorareSurface(visualPalette, shape)',
              'Inline slider Modern width',
          )
          write(slider_path, text)

          segmented_path = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SegmentedSettingsItem.kt'
          text = read(segmented_path)
          if 'import androidx.compose.foundation.layout.heightIn' not in text:
              text = replace_once(
                  text,
                  'import androidx.compose.foundation.layout.height\n',
                  'import androidx.compose.foundation.layout.height\nimport androidx.compose.foundation.layout.heightIn\n',
                  'Segmented heightIn import',
              )
          text = replace_once(
              text,
              'val surfaceModifier = if (modern) modifier.miyorareSurface(visualPalette, shape) else modifier',
              'val surfaceModifier = if (modern) modifier.fillMaxWidth().miyorareSurface(visualPalette, shape) else modifier',
              'Segmented Modern width',
          )
          text = replace_once(
              text,
              '\t\t\t\t.height(if (modern) 46.dp else 48.dp)\n',
              '\t\t\t\t.let { if (modern) it.heightIn(min = 48.dp) else it.height(48.dp) }\n',
              'Segmented touch target',
          )
          text = replace_once(
              text,
              '\t\t\t\t\t\ttext = label,\n\t\t\t\t\t\tstyle = MaterialTheme.typography.labelLarge,\n\t\t\t\t\t\tfontWeight = if (isSelected) FontWeight.SemiBold else FontWeight.Normal,\n\t\t\t\t\t\ttextAlign = TextAlign.Center,\n\t\t\t\t\t\tmaxLines = 1,',
              '\t\t\t\t\t\ttext = label,\n\t\t\t\t\t\tstyle = MaterialTheme.typography.labelLarge,\n\t\t\t\t\t\tfontWeight = if (isSelected) FontWeight.SemiBold else FontWeight.Normal,\n\t\t\t\t\t\ttextAlign = TextAlign.Center,\n\t\t\t\t\t\tmaxLines = if (modern) 2 else 1,',
              'Segmented long-label wrapping',
          )
          write(segmented_path, text)

          pref_path = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsPreferenceItems.kt'
          text = read(pref_path)
          text = replace_once(
              text,
              '\tval itemEnabled = enabled && hasOptions\n\n\tSettingsItem(\n\t\ttitle = title,\n\t\tmodifier = modifier,\n\t\tsubtitle = if (modern) null else displayValue,',
              '\tval itemEnabled = enabled && hasOptions\n\tval useTrailingValue = modern && !displayValue.isNullOrBlank() && displayValue.length <= 12\n\n\tSettingsItem(\n\t\ttitle = title,\n\t\tmodifier = modifier,\n\t\tsubtitle = if (useTrailingValue) null else displayValue,',
              'List setting long-value fallback',
          )
          text = replace_once(
              text,
              '\t\ttrailing = if (modern && !displayValue.isNullOrBlank()) {\n\t\t\t{ ModernSelectedValue(displayValue) }\n\t\t} else null,',
              '\t\ttrailing = if (useTrailingValue) {\n\t\t\t{ ModernSelectedValue(displayValue.orEmpty()) }\n\t\t} else null,',
              'List setting trailing value fallback',
          )
          write(pref_path, text)

          # Fix a previous language inversion: this default (English) resource
          # accidentally contained Indonesian strings. Indonesian stays in values-in.
          private_theme_path = 'app/src/main/res/values/strings_private_favourites_theme.xml'
          private_theme = '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="private_favourites_appearance_group">Appearance</string>
              <string name="private_favourites_theme_title">Private Favourites theme</string>
              <string name="private_favourites_theme_summary">Choose a dedicated visual identity for Private without changing Normal Favourites.</string>
              <string name="private_favourites_theme_follow_normal">Follow Normal theme</string>
              <string name="private_favourites_theme_miyorare">Private Miyorare</string>
              <string name="private_favourites_theme_sakura">Private Sakura</string>
              <string name="private_favourites_theme_violet">Private Violet</string>
              <string name="private_favourites_theme_cyan">Private Cyan</string>
              <string name="private_favourites_theme_emerald">Private Emerald</string>
              <string name="private_favourites_theme_amber">Private Amber</string>
              <string name="private_favourites_theme_preview">Preview Private theme</string>
          </resources>
          '''
          private_theme = '\n'.join(line.strip() if line.startswith('          ') else line for line in private_theme.splitlines()) + '\n'
          write(private_theme_path, private_theme)

          # ------------------------------------------------------------------
          # 3) Indonesian language cleanup for the reorganized core Settings.
          # A dedicated file avoids touching stable preference/resource wiring.
          # ------------------------------------------------------------------
          translations = {
              'auto_update': 'Pembaruan otomatis',
              'cancel': 'Batal',
              'chapter_jump_setting_summary': 'Tanyakan apakah ingin mengintip atau memindahkan progres saat membuka bab yang jauh dari posisi terakhir',
              'chapter_jump_setting_title': 'Popup lompat bab',
              'create_backup_summary': 'Simpan koleksi, riwayat, dan pengaturan ke sebuah berkas',
              'details_appearance': 'Tampilan layar detail',
              'details_appearance_summary': 'Gaya layar, gambar latar, dan efek buram',
              'details_backdrop': 'Gunakan sampul besar sebagai latar',
              'details_backdrop_blur': 'Keburaman latar',
              'details_backdrop_blur_default': 'Bawaan',
              'details_backdrop_blur_light': 'Ringan',
              'details_backdrop_blur_none': 'Tanpa buram',
              'details_backdrop_summary': 'Tampilkan gambar sampul besar di bagian atas sebagai gambar latar seperti Tachiyomi',
              'details_ui': 'Gaya layar detail',
              'details_ui_compact': 'Ringkas',
              'details_ui_expressive': 'Terpusat',
              'developer_testing_tools': 'Alat pengujian pengembang',
              'developer_testing_tools_summary': 'Uji ekstensi yang terpasang',
              'duplicates_check': 'Periksa duplikat',
