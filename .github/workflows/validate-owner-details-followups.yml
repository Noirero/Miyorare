name: Validate owner Details follow-ups

on:
  push:
    branches:
      - fix/amain2-owner-details-followups

permissions:
  contents: read

jobs:
  compile-unit:
    name: Compile, resources & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Compile debug sources and validate Android resources
        run: ./gradlew compileDebugSources --max-workers=4 --no-daemon --stacktrace
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --max-workers=4 --no-daemon --stacktrace
