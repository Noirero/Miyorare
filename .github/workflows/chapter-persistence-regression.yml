name: Chapter Persistence Regression

on:
  push:
    branches:
      - agent/set-scoped-groups-migration-55-56-20261120
    paths:
      - '.github/workflows/chapter-persistence-regression.yml'
  pull_request:
    branches:
      - beta
    paths:
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/MangaDatabase.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/entity/MangaEntity.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/dao/MangaDao.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/migrations/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/dao/ChaptersDao.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/DetailsCachePolicy.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/parser/MangaDataRepository.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/history/data/HistoryRepository.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/domain/DetailsLoadUseCase.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/local/domain/DownloadedMangaResolver.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/data/DetailsNavigationCache.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsExpressiveActivity.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsExpressiveScreen.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsChapterComponents.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/model/ChapterListItem.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/ChapterListOptions.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/ChapterOptionsSheet.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/ChapterPagesMenuProvider.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/ChaptersPagesViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/chapters/ChaptersFragment.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/list/ui/MangaListFragment.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/local/data/input/LocalMangaParser.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/local/data/index/LocalMangaIndex.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/reader/domain/PageLoader.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/reader/domain/DetectReaderModeUseCase.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/LocalFavouritesListViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/settings/override/OverrideConfigViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/local/data/LocalMangaRepository.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/local/ui/LocalListViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/main/ui/MainActivity.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/local/data/LegacyChapterDownloadCompat.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/ReaderViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/config/ReaderSettings.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/config/MangaReaderProfileStore.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/alternatives/domain/MigrateUseCase.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/data/MangaNotesRepository.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/tracker/work/TrackWorker.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/network/UserAgentManager.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/AppSettings.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/performance/RuntimeLagHardeningRegressionTest.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/core/db/ChapterPersistenceRegressionTest.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/alternatives/domain/ProfileMigrationPersistenceRegressionTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/details/domain/DetailsHotPathOrderingTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/details/domain/DetailsDownloadResolutionBoundaryTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/details/domain/DetailsChapterRoomFlowRegressionTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/details/domain/ExtensionDetailsStage1RegressionTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/details/domain/ExtensionDetailsStages234RegressionTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/details/data/DetailsNavigationCacheTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesPaginationRegressionTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/local/data/LocalStackSafetyRegressionTest.kt'
      - '.github/workflows/chapter-persistence-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chapter-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/agent/set-scoped-groups-migration-55-56-20261120') &&
      (github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'fix/') && !startsWith(github.head_ref, 'bugfix/') && !startsWith(github.head_ref, 'hotfix/')))
    name: Verify chapter cache survives process-style reopen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify chapter, Room Flow, resolver, navigation-cache and Favourites hot paths
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests org.koitharu.kotatsu.details.domain.DetailsHotPathOrderingTest
          --tests org.koitharu.kotatsu.details.domain.DetailsDownloadResolutionBoundaryTest
          --tests org.koitharu.kotatsu.details.domain.DetailsChapterRoomFlowRegressionTest
          --tests org.koitharu.kotatsu.details.domain.ExtensionDetailsStage1RegressionTest
          --tests org.koitharu.kotatsu.details.domain.ExtensionDetailsStages234RegressionTest
          --tests org.koitharu.kotatsu.details.ui.pager.ChapterOptionsRegressionTest
          --tests org.koitharu.kotatsu.details.data.DetailsNavigationCacheTest
          --tests org.koitharu.kotatsu.favourites.ui.list.FavouritesPaginationRegressionTest
          --no-daemon --stacktrace

      - name: Enable KVM
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Run chapter persistence regression on Android 15
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.core.db.ChapterPersistenceRegressionTest,org.koitharu.kotatsu.alternatives.domain.ProfileMigrationPersistenceRegressionTest

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-persistence-regression
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7

  # Diagnostic-only lane: reuses a workflow already registered on the default branch.
  # It never changes the normal pull_request regression gate.
  room-55-to-56:
    name: Targeted Room migration and Private-to-Normal on Android 15
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/agent/set-scoped-groups-migration-55-56-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout immutable dispatch commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact tested SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/agent/set-scoped-groups-migration-55-56-20261120'
          echo "Room migration diagnostics at $GITHUB_SHA"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm

      - name: Run fixed Room migration and Private-to-Normal tests on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.core.db.LibraryGroupSetMigrationTest,org.koitharu.kotatsu.favourites.vault.PrivateToNormalOwnershipRegressionTest

      - name: Verify targeted test evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          directory = Path('app/build/outputs/androidTest-results/connected')
          reports = sorted(directory.rglob('TEST-*.xml')) if directory.exists() else []
          assert reports, 'No Android instrumentation TEST-*.xml evidence found'
          cases = []
          for report in reports:
              cases.extend(ET.parse(report).getroot().iter('testcase'))
          expected = {
              'upgradePreservesGroupChildrenAndResolvesOwners',
              'failedBackfillRollsBackSchemaAndPreservesRows',
              'upgradedAndFreshDatabasesHaveIdenticalGroupTriggers',
              'moveToNormalPreservesCategoryAndGroupIdentities',
              'multiplePrivateSetsCloneSeparatelyIncludingEmptyAndDuplicateTitles',
              'moveToNormalGroupCollisionRollsBackAndKeepsSecurity',
              'invalidPrivateCategoryAssignmentFailsWithoutMutation',
              'groupSpaceChangeWithoutOwnerReassignmentIsRejectedAndRolledBack',
              'destinationSetCollisionFailsClosedWithoutDroppingGroupChildren',
          }
          names = [case.attrib.get('name', '').split('[')[0] for case in cases]
          assert len(names) == 9 and set(names) == expected, f'Unexpected executed tests: {names}'
          allowed_classes = (
              '.LibraryGroupSetMigrationTest',
              '.PrivateToNormalOwnershipRegressionTest',
          )
          for case in cases:
              assert case.attrib.get('classname', '').endswith(allowed_classes), case.attrib
              assert not any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped')), case.attrib
          print('Verified exactly nine targeted Room/Private-to-Normal tests with no failures or skips')
          PY

      - name: Upload targeted Room migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-55-to-56-android15-evidence
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7

# Diagnostic-only compatibility gate. This never changes the existing PR lane.
  historical-v55-compatibility:
    name: Upgrade authentic historical Room v55 database on Android 15
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      github.ref == 'refs/heads/agent/set-scoped-groups-migration-55-56-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout exact migration candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout immutable historical Room v55 source
        uses: actions/checkout@v5
        with:
          ref: b4e66ec6130bac5e05d77af2ca6cc11c99ad1190
          path: historical-v55
          persist-credentials: false

      - name: Verify source identities and stage historical test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C historical-v55 rev-parse HEAD)" = 'b4e66ec6130bac5e05d77af2ca6cc11c99ad1190'
          test "$GITHUB_REF" = 'refs/heads/agent/set-scoped-groups-migration-55-56-20261120'
          cp .github/fixtures/historical-v55/HistoricalV55SeedTest.kt historical-v55/app/src/androidTest/kotlin/org/koitharu/kotatsu/core/db/HistoricalV55SeedTest.kt
          chmod +x gradlew historical-v55/gradlew

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Create v55 Room database, then upgrade using v56 application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-authentic-v55-compatibility.sh

      - name: Verify historical instrumentation and upgrade XML evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          historical_log = Path('app/build/historical-v55-evidence/v55-seed-instrumentation.log')
          assert historical_log.is_file(), 'Missing historical instrumentation evidence'
          output = historical_log.read_text()
          assert 'INSTRUMENTATION_STATUS: test=createAuthenticRoomV55DatabaseWithGroups' in output
          assert 'INSTRUMENTATION_STATUS_CODE: 0' in output
          assert 'OK (1 test)' in output and 'INSTRUMENTATION_CODE: -1' in output
          assert 'FAILURES!!!' not in output and 'Error in' not in output
          print('PASS: HistoricalV55SeedTest.createAuthenticRoomV55DatabaseWithGroups')
          directory = Path('app/build/outputs/androidTest-results/connected')
          files = list(directory.rglob('TEST-*.xml'))
          assert files, f'Missing upgrade XML evidence: {directory}'
          cases = [case for f in files for case in ET.parse(f).getroot().iter('testcase')]
          assert len(cases) == 1, [c.attrib for c in cases]
          case = cases[0]
          assert case.attrib.get('name', '').split('[')[0] == 'historicalRoomV55DatabaseUpgradesWithoutLosingGroupChildren', case.attrib
          assert case.attrib.get('classname', '').endswith('.HistoricalV55CompatibilityTest'), case.attrib
          assert all(case.find(tag) is None for tag in ('failure', 'error', 'skipped')), case.attrib
          print('PASS: HistoricalV55CompatibilityTest.historicalRoomV55DatabaseUpgradesWithoutLosingGroupChildren')
          PY

      - name: Upload historical v55 schema, database and instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentic-room-v55-to-v56-android15-evidence
          path: |
            app/build/historical-v55-evidence/
            historical-v55/app/build/outputs/androidTest-results/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7
