name: Chapter Persistence Regression

on:
  pull_request:
    branches:
      - beta
    paths:
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/MangaDatabase.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/entity/MangaEntity.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/dao/MangaDao.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/migrations/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/dao/ChaptersDao.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/DetailsCachePolicy.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/parser/MangaDataRepository.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/history/data/HistoryRepository.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/domain/DetailsLoadUseCase.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/local/domain/DownloadedMangaResolver.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/data/DetailsNavigationCache.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsExpressiveActivity.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsExpressiveScreen.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsChapterComponents.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/model/ChapterListItem.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/ChapterListOptions.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/ChapterOptionsSheet.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/ChapterPagesMenuProvider.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/ChaptersPagesViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/chapters/ChaptersFragment.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/list/ui/MangaListFragment.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/local/data/input/LocalMangaParser.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/local/data/index/LocalMangaIndex.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/reader/domain/PageLoader.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/reader/domain/DetectReaderModeUseCase.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/LocalFavouritesListViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/settings/override/OverrideConfigViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/local/data/LocalMangaRepository.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/local/ui/LocalListViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/main/ui/MainActivity.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/local/data/LegacyChapterDownloadCompat.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/ReaderViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/config/ReaderSettings.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/config/MangaReaderProfileStore.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/alternatives/domain/MigrateUseCase.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/data/MangaNotesRepository.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/tracker/work/TrackWorker.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/network/UserAgentManager.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/AppSettings.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/performance/RuntimeLagHardeningRegressionTest.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/core/db/ChapterPersistenceRegressionTest.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/alternatives/domain/ProfileMigrationPersistenceRegressionTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/details/domain/DetailsHotPathOrderingTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/details/domain/DetailsDownloadResolutionBoundaryTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/details/domain/DetailsChapterRoomFlowRegressionTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/details/domain/ExtensionDetailsStage1RegressionTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/details/domain/ExtensionDetailsStages234RegressionTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/details/data/DetailsNavigationCacheTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesPaginationRegressionTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/local/data/LocalStackSafetyRegressionTest.kt'
      - '.github/workflows/chapter-persistence-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chapter-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    if: >-
      github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'fix/') && !startsWith(github.head_ref, 'bugfix/') && !startsWith(github.head_ref, 'hotfix/'))
    name: Verify chapter cache survives process-style reopen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify chapter, Room Flow, resolver, navigation-cache and Favourites hot paths
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests org.koitharu.kotatsu.details.domain.DetailsHotPathOrderingTest
          --tests org.koitharu.kotatsu.details.domain.DetailsDownloadResolutionBoundaryTest
          --tests org.koitharu.kotatsu.details.domain.DetailsChapterRoomFlowRegressionTest
          --tests org.koitharu.kotatsu.details.domain.ExtensionDetailsStage1RegressionTest
          --tests org.koitharu.kotatsu.details.domain.ExtensionDetailsStages234RegressionTest
          --tests org.koitharu.kotatsu.details.ui.pager.ChapterOptionsRegressionTest
          --tests org.koitharu.kotatsu.details.data.DetailsNavigationCacheTest
          --tests org.koitharu.kotatsu.favourites.ui.list.FavouritesPaginationRegressionTest
          --tests org.koitharu.kotatsu.local.data.LocalStackSafetyRegressionTest
          --tests org.koitharu.kotatsu.performance.RuntimeLagHardeningRegressionTest
          --no-daemon --stacktrace

      - name: Enable KVM
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Run chapter persistence regression on Android 15
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.core.db.ChapterPersistenceRegressionTest,org.koitharu.kotatsu.alternatives.domain.ProfileMigrationPersistenceRegressionTest

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-persistence-regression
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7
