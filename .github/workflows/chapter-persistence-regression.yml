name: Chapter Persistence Regression

on:
  pull_request:
    branches:
      - beta
      - main
    paths:
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/MangaDatabase.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/entity/MangaEntity.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/dao/MangaDao.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/migrations/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/dao/ChaptersDao.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/parser/MangaDataRepository.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/details/domain/DetailsLoadUseCase.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/core/db/ChapterPersistenceRegressionTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/details/domain/DetailsHotPathOrderingTest.kt'
      - '.github/workflows/chapter-persistence-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chapter-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Verify chapter cache survives process-style reopen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify cached chapter hot-path ordering
        run: ./gradlew :app:testDebugUnitTest --tests org.koitharu.kotatsu.details.domain.DetailsHotPathOrderingTest --no-daemon --stacktrace

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Run chapter persistence regression on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.core.db.ChapterPersistenceRegressionTest

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-persistence-regression
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7
