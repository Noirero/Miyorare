name: Promotion Compile & Unit Check 2

on:
  pull_request:
    branches:
      - main

jobs:
  compile-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew compileDebugSources testDebugUnitTest --max-workers=4 --no-daemon --stacktrace
