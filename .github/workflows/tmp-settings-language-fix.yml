name: Temporary Settings Language Fix

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/tmp-settings-language-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
      - name: Localize remaining Settings diagnostics and What’s New
        shell: python
        run: |
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          runner_path = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/developer/DeveloperExtensionTestRunner.kt')
          runner = runner_path.read_text(encoding='utf-8')
          if 'import org.koitharu.kotatsu.R' not in runner:
              marker = 'import org.koitharu.kotatsu.core.exceptions.CloudFlareException\n'
              if marker not in runner:
                  raise SystemExit('Runner import marker not found')
              runner = runner.replace(marker, 'import org.koitharu.kotatsu.R\n' + marker, 1)

          stage_block = '''\t\tconst val STAGE_LOAD = "Extension loading"\n\t\tconst val STAGE_LIST = "Popular listing"\n\t\tconst val STAGE_SEARCH = "Search"\n\t\tconst val STAGE_DETAILS = "Manga details"\n\t\tconst val STAGE_PAGES = "Chapter pages"\n\t\tconst val STAGE_IMAGE = "Page image"\n\t\tconst val STAGE_COVER = "Cover image"\n\t\tconst val STAGE_LATEST = "Latest listing"\n\t\tconst val STAGE_PAGINATION = "Pagination"\n\t\tconst val STAGE_FILTERS = "Filters"\n\t\tconst val STAGE_RELATED = "Related manga"\n'''
          if stage_block not in runner:
              raise SystemExit('Developer stage constant block not found')
          runner = runner.replace(stage_block, '', 1)

          stage_props = '''\n\tfun loadingStageLabel(): String = stageLoad\n\n\tprivate val stageLoad: String get() = context.getString(R.string.developer_stage_extension_loading)\n\tprivate val stageList: String get() = context.getString(R.string.developer_stage_popular_listing)\n\tprivate val stageSearch: String get() = context.getString(R.string.developer_stage_search)\n\tprivate val stageDetails: String get() = context.getString(R.string.developer_stage_manga_details)\n\tprivate val stagePages: String get() = context.getString(R.string.developer_stage_chapter_pages)\n\tprivate val stageImage: String get() = context.getString(R.string.developer_stage_page_image)\n\tprivate val stageCover: String get() = context.getString(R.string.developer_stage_cover_image)\n\tprivate val stageLatest: String get() = context.getString(R.string.developer_stage_latest_listing)\n\tprivate val stagePagination: String get() = context.getString(R.string.developer_stage_pagination)\n\tprivate val stageFilters: String get() = context.getString(R.string.developer_stage_filters)\n\tprivate val stageRelated: String get() = context.getString(R.string.developer_stage_related_manga)\n'''
          insert_marker = '\n\tprivate suspend fun testExtension(\n'
          if insert_marker not in runner:
              raise SystemExit('Runner insertion marker not found')
          runner = runner.replace(insert_marker, stage_props + insert_marker, 1)

          for old, new in {
              'STAGE_LOAD': 'stageLoad',
              'STAGE_LIST': 'stageList',
              'STAGE_SEARCH': 'stageSearch',
              'STAGE_DETAILS': 'stageDetails',
              'STAGE_PAGES': 'stagePages',
              'STAGE_IMAGE': 'stageImage',
              'STAGE_COVER': 'stageCover',
              'STAGE_LATEST': 'stageLatest',
              'STAGE_PAGINATION': 'stagePagination',
              'STAGE_FILTERS': 'stageFilters',
              'STAGE_RELATED': 'stageRelated',
          }.items():
              runner = runner.replace(old, new)

          message_replacements = {
              'sourceName = source?.displayName ?: "No catalogue source"': 'sourceName = source?.displayName ?: context.getString(R.string.developer_no_catalogue_source)',
              'sourceName = "No catalogue source"': 'sourceName = context.getString(R.string.developer_no_catalogue_source)',
              'failedStage(stageLoad, "Extension contains no catalogue source")': 'failedStage(stageLoad, context.getString(R.string.developer_extension_no_catalogue_source))',
              'error("Source does not expose its filter list")': 'error(context.getString(R.string.developer_filter_list_unavailable))',
              'IllegalStateException("Popular listing returned no manga")': 'IllegalStateException(context.getString(R.string.developer_popular_empty))',
              'IllegalStateException("Popular listing failed")': 'IllegalStateException(context.getString(R.string.developer_popular_failed))',
              'IllegalStateException("Manga details returned no chapters")': 'IllegalStateException(context.getString(R.string.developer_details_no_chapters))',
              'IllegalStateException("No usable manga was found in the popular listing")': 'IllegalStateException(context.getString(R.string.developer_no_usable_manga))',
              'IllegalStateException("Chapter returned no pages")': 'IllegalStateException(context.getString(R.string.developer_chapter_no_pages))',
              'skippedStage(name, "Not supported")': 'skippedStage(name, context.getString(R.string.developer_not_supported))',
              'message = "Timed out after ${STAGE_TIMEOUT_MILLIS / 1_000} seconds"': 'message = context.getString(R.string.developer_timeout_seconds, STAGE_TIMEOUT_MILLIS / 1_000)',
          }
          for old, new in message_replacements.items():
              if old not in runner:
                  raise SystemExit(f'Expected Runner text not found: {old}')
              runner = runner.replace(old, new)
          runner_path.write_text(runner, encoding='utf-8')

          vm_path = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/developer/DeveloperToolsViewModel.kt')
          vm = vm_path.read_text(encoding='utf-8')
          old_vm = 'name = "Extension loading",'
          if old_vm not in vm:
              raise SystemExit('ViewModel Extension loading literal not found')
          vm = vm.replace(old_vm, 'name = runner.loadingStageLabel(),', 1)
          vm_path.write_text(vm, encoding='utf-8')

          default_diag = Path('app/src/main/res/values/settings_developer_diagnostics.xml')
          id_diag = Path('app/src/main/res/values-in/settings_developer_diagnostics.xml')
          if default_diag.exists() or id_diag.exists():
              raise SystemExit('Developer diagnostics resource file already exists unexpectedly')
          default_diag.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="developer_stage_extension_loading">Extension loading</string>\n    <string name="developer_stage_popular_listing">Popular listing</string>\n    <string name="developer_stage_search">Search</string>\n    <string name="developer_stage_manga_details">Manga details</string>\n    <string name="developer_stage_chapter_pages">Chapter pages</string>\n    <string name="developer_stage_page_image">Page image</string>\n    <string name="developer_stage_cover_image">Cover image</string>\n    <string name="developer_stage_latest_listing">Latest listing</string>\n    <string name="developer_stage_pagination">Pagination</string>\n    <string name="developer_stage_filters">Filters</string>\n    <string name="developer_stage_related_manga">Related manga</string>\n    <string name="developer_no_catalogue_source">No catalogue source</string>\n    <string name="developer_extension_no_catalogue_source">Extension contains no catalogue source</string>\n    <string name="developer_filter_list_unavailable">Source does not expose its filter list</string>\n    <string name="developer_popular_empty">Popular listing returned no manga</string>\n    <string name="developer_popular_failed">Popular listing failed</string>\n    <string name="developer_details_no_chapters">Manga details returned no chapters</string>\n    <string name="developer_no_usable_manga">No usable manga was found in the popular listing</string>\n    <string name="developer_chapter_no_pages">Chapter returned no pages</string>\n    <string name="developer_not_supported">Not supported</string>\n    <string name="developer_timeout_seconds">Timed out after %1$d seconds</string>\n</resources>\n''', encoding='utf-8')
          id_diag.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="developer_stage_extension_loading">Memuat ekstensi</string>\n    <string name="developer_stage_popular_listing">Daftar populer</string>\n    <string name="developer_stage_search">Pencarian</string>\n    <string name="developer_stage_manga_details">Detail manga</string>\n    <string name="developer_stage_chapter_pages">Halaman bab</string>\n    <string name="developer_stage_page_image">Gambar halaman</string>\n    <string name="developer_stage_cover_image">Gambar sampul</string>\n    <string name="developer_stage_latest_listing">Daftar terbaru</string>\n    <string name="developer_stage_pagination">Paginasi</string>\n    <string name="developer_stage_filters">Filter</string>\n    <string name="developer_stage_related_manga">Manga terkait</string>\n    <string name="developer_no_catalogue_source">Tidak ada sumber katalog</string>\n    <string name="developer_extension_no_catalogue_source">Ekstensi tidak memiliki sumber katalog</string>\n    <string name="developer_filter_list_unavailable">Sumber tidak menyediakan daftar filter</string>\n    <string name="developer_popular_empty">Daftar populer tidak mengembalikan manga</string>\n    <string name="developer_popular_failed">Gagal memuat daftar populer</string>\n    <string name="developer_details_no_chapters">Detail manga tidak mengembalikan bab</string>\n    <string name="developer_no_usable_manga">Tidak ditemukan manga yang dapat diuji dari daftar populer</string>\n    <string name="developer_chapter_no_pages">Bab tidak mengembalikan halaman</string>\n    <string name="developer_not_supported">Tidak didukung</string>\n    <string name="developer_timeout_seconds">Waktu habis setelah %1$d detik</string>\n</resources>\n''', encoding='utf-8')

          whats_path = Path('app/src/main/res/values-in/whats_new.xml')
          whats = whats_path.read_text(encoding='utf-8')
          whats_replacements = {
              'MIYORARE — A NEW CHAPTER': 'MIYORARE — BABAK BARU',
              'Private Favourites': 'Disukai Private',
              'Gekkoushi Plugin Support': 'Dukungan Plugin Gekkoushi',
              'Reader WebView': 'WebView Pembaca',
              'Library Groups': 'Grup Koleksi',
              'Group Tracking Search': 'Pencarian Pelacakan Grup',
              'New Favourites Themes': 'Tema Disukai Baru',
              'Independent Private Themes': 'Tema Private Independen',
              'More Improvements': 'Peningkatan Lainnya',
          }
          for old, new in whats_replacements.items():
              if old not in whats:
                  raise SystemExit(f'What’s New text not found: {old}')
              whats = whats.replace(old, new)
          whats_path.write_text(whats, encoding='utf-8')

          stage3_path = Path('app/src/main/res/values-in/settings_language_stage3.xml')
          stage3 = stage3_path.read_text(encoding='utf-8')
          stage3 = stage3.replace('<string name="edit_store">Edit store</string>', '<string name="edit_store">Ubah store</string>')
          stage3_path.write_text(stage3, encoding='utf-8')

      - name: Fail-closed Settings language audit
        shell: python
        run: |
          from collections import defaultdict
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          def read_locale(directory):
              values = {}
              locations = defaultdict(list)
              for path in sorted(Path(directory).glob('*.xml')):
                  root = ET.parse(path).getroot()
                  for node in root:
                      if node.tag != 'string' or not node.attrib.get('name'):
                          continue
                      name = node.attrib['name']
                      locations[name].append(str(path))
                      values.setdefault(name, ''.join(node.itertext()).strip())
              duplicates = {k: v for k, v in locations.items() if len(v) > 1}
              return values, duplicates

          default, dup_default = read_locale('app/src/main/res/values')
          indonesian, dup_id = read_locale('app/src/main/res/values-in')
          settings_root = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings')
          source = '\n'.join(p.read_text(encoding='utf-8') for p in settings_root.rglob('*.kt'))
          keys = set(re.findall(r'R\.string\.([A-Za-z0-9_]+)', source))
          external_or_generated = {'cancel', 'not_set', 'ok', 'selectAll'}
          missing_default = sorted(k for k in keys if k not in default and k not in external_or_generated)
          missing_id = sorted(k for k in keys if k in default and k not in indonesian)

          forbidden_literals = [
              '"Extension loading"', '"Popular listing"', '"Manga details"',
              '"Chapter pages"', '"Page image"', '"Cover image"', '"Latest listing"',
              '"Related manga"', '"No catalogue source"', '"Extension contains no catalogue source"',
              '"Source does not expose its filter list"', '"Popular listing returned no manga"',
              '"Popular listing failed"', '"Manga details returned no chapters"',
              '"No usable manga was found in the popular listing"', '"Chapter returned no pages"',
              '"Not supported"', '"Timed out after ',
          ]
          hardcoded = [token for token in forbidden_literals if token in source]

          required_id_values = {
              'whats_new_hero_title': 'MIYORARE — BABAK BARU',
              'whats_new_private_favourites_title': 'Disukai Private',
              'whats_new_gekkoushi_title': 'Dukungan Plugin Gekkoushi',
              'whats_new_reader_webview_title': 'WebView Pembaca',
              'whats_new_library_groups_title': 'Grup Koleksi',
              'whats_new_group_tracking_title': 'Pencarian Pelacakan Grup',
              'whats_new_favourites_themes_title': 'Tema Disukai Baru',
              'whats_new_private_themes_title': 'Tema Private Independen',
              'whats_new_more_improvements': 'Peningkatan Lainnya',
              'edit_store': 'Ubah store',
              'developer_stage_extension_loading': 'Memuat ekstensi',
          }
          wrong_values = {k: (indonesian.get(k), expected) for k, expected in required_id_values.items() if indonesian.get(k) != expected}

          print(f'Settings string keys: {len(keys)}')
          print(f'Missing Indonesian Settings resources: {len(missing_id)}')
          print(f'Duplicate default resources: {len(dup_default)}')
          print(f'Duplicate Indonesian resources: {len(dup_id)}')
          print(f'Forbidden hardcoded English diagnostic literals: {len(hardcoded)}')
          print(f'Incorrect Indonesian quality assertions: {len(wrong_values)}')
          if missing_default or missing_id or dup_default or dup_id or hardcoded or wrong_values:
              print('missing_default=', missing_default)
              print('missing_id=', missing_id)
              print('hardcoded=', hardcoded)
              print('wrong_values=', wrong_values)
              raise SystemExit('Stage 3 language audit failed')
          print('STAGE 3 LANGUAGE AUDIT PASSED')

      - name: Validate resources
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:processDebugResources --no-daemon --stacktrace
      - name: Run debug unit tests
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile debug Kotlin
        shell: bash
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Commit Stage 3 cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/kotlin/org/koitharu/kotatsu/settings/developer/DeveloperExtensionTestRunner.kt \
            app/src/main/kotlin/org/koitharu/kotatsu/settings/developer/DeveloperToolsViewModel.kt \
            app/src/main/res/values/settings_developer_diagnostics.xml \
            app/src/main/res/values-in/settings_developer_diagnostics.xml \
            app/src/main/res/values-in/settings_language_stage3.xml \
            app/src/main/res/values-in/whats_new.xml
          git commit -m 'Finish Settings Indonesian language cleanup'
          git push origin HEAD:beta
