name: Temporary Settings Language Fix

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/tmp-settings-language-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
