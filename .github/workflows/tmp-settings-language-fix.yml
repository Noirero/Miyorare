          # Parse first to ensure the source file is valid and gather all existing names.
          root = ET.parse(path).getroot()
          existing = {node.attrib['name'] for node in root if node.tag == 'string' and 'name' in node.attrib}
          unexpected_existing = sorted(set(translations) & existing)
          if unexpected_existing:
              raise SystemExit('Refusing to create duplicate Indonesian strings: ' + ', '.join(unexpected_existing))

          text = path.read_text(encoding='utf-8')
          marker = '</resources>'
          if marker not in text:
              raise SystemExit('Missing </resources> marker')

          lines = ['\n    <!-- Settings language cleanup: explicit Indonesian coverage -->']
          for key, value in translations.items():
              escaped = escape(value, {'"': '&quot;'})
              lines.append(f'    <string name="{key}">{escaped}</string>')
          block = '\n'.join(lines) + '\n'
          path.write_text(text.replace(marker, block + marker), encoding='utf-8')

          # Reparse and assert exact coverage.
          root = ET.parse(path).getroot()
          names = [node.attrib['name'] for node in root if node.tag == 'string' and 'name' in node.attrib]
          duplicate_names = sorted({x for x in names if names.count(x) > 1})
          if duplicate_names:
              raise SystemExit('Duplicate string resources after insertion: ' + ', '.join(duplicate_names))
          missing = sorted(set(translations) - set(names))
          if missing:
              raise SystemExit('Translations were not written: ' + ', '.join(missing))
          print(f'Added {len(translations)} explicit Indonesian Settings translations')
      - name: Verify Android resources
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:processDebugResources --no-daemon --stacktrace
      - name: Commit language cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/res/values-in/strings.xml; then
            echo 'No translation changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/values-in/strings.xml
          git commit -m 'Complete Indonesian Settings translations'
          git push origin HEAD:beta
