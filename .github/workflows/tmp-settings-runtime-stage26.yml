name: Temporary Settings Runtime Stage 2 and 6 Audit

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/tmp-settings-runtime-stage26.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SETTINGS_BASELINE: 128e09473142da3bc4c70b3bb5daa33a57c4f3f9

jobs:
  runtime-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout beta with history
        uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build pre-reorganization and current debug APKs with identical debug signing
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          patch_settings_export() {
            python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          old = '''<activity\n\t\t\tandroid:name="org.koitharu.kotatsu.settings.SettingsActivity"\n\t\t\tandroid:exported="false"'''
          new = '''<activity\n\t\t\tandroid:name="org.koitharu.kotatsu.settings.SettingsActivity"\n\t\t\tandroid:exported="true"'''
          if old not in text:
              raise SystemExit('SettingsActivity export marker not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          }

          git checkout --force "$SETTINGS_BASELINE"
          patch_settings_export
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          OLD_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$OLD_APK"
          cp "$OLD_APK" /tmp/miyorare-settings-old.apk

          git checkout --force "$HEAD_SHA"
          patch_settings_export
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          CURRENT_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$CURRENT_APK"
          cp "$CURRENT_APK" /tmp/miyorare-settings-current.apk

          echo "Old APK: $(du -h /tmp/miyorare-settings-old.apk | cut -f1)"
          echo "Current APK: $(du -h /tmp/miyorare-settings-current.apk | cut -f1)"

      - name: Enable KVM
        shell: bash
        run: |
          sudo chmod 666 /dev/kvm || true

      - name: Stage 2 upgrade regression and Stage 6 responsive/theme runtime matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            PKG='org.noirero.miyorare.debug'
            SETTINGS_ACTIVITY='org.koitharu.kotatsu.settings.SettingsActivity'
            PREF_FILE="${PKG}_preferences.xml"
            OUT="$GITHUB_WORKSPACE/settings-stage26-runtime"
            mkdir -p "$OUT"

            fail() {
              echo "::error::$*"
              adb logcat -d | tail -n 300 || true
              exit 1
            }

            assert_alive_no_crash() {
              local label="$1"
              sleep 2
              adb shell pidof "$PKG" >/dev/null 2>&1 || fail "$label: app process is not alive"
              adb logcat -d > "$OUT/${label//[^A-Za-z0-9_-]/_}.log" || true
              if grep -q 'FATAL EXCEPTION' "$OUT/${label//[^A-Za-z0-9_-]/_}.log" && grep -q "Process: $PKG" "$OUT/${label//[^A-Za-z0-9_-]/_}.log"; then
                fail "$label: fatal exception detected"
              fi
            }

            start_settings() {
              local label="$1"
              local action="${2:-}"
              adb shell am force-stop "$PKG" || true
              adb logcat -c
              if [ -n "$action" ]; then
                adb shell am start -W -a "$action" -n "$PKG/$SETTINGS_ACTIVITY" >/tmp/start.txt || fail "$label: unable to launch Settings"
              else
                adb shell am start -W -n "$PKG/$SETTINGS_ACTIVITY" >/tmp/start.txt || fail "$label: unable to launch Settings"
              fi
              cat /tmp/start.txt
              assert_alive_no_crash "$label"
            }

            dump_ui() {
              local label="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || fail "$label: uiautomator dump failed"
              adb pull /sdcard/window.xml "$OUT/$label.xml" >/dev/null
              adb exec-out screencap -p > "$OUT/$label.png"
              python3 - "$OUT/$label.xml" "$label" <<'PY'
            import re, sys, xml.etree.ElementTree as ET
            path, label = sys.argv[1:]
            root = ET.parse(path).getroot()
            nodes = [n for n in root.iter('node') if (n.attrib.get('text') or n.attrib.get('content-desc'))]
            if len(nodes) < 2:
                raise SystemExit(f'{label}: too few accessible text nodes ({len(nodes)})')
            bad = []
            for n in nodes:
                b = n.attrib.get('bounds', '')
                m = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', b)
                if m:
                    x1,y1,x2,y2 = map(int, m.groups())
                    if x2 <= x1 or y2 <= y1:
                        bad.append((n.attrib.get('text') or n.attrib.get('content-desc'), b))
            if bad:
                raise SystemExit(f'{label}: invalid accessible bounds: {bad[:5]}')
            print(f'{label}: {len(nodes)} accessible text nodes, bounds valid')
            PY
            }

            write_theme_prefs() {
              local style="$1" preset="$2" night="$3" amoled="$4" accent="$5"
              adb shell am force-stop "$PKG" || true
              cat > /tmp/theme.xml <<EOF
            <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
            <map>
              <string name="miyorare_design_style">$style</string>
              <string name="miyorare_theme_preset">$preset</string>
              <string name="miyorare_custom_accent">$accent</string>
              <string name="theme">$night</string>
              <boolean name="amoled_theme" value="$amoled" />
              <boolean name="ui_scale_reset_v2" value="true" />
            </map>
            EOF
              adb shell run-as "$PKG" mkdir -p shared_prefs
              cat /tmp/theme.xml | adb shell run-as "$PKG" sh -c "cat > shared_prefs/$PREF_FILE"
            }

            set_geometry() {
              local size="$1" density="$2" font="$3" rotation="$4"
              if [ "$size" = reset ]; then adb shell wm size reset; else adb shell wm size "$size"; fi
              if [ "$density" = reset ]; then adb shell wm density reset; else adb shell wm density "$density"; fi
              adb shell settings put system font_scale "$font"
              adb shell settings put system accelerometer_rotation 0
              adb shell settings put system user_rotation "$rotation"
              sleep 1
            }

            echo '=== Stage 2A: install pre-reorganization APK and seed real old-install state ==='
            adb install -r /tmp/miyorare-settings-old.apk
            start_settings old_baseline
            adb shell am force-stop "$PKG"
            adb shell run-as "$PKG" mkdir -p shared_prefs files
            printf 'miyorare-settings-upgrade-marker\n' | adb shell run-as "$PKG" sh -c 'cat > files/settings_stage2_upgrade_marker.txt'
            cat > /tmp/oldprefs.xml <<'EOF'
            <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
            <map>
              <string name="miyorare_design_style">CLASSIC</string>
              <string name="miyorare_theme_preset">VIOLET</string>
              <string name="miyorare_custom_accent">#3A7AFE</string>
              <string name="theme">2</string>
              <boolean name="amoled_theme" value="true" />
              <boolean name="title_tap_to_read" value="true" />
              <boolean name="check_duplicates" value="false" />
              <boolean name="reader_volume_buttons" value="true" />
              <boolean name="reader_taps_ltr" value="true" />
              <boolean name="reader_navigation_inverted" value="true" />
              <boolean name="feed_swipe_gestures" value="false" />
              <boolean name="feed_counter_dot" value="true" />
              <boolean name="nav_legacy" value="true" />
              <boolean name="haptic_feedback" value="false" />
              <boolean name="tracker_smart_update" value="false" />
              <boolean name="no_offline" value="false" />
              <boolean name="ssl_bypass" value="false" />
            </map>
            EOF
            cat /tmp/oldprefs.xml | adb shell run-as "$PKG" sh -c "cat > shared_prefs/$PREF_FILE"
            start_settings old_seeded
            adb shell am force-stop "$PKG"
            adb shell run-as "$PKG" cat "shared_prefs/$PREF_FILE" > "$OUT/pre_upgrade_preferences.xml"

            echo '=== Stage 2B: in-place upgrade to current APK, preserving Android app data ==='
            adb install -r /tmp/miyorare-settings-current.apk
            test "$(adb shell run-as "$PKG" cat files/settings_stage2_upgrade_marker.txt | tr -d '\r')" = 'miyorare-settings-upgrade-marker' || fail 'Upgrade wiped app files/data'
            start_settings current_after_upgrade
            dump_ui current_after_upgrade
            adb shell am force-stop "$PKG"
            adb shell run-as "$PKG" cat "shared_prefs/$PREF_FILE" > "$OUT/post_upgrade_preferences.xml"

            python3 - "$OUT/post_upgrade_preferences.xml" <<'PY'
            import sys, xml.etree.ElementTree as ET
            root = ET.parse(sys.argv[1]).getroot()
            vals = {}
            for n in root:
                name = n.attrib.get('name')
                if n.tag == 'string': vals[name] = n.text or ''
                elif n.tag == 'boolean': vals[name] = n.attrib.get('value') == 'true'
                elif n.tag == 'int': vals[name] = int(n.attrib['value'])
            expected = {
                'miyorare_design_style': 'CLASSIC',
                'miyorare_theme_preset': 'VIOLET',
                'miyorare_custom_accent': '#3A7AFE',
                'theme': '2',
                'amoled_theme': True,
                'title_tap_to_read': True,
                'check_duplicates': False,
                'reader_volume_buttons': True,
                'reader_taps_ltr': True,
                'reader_navigation_inverted': True,
                'feed_swipe_gestures': False,
                'feed_counter_dot': True,
                'nav_legacy': True,
                'haptic_feedback': False,
                'tracker_smart_update': False,
                'no_offline': False,
                'ssl_bypass': False,
            }
            bad = {k:(vals.get(k),v) for k,v in expected.items() if vals.get(k) != v}
            if bad:
                raise SystemExit(f'Upgrade preference regression: {bad}')
            print(f'PASS: {len(expected)} moved/sensitive preferences preserved across real APK upgrade')
            PY

            echo '=== Stage 2C: runtime smoke of sensitive Settings destinations ==='
            for action in \
              "$PKG.action.MANAGE_PRIVATE_FAVOURITES" \
              "$PKG.action.MANAGE_READER_SETTINGS" \
              "$PKG.action.MANAGE_DOWNLOADS" \
              "$PKG.action.MANAGE_TRACKER" \
              "$PKG.action.MANAGE_SOURCES" \
              "$PKG.action.MANAGE_PROXY"; do
              label="route_${action##*.}"
              start_settings "$label" "$action"
              dump_ui "$label"
            done

            echo '=== Stage 2D: clean current install must default to Modern ==='
            adb uninstall "$PKG"
            adb install /tmp/miyorare-settings-current.apk
            start_settings fresh_current
            dump_ui fresh_current
            adb shell am force-stop "$PKG"
            adb shell run-as "$PKG" cat "shared_prefs/$PREF_FILE" > "$OUT/fresh_preferences.xml"
            grep -q '<string name="miyorare_design_style">MODERN</string>' "$OUT/fresh_preferences.xml" || fail 'Fresh install did not default to Modern'

            echo '=== Stage 6A: all Modern accent presets on a normal phone viewport ==='
            set_geometry reset reset 1.0 0
            i=0
            for preset in MIYORARE SAKURA VIOLET CYAN EMERALD AMBER CUSTOM; do
              if [ $((i % 2)) -eq 0 ]; then night=1; amoled=false; adb shell cmd uimode night no >/dev/null; else night=2; amoled=false; adb shell cmd uimode night yes >/dev/null; fi
              write_theme_prefs MODERN "$preset" "$night" "$amoled" '#E650A8'
              label="modern_${preset,,}"
              start_settings "$label"
              dump_ui "$label"
              i=$((i+1))
            done

            echo '=== Stage 6B: AMOLED + Dark, Classic/Modern, large-font small screen ==='
            set_geometry 720x1280 360 1.5 0
            adb shell cmd uimode night yes >/dev/null
            write_theme_prefs MODERN MIYORARE 2 true '#5B6CFF'
            start_settings small_largefont_modern_dark_amoled
            dump_ui small_largefont_modern_dark_amoled
            start_settings small_largefont_reader "$PKG.action.MANAGE_READER_SETTINGS"
            dump_ui small_largefont_reader
            write_theme_prefs CLASSIC MIYORARE 2 true '#5B6CFF'
            start_settings small_largefont_classic_dark_amoled
            dump_ui small_largefont_classic_dark_amoled

            echo '=== Stage 6C: landscape, large font, both Classic and Modern ==='
            set_geometry 1280x720 320 1.3 1
            adb shell cmd uimode night no >/dev/null
            write_theme_prefs MODERN EMERALD 1 false '#2FA97D'
            start_settings landscape_modern_light
            dump_ui landscape_modern_light
            start_settings landscape_modern_downloads "$PKG.action.MANAGE_DOWNLOADS"
            dump_ui landscape_modern_downloads
            write_theme_prefs CLASSIC EMERALD 1 false '#2FA97D'
            start_settings landscape_classic_light
            dump_ui landscape_classic_light

            echo '=== Stage 6D: scrollability/accessibility sanity on extreme viewport ==='
            write_theme_prefs MODERN SAKURA 2 true '#E85D9E'
            set_geometry 720x1280 360 1.5 0
            start_settings extreme_scroll_root
            for n in 1 2 3 4 5; do
              adb shell input swipe 360 1050 360 300 350
              sleep 0.4
              dump_ui "extreme_scroll_${n}"
            done

            # Restore emulator overrides for clean teardown.
            adb shell wm size reset || true
            adb shell wm density reset || true
            adb shell settings put system font_scale 1.0 || true
            adb shell settings put system user_rotation 0 || true

            echo 'STAGE 2 RUNTIME UPGRADE/ROUTE CHECKS PASSED'
            echo 'STAGE 6 RESPONSIVE/THEME MATRIX PASSED'

      - name: Upload Settings runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-stage2-stage6-runtime-evidence
          path: settings-stage26-runtime
          if-no-files-found: warn
          retention-days: 7
