name: Beta to Main Release Gate

on:
  push:
    branches:
      - beta
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-main-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify beta is safe to promote
    if: github.event_name != 'pull_request' || github.head_ref == 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fast beta compile feedback
        if: github.event_name == 'push'
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Run deep promotion gate
        if: github.event_name != 'push'
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace

  runtime-smoke:
    name: Upgrade and critical runtime smoke
    if: github.event_name == 'pull_request' && github.head_ref == 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout beta with history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build main and beta debug APKs with identical debug signing
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          patch_settings_export() {
            python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          old = '''<activity\n\t\t\tandroid:name="org.koitharu.kotatsu.settings.SettingsActivity"\n\t\t\tandroid:exported="false"'''
          new = '''<activity\n\t\t\tandroid:name="org.koitharu.kotatsu.settings.SettingsActivity"\n\t\t\tandroid:exported="true"'''
          if old not in text:
              raise SystemExit('SettingsActivity export marker not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          }

          git checkout --force "$BASE_SHA"
          patch_settings_export
          chmod +x gradlew
          rm -rf app/build/outputs/apk/debug
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          MAIN_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$MAIN_APK"
          cp "$MAIN_APK" /tmp/miyorare-main-debug.apk

          git checkout --force "$HEAD_SHA"
          patch_settings_export
          chmod +x gradlew
          rm -rf app/build/outputs/apk/debug
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          BETA_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$BETA_APK"
          cp "$BETA_APK" /tmp/miyorare-beta-debug.apk

          echo "Main APK: $(du -h /tmp/miyorare-main-debug.apk | cut -f1)"
          echo "Beta APK: $(du -h /tmp/miyorare-beta-debug.apk | cut -f1)"

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Run upgrade and navigation smoke on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/beta-main-runtime-smoke.sh

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-main-release-gate-runtime
          path: release-gate-runtime/
          if-no-files-found: warn
          retention-days: 7
