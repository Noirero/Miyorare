name: Beta to Main Release Gate

# Phase 12 promotion policy:
# - Beta pays the validation cost.
# - Main only accepts a proven beta/release candidate.
# - Do not repeat Gradle, APK, emulator, or instrumentation work during promotion.
# - Freeze accepted beta into release/main-* when beta must keep moving during release prep.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-main-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-gate:
    name: Promotion Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout promotion candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify promotion source
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" != "beta" && "$HEAD_REF" != release/main-* ]]; then
            echo "::error::Main accepts promotion only from beta or a frozen release/main-* candidate."
            exit 1
          fi

      - name: Verify exact candidate ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          # A frozen release candidate must be a beta snapshot, not an unrelated branch.
          git fetch --no-tags origin beta
          git merge-base --is-ancestor "$HEAD_SHA" origin/beta || {
            echo "::error::Promotion candidate is not contained in beta."
            exit 1
          }

      - name: Verify release-critical identity invariants
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "applicationId = 'org.noirero.miyorare'" app/build.gradle || {
            echo "::error::Main applicationId must remain org.noirero.miyorare."
            exit 1
          }
          grep -Fq "variant.applicationId.set('org.noirero.miyorare.beta')" app/build.gradle || {
            echo "::error::Beta preview applicationId must remain org.noirero.miyorare.beta."
            exit 1
          }
          grep -Fq 'android:label="@string/app_name"' app/src/main/AndroidManifest.xml || {
            echo "::error::Main manifest must use @string/app_name."
            exit 1
          }
          grep -Fq '<string name="app_name" translatable="false">Miyorare</string>' app/src/release/res/values/app_name.xml || {
            echo "::error::Main release label must remain Miyorare."
            exit 1
          }
          grep -Fq 'android:label="@string/app_name_beta"' app/src/preview/AndroidManifest.xml || {
            echo "::error::Beta preview manifest must override the app label."
            exit 1
          }
          grep -Fq '<string name="app_name_beta" translatable="false">Miyorare Beta</string>' app/src/preview/res/values/strings.xml || {
            echo "::error::Beta label must remain Miyorare Beta."
            exit 1
          }

      - name: Record validate-once promotion evidence
        shell: bash
        run: |
          {
            echo "### Promotion Gate"
            echo
            echo "- Candidate: \`$(git rev-parse HEAD)\`"
            echo "- Source: \`${{ github.head_ref || github.ref_name }}\`"
            echo "- Policy: beta validates; main verifies and promotes."
            echo "- Repeated Gradle/Android validation: none."
          } >> "$GITHUB_STEP_SUMMARY"
