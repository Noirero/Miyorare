name: Beta to Main Release Gate

on:
  push:
    branches:
      - beta
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-main-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify beta is safe to promote
    if: github.event_name != 'pull_request' || github.head_ref == 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run all debug unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
