name: Beta to Main Release Gate

# Main has three protected entry paths:
# 1. beta or release/main-* promotion: beta already paid the validation cost, so only
#    exact-candidate/release invariants are verified here.
# 2. hotfix/*: emergency fixes branch from current main and pay their own JVM/runtime
#    validation cost before the same required status can succeed.
# 3. Owned README automation: strict current-main, open-PR, exact-head, README-only
#    maintenance; no Gradle/emulator and no generic automation/docs bypass.
#
# The final job name is intentionally stable because the main ruleset requires it.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      maintenance_pr:
        description: Open main README automation PR number (required for maintenance).
        required: false
        type: string
      candidate_sha:
        description: Exact README PR head SHA, which must also equal this dispatch run SHA.
        required: false
        type: string
      main_base_sha:
        description: Exact protected-main PR base SHA (required for maintenance).
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: beta-main-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  classify:
    name: Classify main candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      run_runtime: ${{ steps.runtime.outputs.run_runtime }}
      run_android_test_compile: ${{ steps.compile.outputs.run_android_test_compile }}
      run_preview_android_test_compile: ${{ steps.compile.outputs.run_preview_android_test_compile }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
          fetch-depth: 0

      - name: Classify source
        id: mode
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.main_base_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.maintenance_pr }}
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [[ "${{ github.event_name }}" = workflow_dispatch ]]; then
            # Required checks attach to the dispatch SHA, not checkout's override.
            test "$GITHUB_SHA" = "$HEAD_SHA"
          fi

          if [[ "$HEAD_REF" = "beta" || "$HEAD_REF" = release/main-* ]]; then
            git fetch --no-tags origin beta
            git merge-base --is-ancestor "$HEAD_SHA" origin/beta || {
              echo "::error::Promotion candidate is not contained in beta."
              exit 1
            }
            evidence_sha="$HEAD_SHA"
            checks_json="$(gh api --repo "$GITHUB_REPOSITORY" "repos/{owner}/{repo}/commits/$evidence_sha/check-runs?per_page=100")"
            if ! printf '%s' "$checks_json" | python3 .github/scripts/promotion_evidence.py >/dev/null 2>&1; then
              # A beta merge commit can reuse the exact PR-head evidence only when its tree is identical.
              read -r -a parents <<< "$(git show -s --format=%P "$HEAD_SHA")"
              test "${#parents[@]}" -ge 2 || { echo "::error::Promotion candidate has no exact required-check evidence."; exit 1; }
              evidence_sha="${parents[1]}"
              test "$(git rev-parse "$HEAD_SHA^{tree}")" = "$(git rev-parse "$evidence_sha^{tree}")" || {
                echo "::error::Validated PR head is not tree-equivalent to the promotion candidate."; exit 1;
              }
              checks_json="$(gh api --repo "$GITHUB_REPOSITORY" "repos/{owner}/{repo}/commits/$evidence_sha/check-runs?per_page=100")"
            fi
            printf '%s' "$checks_json" | python3 .github/scripts/promotion_evidence.py
            echo "evidence_sha=$evidence_sha" >> "$GITHUB_OUTPUT"
            echo "mode=promotion" >> "$GITHUB_OUTPUT"
          elif [[ "$HEAD_REF" = hotfix/* && "${{ github.event_name }}" = "pull_request" ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            # A direct-main hotfix must include the exact protected-main base it targets.
            # This prevents an old/diverged branch from using the emergency path.
            git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" || {
              echo "::error::hotfix/* must branch from or be updated onto the current main base."
              exit 1
            }
            echo "mode=hotfix" >> "$GITHUB_OUTPUT"
          elif [[ "$HEAD_REF" = automation/release-readme-* || "$HEAD_REF" = automation/readme-release-stats ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            if [[ "${{ github.event_name }}" = pull_request ]]; then
              test "$BASE_REF" = main
            elif [[ "${{ github.event_name }}" = workflow_dispatch ]]; then
              test "$REQUESTED_SHA" = "$HEAD_SHA"
            else
              echo "::error::README maintenance requires a main PR or explicit PR-bound dispatch."
              exit 1
            fi

            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            test "$(git rev-parse origin/main)" = "$BASE_SHA"
            git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > /tmp/main-maintenance-pr.json
            python3 - <<'PY_MAINTENANCE'
          import json
          import os
          import subprocess
          from pathlib import Path

          pr = json.loads(Path('/tmp/main-maintenance-pr.json').read_text())
          repo, head, base = (os.environ[k] for k in ('GITHUB_REPOSITORY', 'HEAD_SHA', 'BASE_SHA'))
          if not (pr['state'] == 'open' and pr['base']['ref'] == 'main'
                  and pr['base']['sha'] == base and pr['head']['sha'] == head
                  and pr['head']['ref'] == os.environ['HEAD_REF']
                  and pr['base']['repo']['full_name'] == repo
                  and pr['head']['repo']['full_name'] == repo):
              raise SystemExit('README maintenance PR metadata does not match the exact candidate/main base')
          diff = subprocess.check_output(['git', 'diff', '--name-status', '-z', '--no-renames', base, head])
          if diff.split(b'\0') != [b'M', b'README.md', b'']:
              raise SystemExit('README maintenance must modify only the existing README.md')
          for sha in (base, head):
              entry = subprocess.check_output(['git', 'ls-tree', sha, '--', 'README.md'])
              if not entry.startswith(b'100644 blob '):
                  raise SystemExit('README maintenance must preserve README.md regular-file mode')
          PY_MAINTENANCE
            git diff --check "$BASE_SHA" "$HEAD_SHA"
            echo "mode=maintenance" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Main accepts beta/release promotion, hotfix PRs, or strictly validated owned README maintenance."
            exit 1
          fi

      - name: Verify release-critical identity invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "applicationId = 'org.noirero.miyorare'" app/build.gradle
          grep -Fq "variant.applicationId.set('org.noirero.miyorare.beta')" app/build.gradle
          grep -Fq 'android:label="@string/app_name"' app/src/main/AndroidManifest.xml
          grep -Fq '<string name="app_name" translatable="false">Miyorare</string>' app/src/release/res/values/app_name.xml
          grep -Fq 'android:label="@string/app_name_beta"' app/src/preview/AndroidManifest.xml
          grep -Fq '<string name="app_name_beta" translatable="false">Miyorare Beta</string>' app/src/preview/res/values/strings.xml

      - name: Verify launcher isolation
        shell: bash
        run: |
          set -euo pipefail

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for name in ic_launcher ic_launcher_round; do
              main_icon="app/src/main/res/mipmap-${density}/${name}.webp"
              beta_icon="app/src/preview/res/mipmap-${density}/${name}.webp"
              test -f "$main_icon"
              test -f "$beta_icon"
              if cmp -s "$main_icon" "$beta_icon"; then
                echo "::error::Main and Beta launcher artwork must remain visually isolated: $name ($density)."
                exit 1
              fi
            done
          done

          for adaptive in ic_launcher.xml ic_launcher_round.xml; do
            main_adaptive="app/src/main/res/mipmap-anydpi-v26/$adaptive"
            beta_adaptive="app/src/preview/res/mipmap-anydpi-v26/$adaptive"
            test -f "$main_adaptive"
            test -f "$beta_adaptive"
            grep -Fq '@drawable/ic_launcher_foreground' "$main_adaptive"
            grep -Fq '@drawable/ic_launcher_beta_foreground' "$beta_adaptive"
          done

          grep -Fq '@drawable/ic_launcher_main_foreground' app/src/main/res/drawable/ic_launcher_foreground.xml

          if grep -R -Fq '@drawable/ic_launcher_beta_foreground' app/src/main/res/mipmap-anydpi-v26; then
            echo "::error::Main launcher mapping must not reference Beta artwork."
            exit 1
          fi

          if grep -R -Fq '@drawable/ic_launcher_foreground' app/src/preview/res/mipmap-anydpi-v26; then
            echo "::error::Beta launcher mapping must not fall back to Main foreground artwork."
            exit 1
          fi

      - name: Diff sanity
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Classify hotfix instrumentation compile risk
        id: compile
        if: steps.mode.outputs.mode == 'hotfix'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/test_ci_deep_paths.py
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/hotfix-compile-paths.txt
          for gate in android-test-compile preview-android-test-compile; do
            value="$(python3 .github/scripts/ci_deep_paths.py --paths-file /tmp/hotfix-compile-paths.txt --gate "$gate")"
            [[ "$value" = true || "$value" = false ]]
            if [[ "$gate" = android-test-compile ]]; then
              echo "run_android_test_compile=$value" >> "$GITHUB_OUTPUT"
            else
              echo "run_preview_android_test_compile=$value" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Classify hotfix Android runtime risk
        id: runtime
        if: steps.mode.outputs.mode == 'hotfix'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/test_android_runtime_paths.py
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/hotfix-runtime-paths.txt
          run_runtime="$(python3 .github/scripts/android_runtime_paths.py --paths-file /tmp/hotfix-runtime-paths.txt)"
          echo "run_runtime=$run_runtime" >> "$GITHUB_OUTPUT"
          echo "Hotfix Android runtime required: $run_runtime" >> "$GITHUB_STEP_SUMMARY"

      - name: Record promotion evidence
        if: steps.mode.outputs.mode == 'promotion'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          {
            echo "### Beta promotion"
            echo
            printf '%s`%s`\n' '- Candidate: ' "$(git rev-parse HEAD)"
            printf '%s`%s`\n' '- Source: ' "$HEAD_REF"
            printf '%s`%s`\n' '- Validated evidence SHA: ' "${{ steps.mode.outputs.evidence_sha }}"
            echo "- Evidence: required beta checks passed on the candidate itself or an identical-tree PR head."
            echo "- Policy: beta validates; main verifies and promotes."
            echo "- Repeated Gradle/Android validation: none."
          } >> "$GITHUB_STEP_SUMMARY"

  hotfix-jvm:
    name: Validate main hotfix JVM regression
    needs: classify
    if: needs.classify.outputs.mode == 'hotfix'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact hotfix head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact hotfix head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Run full JVM unit regression
        run: ./gradlew :app:testDebugUnitTest ${{ needs.classify.outputs.run_android_test_compile == 'true' && ':app:compileDebugAndroidTestKotlin :app:compileDebugAndroidTestJavaWithJavac' || '' }} --no-daemon --stacktrace

      - name: Compile Preview instrumentation source when variant/build risk requires it
        if: needs.classify.outputs.run_preview_android_test_compile == 'true'
        run: ./gradlew :app:compilePreviewAndroidTestKotlin :app:compilePreviewAndroidTestJavaWithJavac -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview --no-daemon --stacktrace

      - name: Upload hotfix unit-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-hotfix-unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

  hotfix-runtime:
    name: Validate main hotfix Android runtime
    needs: classify
    if: needs.classify.outputs.mode == 'hotfix' && needs.classify.outputs.run_runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact hotfix head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact hotfix head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Run Android 15 persistence and migration acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.core.db.ChapterPersistenceRegressionTest,org.koitharu.kotatsu.alternatives.domain.ProfileMigrationPersistenceRegressionTest,org.koitharu.kotatsu.backup.local.LocalBackupIdentityTest,org.koitharu.kotatsu.settings.backup.AppBackupAgentTest

      - name: Upload hotfix runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-hotfix-android-runtime-evidence
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7

  required:
    name: Verify beta is safe to promote
    needs:
      - classify
      - hotfix-jvm
      - hotfix-runtime
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify candidate validation result
        shell: bash
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          JVM_RESULT: ${{ needs.hotfix-jvm.result }}
          RUNTIME_RESULT: ${{ needs.hotfix-runtime.result }}
          RUN_RUNTIME: ${{ needs.classify.outputs.run_runtime }}
        run: |
          set -euo pipefail

          test "$CLASSIFY_RESULT" = "success"

          if [[ "$MODE" = "promotion" ]]; then
            test "$JVM_RESULT" = "skipped"
            test "$RUNTIME_RESULT" = "skipped"
            echo "Validated beta/release candidate is safe to promote."
          elif [[ "$MODE" = "maintenance" ]]; then
            test "$JVM_RESULT" = "skipped"
            test "$RUNTIME_RESULT" = "skipped"
            echo "Owned README-only exact-head maintenance passed main invariants."
          elif [[ "$MODE" = "hotfix" ]]; then
            test "$JVM_RESULT" = "success"
            if [[ "$RUN_RUNTIME" = "true" ]]; then
              test "$RUNTIME_RESULT" = "success"
            else
              test "$RUNTIME_RESULT" = "skipped"
            fi
            echo "Direct-main hotfix passed its required validation."
          else
            echo "::error::Unknown or rejected main candidate mode: $MODE"
            exit 1
          fi
