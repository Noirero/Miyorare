name: P0 P1 Acceptance Gate

on:
  pull_request:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-p1-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-acceptance:
    name: P0/P1 deterministic acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          echo "Acceptance head: $actual"


      - name: Decide whether P0/P1 Gradle acceptance is required
        id: p0_scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/test_ci_gradle_paths.py
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            required=true
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-paths.txt
            required="$(python3 .github/scripts/ci_gradle_paths.py --paths-file changed-paths.txt)"
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "P0/P1 Gradle acceptance required: $required"

      - name: Set up JDK
        if: steps.p0_scope.outputs.required == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.p0_scope.outputs.required == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        if: steps.p0_scope.outputs.required == 'true'
        run: chmod +x gradlew

      - name: Pre-warm parser dependency
        if: steps.p0_scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("gradle/libs.versions.toml").read_text(encoding="utf-8"))
          value = str(data.get("versions", {}).get("parsers", "")).strip()
          if not value:
              raise SystemExit("Missing versions.parsers in gradle/libs.versions.toml")
          print(value)
          PY
          )"
          POM_URL="https://jitpack.io/com/github/Gekkoushi/plugin-source/${PARSERS_VERSION}/plugin-source-${PARSERS_VERSION}.pom"
          for i in $(seq 1 12); do
            HTTP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$POM_URL" || true)"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Parser artifact is ready (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: parser artifact returned HTTP ${HTTP_STATUS:-000}"
            sleep 20
          done
          echo "::error::Parser artifact ${PARSERS_VERSION} is not ready on JitPack"
          exit 1

      - name: Run P0/P1 deterministic regressions and compile candidate
        if: steps.p0_scope.outputs.required == 'true'
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests org.koitharu.kotatsu.local.data.output.LocalArchiveFinalizationRegressionTest
          --tests org.koitharu.kotatsu.local.DownloadDeletionRegressionTest
          --tests org.koitharu.kotatsu.settings.sources.ExtensionInstallerMethodDialogRegressionTest
          --tests org.koitharu.kotatsu.local.data.LocalStackSafetyRegressionTest
          --tests org.koitharu.kotatsu.favourites.ui.categories.select.FavouriteCategoryBatchingRegressionTest
          --tests org.koitharu.kotatsu.performance.RuntimeLagHardeningRegressionTest
          --no-daemon --stacktrace

      - name: Upload JVM acceptance evidence
        if: ${{ always() && steps.p0_scope.outputs.required == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: p0-p1-jvm-acceptance
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14


  # Core Android persistence/migration instrumentation is consolidated in android-runtime.yml.
  # Manual P0/P1 dispatch keeps the deterministic JVM gate and the unique Favourites visual evidence below.


  # Expensive final-only visual verification. During UI editing this job stays dormant:
  # PR pushes run the lightweight JVM gate, while emulator/golden capture is manual.
  favourites-golden-evidence:
    name: Favourites canonical visual evidence
    if: github.event_name == 'workflow_dispatch'
    needs: jvm-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          echo "Visual-evidence head: $actual"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Capture canonical Favourites screenshot on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 864x1536
            adb shell wm density 320
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night yes
            adb shell rm -rf /sdcard/Download/miyorare-favourites-golden
            # Use the debuggable preview/Beta variant so the visual capture matches the installable Beta artifact.
            ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.favourites.ui.FavouritesGoldenVisualTest
            mkdir -p favourites-golden-evidence
            adb pull /sdcard/Download/miyorare-favourites-golden/implementation.png favourites-golden-evidence/implementation.png
            adb pull /sdcard/Download/miyorare-favourites-golden/geometry.json favourites-golden-evidence/geometry.json
            test -s favourites-golden-evidence/implementation.png
            test -s favourites-golden-evidence/geometry.json

      - name: Upload Favourites visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: favourites-golden-evidence
          path: |
            favourites-golden-evidence/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
