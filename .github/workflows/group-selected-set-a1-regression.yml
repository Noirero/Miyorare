name: Selected Set Library Group A1 Regression

on:
  push:
    branches:
      - agent/set-scoped-groups-migration-55-56-20261120
    paths:
      - '.github/workflows/group-selected-set-a1-regression.yml'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/favourites/ui/CategorySetsUiTest.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/favourites/groups/domain/LibraryGroupsRepository.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/favourites/groups/data/LibraryGroupsDao.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/favourites/domain/FavouriteSetSelectionStore.kt'
  workflow_dispatch:

jobs:
  group-a1-regression:
    name: Selected Set A1 Android 15 reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact pushed SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact SHA and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/agent/set-scoped-groups-migration-55-56-20261120'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Run selected Set A1 instrumented regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.favourites.ui.CategorySetsUiTest#selectedSetA1GroupCreationAndPickerRespectOwner
