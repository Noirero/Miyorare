name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - name: Checkout fork
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Fetch upstream
      run: |
        git remote add upstream https://github.com/HuzaifaKhalid1311/DropSauce.git
        git fetch upstream main

    - name: Merge upstream main
      id: merge
      shell: bash
      run: |
        set -euo pipefail
        BEFORE=$(git rev-parse HEAD)

        if ! git merge --no-edit upstream/main; then
          echo "::error::Upstream could not be merged automatically. Resolve the merge conflict manually before the next sync."
          git status --short
          exit 1
        fi

        AFTER=$(git rev-parse HEAD)
        if [ "$BEFORE" = "$AFTER" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "Fork is already up to date with upstream."
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Upstream changes merged: $BEFORE -> $AFTER"
        fi

    - name: Verify fork identity and update source
      if: steps.merge.outputs.changed == 'true'
      run: |
        set -euo pipefail
        grep -Fq "applicationId = 'org.noirero.miyorare'" app/build.gradle || {
          echo "::error::Fork applicationId was lost during the upstream merge. Refusing to publish."
          exit 1
        }
        grep -Fq '<string name="github_updates_repo" translatable="false">Noirero/Miyorare</string>' app/src/main/res/values/constants.xml || {
          echo "::error::Fork update repository was lost during the upstream merge. Refusing to publish."
          exit 1
        }

    - name: Push merged upstream changes
      if: steps.merge.outputs.changed == 'true'
      run: git push origin HEAD:refs/heads/main

    - name: Start fork release build
      if: steps.merge.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh workflow run release.yml --ref main
