name: Post Release README

on:
  release:
    types: [published]

concurrency:
  group: post-release-readme-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-readme:
    name: Update published release verification
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve published release provenance and exact APK assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$TAG" == v* ]] || {
            echo "::error::Stable Miyorare release tag must start with v."
            exit 1
          }

          git fetch --force origin main --tags
          RELEASE_COMMIT="$(git rev-list -n 1 "$TAG")"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve exact release commit for $TAG."
            exit 1
          }

          mkdir -p release
          gh release view "$TAG"             --repo "$GITHUB_REPOSITORY"             --json body             --jq '.body // ""'             > release/release-body.txt

          SOURCE_RUN_ID="$(sed -n 's/^<!-- MIYORARE_RELEASE_RUN_ID:\([0-9][0-9]*\) -->$/\1/p' release/release-body.txt | head -n 1)"
          MARKED_SHA="$(sed -n 's/^<!-- MIYORARE_RELEASE_SOURCE_SHA:\([0-9a-f][0-9a-f]*\) -->$/\1/p' release/release-body.txt | head -n 1)"

          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Release provenance is missing the originating Main Build run ID."
            exit 1
          }
          [[ "$MARKED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Release provenance is missing the exact source SHA."
            exit 1
          }
          [[ "$MARKED_SHA" == "$RELEASE_COMMIT" ]] || {
            echo "::error::Release tag commit does not match the source SHA recorded by Main Build."
            exit 1
          }

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > release/source-run.json
          RUN_NAME="$(jq -r '.name' release/source-run.json)"
          RUN_SHA="$(jq -r '.head_sha' release/source-run.json)"
          [[ "$RUN_NAME" == "Miyorare Main Build" ]] || {
            echo "::error::Recorded source run is not Miyorare Main Build."
            exit 1
          }
          [[ "$RUN_SHA" == "$RELEASE_COMMIT" ]] || {
            echo "::error::Recorded Main Build run did not execute on the release commit."
            exit 1
          }

          gh release download "$TAG"             --repo "$GITHUB_REPOSITORY"             --dir release             --pattern '*.apk'

          shopt -s nullglob
          APK_FILES=(release/*.apk)
          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "::error::Published release contains no APK assets."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Update README from published APKs
        env:
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          SOURCE_RUN_ID: ${{ steps.release.outputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout -B release-readme-base origin/main

          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          readme = Path('README.md')
          start = '<!-- RELEASE_README_START -->'
          end = '<!-- RELEASE_README_END -->'
          text = readme.read_text()
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('README release verification markers are missing or duplicated')

          repo = os.environ['GITHUB_REPOSITORY']
          version = os.environ['VERSION_NAME']
          commit = os.environ['RELEASE_COMMIT']
          run_id = os.environ['SOURCE_RUN_ID']
          apk_files = sorted(Path('release').glob('*.apk'))
          if not apk_files:
              raise SystemExit('No published release APKs found while updating README')

          apk_lines = []
          for apk in apk_files:
              digest = hashlib.sha256(apk.read_bytes()).hexdigest()
              apk_lines.append(f'  - `{apk.name}` — `{digest}`')

          block = '\n'.join([
              start,
              f'- **Versi:** [v{version}](https://github.com/{repo}/releases/tag/v{version})',
              f'- **Commit:** [`{commit}`](https://github.com/{repo}/commit/{commit})',
              f'- **GitHub Actions:** [run {run_id}](https://github.com/{repo}/actions/runs/{run_id})',
              '- **APK dan SHA-256:**',
              *apk_lines,
              end,
          ])

          before, remainder = text.split(start, 1)
          _, after = remainder.split(end, 1)
          readme.write_text(before + block + after)
          PY

          if git diff --quiet -- README.md; then
            echo "README release verification is already current."
            exit 0
          fi

          mapfile -t stale < <(
            gh pr list               --repo "$GITHUB_REPOSITORY"               --base main               --state open               --json number,headRefName               --jq '.[] | select(.headRefName | startswith("automation/release-readme-")) | .number'
          )
          for pr in "${stale[@]}"; do
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch || true
          done

          branch="automation/release-readme-v${VERSION_NAME}-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README release verification"
          git push origin "HEAD:$branch"
          head_sha="$(git rev-parse HEAD)"

          url="$(gh pr create             --repo "$GITHUB_REPOSITORY"             --base main             --head "$branch"             --title "Update README for v${VERSION_NAME}"             --body "Automated post-release verification metadata for v${VERSION_NAME}. Release commit ${RELEASE_COMMIT}; originating Main Build run ${SOURCE_RUN_ID}.")"
          pr_number="$(gh pr view "$url" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"

          gh workflow run identity-guard.yml             --repo "$GITHUB_REPOSITORY"             --ref "$branch"

          identity_run=""
          for attempt in $(seq 1 60); do
            identity_run="$(gh run list               --repo "$GITHUB_REPOSITORY"               --workflow identity-guard.yml               --branch "$branch"               --event workflow_dispatch               --limit 20               --json databaseId,headSha               --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId"               | head -n 1)"
            if [[ -n "$identity_run" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$identity_run" ]]; then
            echo "::error::Could not resolve Identity Guard for README PR head $head_sha."
            exit 1
          fi

          gh run watch "$identity_run"             --repo "$GITHUB_REPOSITORY"             --exit-status             --interval 10

          live_sha="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          [[ "$live_sha" == "$head_sha" ]]
          gh pr merge "$pr_number"             --repo "$GITHUB_REPOSITORY"             --squash             --delete-branch
          merged="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json mergedAt --jq '.mergedAt')"
          [[ -n "$merged" && "$merged" != "null" ]]

          {
            echo "### Post-release README"
            echo
            echo "Release: `v${VERSION_NAME}`"
            echo "Release commit: `${RELEASE_COMMIT}`"
            echo "Originating Main Build run: `${SOURCE_RUN_ID}`"
            echo "README PR: #${pr_number}"
          } >> "$GITHUB_STEP_SUMMARY"
