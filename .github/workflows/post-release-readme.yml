name: Post Release README

on:
  release:
    types: [published]

concurrency:
  group: post-release-readme-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-release:
    name: Verify published release provenance and APK
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve published release provenance and exact APK assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$TAG" == v* ]] || {
            echo "::error::Stable Miyorare release tag must start with v."
            exit 1
          }

          git fetch --force origin main --tags
          RELEASE_COMMIT="$(git rev-list -n 1 "$TAG")"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve exact release commit for $TAG."
            exit 1
          }

          mkdir -p release
          gh release view "$TAG"             --repo "$GITHUB_REPOSITORY"             --json body             --jq '.body // ""'             > release/release-body.txt

          SOURCE_RUN_ID="$(sed -n 's/^<!-- MIYORARE_RELEASE_RUN_ID:\([0-9][0-9]*\) -->$/\1/p' release/release-body.txt | head -n 1)"
          MARKED_SHA="$(sed -n 's/^<!-- MIYORARE_RELEASE_SOURCE_SHA:\([0-9a-f][0-9a-f]*\) -->$/\1/p' release/release-body.txt | head -n 1)"

          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Release provenance is missing the originating Main Build run ID."
            exit 1
          }
          [[ "$MARKED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Release provenance is missing the exact source SHA."
            exit 1
          }
          [[ "$MARKED_SHA" == "$RELEASE_COMMIT" ]] || {
            echo "::error::Release tag commit does not match the source SHA recorded by Main Build."
            exit 1
          }

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > release/source-run.json
          RUN_PATH="$(jq -r '.path' release/source-run.json)"
          RUN_SHA="$(jq -r '.head_sha' release/source-run.json)"
          RUN_EVENT="$(jq -r '.event' release/source-run.json)"
          RUN_CONCLUSION="$(jq -r '.conclusion' release/source-run.json)"
          [[ "$RUN_PATH" == ".github/workflows/main-build.yml" ]] || {
            echo "::error::Recorded source run is not the official Main Build workflow."
            exit 1
          }
          [[ "$RUN_EVENT" == "workflow_dispatch" && "$RUN_CONCLUSION" == "success" ]] || {
            echo "::error::Recorded Main Build run was not a successful manual build."
            exit 1
          }
          [[ "$RUN_SHA" == "$RELEASE_COMMIT" ]] || {
            echo "::error::Recorded Main Build run did not execute on the release commit."
            exit 1
          }

          gh release download "$TAG"             --repo "$GITHUB_REPOSITORY"             --dir release             --pattern '*.apk'

          shopt -s nullglob
          APK_FILES=(release/*.apk)
          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "::error::Published release contains no APK assets."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"

          # The release check remains independent of the README writer. Verify
          # downloaded bytes against GitHub's published asset SHA-256 digest.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release/release.json
          apk_count="$(jq -r '[.assets[] | select(.name | endswith(".apk"))] | length' release/release.json)"
          [[ "$apk_count" == "1" ]] || {
            echo "::error::Expected exactly one published APK asset; got $apk_count."
            exit 1
          }
          asset_name="$(jq -r '.assets[] | select(.name | endswith(".apk")) | .name' release/release.json)"
          asset_digest="$(jq -r '.assets[] | select(.name | endswith(".apk")) | (.digest // "")' release/release.json)"
          [[ "$asset_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Published APK is missing a valid GitHub SHA-256 digest."
            exit 1
          }
          [[ -f "release/$asset_name" ]] || {
            echo "::error::Published APK asset was not downloaded."
            exit 1
          }
          actual_digest="$(sha256sum "release/$asset_name" | awk '{print $1}')"
          [[ "sha256:$actual_digest" == "$asset_digest" ]] || {
            echo "::error::Published APK bytes do not match the reported SHA-256 digest."
            exit 1
          }

          {
            echo "### Published release verified"
            echo
            echo "Release: $TAG"
            echo "Source commit: $RELEASE_COMMIT"
            echo "Main Build run: $SOURCE_RUN_ID"
            echo "APK: $asset_name"
            echo "SHA-256: $actual_digest"
            echo
            echo "README changes are owned by Release README Sync; this workflow does not write to main."
          } >> "$GITHUB_STEP_SUMMARY"

