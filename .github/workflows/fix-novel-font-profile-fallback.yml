name: Fix Novel font profile fallback

on:
  push:
    branches: [beta]
    paths: ['.github/workflows/fix-novel-font-profile-fallback.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Keep empty per-Novel font metadata isolated
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubBookSettingsStore.kt')
          s = p.read_text()
          replacements = [
              (
                  '''\t\tval customFontName: String\n\t\t\tget() = if (enabled) {\n\t\t\t\tprefs.getString(key("custom_font_name"), global.epubCustomFontName) ?: global.epubCustomFontName\n\t\t\t} else {\n\t\t\t\tglobal.epubCustomFontName\n\t\t\t}\n\n\t\tval customFontRevision: Int\n\t\t\tget() = if (enabled) prefs.getInt(key("custom_font_revision"), global.epubCustomFontRevision) else global.epubCustomFontRevision\n''',
                  '''\t\tval customFontName: String\n\t\t\tget() = if (enabled) {\n\t\t\t\tprefs.getString(key("custom_font_name"), "") ?: ""\n\t\t\t} else {\n\t\t\t\tglobal.epubCustomFontName\n\t\t\t}\n\n\t\tval customFontRevision: Int\n\t\t\tget() = if (enabled) prefs.getInt(key("custom_font_revision"), 0) else global.epubCustomFontRevision\n''',
              ),
              (
                  '''\t\t\t\tupdateReader {\n\t\t\t\t\tremove(key("custom_font_name"))\n\t\t\t\t\tputInt(key("custom_font_revision"), revision)\n\t\t\t\t}\n''',
                  '''\t\t\t\tupdateReader {\n\t\t\t\t\tputString(key("custom_font_name"), "")\n\t\t\t\t\tputInt(key("custom_font_revision"), revision)\n\t\t\t\t}\n''',
              ),
          ]
          for old, new in replacements:
              n = s.count(old)
              if n != 1:
                  raise RuntimeError(f'Expected one font fallback block, got {n}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git add app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubBookSettingsStore.kt
          git diff --cached --check
          git commit -m "Keep per-Novel font metadata isolated"
          git push
