name: Experimental Merge Check

on:
  push:
    branches:
      - experimental

permissions:
  contents: read

concurrency:
  group: experimental-merge-check
  cancel-in-progress: true

jobs:
  verify:
    name: Compile and test experimental
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run debug unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
