name: PF5 Private UNKNOWN State Fix

on:
  push:
    branches:
      - pf5

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Keep failed Private classification secure-only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/pf5_private_unknown_patch.py
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main
          git commit -m 'Keep failed Private classification secure-only'
          git push origin HEAD:pf5
