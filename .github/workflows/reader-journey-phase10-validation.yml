name: Reader Journey Phase 10 Full Validation

on:
  pull_request:
    branches:
      - beta
    paths:
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/ui/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/settings/**'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/readerjourney/**'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/core/ui/**'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/settings/**'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/readerjourney/**'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/core/db/ChapterPersistenceRegressionTest.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/backup/local/LocalBackupIdentityTest.kt'
      - 'docs/reader-journey-phase10-validation.md'
      # Direct state/render/build dependencies omitted by the legacy area filter.
      - '.github/scripts/phase10_paths.py'
      - '.github/scripts/test_phase10_paths.py'
      - '.github/scripts/exclusive_visual_paths.py'
      - '.github/workflows/ci-deep.yml'
      - '.github/scripts/ci_deep_paths.py'
      - '.github/workflows/android-runtime.yml'
      - '.github/scripts/android_runtime_paths.py'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'build-logic/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - 'app/src/main/assets/navigation/**'
      - 'app/src/main/assets/miyorare/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/db/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/parser/MangaDataRepository.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/AppModule.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/BaseApp.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/util/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/main/ui/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/KotatsuApp.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/HiltTestRunner.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/SampleData.kt'
      - 'app/src/testFixtures/**'
      - 'app/src/debug/**'
      - 'app/src/preview/**'
      - 'app/src/androidTest/AndroidManifest.xml'
      - '.github/workflows/reader-journey-phase10-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-journey-phase10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-validation:
    name: Phase 10 routing / deterministic fallback
    outputs:
      run_state: ${{ steps.phase10_scope.outputs.run_state }}
      run_render: ${{ steps.phase10_scope.outputs.run_render }}
      state_classes: ${{ steps.phase10_scope.outputs.state_classes }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          echo "Phase 10 head: $actual"


      - name: Test Phase 10 routing and coverage contracts
        run: python3 .github/scripts/test_phase10_paths.py

      - name: Route exact base to candidate head
        id: phase10_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          route_file="$(mktemp)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 .github/scripts/phase10_paths.py --manual > "$route_file"
          elif ! python3 .github/scripts/phase10_paths.py --base "$BASE_SHA" --head "$HEAD_SHA" > "$route_file"; then
            # Import/parser/process failure cannot silently remove any coverage.
            cat > "$route_file" <<'ROUTE'
          run_jvm=true
          run_state=true
          run_render=true
          state_classes=org.koitharu.kotatsu.readerjourney.theme.ReaderJourneyPhase10StateRestorationTest,org.koitharu.kotatsu.core.db.ChapterPersistenceRegressionTest,org.koitharu.kotatsu.backup.local.LocalBackupIdentityTest
          ROUTE
          fi
          cat "$route_file" >> "$GITHUB_OUTPUT"
          {
            echo "Phase 10 exact candidate: $HEAD_SHA (base $BASE_SHA)"
            cat "$route_file"
            echo "Delegated JVM evidence: CI Deep / ci-deep-unit-test-reports at this candidate."
            echo "Delegated backup evidence, when routed: Android Runtime / android-runtime-evidence at this candidate."
            echo "Delegation is a coverage contract, not reuse of a previous-head result. Both applicable gates must pass."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK
        if: steps.phase10_scope.outputs.run_jvm == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.phase10_scope.outputs.run_jvm == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        if: steps.phase10_scope.outputs.run_jvm == 'true'
        run: chmod +x gradlew

      - name: Pre-warm parser dependency
        if: steps.phase10_scope.outputs.run_jvm == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("gradle/libs.versions.toml").read_text(encoding="utf-8"))
          value = str(data.get("versions", {}).get("parsers", "")).strip()
          if not value:
              raise SystemExit("Missing versions.parsers in gradle/libs.versions.toml")
          print(value)
          PY
          )"
          POM_URL="https://jitpack.io/com/github/Gekkoushi/plugin-source/${PARSERS_VERSION}/plugin-source-${PARSERS_VERSION}.pom"
          for i in $(seq 1 12); do
            HTTP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$POM_URL" || true)"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Parser artifact is ready (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: parser artifact returned HTTP ${HTTP_STATUS:-000}"
            sleep 20
          done
          echo "::error::Parser artifact ${PARSERS_VERSION} is not ready on JitPack"
          exit 1

      - name: Run Phase 10 Reader Journey validation suite
        if: steps.phase10_scope.outputs.run_jvm == 'true'
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests org.koitharu.kotatsu.readerjourney.theme.ReaderJourneyPhase10ValidationTest
          --tests org.koitharu.kotatsu.readerjourney.theme.ReaderJourneyPhase10AccessibilityRegressionTest
          --tests org.koitharu.kotatsu.readerjourney.theme.RankThemeFoundationTest
          --tests org.koitharu.kotatsu.readerjourney.theme.RankThemeVisualRegistryTest
          --tests org.koitharu.kotatsu.readerjourney.theme.RankThemeVisualsRegressionTest
          --tests org.koitharu.kotatsu.readerjourney.theme.ReaderContentIsolationRegressionTest
          --tests org.koitharu.kotatsu.readerjourney.theme.ReaderJourneyThemeActivationRegressionTest
          --tests org.koitharu.kotatsu.readerjourney.theme.ReaderJourneyThemePresentationResolverTest
          --tests org.koitharu.kotatsu.readerjourney.domain.ReaderJourneyCosmeticSnapshotCodecTest
          --tests org.koitharu.kotatsu.readerjourney.domain.ReaderJourneyCosmeticPolicyTest
          --tests org.koitharu.kotatsu.readerjourney.domain.ReaderJourneyThemeCollectionRegressionTest
          --tests org.koitharu.kotatsu.settings.developer.RankThemeGalleryRegressionTest
          --tests org.koitharu.kotatsu.core.ui.RankThemeMiyorareBridgeTest
          --no-daemon --stacktrace

      - name: Upload deterministic evidence
        if: ${{ always() && steps.phase10_scope.outputs.run_jvm == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: reader-journey-phase10-deterministic
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  # Keep the unique profile boundary and timed chapter probes on their original
  # 4-core/4-GB device. Functional backup runs here only without durable Runtime coverage.
  android-state-restoration:
    name: Phase 10 Android state restoration
    needs: deterministic-validation
    if: needs.deterministic-validation.outputs.run_state == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          echo "Phase 10 Android head: $actual"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("gradle/libs.versions.toml").read_text(encoding="utf-8"))
          value = str(data.get("versions", {}).get("parsers", "")).strip()
          if not value:
              raise SystemExit("Missing versions.parsers in gradle/libs.versions.toml")
          print(value)
          PY
          )"
          POM_URL="https://jitpack.io/com/github/Gekkoushi/plugin-source/${PARSERS_VERSION}/plugin-source-${PARSERS_VERSION}.pom"
          for i in $(seq 1 12); do
            HTTP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$POM_URL" || true)"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Parser artifact is ready (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: parser artifact returned HTTP ${HTTP_STATUS:-000}"
            sleep 20
          done
          echo "::error::Parser artifact ${PARSERS_VERSION} is not ready on JitPack"
          exit 1

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Run Android 15 recreation/persistence probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35

          emulator-build: 13823996
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=${{ needs.deterministic-validation.outputs.state_classes }}
            --no-daemon --stacktrace

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-journey-phase10-android
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14


  rendered-device-matrix:
    name: Phase 10 rendered / ${{ matrix.scenario }}
    needs: deterministic-validation
    if: needs.deterministic-validation.outputs.run_render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: narrow-light-large-minimal-reduced
            theme: light
            wm_size: 720x1280
            density: 320
            font_scale: '1.30'
            ui_mode: 'no'
          - scenario: modern-dark
            theme: dark
            wm_size: 1080x2400
            density: 420
            font_scale: '1.00'
            ui_mode: 'yes'
          - scenario: modern-oled
            theme: oled
            wm_size: 1080x2400
            density: 420
            font_scale: '1.00'
            ui_mode: 'yes'

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          echo "Rendered matrix head: $actual"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("gradle/libs.versions.toml").read_text(encoding="utf-8"))
          value = str(data.get("versions", {}).get("parsers", "")).strip()
          if not value:
              raise SystemExit("Missing versions.parsers in gradle/libs.versions.toml")
          print(value)
          PY
          )"
          POM_URL="https://jitpack.io/com/github/Gekkoushi/plugin-source/${PARSERS_VERSION}/plugin-source-${PARSERS_VERSION}.pom"
          for i in $(seq 1 12); do
            HTTP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$POM_URL" || true)"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Parser artifact is ready (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: parser artifact returned HTTP ${HTTP_STATUS:-000}"
            sleep 20
          done
          echo "::error::Parser artifact ${PARSERS_VERSION} is not ready on JitPack"
          exit 1

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Render Reader Journey and Appearance on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35

          emulator-build: 13823996
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb shell wm size ${{ matrix.wm_size }}
            adb shell wm density ${{ matrix.density }}
            adb shell settings put system font_scale ${{ matrix.font_scale }}
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell cmd uimode night ${{ matrix.ui_mode }}
            # The emulator can finish a long Gradle build with the display asleep/locked. Keep the
            # rendered matrix foreground-visible so UiAutomation can expose the application window.
            adb shell svc power stayon true || true
            adb shell settings put system screen_off_timeout 2147483647 || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell rm -rf /sdcard/Download/miyorare-phase10-rendered/${{ matrix.scenario }}

            ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace               -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview               -PMIYORARE_VISUAL_TEST_SIGNING=true               -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.readerjourney.theme.ReaderJourneyPhase10RenderedMatrixTest               -Pandroid.testInstrumentationRunnerArguments.phase10_scenario=${{ matrix.scenario }}               -Pandroid.testInstrumentationRunnerArguments.phase10_theme=${{ matrix.theme }}

            mkdir -p "phase10-rendered-evidence/${{ matrix.scenario }}"
            bash -lc 'set -eu; src="/sdcard/Download/miyorare-phase10-rendered/${{ matrix.scenario }}"; dest="phase10-rendered-evidence/${{ matrix.scenario }}"; files="reader-journey.png reader-journey.json appearance-settings.png appearance-settings.json settings-ime.png settings-ime.json theme-newcomer_first_page.png theme-newcomer_first_page.json theme-archivist_neon_archive.png theme-archivist_neon_archive.json theme-master_golden_manuscript.png theme-master_golden_manuscript.json theme-legend_eternal_library.png theme-legend_eternal_library.json"; rm -rf "$dest"; mkdir -p "$dest"; for file in $files; do copied=false; for attempt in 1 2 3; do adb wait-for-device; adb pull "$src/$file" "$dest/$file" >/dev/null 2>&1 || true; if test -s "$dest/$file"; then copied=true; break; fi; echo "Evidence file $file attempt $attempt incomplete; reconnecting adb"; adb reconnect >/dev/null 2>&1 || true; sleep 2; done; test "$copied" = true; done'
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/reader-journey.png"
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/reader-journey.json"
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/appearance-settings.png"
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/appearance-settings.json"
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/settings-ime.png"
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/settings-ime.json"
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/theme-newcomer_first_page.png"
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/theme-newcomer_first_page.json"
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/theme-archivist_neon_archive.png"
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/theme-archivist_neon_archive.json"
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/theme-master_golden_manuscript.png"
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/theme-master_golden_manuscript.json"
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/theme-legend_eternal_library.png"
            test -s "phase10-rendered-evidence/${{ matrix.scenario }}/theme-legend_eternal_library.json"

            echo "scenario=${{ matrix.scenario }}" > "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            echo "package=org.noirero.miyorare.beta" >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            echo "wm_size=${{ matrix.wm_size }}" >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            echo "density=${{ matrix.density }}" >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            echo "font_scale=${{ matrix.font_scale }}" >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            adb install -r "$(find app/build/outputs/apk/preview -name '*.apk' -print -quit)"
            adb shell am force-stop org.noirero.miyorare.beta
            echo "--- startup 1 ---" >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            adb shell am start -W -n org.noirero.miyorare.beta/org.koitharu.kotatsu.main.ui.MainActivity >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            adb shell am force-stop org.noirero.miyorare.beta
            echo "--- startup 2 ---" >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            adb shell am start -W -n org.noirero.miyorare.beta/org.koitharu.kotatsu.main.ui.MainActivity >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            adb shell am force-stop org.noirero.miyorare.beta
            echo "--- startup 3 ---" >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            adb shell am start -W -n org.noirero.miyorare.beta/org.koitharu.kotatsu.main.ui.MainActivity >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            echo "--- meminfo summary ---" >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            adb shell dumpsys meminfo org.noirero.miyorare.beta | head -n 80 >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            echo "--- gfxinfo summary ---" >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"
            adb shell dumpsys gfxinfo org.noirero.miyorare.beta | head -n 120 >> "phase10-rendered-evidence/${{ matrix.scenario }}/runtime-evidence.txt"

      - name: Upload rendered Phase 10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-journey-phase10-rendered-${{ matrix.scenario }}
          path: |
            phase10-rendered-evidence/${{ matrix.scenario }}/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare debug-signed owner-testing Preview APK
        if: matrix.scenario == 'modern-dark'
        id: owner_preview
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          apk="app/build/outputs/apk/preview/app-preview.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/owner-preview-signature.txt"
          python3 - "$RUNNER_TEMP/owner-preview-signature.txt" <<'PY'
          import re
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text().splitlines()
          if lines.count('Verifies') != 1 or [x for x in lines if x.startswith('Number of signers:')] != ['Number of signers: 1']:
              sys.exit('Expected a verified APK with exactly one signer')
          names = [x for x in lines if 'certificate DN:' in x]
          pattern = r'(?:Signer #1|V[1-4](?:\.\d+)? Signer:) certificate DN: (.+)'
          debug = ['C=US', 'CN=Android Debug', 'O=Android']
          if not names or any(not (match := re.fullmatch(pattern, x)) or sorted(part.strip() for part in match[1].split(',')) != debug for x in names):
              sys.exit('Expected the existing Android debug certificate')
          print('Verified existing Android debug signature')
          PY
          artifact="owner-testing-preview-debug-signed-${actual}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          filename="Miyorare-${artifact}.apk"
          cp "$apk" "$RUNNER_TEMP/$filename"
          echo "artifact_name=$artifact" >> "$GITHUB_OUTPUT"
          echo "apk_path=$RUNNER_TEMP/$filename" >> "$GITHUB_OUTPUT"
          {
            echo "### Debug-signed owner-testing Preview"
            echo "Exact source head: $actual"
            echo "Artifact: $artifact (retained 14 days)"
            echo "SHA-256: $(sha256sum "$RUNNER_TEMP/$filename" | cut -d ' ' -f1)"
            echo "Package: org.noirero.miyorare.beta; signing: existing Android debug key."
            echo "This is an owner-testing APK, not an official Beta/release. It cannot update a permanent-key Beta installation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug-signed owner-testing Preview APK
        if: matrix.scenario == 'modern-dark'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.owner_preview.outputs.artifact_name }}
          path: ${{ steps.owner_preview.outputs.apk_path }}
