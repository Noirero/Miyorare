name: Apply Novel translation integration

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/apply-novel-translation-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Apply guarded reader patch
        run: python .github/scripts/apply_novel_translation_patch.py

      - name: Remove one-time patcher
        run: |
          git rm .github/scripts/apply_novel_translation_patch.py
          git rm .github/workflows/apply-novel-translation-integration.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt
          git diff --cached --check
          git commit -m "Integrate Novel online and AI translation hub"
          git push origin HEAD:beta
