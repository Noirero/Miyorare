name: CI Fast

on:
  pull_request:
    branches:
      - beta
      - main
  workflow_dispatch:

concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fast:
    name: Fast
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "Fast validation head: $EXPECTED_HEAD"

      - name: Diff sanity
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Verify application identity and labels
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "applicationId = 'org.noirero.miyorare'" app/build.gradle
          grep -Fq "variant.applicationId.set('org.noirero.miyorare.beta')" app/build.gradle

          grep -Fq 'android:label="@string/app_name"' app/src/main/AndroidManifest.xml
          grep -Fq '<string name="app_name" translatable="false">Miyorare</string>' app/src/release/res/values/app_name.xml

          grep -Fq 'android:label="@string/app_name_beta"' app/src/preview/AndroidManifest.xml
          grep -Fq '<string name="app_name_beta" translatable="false">Miyorare Beta</string>' app/src/preview/res/values/strings.xml

      - name: Verify launcher isolation
        shell: bash
        run: |
          set -euo pipefail

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for name in ic_launcher ic_launcher_round; do
              main_icon="app/src/main/res/mipmap-${density}/${name}.webp"
              beta_icon="app/src/preview/res/mipmap-${density}/${name}.webp"
              test -f "$main_icon"
              test -f "$beta_icon"
              if cmp -s "$main_icon" "$beta_icon"; then
                echo "::error::Main and Beta launcher artwork must remain visually isolated: $name ($density)."
                exit 1
              fi
            done
          done

          for adaptive in ic_launcher.xml ic_launcher_round.xml; do
            main_adaptive="app/src/main/res/mipmap-anydpi-v26/$adaptive"
            beta_adaptive="app/src/preview/res/mipmap-anydpi-v26/$adaptive"
            test -f "$main_adaptive"
            test -f "$beta_adaptive"
            grep -Fq '@drawable/ic_launcher_foreground' "$main_adaptive"
            grep -Fq '@drawable/ic_launcher_beta_foreground' "$beta_adaptive"
          done

          grep -Fq '@drawable/ic_launcher_main_foreground' app/src/main/res/drawable/ic_launcher_foreground.xml

          if grep -R -Fq '@drawable/ic_launcher_beta_foreground' app/src/main/res/mipmap-anydpi-v26; then
            echo "::error::Main launcher mapping must not reference Beta artwork."
            exit 1
          fi

          if grep -R -Fq '@drawable/ic_launcher_foreground' app/src/preview/res/mipmap-anydpi-v26; then
            echo "::error::Beta launcher mapping must not fall back to Main foreground artwork."
            exit 1
          fi

      - name: Validate CI helper scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             .github/scripts/runtime_smoke_paths.py             .github/scripts/source_pack_readiness.py             .github/scripts/release_version.py             .github/scripts/summarize_gradle_profile.py             .github/scripts/gradle_benchmark_summary.py             .github/scripts/ci_metrics.py             .github/scripts/release_build_config_guard.py             .github/scripts/promotion_evidence.py

          python3 .github/scripts/test_runtime_smoke_paths.py
          python3 .github/scripts/test_source_pack_readiness.py
          python3 .github/scripts/test_release_version.py
          python3 .github/scripts/test_summarize_gradle_profile.py
          python3 .github/scripts/test_gradle_benchmark_summary.py
          python3 .github/scripts/test_ci_metrics.py
          python3 .github/scripts/test_main_candidate_contract.py
          python3 .github/scripts/test_pre_main_audit_regressions.py
          python3 .github/scripts/test_ci_deep_paths.py
          python3 .github/scripts/test_exclusive_visual_paths.py
          python3 .github/scripts/test_runtime_acceptance_harness.py
          bash -n .github/scripts/prewarm_jitpack.sh
