name: Fix EPUB translate dialog

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/fix-epub-translate-dialog.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix translation dialog
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt')
          text = p.read_text()
          old = '''\t\tMaterialAlertDialogBuilder(requireContext())\n\t\t\t.setTitle(R.string.epub_translate_current_chapter)\n\t\t\t.setMessage(R.string.epub_translate_online_note)\n\t\t\t.setItems(labels) { _, which ->\n'''
          new = '''\t\tMaterialAlertDialogBuilder(requireContext())\n\t\t\t.setTitle(R.string.epub_translate_current_chapter)\n\t\t\t.setItems(labels) { _, which ->\n'''
          if old not in text:
              raise SystemExit('Expected translation dialog block not found')
          p.write_text(text.replace(old, new, 1))

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt
          git commit -m "Show EPUB translation language choices on beta"
          git push
