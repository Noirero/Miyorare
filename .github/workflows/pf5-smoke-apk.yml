name: PF5 Smoke APK

on:
  push:
    branches:
      - pf5

permissions:
  contents: read

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Require pf5 branch and signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "pf5"
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION=$(grep 'parsers = ' gradle/libs.versions.toml | sed 's/.*= "\(.*\)"/\1/')
          POM_URL="https://jitpack.io/com/github/YakaTeam/kotatsu-parsers/${PARSERS_VERSION}/kotatsu-parsers-${PARSERS_VERSION}.pom"
          for i in $(seq 1 10); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$POM_URL")
            if [ "$HTTP_STATUS" = "200" ]; then exit 0; fi
            sleep 15
          done
          exit 1

      - name: Build signed PF5 Preview APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assemblePreview --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=../release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Verify and collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/preview/output-metadata.json').read_text())
          actual = metadata.get('applicationId')
          expected = 'org.noirero.miyorare.beta'
          if actual != expected:
              raise SystemExit(f'Unexpected applicationId: {actual!r}')
          print(f'Verified applicationId: {actual}')
          PY
          APK=$(find app/build/outputs/apk/preview -name '*.apk' | head -n1)
          test -n "$APK"
          SOURCE_SHA=$(git rev-parse HEAD^)
          SHORT_SHA=$(git rev-parse --short HEAD^)
          DEST="Miyorare-PF5-${SHORT_SHA}.apk"
          cp "$APK" "$DEST"
          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          echo "apk_name=$DEST" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "### PF5 smoke APK"
            echo ""
            echo "Source commit: \`$SOURCE_SHA\`"
            echo "File: \`$DEST\`"
            echo "Application ID: \`org.noirero.miyorare.beta\`"
            echo "SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PF5 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30
