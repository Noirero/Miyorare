name: Guard Details download duplicates once

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/dedupe-details-download-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prevent duplicate chapter download jobs
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/ChaptersPagesViewModel.kt')
          text = p.read_text()
          old = '''\tfun download(chaptersIds: Set<Long>?, allowMeteredNetwork: Boolean) {\n\t\tlaunchJob(Dispatchers.Default) {\n\t\t\tval manga = requireManga()\n\t\t\tval task = DownloadTask(\n\t\t\t\tmangaId = manga.id,\n\t\t\t\tisPaused = false,\n\t\t\t\tisSilent = false,\n\t\t\t\tchaptersIds = chaptersIds?.toLongArray(),\n\t\t\t\tdestination = downloadDestinationStore.effectiveRoot(favouriteSpace),\n\t\t\t\tformat = null,\n\t\t\t\tallowMeteredNetwork = allowMeteredNetwork,\n\t\t\t\tfavouriteSpace = favouriteSpace,\n\t\t\t)\n\t\t\tdownloadScheduler.schedule(setOf(manga to task))\n\t\t\tonDownloadStarted.call(Unit)\n\t\t}\n\t}\n'''
          new = '''\tfun download(chaptersIds: Set<Long>?, allowMeteredNetwork: Boolean) {\n\t\tlaunchJob(Dispatchers.Default) {\n\t\t\tval manga = requireManga()\n\t\t\tval active = activeChapterDownloads.value\n\t\t\tval effectiveChapterIds = when {\n\t\t\t\tchaptersIds == null && active.isAll -> return@launchJob\n\t\t\t\tchaptersIds == null -> null\n\t\t\t\telse -> chaptersIds.filterNot(active::contains).toSet().takeIf { it.isNotEmpty() }\n\t\t\t\t\t?: return@launchJob\n\t\t\t}\n\t\t\tval task = DownloadTask(\n\t\t\t\tmangaId = manga.id,\n\t\t\t\tisPaused = false,\n\t\t\t\tisSilent = false,\n\t\t\t\tchaptersIds = effectiveChapterIds?.toLongArray(),\n\t\t\t\tdestination = downloadDestinationStore.effectiveRoot(favouriteSpace),\n\t\t\t\tformat = null,\n\t\t\t\tallowMeteredNetwork = allowMeteredNetwork,\n\t\t\t\tfavouriteSpace = favouriteSpace,\n\t\t\t)\n\t\t\tdownloadScheduler.schedule(setOf(manga to task))\n\t\t\tonDownloadStarted.call(Unit)\n\t\t}\n\t}\n'''
          if old not in text:
              raise SystemExit('download function anchor not found')
          p.write_text(text.replace(old, new, 1))

      - name: Validate duplicate guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'chaptersIds.filterNot(active::contains)' app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/ChaptersPagesViewModel.kt

      - name: Commit guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/dedupe-details-download-once.yml
          git add app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/ChaptersPagesViewModel.kt \
                  .github/workflows/dedupe-details-download-once.yml
          git commit -m "Prevent duplicate chapter download jobs"
          git push
