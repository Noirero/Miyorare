name: Temporary Settings Stage 5 and 6 Audit

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/tmp-settings-stage56.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit-and-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 1

      - name: Apply progressive disclosure and responsive polish
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected pattern not found in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # ---------- Stage 5: progressive disclosure ----------
          # Appearance: make Advanced discoverable and group its contents by purpose.
          p = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/AppearanceSettingsFragment.kt'
          replace(p,
              '''NavigationSettingsItem(\n                        title = stringResource(R.string.settings_advanced),\n                        icon = R.drawable.ic_script,''',
              '''NavigationSettingsItem(\n                        title = stringResource(R.string.settings_advanced),\n                        subtitle = stringResource(R.string.settings_advanced_appearance_summary),\n                        icon = R.drawable.ic_script,''')

          p = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/AppearanceAdvancedSettingsFragment.kt'
          replace(p,
              'SettingsGroup(title = stringResource(R.string.settings_advanced)) {',
              'SettingsGroup(title = stringResource(R.string.settings_advanced_system_navigation)) {')
          marker = '''                item { pos ->\n                    SwitchSettingsItem(\n                        title = stringResource(R.string.exit_confirmation),'''
          split = '''            }\n        }\n        item { Spacer(Modifier.height(8.dp).fillMaxWidth()) }\n        item {\n            SettingsGroup(title = stringResource(R.string.settings_advanced_app_behavior)) {\n                item { pos ->\n                    SwitchSettingsItem(\n                        title = stringResource(R.string.exit_confirmation),'''
          replace(p, marker, split)

          # Reader: hardware buttons belong in Advanced; same key/state, only presentation moves.
          p = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/ReaderSettingsFragment.kt'
          replace(p, '    var readerVolumeButtons by rememberBooleanPref(AppSettings.KEY_READER_VOLUME_BUTTONS, false)\n', '')
          volume_block = '''                item { pos ->\n                    SwitchSettingsItem(\n                        title = stringResource(R.string.switch_pages_volume_buttons),\n                        subtitle = stringResource(R.string.switch_pages_volume_buttons_summary),\n                        checked = readerVolumeButtons,\n                        onCheckedChange = { readerVolumeButtons = it },\n                        icon = R.drawable.ic_action_skip,\n                        shape = pos.shape,\n                    )\n                }\n'''
          replace(p, volume_block, '')
          replace(p,
              '''NavigationSettingsItem(\n                        title = stringResource(R.string.settings_advanced),\n                        icon = R.drawable.ic_script,''',
              '''NavigationSettingsItem(\n                        title = stringResource(R.string.settings_advanced),\n                        subtitle = stringResource(R.string.settings_advanced_reader_summary),\n                        icon = R.drawable.ic_script,''')

          p = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/ReaderAdvancedSettingsFragment.kt'
          replace(p,
              '    var readerTapsLtr by rememberBooleanPref(AppSettings.KEY_READER_CONTROL_LTR, false)\n',
              '    var readerVolumeButtons by rememberBooleanPref(AppSettings.KEY_READER_VOLUME_BUTTONS, false)\n    var readerTapsLtr by rememberBooleanPref(AppSettings.KEY_READER_CONTROL_LTR, false)\n')
          replace(p,
              'SettingsGroup(title = stringResource(R.string.settings_group_reader_controls)) {\n',
              '''SettingsGroup(title = stringResource(R.string.settings_advanced_reader_hardware)) {\n                item { pos ->\n                    SwitchSettingsItem(\n                        title = stringResource(R.string.switch_pages_volume_buttons),\n                        subtitle = stringResource(R.string.switch_pages_volume_buttons_summary),\n                        checked = readerVolumeButtons,\n                        onCheckedChange = { readerVolumeButtons = it },\n                        icon = R.drawable.ic_action_skip,\n                        shape = pos.shape,\n                    )\n                }\n''')

          # Search must follow the moved volume-button preference into Reader Advanced.
          p = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/search/SettingsSearchHelper.kt'
          replace(p,
              '''                addItem(AppSettings.KEY_READER_VOLUME_BUTTONS, R.string.switch_pages_volume_buttons, R.string.switch_pages_volume_buttons_summary, crumbs, ReaderSettingsFragment::class.java)\n''',
              '')
          replace(p,
              '''                val advancedCrumbs = crumbs + ctx.getString(R.string.settings_advanced)\n                addItem(AppSettings.KEY_READER_CONTROL_LTR,''',
              '''                val advancedCrumbs = crumbs + ctx.getString(R.string.settings_advanced)\n                addItem(AppSettings.KEY_READER_VOLUME_BUTTONS, R.string.switch_pages_volume_buttons, R.string.switch_pages_volume_buttons_summary, advancedCrumbs, ReaderAdvancedSettingsFragment::class.java)\n                addItem(AppSettings.KEY_READER_CONTROL_LTR,''')

          # Network Advanced: compatibility, behaviour and risky security override are distinct groups.
          p = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/AdvancedNetworkSettingsFragment.kt'
          replace(p,
              'SettingsGroup(title = stringResource(R.string.settings_advanced_network)) {',
              'SettingsGroup(title = stringResource(R.string.settings_advanced_network_compatibility)) {')
          marker = '''                item { pos ->\n                    SwitchSettingsItem(\n                        title = stringResource(R.string.disable_connectivity_check),'''
          split = '''            }\n        }\n        item { Spacer(Modifier.height(8.dp).fillMaxWidth()) }\n        item {\n            SettingsGroup(title = stringResource(R.string.settings_advanced_network_behavior)) {\n                item { pos ->\n                    SwitchSettingsItem(\n                        title = stringResource(R.string.disable_connectivity_check),'''
          replace(p, marker, split)
          marker = '''                item { pos ->\n                    SwitchSettingsItem(\n                        title = stringResource(R.string.ignore_ssl_errors),'''
          split = '''            }\n        }\n        item { Spacer(Modifier.height(8.dp).fillMaxWidth()) }\n        item {\n            SettingsGroup(title = stringResource(R.string.settings_advanced_network_security)) {\n                item { pos ->\n                    SwitchSettingsItem(\n                        title = stringResource(R.string.ignore_ssl_errors),'''
          replace(p, marker, split)

          # Dedicated strings keep Stage 5 wording separate from functional preference strings.
          Path('app/src/main/res/values/strings_settings_stage56.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="settings_advanced_appearance_summary">Status bar, legacy navigation, exit confirmation, and recent shortcuts</string>\n    <string name="settings_advanced_reader_summary">Hardware buttons, tap direction, and navigation behaviour</string>\n    <string name="settings_advanced_system_navigation">System &amp; navigation</string>\n    <string name="settings_advanced_app_behavior">App behaviour</string>\n    <string name="settings_advanced_reader_hardware">Hardware &amp; navigation</string>\n    <string name="settings_advanced_network_compatibility">Compatibility &amp; requests</string>\n    <string name="settings_advanced_network_behavior">Connection behaviour</string>\n    <string name="settings_advanced_network_security">Security risk</string>\n</resources>\n''', encoding='utf-8')
          Path('app/src/main/res/values-in/strings_settings_stage56.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="settings_advanced_appearance_summary">Bilah status, navigasi lama, konfirmasi keluar, dan pintasan terbaru</string>\n    <string name="settings_advanced_reader_summary">Tombol perangkat, arah ketuk, dan perilaku navigasi</string>\n    <string name="settings_advanced_system_navigation">Sistem &amp; navigasi</string>\n    <string name="settings_advanced_app_behavior">Perilaku aplikasi</string>\n    <string name="settings_advanced_reader_hardware">Perangkat &amp; navigasi</string>\n    <string name="settings_advanced_network_compatibility">Kompatibilitas &amp; request</string>\n    <string name="settings_advanced_network_behavior">Perilaku koneksi</string>\n    <string name="settings_advanced_network_security">Risiko keamanan</string>\n</resources>\n''', encoding='utf-8')

          # ---------- Stage 6: accessibility & responsiveness ----------
          # Settings content adapts to narrow phones and stops stretching excessively in landscape/tablets.
          p = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsScaffold.kt'
          replace(p, 'import androidx.compose.foundation.layout.Box\n', 'import androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.BoxWithConstraints\n')
          replace(p, 'import androidx.compose.foundation.layout.fillMaxSize\n', 'import androidx.compose.foundation.layout.fillMaxHeight\nimport androidx.compose.foundation.layout.fillMaxSize\n')
          replace(p, 'import androidx.compose.foundation.layout.padding\n', 'import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.width\n')
          replace(p, 'import androidx.compose.ui.Modifier\n', 'import androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\n')
          replace(p, '\tBox(\n\t\tmodifier = modifier', '\tBoxWithConstraints(\n\t\tmodifier = modifier')
          replace(p,
              '''\t\tCompositionLocalProvider(\n\t\t\tLocalSettingsHighlightScroll provides scrollTo,\n\t\t\tLocalSettingsScrollToTop provides scrollToTop,\n\t\t) {\n\t\t\tColumn(\n\t\t\t\tmodifier = Modifier\n\t\t\t\t\t.fillMaxSize()\n\t\t\t\t\t.verticalScroll(scrollState)\n\t\t\t\t\t.padding(top = 10.dp, bottom = 28.dp, start = 16.dp, end = 16.dp),''',
              '''\t\tval horizontalPadding = when {\n\t\t\tmaxWidth < 360.dp -> 10.dp\n\t\t\tmaxWidth < 600.dp -> 16.dp\n\t\t\telse -> 24.dp\n\t\t}\n\t\tval contentWidth = maxWidth.coerceAtMost(840.dp)\n\t\tCompositionLocalProvider(\n\t\t\tLocalSettingsHighlightScroll provides scrollTo,\n\t\t\tLocalSettingsScrollToTop provides scrollToTop,\n\t\t) {\n\t\t\tColumn(\n\t\t\t\tmodifier = Modifier\n\t\t\t\t\t.align(Alignment.TopCenter)\n\t\t\t\t\t.width(contentWidth)\n\t\t\t\t\t.fillMaxHeight()\n\t\t\t\t\t.verticalScroll(scrollState)\n\t\t\t\t\t.padding(top = 10.dp, bottom = 28.dp, start = horizontalPadding, end = horizontalPadding),''')

          # Row titles get more room when Android font scaling is large.
          p = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsItem.kt'
          replace(p, 'import androidx.compose.ui.platform.LocalContext\n' if 'import androidx.compose.ui.platform.LocalContext\n' in Path(p).read_text(encoding='utf-8') else 'import androidx.compose.ui.layout.positionInWindow\n',
                    'import androidx.compose.ui.layout.positionInWindow\nimport androidx.compose.ui.platform.LocalDensity\n' if 'import androidx.compose.ui.platform.LocalContext\n' not in Path(p).read_text(encoding='utf-8') else 'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.LocalDensity\n')
          replace(p,
              '\tval visualPalette = LocalMiyorareVisualPalette.current\n\tval modern = visualPalette.isModern\n',
              '\tval visualPalette = LocalMiyorareVisualPalette.current\n\tval modern = visualPalette.isModern\n\tval largeFont = LocalDensity.current.fontScale >= 1.3f\n')
          replace(p, '\t\t\t\t\tmaxLines = 2,\n', '\t\t\t\t\tmaxLines = if (largeFont) 4 else 2,\n', 1)

          # Segmented controls stack vertically on compact screens or large-font configurations.
          p = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SegmentedSettingsItem.kt'
          replace(p, 'import androidx.compose.ui.platform.LocalDensity\n' if 'import androidx.compose.ui.platform.LocalDensity\n' in Path(p).read_text(encoding='utf-8') else 'import androidx.compose.ui.graphics.Shape\n',
                    'import androidx.compose.ui.graphics.Shape\nimport androidx.compose.ui.platform.LocalConfiguration\nimport androidx.compose.ui.platform.LocalDensity\n' if 'import androidx.compose.ui.platform.LocalDensity\n' not in Path(p).read_text(encoding='utf-8') else 'import androidx.compose.ui.platform.LocalDensity\n')
          replace(p,
              '''\tval modern = visualPalette.isModern\n\tval colorAnimation = when (visualPalette.effectLevel) {''',
              '''\tval modern = visualPalette.isModern\n\tval compactLayout = LocalConfiguration.current.screenWidthDp < 360 || LocalDensity.current.fontScale >= 1.3f\n\tif (compactLayout) {\n\t\tStackedSegmentedOptions(\n\t\t\tlabels = labels,\n\t\t\tselectedIndex = selectedIndex,\n\t\t\tonSelected = onSelected,\n\t\t\tenabled = enabled,\n\t\t)\n\t\treturn\n\t}\n\tval colorAnimation = when (visualPalette.effectLevel) {''')
          Path(p).write_text(Path(p).read_text(encoding='utf-8') + '''\n\n@Composable\nprivate fun StackedSegmentedOptions(\n\tlabels: List<String>,\n\tselectedIndex: Int,\n\tonSelected: (Int) -> Unit,\n\tenabled: Boolean,\n) {\n\tval haptic = rememberHapticEffect()\n\tval palette = LocalMiyorareVisualPalette.current\n\tColumn(verticalArrangement = Arrangement.spacedBy(4.dp)) {\n\t\tlabels.forEachIndexed { index, label ->\n\t\t\tval selected = index == selectedIndex\n\t\t\tval alpha = if (enabled) 1f else 0.55f\n\t\t\tval shape = RoundedCornerShape(14.dp)\n\t\t\tSurface(\n\t\t\t\tonClick = {\n\t\t\t\t\thaptic(HapticEffect.TOGGLE_ON)\n\t\t\t\t\tonSelected(index)\n\t\t\t\t},\n\t\t\t\tenabled = enabled,\n\t\t\t\tmodifier = Modifier.fillMaxWidth().heightIn(min = 48.dp),\n\t\t\t\tshape = shape,\n\t\t\t\tcolor = if (selected) MaterialTheme.colorScheme.primary.copy(alpha = alpha)\n\t\t\t\telse MaterialTheme.colorScheme.surfaceContainerHigh.copy(alpha = alpha),\n\t\t\t\tcontentColor = if (selected) MaterialTheme.colorScheme.onPrimary.copy(alpha = alpha)\n\t\t\t\telse MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = alpha),\n\t\t\t) {\n\t\t\t\tBox(contentAlignment = Alignment.Center) {\n\t\t\t\t\tText(\n\t\t\t\t\t\ttext = label,\n\t\t\t\t\t\tstyle = MaterialTheme.typography.labelLarge,\n\t\t\t\t\t\tfontWeight = if (selected) FontWeight.SemiBold else FontWeight.Normal,\n\t\t\t\t\t\ttextAlign = TextAlign.Center,\n\t\t\t\t\t\tmodifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp),\n\t\t\t\t\t)\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n}\n''', encoding='utf-8')

      - name: Static Stage 5 and 6 audit
        shell: python
        run: |
          from pathlib import Path

          reader = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/ReaderSettingsFragment.kt').read_text(encoding='utf-8')
          reader_adv = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/ReaderAdvancedSettingsFragment.kt').read_text(encoding='utf-8')
          appearance = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/AppearanceSettingsFragment.kt').read_text(encoding='utf-8')
          appearance_adv = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/AppearanceAdvancedSettingsFragment.kt').read_text(encoding='utf-8')
          network_adv = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/AdvancedNetworkSettingsFragment.kt').read_text(encoding='utf-8')
          search = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/search/SettingsSearchHelper.kt').read_text(encoding='utf-8')
          scaffold = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsScaffold.kt').read_text(encoding='utf-8')
          item = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsItem.kt').read_text(encoding='utf-8')
          segmented = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SegmentedSettingsItem.kt').read_text(encoding='utf-8')

          checks = {
              'reader hardware removed from main': 'var readerVolumeButtons' not in reader and 'checked = readerVolumeButtons' not in reader,
              'reader hardware lives in advanced': 'AppSettings.KEY_READER_VOLUME_BUTTONS' in reader_adv and 'checked = readerVolumeButtons' in reader_adv,
              'reader search follows advanced route': 'KEY_READER_VOLUME_BUTTONS, R.string.switch_pages_volume_buttons, R.string.switch_pages_volume_buttons_summary, advancedCrumbs, ReaderAdvancedSettingsFragment::class.java' in search,
              'appearance advanced is discoverable': 'settings_advanced_appearance_summary' in appearance,
              'reader advanced is discoverable': 'settings_advanced_reader_summary' in reader,
              'appearance advanced grouped': 'settings_advanced_system_navigation' in appearance_adv and 'settings_advanced_app_behavior' in appearance_adv,
              'network risk separated': 'settings_advanced_network_compatibility' in network_adv and 'settings_advanced_network_behavior' in network_adv and 'settings_advanced_network_security' in network_adv,
              'responsive scaffold compact padding': 'maxWidth < 360.dp -> 10.dp' in scaffold,
              'responsive scaffold centered max width': 'maxWidth.coerceAtMost(840.dp)' in scaffold and 'Alignment.TopCenter' in scaffold,
              'large-font row titles expand': 'LocalDensity.current.fontScale >= 1.3f' in item and 'maxLines = if (largeFont) 4 else 2' in item,
              'segmented controls adapt': 'screenWidthDp < 360' in segmented and 'StackedSegmentedOptions' in segmented and '.heightIn(min = 48.dp)' in segmented,
              'no hardcoded black settings text': 'Color.Black' not in '\n'.join(x.read_text(encoding='utf-8') for x in Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/compose').glob('*.kt')),
          }
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ' | ' + name)
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit('Stage 5/6 audit failed: ' + ', '.join(failed))

      - name: Validate Android resources
        run: ./gradlew processDebugResources --no-daemon --stacktrace

      - name: Run all debug unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Compile debug Kotlin
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace

      - name: Commit Stage 5 and 6 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/koitharu/kotatsu/settings/AppearanceSettingsFragment.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/AppearanceAdvancedSettingsFragment.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/ReaderSettingsFragment.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/ReaderAdvancedSettingsFragment.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/AdvancedNetworkSettingsFragment.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/search/SettingsSearchHelper.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsScaffold.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsItem.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SegmentedSettingsItem.kt \
                  app/src/main/res/values/strings_settings_stage56.xml \
                  app/src/main/res/values-in/strings_settings_stage56.xml
          if git diff --cached --quiet; then
            echo "No Stage 5/6 changes to commit"
            exit 0
          fi
          git commit -m "Refine Settings advanced disclosure and responsive layout"
          git push origin HEAD:beta
