          \t\treturn ids.mapTo(LinkedHashSet(ids.size)) { id ->
          \t\t\tval category = dao.find(id.toInt())
          \t\t\trequire(category.space == FavouriteSpace.NORMAL.dbValue) { "Category $id is not Normal" }
