          \tprivate suspend fun ensureNormalCategoryMapping(sourceCategoryIds: Set<Long>): CategoryMapping {
          \t\tval dao = db.getFavouriteCategoriesDao()
          \t\tval sourceCategories = dao.findAllInSpace(FavouriteSpace.PRIVATE.dbValue)
          \t\t\t.filter { it.categoryId.toLong() in sourceCategoryIds }
          \t\t\t.sortedBy { it.sortKey }
          \t\tval normalCategories = dao.findAll().toMutableList()
          \t\tval mapping = LinkedHashMap<Long, Long>(sourceCategories.size)
          \t\tval targetTypes = LinkedHashMap<Long, FavouriteContentType>()
          \t\tvar createdCount = 0
          \t\tvar nextSortKey = dao.getNextSortKey(FavouriteSpace.NORMAL)

          \t\tdb.withTransaction {
          \t\t\tfor (source in sourceCategories) {
          \t\t\t\tval type = categoryType(source.categoryId.toLong())
          \t\t\t\tval key = categoryKey(source.title, type)
          \t\t\t\tval existing = normalCategories.firstOrNull {
          \t\t\t\t\tcategoryKey(it.title, categoryType(it.categoryId.toLong())) == key
          \t\t\t\t}
          \t\t\t\tval targetId = if (existing != null) {
          \t\t\t\t\texisting.categoryId.toLong()
          \t\t\t\t} else {
          \t\t\t\t\tval clone = FavouriteCategoryEntity(
          \t\t\t\t\t\tcategoryId = 0,
          \t\t\t\t\t\tcreatedAt = source.createdAt,
          \t\t\t\t\t\tsortKey = nextSortKey++,
          \t\t\t\t\t\ttitle = source.title,
          \t\t\t\t\t\torder = source.order,
          \t\t\t\t\t\ttrack = false,
          \t\t\t\t\t\tdownloadNewChapters = false,
          \t\t\t\t\t\tisVisibleInLibrary = source.isVisibleInLibrary,
          \t\t\t\t\t\tdeletedAt = 0L,
          \t\t\t\t\t\tspace = FavouriteSpace.NORMAL.dbValue,
          \t\t\t\t\t)
          \t\t\t\t\tval id = dao.insert(clone)
          \t\t\t\t\tnormalCategories += clone.copy(categoryId = id.toInt())
          \t\t\t\t\tcreatedCount++
          \t\t\t\t\tid
          \t\t\t\t}
          \t\t\t\tmapping[source.categoryId.toLong()] = targetId
          \t\t\t\ttargetTypes[targetId] = type
          \t\t\t}
          \t\t}

          \t\tfor ((targetId, type) in targetTypes) contentTypeStore.setCategoryType(targetId, type)
          \t\treturn CategoryMapping(mapping, createdCount)
          \t}

          \tprivate suspend fun validateNormalCategories(ids: Set<Long>): Set<Long> {
