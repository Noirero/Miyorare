          \t\t\t\t\t\tSELECT manga_id, ?, sort_key, pinned, created_at, 0
          \t\t\t\t\t\tFROM private_favourites
          \t\t\t\t\t\tWHERE deleted_at = 0 AND category_id = ? AND manga_id IN ($placeholders)
          \t\t\t\t\t\t""".trimIndent(),
          \t\t\t\t\t\tinsertArgs,
