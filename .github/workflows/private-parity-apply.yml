name: Apply Private Favourites parity

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/private-parity-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0

      - name: Apply Private favourites parity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\n---\n{old}")
              p.write_text(text.replace(old, new, 1))

          def insert_before(path, anchor, addition):
              p = Path(path)
              text = p.read_text()
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}\n---\n{anchor}")
              p.write_text(text.replace(anchor, addition + anchor, 1))

          vm = 'app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt'
          replace_once(vm,
          '''\tprivate val libraryGroups = libraryGroupsRepository.observeGroups().stateIn(
          ''',
          '''\tprivate val libraryGroups = libraryGroupsRepository.observeGroups(favouriteSpace).stateIn(
          ''')
          replace_once(vm,
          '''\tinit {
          \t\tif (favouriteSpace == FavouriteSpace.NORMAL) {
          \t\t\tviewModelScope.launch(Dispatchers.Default) {
          \t\t\t\tlibraryGroupsRepository.repairInvalidGroups()
          \t\t\t}
          \t\t}
          \t}
          ''',
          '''\tinit {
          \t\tviewModelScope.launch(Dispatchers.Default) {
          \t\t\tlibraryGroupsRepository.repairInvalidGroups(favouriteSpace)
          \t\t}
          \t}
          ''')
          replace_once(vm,
          '''\tval isLibraryGroupingAvailable: Boolean
          \t\tget() = favouriteSpace == FavouriteSpace.NORMAL &&
          \t\t\tsettings.miyorareDesignStyle == MiyorareDesignStyle.MODERN &&
          ''',
          '''\tval isLibraryGroupingAvailable: Boolean
          \t\tget() = settings.miyorareDesignStyle == MiyorareDesignStyle.MODERN &&
          ''')
          replace_once(vm,
          '''\tsuspend fun createLibraryGroup(title: String, mangaIds: Collection<Long>): Long = withContext(Dispatchers.Default) {
          \t\tcheck(favouriteSpace == FavouriteSpace.NORMAL)
          \t\tlibraryGroupsRepository.createGroup(title = title, mangaIds = mangaIds)
          \t}
          ''',
          '''\tsuspend fun createLibraryGroup(title: String, mangaIds: Collection<Long>): Long = withContext(Dispatchers.Default) {
          \t\tlibraryGroupsRepository.createGroup(title = title, mangaIds = mangaIds, space = favouriteSpace)
          \t}
          ''')
          replace_once(vm,
          '''\tsuspend fun getLibraryGroupManageItems(groupId: Long): Pair<LibraryGroup, List<LibraryGroupManageItem>>? =
          \t\twithContext(Dispatchers.Default) {
          \t\t\tif (favouriteSpace != FavouriteSpace.NORMAL) return@withContext null
          \t\t\tval group = libraryGroupsRepository.getGroup(groupId) ?: return@withContext null
          ''',
          '''\tsuspend fun getLibraryGroupManageItems(groupId: Long): Pair<LibraryGroup, List<LibraryGroupManageItem>>? =
          \t\twithContext(Dispatchers.Default) {
          \t\t\tval group = libraryGroupsRepository.getGroup(groupId, favouriteSpace) ?: return@withContext null
          ''')
          replace_once(vm,
          '''\tsuspend fun updateLibraryGroup(groupId: Long, title: String, coverUrl: String?) = withContext(Dispatchers.Default) {
          \t\tif (favouriteSpace == FavouriteSpace.NORMAL) libraryGroupsRepository.updateGroup(groupId, title, coverUrl)
          \t}

          \tsuspend fun deleteLibraryGroup(groupId: Long) = withContext(Dispatchers.Default) {
          \t\tif (favouriteSpace == FavouriteSpace.NORMAL) libraryGroupsRepository.deleteGroup(groupId)
          \t}

          \tsuspend fun removeLibraryGroupMember(groupId: Long, mangaId: Long) = withContext(Dispatchers.Default) {
          \t\tif (favouriteSpace == FavouriteSpace.NORMAL) libraryGroupsRepository.removeMember(groupId, mangaId)
          \t}

          \tsuspend fun reorderLibraryGroup(groupId: Long, orderedMangaIds: List<Long>) = withContext(Dispatchers.Default) {
          \t\tif (favouriteSpace == FavouriteSpace.NORMAL) libraryGroupsRepository.reorder(groupId, orderedMangaIds)
          \t}
          ''',
          '''\tsuspend fun updateLibraryGroup(groupId: Long, title: String, coverUrl: String?) = withContext(Dispatchers.Default) {
          \t\tlibraryGroupsRepository.updateGroup(groupId, title, coverUrl, favouriteSpace)
          \t}

          \tsuspend fun deleteLibraryGroup(groupId: Long) = withContext(Dispatchers.Default) {
          \t\tlibraryGroupsRepository.deleteGroup(groupId, favouriteSpace)
          \t}

          \tsuspend fun removeLibraryGroupMember(groupId: Long, mangaId: Long) = withContext(Dispatchers.Default) {
          \t\tlibraryGroupsRepository.removeMember(groupId, mangaId, favouriteSpace)
          \t}

          \tsuspend fun reorderLibraryGroup(groupId: Long, orderedMangaIds: List<Long>) = withContext(Dispatchers.Default) {
          \t\tlibraryGroupsRepository.reorder(groupId, orderedMangaIds, favouriteSpace)
          \t}
          ''')
          replace_once(vm,
          '''\t\t\tif (favouriteSpace == FavouriteSpace.NORMAL) libraryGroupsRepository.repairInvalidGroups()
          ''',
          '''\t\t\tlibraryGroupsRepository.repairInvalidGroups(favouriteSpace)
          ''')

          transfer = 'app/src/main/kotlin/org/koitharu/kotatsu/favourites/domain/TransferFavouritesToPrivateUseCase.kt'
          replace_once(transfer,
          '''\tsuspend fun getPrivateCategories(): List<PrivateTransferCategory> = withContext(Dispatchers.IO) {
          \t\tdb.getFavouriteCategoriesDao()
          \t\t\t.findAllInSpace(FavouriteSpace.PRIVATE.dbValue)
          \t\t\t.map { PrivateTransferCategory(it.categoryId.toLong(), it.title) }
          \t}
          ''',
          '''\tsuspend fun getPrivateCategories(): List<PrivateTransferCategory> = withContext(Dispatchers.IO) {
          \t\tdb.getFavouriteCategoriesDao()
          \t\t\t.findAllInSpace(FavouriteSpace.PRIVATE.dbValue)
          \t\t\t.map { PrivateTransferCategory(it.categoryId.toLong(), it.title) }
          \t}

          \tsuspend fun getNormalCategories(): List<NormalTransferCategory> = withContext(Dispatchers.IO) {
          \t\tdb.getFavouriteCategoriesDao()
          \t\t\t.findAll()
          \t\t\t.map { NormalTransferCategory(it.categoryId.toLong(), it.title) }
          \t}
          ''')

          insert_before(transfer,
          '''\t/** Remove the titles from Normal only. Private rows and shared downloaded files remain untouched. */
          ''',
          '''\tsuspend fun transferToNormal(
          \t\tids: Set<Long>,
          \t\tdestination: NormalTransferDestination,
          \t\tonProgress: (PrivateTransferProgress) -> Unit = {},
          \t): NormalTransferResult = withContext(Dispatchers.IO) {
          \t\tif (ids.isEmpty()) return@withContext NormalTransferResult.EMPTY

          \t\tval snapshot = collectPrivateSnapshot(ids)
          \t\tif (snapshot.mangaIds.isEmpty()) {
          \t\t\treturn@withContext NormalTransferResult(
          \t\t\t\trequestedCount = ids.size,
          \t\t\t\tsourceCount = 0,
          \t\t\t\tverifiedCount = 0,
          \t\t\t\tfailedCount = 0,
          \t\t\t\tcreatedCategoryCount = 0,
          \t\t\t)
          \t\t}

          \t\tval createdCategories = when (destination) {
          \t\t\tNormalTransferDestination.PreserveCategories -> {
          \t\t\t\tval mapping = ensureNormalCategoryMapping(snapshot.categoryIds)
          \t\t\t\tcopyPrivatePreservingCategories(snapshot.mangaIds, mapping, onProgress)
          \t\t\t\tmapping.createdCount
          \t\t\t}

          \t\t\tis NormalTransferDestination.NormalCategories -> {
          \t\t\t\tval targetIds = validateNormalCategories(destination.categoryIds)
          \t\t\t\tcopyToNormalCategories(snapshot.mangaIds, targetIds, onProgress)
          \t\t\t\t0
          \t\t\t}
          \t\t}

          \t\tval verified = findNormalIds(snapshot.mangaIds)
          \t\tNormalTransferResult(
          \t\t\trequestedCount = ids.size,
          \t\t\tsourceCount = snapshot.mangaIds.size,
          \t\t\tverifiedCount = verified.size,
          \t\t\tfailedCount = snapshot.mangaIds.size - verified.size,
          \t\t\tcreatedCategoryCount = createdCategories,
          \t\t)
          \t}

          \t/** Remove the titles from Private only after a verified Normal copy. Shared downloads stay untouched. */
          \tsuspend fun removeFromPrivate(ids: Set<Long>) = withContext(Dispatchers.IO) {
          \t\tif (ids.isEmpty()) return@withContext
          \t\tval timestamp = System.currentTimeMillis()
          \t\tfor (chunk in ids.chunked(SQL_CHUNK_SIZE)) {
          \t\t\tdb.withTransaction {
          \t\t\t\tval placeholders = placeholders(chunk.size)
          \t\t\t\tval args = ArrayList<Any?>(chunk.size + 1).apply {
          \t\t\t\t\tadd(timestamp)
          \t\t\t\t\taddAll(chunk)
          \t\t\t\t}.toTypedArray()
          \t\t\t\tdb.openHelper.writableDatabase.execSQL(
          \t\t\t\t\t"UPDATE private_favourites SET deleted_at = ? WHERE deleted_at = 0 AND manga_id IN ($placeholders)",
          \t\t\t\t\targs,
          \t\t\t\t)
          \t\t\t}
          \t\t}
          \t\tdb.getChaptersDao().gc()
          \t\tlibraryGroupsRepository.repairInvalidGroups(FavouriteSpace.PRIVATE)
          \t}

          ''')

          insert_before(transfer,
          '''\tprivate fun categoryType(categoryId: Long): FavouriteContentType =
          ''',
          '''\tprivate suspend fun collectPrivateSnapshot(ids: Set<Long>): PrivateSnapshot {
          \t\tval mangaIds = LinkedHashSet<Long>(ids.size)
          \t\tval categoryIds = LinkedHashSet<Long>()
          \t\tfor (chunk in ids.chunked(SQL_CHUNK_SIZE)) {
          \t\t\tval query = SimpleSQLiteQuery(
          \t\t\t\t"SELECT manga_id, category_id FROM private_favourites WHERE deleted_at = 0 AND manga_id IN (${placeholders(chunk.size)})",
          \t\t\t\tchunk.map { it as Any }.toTypedArray(),
          \t\t\t)
          \t\t\tdb.openHelper.readableDatabase.query(query).use { cursor ->
          \t\t\t\twhile (cursor.moveToNext()) {
          \t\t\t\t\tmangaIds += cursor.getLong(0)
          \t\t\t\t\tcategoryIds += cursor.getLong(1)
