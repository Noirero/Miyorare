      - name: Diff sanity
        run: git diff --check

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compile JVM source
        run: ./gradlew :app:compileDebugUnitTestKotlin --no-daemon --stacktrace

      - name: Private regression tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests org.koitharu.kotatsu.main.ui.protect.ScreenshotPolicyHelperTest \
            --tests org.koitharu.kotatsu.reader.ui.tts.ReaderTtsPrivacyPolicyTest \
            --tests org.koitharu.kotatsu.history.data.TrackingProgressPolicyTest

      - name: Commit verified parity update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/private-parity-apply.yml
          git add app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt
          git add app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListFragment.kt
          git add app/src/main/kotlin/org/koitharu/kotatsu/favourites/domain/TransferFavouritesToPrivateUseCase.kt
          git add app/src/main/res/menu/mode_favourites.xml
          git add app/src/main/res/values/private_transfer.xml
          git add app/src/main/res/values-in/private_transfer.xml
          git commit -m 'Complete Private favourites group and reverse transfer parity'
          git push origin HEAD:beta
