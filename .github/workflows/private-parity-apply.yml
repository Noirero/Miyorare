          \t\t\t\t\t0 -> {
          \t\t\t\t\t\tmode?.finish()
          \t\t\t\t\t\tstartNormalTransfer(ids, NormalTransferDestination.PreserveCategories)
          \t\t\t\t\t}
          \t\t\t\t\t1 -> showNormalCategoryChooser(ids, mode)
          \t\t\t\t}
          \t\t\t}
          \t\t\t.setNegativeButton(android.R.string.cancel, null)
          \t\t\t.show()
          \t}

          \tprivate fun showNormalCategoryChooser(ids: Set<Long>, mode: ActionMode?) {
          \t\tviewLifecycleScope.launch {
          \t\t\tval categoriesResult = runCatchingCancellable { transferFavouritesToPrivateUseCase.getNormalCategories() }
          \t\t\tval categories = categoriesResult.getOrElse {
          \t\t\t\tshowPrivateOperationError(it, R.string.normal_transfer_error)
          \t\t\t\treturn@launch
          \t\t\t}
          \t\t\tif (categories.isEmpty()) {
          \t\t\t\tToast.makeText(requireContext(), R.string.normal_transfer_no_normal_categories, Toast.LENGTH_LONG).show()
          \t\t\t\treturn@launch
          \t\t\t}
          \t\t\tval selected = BooleanArray(categories.size)
          \t\t\tMaterialAlertDialogBuilder(requireContext())
          \t\t\t\t.setTitle(R.string.normal_transfer_choose_category_title)
          \t\t\t\t.setMultiChoiceItems(categories.map { it.title }.toTypedArray(), selected) { _, which, checked ->
          \t\t\t\t\tselected[which] = checked
          \t\t\t\t}
          \t\t\t\t.setNegativeButton(android.R.string.cancel, null)
          \t\t\t\t.setPositiveButton(android.R.string.ok) { _, _ ->
          \t\t\t\t\tval targetIds = categories.mapIndexedNotNullTo(LinkedHashSet()) { index, category ->
          \t\t\t\t\t\tcategory.id.takeIf { selected[index] }
          \t\t\t\t\t}
          \t\t\t\t\tif (targetIds.isEmpty()) {
          \t\t\t\t\t\tToast.makeText(requireContext(), R.string.normal_transfer_select_category, Toast.LENGTH_SHORT).show()
          \t\t\t\t\t} else {
          \t\t\t\t\t\tmode?.finish()
          \t\t\t\t\t\tstartNormalTransfer(ids, NormalTransferDestination.NormalCategories(targetIds))
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t\t.show()
          \t\t}
          \t}

          \tprivate fun startNormalTransfer(ids: Set<Long>, destination: NormalTransferDestination) {
          \t\tval progressDialog = MaterialAlertDialogBuilder(requireContext())
          \t\t\t.setTitle(R.string.normal_transfer_title)
          \t\t\t.setMessage(getString(R.string.normal_transfer_preparing, ids.size))
          \t\t\t.setCancelable(false)
          \t\t\t.create()
          \t\tprogressDialog.show()
          \t\tviewLifecycleScope.launch {
          \t\t\tval result = runCatchingCancellable {
          \t\t\t\ttransferFavouritesToPrivateUseCase.transferToNormal(ids, destination) { progress ->
          \t\t\t\t\tview?.post {
          \t\t\t\t\t\tif (progressDialog.isShowing) {
          \t\t\t\t\t\t\tprogressDialog.setMessage(
          \t\t\t\t\t\t\t\tgetString(R.string.normal_transfer_progress, progress.processed, progress.total),
          \t\t\t\t\t\t\t)
          \t\t\t\t\t\t}
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t}
          \t\t\tif (progressDialog.isShowing) progressDialog.dismiss()
          \t\t\tresult.onSuccess { showNormalTransferResult(ids, it) }
          \t\t\t\t.onFailure { showPrivateOperationError(it, R.string.normal_transfer_error) }
          \t\t}
          \t}

          \tprivate fun showNormalTransferResult(ids: Set<Long>, result: NormalTransferResult) {
          \t\tval builder = MaterialAlertDialogBuilder(requireContext())
          \t\t\t.setTitle(R.string.normal_transfer_title)
          \t\t\t.setNegativeButton(R.string.close, null)
          \t\tif (result.isComplete) {
          \t\t\tbuilder
          \t\t\t\t.setMessage(getString(R.string.normal_transfer_success, result.verifiedCount, result.sourceCount))
          \t\t\t\t.setPositiveButton(R.string.normal_transfer_remove_private) { _, _ ->
          \t\t\t\t\tviewLifecycleScope.launch {
          \t\t\t\t\t\trunCatchingCancellable { transferFavouritesToPrivateUseCase.removeFromPrivate(ids) }
          \t\t\t\t\t\t\t.onSuccess {
          \t\t\t\t\t\t\t\tviewModel.onRefresh()
          \t\t\t\t\t\t\t\tToast.makeText(requireContext(), R.string.normal_transfer_removed_private, Toast.LENGTH_SHORT).show()
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t.onFailure { showPrivateOperationError(it, R.string.normal_transfer_error) }
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t} else {
          \t\t\tbuilder.setMessage(getString(R.string.normal_transfer_partial, result.verifiedCount, result.sourceCount))
          \t\t}
          \t\tbuilder.show()
          \t}

          ''')

