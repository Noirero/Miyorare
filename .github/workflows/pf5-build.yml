name: PF5 Build
run-name: PF5 Build · pf5

# Manual PF5 APK build. This workflow is registered on the default branch so GitHub exposes
# Actions > PF5 Build > Run workflow, but it always checks out and builds branch pf5.
# Regular commits never build an APK automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pf5-build
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build signed PF5 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout PF5
        uses: actions/checkout@v5
        with:
          ref: pf5

      - name: Verify PF5 checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "pf5" || {
            echo "::error::PF5 checkout guard failed."
            exit 1
          }
          echo "Building PF5 from $(git rev-parse HEAD)"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION=$(grep 'parsers = ' gradle/libs.versions.toml | sed 's/.*= "\(.*\)"/\1/')
          POM_URL="https://jitpack.io/com/github/YakaTeam/kotatsu-parsers/${PARSERS_VERSION}/kotatsu-parsers-${PARSERS_VERSION}.pom"
          for i in $(seq 1 8); do
            HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$POM_URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "JitPack parser dependency is ready."
              exit 0
            fi
            echo "Attempt $i: JitPack returned HTTP ${HTTP_STATUS}; retrying in 10s..."
            sleep 10
          done
          echo "::error::Parser dependency is not available from JitPack."
          exit 1

      - name: Require stable signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build signed PF5 APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assemblePreview --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=../release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Collect APK and checksums
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/preview -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "::error::No PF5 APK found."; exit 1; }

          SHORT_SHA=$(git rev-parse --short HEAD)
          DEST="Miyorare-PF5-${SHORT_SHA}.apk"
          cp "$APK" "$DEST"

          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          SIZE=$(du -h "$DEST" | cut -f1)
          echo "apk_name=${DEST}" >> "$GITHUB_OUTPUT"

          {
            echo "**PF5 manual build**"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| File | \`${DEST}\` |"
            echo "| Branch | \`pf5\` |"
            echo "| Commit | \`${SHORT_SHA}\` |"
            echo "| Size | ${SIZE} |"
            echo "| SHA-256 | \`${SHA256}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.keystore

      - name: Upload PF5 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14
