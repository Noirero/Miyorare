name: Novel Translation Final Audit Patch

on:
  push:
    branches:
      - fix/novel-translation-final-reliability-audit
    paths:
      - tools/novel_translation_final_audit_patch.py
      - .github/workflows/novel-translation-final-audit-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/novel-translation-final-reliability-audit
          fetch-depth: 1

      - name: Apply guarded patch
        run: python3 tools/novel_translation_final_audit_patch.py

      - name: Validate patch shape
        run: |
          git diff --check
          git diff --exit-code -- .github tools
          test -n "$(git status --short app/src/main app/src/test)"

      - name: Commit production and test changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test
          git commit -m "Fix final novel translation reliability audit findings"
          git push origin HEAD:fix/novel-translation-final-reliability-audit
