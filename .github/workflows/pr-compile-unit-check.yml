name: PR Compile & Unit Check

on:
  pull_request:
    branches:
      - Amain2
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-compile-unit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-unit:
    name: Compile, resources & unit tests
    # Explicit runtime validation also applies to drafts waiting for owner decisions.
    if: github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci:runtime-required')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile debug sources and validate Android resources
        run: ./gradlew compileDebugSources --max-workers=4 --no-daemon --stacktrace

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --max-workers=4 --no-daemon --stacktrace

      - name: Upload JVM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-jvm-evidence
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  android-runtime:
    name: Smart Local cover lifecycle — Android 15
    if: contains(github.event.pull_request.labels.*.name, 'ci:runtime-required')
    needs: compile-unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Prepare collector compatibility for the exact head
        run: |
          # Amain2's collector remains authoritative whenever it exists in the checked-out head.
          # Older heads still run their existing cover tests through the same command wrapper.
          if ! test -f .github/scripts/collect-on-device-cover-evidence.sh; then
            mkdir -p .github/scripts
            printf '#!/usr/bin/env bash\nset -euo pipefail\n"$@"\n' > .github/scripts/collect-on-device-cover-evidence.sh
          fi
      - name: Validate cover persistence, source freshness and Reader pins
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            ./gradlew connectedDebugAndroidTest --max-workers=4 --no-daemon --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.local.library.SmartLocalCoverPipelineTest,org.koitharu.kotatsu.core.image.MiyorareImageDiskCacheTest
            && ./gradlew connectedDebugAndroidTest --max-workers=4 --no-daemon --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.details.ui.TrackerPeopleSectionTest,org.koitharu.kotatsu.scrobbling.common.data.TrackerDetailsSessionTest,org.koitharu.kotatsu.core.db.ChapterPersistenceRegressionTest,org.koitharu.kotatsu.backup.local.LocalBackupIdentityTest,org.koitharu.kotatsu.details.ui.TrackerRecommendationSectionTest,org.koitharu.kotatsu.details.domain.TrackerRecommendationMappingTest,org.koitharu.kotatsu.scrobbling.mangaupdates.data.MangaUpdatesRepositoryTest,org.koitharu.kotatsu.scrobbling.mangaupdates.data.MangaUpdatesSessionStoreTest,org.koitharu.kotatsu.scrobbling.mangaupdates.ui.MangaUpdatesAuthActivityTest
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-local-cover-android15
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
