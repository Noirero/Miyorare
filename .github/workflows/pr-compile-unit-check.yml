name: PR Compile & Unit Check

on:
  pull_request:
    branches:
      - Amain2
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: pr-compile-unit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-risk:
    name: Classify Android runtime risk
    runs-on: ubuntu-latest
    outputs:
      run_runtime: ${{ steps.classify.outputs.run_runtime }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Classify changed paths and labels
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABEL_RUNTIME: ${{ contains(github.event.pull_request.labels.*.name, 'ci:runtime-required') }}
          LABEL_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:runtime-full') }}
          LABEL_USER_ISSUE: ${{ contains(github.event.pull_request.labels.*.name, 'ci:user-issue') }}
          LABEL_THEME: ${{ contains(github.event.pull_request.labels.*.name, 'ci:theme') }}
          DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/runtime-changed-files.txt"
          bash .github/scripts/select-pr-runtime-tests.sh --self-test
          plan="$(bash .github/scripts/select-pr-runtime-tests.sh --classify < "$RUNNER_TEMP/runtime-changed-files.txt")"
          targeted_available=false
          if bash .github/scripts/select-pr-runtime-tests.sh < "$RUNNER_TEMP/runtime-changed-files.txt" >/dev/null 2>&1; then
            targeted_available=true
          fi
          plan="$(printf '%s\n' "$plan" | DRAFT="$DRAFT" LABEL_RUNTIME="$LABEL_RUNTIME" LABEL_FULL="$LABEL_FULL" LABEL_USER_ISSUE="$LABEL_USER_ISSUE" LABEL_THEME="$LABEL_THEME" TARGETED_AVAILABLE="$targeted_available" bash .github/scripts/select-pr-runtime-tests.sh --policy)"
          printf '%s\n' "$plan" | tee -a "$GITHUB_OUTPUT"

  compile-unit:
    name: Compile, resources & unit tests
    # Owner-request drafts run compile/unit checks without implicitly requesting Android runtime.
    if: github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci:owner-request') || contains(github.event.pull_request.labels.*.name, 'ci:runtime-required') || contains(github.event.pull_request.labels.*.name, 'ci:runtime-full') || contains(github.event.pull_request.labels.*.name, 'ci:user-issue') || contains(github.event.pull_request.labels.*.name, 'ci:theme')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Validate runtime selector and wrapper
        run: |
          bash .github/scripts/select-pr-runtime-tests.sh --self-test
          bash -n .github/scripts/run-selected-android-runtime.sh

      - name: Install browser auth helper tooling
        run: npm install --prefix browser-auth-helper --ignore-scripts

      - name: Validate temporary browser auth helper
        run: npm test --prefix browser-auth-helper

      - name: Validate Cloudflare Worker bundle
        run: npm run check:cloudflare --prefix browser-auth-helper

      # Run build checks in one Gradle invocation to avoid repeated daemonless startup
      # while preserving every compile, resource, manifest and runtime-pack task.
      - name: Compile, validate resources and build Kotatsu Runtime Pack
        run: ./gradlew compileDebugSources processPreviewMainManifest processReleaseMainManifest :kotatsu-runtime:assembleDebug --max-workers=4 --no-daemon --stacktrace

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --max-workers=4 --no-daemon --stacktrace

      - name: Upload JVM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-jvm-evidence
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 3

  android-runtime:
    name: Android runtime validation — Android 15
    if: needs.runtime-risk.outputs.run_runtime == 'true' && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci:runtime-required') || contains(github.event.pull_request.labels.*.name, 'ci:runtime-full') || contains(github.event.pull_request.labels.*.name, 'ci:user-issue') || contains(github.event.pull_request.labels.*.name, 'ci:theme'))
    needs: [compile-unit, runtime-risk]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Keep the compiler inside one bounded JVM; leave memory for the Android emulator.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Plan Android runtime scope
        id: runtime-plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_RUNTIME: ${{ needs.runtime-risk.outputs.full }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/runtime-changed-files.txt"

          args=()
          if [[ "$FULL_RUNTIME" == "true" ]]; then
            args+=(--full)
          fi

          plan="$(bash .github/scripts/select-pr-runtime-tests.sh "${args[@]}" < "$RUNNER_TEMP/runtime-changed-files.txt")"
          printf '%s\n' "$plan"
          while IFS= read -r line; do
            printf '%s\n' "$line" >> "$GITHUB_OUTPUT"
          done <<< "$plan"

      - name: Build runtime APKs before booting the emulator
        env:
          RUN_RUNTIME_ISOLATION: ${{ steps.runtime-plan.outputs.run_runtime_isolation }}
        run: |
          tasks=(":app:assembleDebug" ":app:assembleDebugAndroidTest")
          if [[ "$RUN_RUNTIME_ISOLATION" == "true" ]]; then
            tasks+=(":kotatsu-runtime:assembleDebug" ":kotatsu-runtime-fixture:assembleDebug")
          fi
          ./gradlew "${tasks[@]}" --max-workers=2 --no-daemon --stacktrace

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Prepare collector compatibility for the exact head
        run: |
          # Amain2's collector remains authoritative whenever it exists in the checked-out head.
          # Older heads still run their existing cover tests through the same command wrapper.
          if ! test -f .github/scripts/collect-on-device-cover-evidence.sh; then
            mkdir -p .github/scripts
            printf '#!/usr/bin/env bash\nset -euo pipefail\n"$@"\n' > .github/scripts/collect-on-device-cover-evidence.sh
          fi

      - name: Run selected Android 15 runtime validation
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RUNTIME_CLASSES: ${{ steps.runtime-plan.outputs.classes }}
          RUN_RUNTIME_ISOLATION: ${{ steps.runtime-plan.outputs.run_runtime_isolation }}
          RUN_MIGRATION_PERSISTENCE: ${{ steps.runtime-plan.outputs.run_migration_persistence }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-selected-android-runtime.sh

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-evidence
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/on-device-cover/
            app/build/reports/migration-process/
            app/build/reports/android-runtime-diagnostics/
          if-no-files-found: warn
          retention-days: 3

      # skip-device-test suppresses only the owner-facing physical-device APK artifact.
      # Automated Android 15 runtime/instrumentation validation above still runs.
      - name: Upload exact-head debug APK for owner validation
        if: success() && !contains(github.event.pull_request.labels.*.name, 'skip-device-test')
        uses: actions/upload-artifact@v4
        with:
          name: on-device-cover-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
