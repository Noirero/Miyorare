name: PR Compile & Unit Check

on:
  pull_request:
    branches:
      - Amain2
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: pr-compile-unit-${{ github.event.pull_request.number }}
  # Keep an in-flight run for label-only updates; new source heads still supersede it.
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

permissions:
  contents: read
  actions: read

jobs:
  runtime-risk:
    name: Classify Android runtime risk
    runs-on: ubuntu-latest
    outputs:
      run_runtime: ${{ steps.classify.outputs.run_runtime }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Classify changed paths and labels
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABEL_OWNER: ${{ contains(github.event.pull_request.labels.*.name, 'ci:owner-request') }}
          LABEL_RUNTIME: ${{ contains(github.event.pull_request.labels.*.name, 'ci:runtime-required') }}
          LABEL_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:runtime-full') }}
          LABEL_USER_ISSUE: ${{ contains(github.event.pull_request.labels.*.name, 'ci:user-issue') }}
          LABEL_THEME: ${{ contains(github.event.pull_request.labels.*.name, 'ci:theme') }}
          DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/runtime-changed-files.txt"
          bash .github/scripts/select-pr-runtime-tests.sh --self-test
          plan="$(bash .github/scripts/select-pr-runtime-tests.sh --classify < "$RUNNER_TEMP/runtime-changed-files.txt")"
          targeted_available=false
          if bash .github/scripts/select-pr-runtime-tests.sh < "$RUNNER_TEMP/runtime-changed-files.txt" >/dev/null 2>&1; then
            targeted_available=true
          fi
          plan="$(printf '%s\n' "$plan" | DRAFT="$DRAFT" LABEL_OWNER="$LABEL_OWNER" LABEL_RUNTIME="$LABEL_RUNTIME" LABEL_FULL="$LABEL_FULL" LABEL_USER_ISSUE="$LABEL_USER_ISSUE" LABEL_THEME="$LABEL_THEME" TARGETED_AVAILABLE="$targeted_available" bash .github/scripts/select-pr-runtime-tests.sh --policy)"
          printf '%s\n' "$plan" | tee -a "$GITHUB_OUTPUT"
          # Explain the existing classifier's decision; never change its outputs or gates.
          run_runtime="$(sed -n 's/^run_runtime=//p' <<< "$plan" | tail -1)"
          full_runtime="$(sed -n 's/^full=//p' <<< "$plan" | tail -1)"
          {
            echo '## Android runtime selection'
            echo "- Exact PR HEAD: \`$HEAD_SHA\`"
            echo "- Runtime requested: **$run_runtime**, full suite: **$full_runtime**"
            echo "- Owner/user/theme/override flags: $LABEL_OWNER / $LABEL_USER_ISSUE / $LABEL_THEME / $LABEL_RUNTIME / $LABEL_FULL"
            if [[ "$LABEL_OWNER" == true && "$LABEL_RUNTIME" == false && "$LABEL_FULL" == false && "$LABEL_USER_ISSUE" == false && "$LABEL_THEME" == false ]]; then
              echo '- Reason: owner-request runs the regular compile/resources/unit checks, while Android 15 is intentionally not selected unless a heavy label is added. Compile success alone does not prove Android runtime or release readiness.'
            elif [[ "$run_runtime" == false ]]; then
              echo '- Reason: this PR has no runtime-relevant changed paths and no mandatory override.'
            elif [[ "$full_runtime" == true ]]; then
              echo '- Reason: shared/unmapped runtime risk or an explicit full-runtime override.'
            else
              echo '- Reason: changed paths are mapped to targeted runtime suites by the existing selector.'
            fi
            echo '- Changed paths used for the decision:'
            echo '```text'
            cat "$RUNNER_TEMP/runtime-changed-files.txt"
            echo '```'
            echo '- This explanation does not modify the required PR checks.'
          } >> "$GITHUB_STEP_SUMMARY"

  compile-unit:
    name: Compile, resources & unit tests
    # Owner-request drafts run compile/unit checks without implicitly requesting Android runtime.
    if: github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci:owner-request') || contains(github.event.pull_request.labels.*.name, 'ci:runtime-required') || contains(github.event.pull_request.labels.*.name, 'ci:runtime-full') || contains(github.event.pull_request.labels.*.name, 'ci:user-issue') || contains(github.event.pull_request.labels.*.name, 'ci:theme')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Validate CI evidence and Miyori status contracts
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_ci_exact_head_reuse.py'
          python3 -m unittest discover -s .github/scripts -p 'test_ci_android_runtime_reuse.py'
          python3 -m unittest discover -s .github/scripts -p 'test_prewarm_jitpack_parsers.py'
          python3 -m unittest discover -s .github/scripts -p 'test_miyori_status.py'

      - name: Find reusable exact-head compile/JVM evidence
        id: compile-proof
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python3 .github/scripts/ci_exact_head_reuse.py

      - name: Set up JDK 17
        if: steps.compile-proof.outputs.reuse != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        if: steps.compile-proof.outputs.reuse != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Gradle
        if: steps.compile-proof.outputs.reuse != 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        if: steps.compile-proof.outputs.reuse != 'true'
        run: chmod +x gradlew

      - name: Validate runtime selector and wrapper
        if: steps.compile-proof.outputs.reuse != 'true'
        run: |
          bash .github/scripts/select-pr-runtime-tests.sh --self-test
          bash -n .github/scripts/run-selected-android-runtime.sh
          bash .github/scripts/run-selected-android-runtime.sh --self-test
          bash -n .github/scripts/run-history-scroll-benchmark.sh
          python3 .github/scripts/targeted-ci-diagnostics.py --self-test

      - name: Install browser auth helper tooling
        if: steps.compile-proof.outputs.reuse != 'true'
        run: npm install --prefix browser-auth-helper --ignore-scripts

      - name: Validate temporary browser auth helper
        if: steps.compile-proof.outputs.reuse != 'true'
        run: npm test --prefix browser-auth-helper

      - name: Validate Cloudflare Worker bundle
        if: steps.compile-proof.outputs.reuse != 'true'
        run: npm run check:cloudflare --prefix browser-auth-helper

      # Run build checks in one Gradle invocation to avoid repeated daemonless startup
      # while preserving every compile, resource, manifest and runtime-pack task.
      - name: Compile, validate resources and build Kotatsu Runtime Pack
        if: steps.compile-proof.outputs.reuse != 'true'
        run: ./gradlew compileDebugSources processPreviewMainManifest processReleaseMainManifest :kotatsu-runtime:assembleDebug --max-workers=4 --no-daemon --stacktrace

      - name: Run JVM unit tests
        if: steps.compile-proof.outputs.reuse != 'true'
        run: ./gradlew testDebugUnitTest --max-workers=4 --no-daemon --stacktrace

      - name: Upload JVM evidence
        if: always() && steps.compile-proof.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-jvm-evidence
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 3

      - name: Explain reused compile evidence
        if: steps.compile-proof.outputs.reuse == 'true'
        env:
          SOURCE_RUN_ID: ${{ steps.compile-proof.outputs.source_run_id }}
        run: |
          echo "Compile, resources & JVM tests reused from successful exact-head run $SOURCE_RUN_ID." >> "$GITHUB_STEP_SUMMARY"
          echo "Head, base, PR and workflow identity were verified. Android validation is evaluated independently." >> "$GITHUB_STEP_SUMMARY"

  android-runtime:
    name: Android runtime validation — Android 15
    if: needs.runtime-risk.outputs.run_runtime == 'true' && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci:runtime-required') || contains(github.event.pull_request.labels.*.name, 'ci:runtime-full') || contains(github.event.pull_request.labels.*.name, 'ci:user-issue') || contains(github.event.pull_request.labels.*.name, 'ci:theme'))
    needs: [compile-unit, runtime-risk]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Keep the compiler inside one bounded JVM; leave memory for the Android emulator.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Plan Android runtime scope
        id: runtime-plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_RUNTIME: ${{ needs.runtime-risk.outputs.full }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/runtime-changed-files.txt"

          args=()
          if [[ "$FULL_RUNTIME" == "true" ]]; then
            args+=(--full)
          fi

          plan="$(bash .github/scripts/select-pr-runtime-tests.sh "${args[@]}" < "$RUNNER_TEMP/runtime-changed-files.txt")"
          printf '%s\n' "$plan"
          while IFS= read -r line; do
            printf '%s\n' "$line" >> "$GITHUB_OUTPUT"
          done <<< "$plan"
          {
            echo '## Exact Android test selection'
            echo 'The existing selector produced the following runtime plan:'
            echo '```text'
            printf '%s\n' "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Find reusable original exact-scope Android evidence
        id: android-proof
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUNTIME_MODE: ${{ steps.runtime-plan.outputs.mode }}
          RUNTIME_CLASSES: ${{ steps.runtime-plan.outputs.classes }}
          RUN_RUNTIME_ISOLATION: ${{ steps.runtime-plan.outputs.run_runtime_isolation }}
          RUN_MIGRATION_PERSISTENCE: ${{ steps.runtime-plan.outputs.run_migration_persistence }}
          RUNTIME_FULL: ${{ needs.runtime-risk.outputs.full }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABEL_CI_OWNER_REQUEST: ${{ contains(github.event.pull_request.labels.*.name, 'ci:owner-request') }}
          LABEL_CI_RUNTIME_REQUIRED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:runtime-required') }}
          LABEL_CI_RUNTIME_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:runtime-full') }}
          LABEL_CI_USER_ISSUE: ${{ contains(github.event.pull_request.labels.*.name, 'ci:user-issue') }}
          LABEL_CI_THEME: ${{ contains(github.event.pull_request.labels.*.name, 'ci:theme') }}
          LABEL_SKIP_DEVICE_TEST: ${{ contains(github.event.pull_request.labels.*.name, 'skip-device-test') }}
          CHANGED_PATHS_FILE: ${{ runner.temp }}/runtime-changed-files.txt
        run: python3 .github/scripts/ci_android_runtime_reuse.py

      - name: Build runtime APKs before booting the emulator
        if: steps.android-proof.outputs.reuse != 'true'
        env:
          RUN_RUNTIME_ISOLATION: ${{ steps.runtime-plan.outputs.run_runtime_isolation }}
        run: |
          tasks=(":app:assembleDebug" ":app:assembleDebugAndroidTest")
          if [[ "$RUN_RUNTIME_ISOLATION" == "true" ]]; then
            tasks+=(":kotatsu-runtime:assembleDebug" ":kotatsu-runtime-fixture:assembleDebug")
          fi
          ./gradlew "${tasks[@]}" --max-workers=2 --no-daemon --stacktrace

      - name: Enable KVM
        if: steps.android-proof.outputs.reuse != 'true'
        run: sudo chmod 666 /dev/kvm

      - name: Prepare collector compatibility for the exact head
        if: steps.android-proof.outputs.reuse != 'true'
        run: |
          # Amain2's collector remains authoritative whenever it exists in the checked-out head.
          # Older heads still run their existing cover tests through the same command wrapper.
          if ! test -f .github/scripts/collect-on-device-cover-evidence.sh; then
            mkdir -p .github/scripts
            printf '#!/usr/bin/env bash\nset -euo pipefail\n"$@"\n' > .github/scripts/collect-on-device-cover-evidence.sh
          fi

      - name: Run selected Android 15 runtime validation
        if: steps.android-proof.outputs.reuse != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          RUNTIME_CLASSES: ${{ steps.runtime-plan.outputs.classes }}
          RUN_RUNTIME_ISOLATION: ${{ steps.runtime-plan.outputs.run_runtime_isolation }}
          RUN_MIGRATION_PERSISTENCE: ${{ steps.runtime-plan.outputs.run_migration_persistence }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-selected-android-runtime.sh

      # A proof is published only after actual Android execution succeeds.
      # Never publish a reusable proof from an already reused run.
      - name: Upload original Android scope proof
        if: success() && steps.android-proof.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-scope-proof
          path: ${{ runner.temp }}/android-runtime-scope-proof.json
          if-no-files-found: warn
          retention-days: 3

      - name: Explain reused Android proof
        if: steps.android-proof.outputs.reuse == 'true'
        env:
          SOURCE_RUN_ID: ${{ steps.android-proof.outputs.source_run_id }}
          FINGERPRINT: ${{ steps.android-proof.outputs.fingerprint }}
        run: |
          echo "## Android 15 evidence REUSED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Original real Android execution run: $SOURCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact scope fingerprint (SHA-256): $FINGERPRINT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Real Android APK-build, KVM, emulator steps skipped; owner APK, if required, restored from the verified source run." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android evidence
        if: always() && steps.android-proof.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-evidence
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/on-device-cover/
            app/build/reports/migration-process/
            app/build/reports/android-runtime-diagnostics/
          if-no-files-found: warn
          retention-days: 3

      # skip-device-test suppresses only the owner-facing physical-device APK artifact.
      # Automated Android 15 runtime/instrumentation validation above still runs.
      - name: Upload exact-head debug APK for owner validation
        if: success() && !contains(github.event.pull_request.labels.*.name, 'skip-device-test')
        uses: actions/upload-artifact@v4
        with:
          name: on-device-cover-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
