name: Optimize Local Backup

on:
  push:
    branches: [beta]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Optimize backup batching
        shell: python
        run: |
          from pathlib import Path

          favourites = Path('app/src/main/kotlin/org/koitharu/kotatsu/favourites/data/FavouritesDao.kt')
          text = favourites.read_text()
          old = '''\tfun dump(): Flow<FavouriteManga> = flow {
          \t\tval window = 10
          \t\tvar offset = 0
          \t\twhile (currentCoroutineContext().isActive) {
          \t\t\tval list = findAllRaw(offset, window)
          \t\t\tif (list.isEmpty()) {
          \t\t\t\tbreak
          \t\t\t}
          \t\t\toffset += window
          \t\t\tlist.forEach { emit(it) }
          \t\t}
          \t}
          '''
          new = '''\tfun dump(): Flow<FavouriteManga> = flow {
          \t\t// Keep backup memory bounded, but avoid thousands of tiny Room transactions on large libraries.
          \t\t// 256 stays comfortably below SQLite/Room relation limits while reducing a 16k-item dump
          \t\t// from roughly 1,600 database windows to about 63.
          \t\tval window = 256
          \t\tvar offset = 0
          \t\twhile (currentCoroutineContext().isActive) {
          \t\t\tval list = findAllRaw(offset, window)
          \t\t\tif (list.isEmpty()) {
          \t\t\t\tbreak
          \t\t\t}
          \t\t\toffset += list.size
          \t\t\tlist.forEach { emit(it) }
          \t\t}
          \t}
          '''
          if old not in text:
              raise SystemExit('Favourites dump block not found; aborting safely')
          favourites.write_text(text.replace(old, new, 1))

          backup = Path('app/src/main/kotlin/org/koitharu/kotatsu/backup/local/data/LocalBackupRepository.kt')
          text = backup.read_text()
          old = '''\tprivate suspend fun dumpMangaChapters(): Flow<MangaWithChaptersBackup> {
          \t\tval dao = database.getMangaDao()
          \t\tval chaptersDao = database.getChaptersDao()
          \t\tval sources = database.getSourcesDao().findAll().map { it.source }
          \t\tval seen = HashSet<Long>()
          \t\treturn kotlinx.coroutines.flow.flow {
          \t\t\tfor (source in sources) {
          \t\t\t\tval items = dao.findAllBySource(source)
          \t\t\t\tfor (item in items) {
          \t\t\t\t\tif (!seen.add(item.manga.id)) continue
          \t\t\t\t\tval chapters = chaptersDao.findAll(item.manga.id)
          \t\t\t\t\tif (chapters.isEmpty()) continue
          \t\t\t\t\temit(
          \t\t\t\t\t\tMangaWithChaptersBackup(
          \t\t\t\t\t\t\tmanga = MangaBackup(item),
          \t\t\t\t\t\t\tchapters = chapters.map(::ChapterBackup),
          \t\t\t\t\t\t),
          \t\t\t\t\t)
          \t\t\t\t}
          \t\t\t}
          \t\t}
          \t}
          '''
          new = '''\tprivate suspend fun dumpMangaChapters(): Flow<MangaWithChaptersBackup> {
          \t\tval dao = database.getMangaDao()
          \t\tval chaptersDao = database.getChaptersDao()
          \t\tval sources = database.getSourcesDao().findAll().map { it.source }
          \t\tval seen = HashSet<Long>()
          \t\treturn kotlinx.coroutines.flow.flow {
          \t\t\tfor (source in sources) {
          \t\t\t\tval items = dao.findAllBySource(source)
          \t\t\t\tfor (batch in items.chunked(BACKUP_DB_BATCH_SIZE)) {
          \t\t\t\t\tval uniqueItems = batch.filter { seen.add(it.manga.id) }
          \t\t\t\t\tif (uniqueItems.isEmpty()) continue
          \t\t\t\t\tval ids = uniqueItems.map { it.manga.id }
          \t\t\t\t\tval chaptersByManga = chaptersDao.findAll(ids).groupBy { it.mangaId }
          \t\t\t\t\tfor (item in uniqueItems) {
          \t\t\t\t\t\tval chapters = chaptersByManga[item.manga.id].orEmpty()
          \t\t\t\t\t\tif (chapters.isEmpty()) continue
          \t\t\t\t\t\temit(
          \t\t\t\t\t\t\tMangaWithChaptersBackup(
          \t\t\t\t\t\t\t\tmanga = MangaBackup(item),
          \t\t\t\t\t\t\t\tchapters = chapters.map(::ChapterBackup),
          \t\t\t\t\t\t\t),
          \t\t\t\t\t\t)
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t}
          \t\t}
          \t}
          '''
          if old not in text:
              raise SystemExit('Chapter dump block not found; aborting safely')
          text = text.replace(old, new, 1)
          marker = '''\tprivate companion object {
          \t\tconst val PRIVATE_FAVOURITES_ENTRY = "private_favourites"
          \t}
          '''
          replacement = '''\tprivate companion object {
          \t\tconst val PRIVATE_FAVOURITES_ENTRY = "private_favourites"
          \t\tconst val BACKUP_DB_BATCH_SIZE = 256
          \t}
          '''
          if marker not in text:
              raise SystemExit('Backup companion block not found; aborting safely')
          backup.write_text(text.replace(marker, replacement, 1))

      - name: Commit optimized backup path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/optimize-local-backup.yml
          git add app/src/main/kotlin/org/koitharu/kotatsu/favourites/data/FavouritesDao.kt
          git add app/src/main/kotlin/org/koitharu/kotatsu/backup/local/data/LocalBackupRepository.kt
          git commit -m "Optimize local backup for large libraries"
          git push origin HEAD:beta
