name: PF5 Regression Audit

on:
  push:
    branches:
      - pf5

permissions:
  contents: read

concurrency:
  group: pf5-regression-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Unit tests, lint, privacy inventory
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout pf5
        uses: actions/checkout@v5

      - name: Verify branch
        run: test "${GITHUB_REF_NAME}" = "pf5"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION=$(grep 'parsers = ' gradle/libs.versions.toml | sed 's/.*= "\(.*\)"/\1/')
          POM_URL="https://jitpack.io/com/github/YakaTeam/kotatsu-parsers/${PARSERS_VERSION}/kotatsu-parsers-${PARSERS_VERSION}.pom"
          for i in $(seq 1 10); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$POM_URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "kotatsu-parsers:${PARSERS_VERSION} ready"
              exit 0
            fi
            echo "Attempt $i returned HTTP ${HTTP_STATUS}"
            sleep 15
          done
          echo "::error::Parser dependency unavailable from JitPack"
          exit 1

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Preview lint
        run: ./gradlew :app:lintPreview --no-daemon --stacktrace

      - name: Privacy boundary inventory
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Private boundary files ==='
          grep -R -l -E 'isPrivateOnly|FavouriteSpace\.PRIVATE|PrivateFavourites' app/src/main/kotlin | sort || true
          echo '=== Tracker outbound call-sites ==='
          grep -R -n -E '\.(findManga|linkManga|scrobble|updateScrobblingInfo|fetchLinkedMangaInfoOrNull|refreshScrobblingOrNull)\(' app/src/main/kotlin || true
          echo '=== OS/privacy surfaces ==='
          grep -R -n -E 'FLAG_SECURE|AssistContent|ShortcutManager|Discord|RichPresence|NotificationCompat' app/src/main/kotlin/org/koitharu/kotatsu | head -n 500 || true
          echo '=== Stale invalid package references ==='
          if grep -R -n --include='*.kt' --include='*.java' 'org\.koitharu\.kotatsu\.favourites\.private' app/src; then
            echo '::error::Stale invalid Private package reference found'
            exit 1
          fi
