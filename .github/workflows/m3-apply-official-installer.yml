name: Apply M3 Official Installer Patch

on:
  push:
    branches:
      - feature/miyorare-source-m3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/miyorare-source-m3
          fetch-depth: 0

      - name: Apply M3 installer and UI changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          installer = 'app/src/main/kotlin/org/koitharu/kotatsu/tsuki/TsukiPluginInstaller.kt'
          replace_once(installer, 'import org.json.JSONObject\n', 'import org.json.JSONArray\nimport org.json.JSONObject\n')
          replace_once(
              installer,
              '''\tfun isStageAvailable(provider: TsukiPluginProvider): Boolean = when (provider) {\n\t\tTsukiPluginProvider.MIYORARE -> false\n\t\tTsukiPluginProvider.UMA,\n\t\tTsukiPluginProvider.GEKKOUSHI,\n\t\tTsukiPluginProvider.CUSTOM,\n\t\t-> true\n\t}\n''',
              '''\tfun isStageAvailable(provider: TsukiPluginProvider): Boolean = when (provider) {\n\t\tTsukiPluginProvider.MIYORARE,\n\t\tTsukiPluginProvider.UMA,\n\t\tTsukiPluginProvider.GEKKOUSHI,\n\t\tTsukiPluginProvider.CUSTOM,\n\t\t-> true\n\t}\n''',
          )
          replace_once(
              installer,
              '''\tsuspend fun latestRelease(provider: TsukiPluginProvider): RemoteRelease = withContext(Dispatchers.IO) {\n\t\tval config = requireNotNull(knownProvider(provider)) { "No official repository for $provider" }\n\t\trequireStageAvailable(config)\n\t\tfetchLatestRelease(config)\n\t}\n''',
              '''\tsuspend fun latestRelease(provider: TsukiPluginProvider): RemoteRelease = withContext(Dispatchers.IO) {\n\t\trequire(provider != TsukiPluginProvider.MIYORARE) {\n\t\t\t"Miyorare has multiple official packs; select a plugin id"\n\t\t}\n\t\tval config = requireNotNull(knownProvider(provider)) { "No official repository for $provider" }\n\t\trequireStageAvailable(config)\n\t\tfetchLatestRelease(config)\n\t}\n\n\tfun officialMiyorarePacks(): List<MiyorareOfficialSourcePack> = MiyorareOfficialSourcePacks.packs\n\n\tsuspend fun latestMiyorareRelease(pluginId: String): RemoteRelease = withContext(Dispatchers.IO) {\n\t\tval config = requireNotNull(miyorarePackConfig(pluginId)) { "Unknown official Miyorare source pack: $pluginId" }\n\t\trequireStageAvailable(config)\n\t\tfetchLatestRelease(config)\n\t}\n''',
          )
          replace_once(
              installer,
              '''\tsuspend fun installLatest(provider: TsukiPluginProvider): TsukiPluginDescriptor = withContext(Dispatchers.IO) {\n\t\tval config = requireNotNull(knownProvider(provider)) { "No official repository for $provider" }\n\t\tinstallFromConfig(config)\n\t}\n''',
              '''\tsuspend fun installLatest(provider: TsukiPluginProvider): TsukiPluginDescriptor = withContext(Dispatchers.IO) {\n\t\trequire(provider != TsukiPluginProvider.MIYORARE) {\n\t\t\t"Miyorare has multiple official packs; select a plugin id"\n\t\t}\n\t\tval config = requireNotNull(knownProvider(provider)) { "No official repository for $provider" }\n\t\tinstallFromConfig(config)\n\t}\n\n\tsuspend fun installLatestMiyorare(pluginId: String): TsukiPluginDescriptor = withContext(Dispatchers.IO) {\n\t\tval config = requireNotNull(miyorarePackConfig(pluginId)) { "Unknown official Miyorare source pack: $pluginId" }\n\t\tinstallFromConfig(config)\n\t}\n''',
          )

          text = Path(installer).read_text()
          start = text.index('\t@WorkerThread\n\tprivate fun fetchLatestRelease(config: ProviderConfig): RemoteRelease {')
          end = text.index('\n\t@WorkerThread\n\tprivate fun downloadRelease', start)
          replacement = '''\t@WorkerThread\n\tprivate fun fetchLatestRelease(config: ProviderConfig): RemoteRelease {\n\t\tif (config.releaseTagPrefix != null) {\n\t\t\treturn fetchLatestPrefixedRelease(config)\n\t\t}\n\t\tval request = Request.Builder()\n\t\t\t.url("https://api.github.com/repos/${config.repository}/releases/latest")\n\t\t\t.header("Accept", "application/vnd.github+json")\n\t\t\t.header("X-GitHub-Api-Version", "2022-11-28")\n\t\t\t.build()\n\t\thttpClient.newCall(request).execute().use { response ->\n\t\t\trequire(response.isSuccessful) { "GitHub returned HTTP ${response.code}" }\n\t\t\treturn parseRelease(config, JSONObject(response.body.string()))\n\t\t}\n\t}\n\n\t@WorkerThread\n\tprivate fun fetchLatestPrefixedRelease(config: ProviderConfig): RemoteRelease {\n\t\tval prefix = requireNotNull(config.releaseTagPrefix)\n\t\tval request = Request.Builder()\n\t\t\t.url("https://api.github.com/repos/${config.repository}/releases?per_page=30")\n\t\t\t.header("Accept", "application/vnd.github+json")\n\t\t\t.header("X-GitHub-Api-Version", "2022-11-28")\n\t\t\t.build()\n\t\thttpClient.newCall(request).execute().use { response ->\n\t\t\trequire(response.isSuccessful) { "GitHub returned HTTP ${response.code}" }\n\t\t\tval releases = JSONArray(response.body.string())\n\t\t\tval candidates = ArrayList<Pair<SourcePackVersion, JSONObject>>()\n\t\t\tfor (i in 0 until releases.length()) {\n\t\t\t\tval release = releases.getJSONObject(i)\n\t\t\t\tif (release.optBoolean("draft") || release.optBoolean("prerelease")) continue\n\t\t\t\tval tag = release.optString("tag_name")\n\t\t\t\tif (!tag.startsWith(prefix)) continue\n\t\t\t\tval version = MiyorareOfficialSourcePacks.versionFromTag(tag) ?: continue\n\t\t\t\tcandidates += version to release\n\t\t\t}\n\t\t\tval selected = candidates.maxByOrNull { it.first }?.second\n\t\t\t\t?: error("No stable official Miyorare source-pack release is published yet")\n\t\t\treturn parseRelease(config, selected)\n\t\t}\n\t}\n\n\tprivate fun parseRelease(config: ProviderConfig, root: JSONObject): RemoteRelease {\n\t\tval tag = root.getString("tag_name").trim().also { require(it.isNotEmpty()) }\n\t\tconfig.releaseTagPrefix?.let { prefix ->\n\t\t\trequire(tag.startsWith(prefix) && MiyorareOfficialSourcePacks.versionFromTag(tag) != null) {\n\t\t\t\t"Unexpected official source-pack release tag: $tag"\n\t\t\t}\n\t\t}\n\t\tval assets = root.getJSONArray("assets")\n\t\tval candidates = ArrayList<JSONObject>()\n\t\tfor (i in 0 until assets.length()) {\n\t\t\tval asset = assets.getJSONObject(i)\n\t\t\tval name = asset.optString("name")\n\t\t\tif (config.assetName != null) {\n\t\t\t\tif (name == config.assetName) candidates += asset\n\t\t\t} else if (name.endsWith(".jar", ignoreCase = true)) {\n\t\t\t\tcandidates += asset\n\t\t\t}\n\t\t}\n\t\tif (config.assetName != null) {\n\t\t\trequire(candidates.size == 1) { "Release $tag does not contain exactly one ${config.assetName}" }\n\t\t} else {\n\t\t\trequire(candidates.size == 1) {\n\t\t\t\t"Custom GitHub release must contain exactly one .jar asset; found ${candidates.size}"\n\t\t\t}\n\t\t}\n\t\tval asset = candidates.single()\n\t\tval name = asset.getString("name")\n\t\tval size = asset.optLong("size", -1L)\n\t\trequire(size in 1..MAX_PLUGIN_BYTES) { "Plugin asset has an invalid size: $size" }\n\t\tval url = asset.getString("browser_download_url")\n\t\trequire(url.startsWith("https://github.com/${config.repository}/releases/download/$tag/")) {\n\t\t\t"Unexpected plugin download origin"\n\t\t}\n\t\tval digest = if (config.requireSha256) {\n\t\t\tMiyorareOfficialSourcePacks.normalizeSha256Digest(asset.optString("digest")).also {\n\t\t\t\trequire(it != null) { "Official Miyorare source pack is missing a valid GitHub SHA-256 digest" }\n\t\t\t}\n\t\t} else {\n\t\t\tasset.optString("digest")\n\t\t\t\t.takeIf { it.startsWith("sha256:", ignoreCase = true) }\n\t\t\t\t?.substringAfter(':')\n\t\t\t\t?.lowercase(Locale.ROOT)\n\t\t}\n\t\treturn RemoteRelease(config.provider, tag, name, url, size, digest)\n\t}\n'''
          Path(installer).write_text(text[:start] + replacement + text[end:])

          replace_once(
              installer,
              '''\tprivate fun configForPlugin(plugin: TsukiPluginDescriptor): ProviderConfig? {\n\t\tknownProvider(plugin.provider)?.let { return it }\n''',
              '''\tprivate fun configForPlugin(plugin: TsukiPluginDescriptor): ProviderConfig? {\n\t\tif (plugin.provider == TsukiPluginProvider.MIYORARE) {\n\t\t\treturn miyorarePackConfig(plugin.pluginId)\n\t\t}\n\t\tknownProvider(plugin.provider)?.let { return it }\n''',
          )
          replace_once(
              installer,
              '''\tprivate fun knownProvider(provider: TsukiPluginProvider): ProviderConfig? = when (provider) {\n\t\tTsukiPluginProvider.MIYORARE -> null\n''',
              '''\tprivate fun miyorarePackConfig(pluginId: String): ProviderConfig? {\n\t\tval pack = MiyorareOfficialSourcePacks.find(pluginId) ?: return null\n\t\treturn ProviderConfig(\n\t\t\tprovider = TsukiPluginProvider.MIYORARE,\n\t\t\tpluginId = pack.pluginId,\n\t\t\tdisplayName = pack.displayName,\n\t\t\trepository = MiyorareOfficialSourcePacks.REPOSITORY,\n\t\t\tassetName = pack.assetName,\n\t\t\treleaseTagPrefix = MiyorareOfficialSourcePacks.RELEASE_TAG_PREFIX,\n\t\t\trequireSha256 = true,\n\t\t)\n\t}\n\n\tprivate fun knownProvider(provider: TsukiPluginProvider): ProviderConfig? = when (provider) {\n\t\tTsukiPluginProvider.MIYORARE -> null\n''',
          )
          replace_once(
              installer,
              '''\tprivate data class ProviderConfig(\n\t\tval provider: TsukiPluginProvider,\n\t\tval pluginId: String,\n\t\tval displayName: String,\n\t\tval repository: String,\n\t\tval assetName: String?,\n\t) {\n''',
              '''\tprivate data class ProviderConfig(\n\t\tval provider: TsukiPluginProvider,\n\t\tval pluginId: String,\n\t\tval displayName: String,\n\t\tval repository: String,\n\t\tval assetName: String?,\n\t\tval releaseTagPrefix: String? = null,\n\t\tval requireSha256: Boolean = false,\n\t) {\n''',
          )

          ui = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/sources/TsukiPluginsSettingsFragment.kt'
          replace_once(
              ui,
              'import org.koitharu.kotatsu.tsuki.TsukiPluginInstaller\n',
              'import org.koitharu.kotatsu.tsuki.MiyorareOfficialSourcePacks\nimport org.koitharu.kotatsu.tsuki.TsukiPluginInstaller\n',
          )
          replace_once(
              ui,
              '''\t\t\t\t\tonInstallOfficial = ::installOrUpdateOfficial,\n''',
              '''\t\t\t\t\tonInstallMiyorare = ::installOrUpdateMiyorare,\n\t\t\t\t\tonInstallOfficial = ::installOrUpdateOfficial,\n''',
          )
          replace_once(
              ui,
              '''\tprivate fun installOrUpdateOfficial(provider: TsukiPluginProvider) {\n''',
              '''\tprivate fun installOrUpdateMiyorare(pluginId: String) {\n\t\tif (busy || !pluginInstaller.isStageAvailable(TsukiPluginProvider.MIYORARE)) return\n\t\trunLongOperation {\n\t\t\tval installed = pluginManager.getPlugins().firstOrNull {\n\t\t\t\tit.provider == TsukiPluginProvider.MIYORARE && it.pluginId == pluginId\n\t\t\t}\n\t\t\tif (installed != null && pluginInstaller.checkForUpdate(installed) == null) {\n\t\t\t\treturn@runLongOperation getString(R.string.tsuki_plugin_up_to_date, installed.displayName)\n\t\t\t}\n\t\t\tval plugin = pluginInstaller.installLatestMiyorare(pluginId)\n\t\t\tgetString(R.string.tsuki_plugin_install_success, plugin.displayName)\n\t\t}\n\t}\n\n\tprivate fun installOrUpdateOfficial(provider: TsukiPluginProvider) {\n''',
          )
          replace_once(
              ui,
              '''\tonInstallOfficial: (TsukiPluginProvider) -> Unit,\n''',
              '''\tonInstallMiyorare: (String) -> Unit,\n\tonInstallOfficial: (TsukiPluginProvider) -> Unit,\n''',
          )
          replace_once(
              ui,
              '''\t\titem(key = "official-header") { SectionTitle(stringResource(R.string.tsuki_plugins_official)) }\n\t\titem(key = "install-uma") {\n''',
              '''\t\titem(key = "official-header") { SectionTitle(stringResource(R.string.tsuki_plugins_official)) }\n\t\titem(key = "install-miyorare-id") {\n\t\t\tActionSettingsItem(\n\t\t\t\ttitle = stringResource(R.string.tsuki_plugins_install_miyorare_id),\n\t\t\t\tsubtitle = stringResource(R.string.tsuki_plugins_install_miyorare_id_summary),\n\t\t\t\ticon = R.drawable.ic_download,\n\t\t\t\tenabled = !busy,\n\t\t\t\tonClick = { onInstallMiyorare(MiyorareOfficialSourcePacks.ID_PLUGIN_ID) },\n\t\t\t)\n\t\t}\n\t\titem(key = "install-miyorare-en") {\n\t\t\tActionSettingsItem(\n\t\t\t\ttitle = stringResource(R.string.tsuki_plugins_install_miyorare_en),\n\t\t\t\tsubtitle = stringResource(R.string.tsuki_plugins_install_miyorare_en_summary),\n\t\t\t\ticon = R.drawable.ic_download,\n\t\t\t\tenabled = !busy,\n\t\t\t\tonClick = { onInstallMiyorare(MiyorareOfficialSourcePacks.EN_PLUGIN_ID) },\n\t\t\t)\n\t\t}\n\t\titem(key = "compatible-header") { SectionTitle(stringResource(R.string.tsuki_plugins_compatible)) }\n\t\titem(key = "install-uma") {\n''',
          )

          strings = 'app/src/main/res/values/strings_tsuki_plugins.xml'
          replace_once(
              strings,
              '    <string name="tsuki_plugins_summary">Install optional UMA or Gekkoushi source packs. Plugins and individual sources stay disabled from search until you enable the sources you want.</string>\n',
              '    <string name="tsuki_plugins_summary">Install official Miyorare source packs or compatible third-party Tsuki / Usagi plugins. Plugins and individual sources stay disabled from search until you enable the sources you want.</string>\n',
          )
          replace_once(
              strings,
              '    <string name="tsuki_plugins_manage_summary">Optional UMA and Gekkoushi source packs; not bundled in Miyorare</string>\n    <string name="tsuki_plugins_official">Official providers</string>\n',
              '    <string name="tsuki_plugins_manage_summary">Official Miyorare-ID / EN packs plus compatible third-party plugins; downloaded only when requested</string>\n    <string name="tsuki_plugins_official">Official Miyorare source packs</string>\n    <string name="tsuki_plugins_install_miyorare_id">Install / update Miyorare-ID</string>\n    <string name="tsuki_plugins_install_miyorare_id_summary">Official curated Indonesian source pack</string>\n    <string name="tsuki_plugins_install_miyorare_en">Install / update Miyorare-EN</string>\n    <string name="tsuki_plugins_install_miyorare_en_summary">Official curated English source pack</string>\n    <string name="tsuki_plugins_compatible">Compatible third-party providers</string>\n',
          )
          replace_once(
              strings,
              '    <string name="tsuki_plugin_optional_note">Plugin JARs are downloaded only after your explicit action and are stored in app-private storage. Miyorare does not bundle UMA or Gekkoushi into the APK.</string>\n',
              '    <string name="tsuki_plugin_optional_note">Plugin JARs are downloaded only after your explicit action and are stored in app-private storage. Official Miyorare packs and compatible third-party plugins are not bundled into the APK.</string>\n',
          )

          compat = '.github/workflows/source-compatibility-check.yml'
          replace_once(
              compat,
              "      - 'app/src/test/kotlin/org/koitharu/kotatsu/sources/compat/**'\n",
              "      - 'app/src/test/kotlin/org/koitharu/kotatsu/sources/compat/**'\n      - 'app/src/test/kotlin/org/koitharu/kotatsu/tsuki/**'\n",
          )
          replace_once(
              compat,
              '            --tests org.koitharu.kotatsu.sources.compat.StoredSourceIdentityTest \\\n',
              '            --tests org.koitharu.kotatsu.tsuki.MiyorareOfficialSourcePacksTest \\\n            --tests org.koitharu.kotatsu.sources.compat.StoredSourceIdentityTest \\\n',
          )

          pack_check = '.github/workflows/miyorare-source-pack-check.yml'
          replace_once(
              pack_check,
              "      - '.github/workflows/miyorare-source-pack-check.yml'\n",
              "      - '.github/workflows/miyorare-source-pack-check.yml'\n      - '.github/workflows/miyorare-source-pack-release.yml'\n",
          )
          PY

          rm .github/workflows/m3-apply-official-installer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add official Miyorare source pack installer"
          git push origin HEAD:feature/miyorare-source-m3
