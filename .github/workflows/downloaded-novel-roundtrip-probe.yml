name: Downloaded Novel Round Trip Probe

on:
  push:
    branches:
      - test/amain2-downloaded-novel-roundtrip-probe

permissions:
  contents: read

concurrency:
  group: downloaded-novel-roundtrip-probe
  cancel-in-progress: true

jobs:
  android-probe:
    name: Novel EPUB round trip — Android 15
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run exact downloaded novel round-trip probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            ./gradlew connectedDebugAndroidTest --max-workers=4 --no-daemon --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.local.data.output.DownloadedNovelRoundTripProbeTest
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-novel-roundtrip-probe
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
