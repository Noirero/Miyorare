name: Temporary Settings Stage 1 and 2 Audit

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/tmp-settings-stage1-stage2-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SETTINGS_BASELINE: 128e09473142da3bc4c70b3bb5daa33a57c4f3f9

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout beta with baseline history
        uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Final Stage 1 binding default duplicate and route audit
        shell: python
        run: |
          from collections import Counter
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys

          BASE = os.environ['SETTINGS_BASELINE']
          P = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/'
          failures = []

          def run(*args, check=True):
              p = subprocess.run(args, text=True, capture_output=True)
              if check and p.returncode != 0:
                  raise RuntimeError(f"command failed: {' '.join(args)}\n{p.stdout}\n{p.stderr}")
              return p

          def show(path):
              return run('git', 'show', f'{BASE}:{path}').stdout

          def cur(path):
              return Path(path).read_text(encoding='utf-8')

          def normalized(value):
              return re.sub(r'\s+', '', value)

          def split_top_level_args(body):
              result = []
              start = 0
              depth = 0
              quote = None
              escape = False
              for i, ch in enumerate(body):
                  if quote is not None:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch in '([{':
                      depth += 1
                  elif ch in ')]}':
                      depth -= 1
                  elif ch == ',' and depth == 0:
                      result.append(body[start:i].strip())
                      start = i + 1
              result.append(body[start:].strip())
              return result

          def pref_calls(text):
              calls = []
              rx = re.compile(r'\b(remember[A-Za-z0-9_]*Pref)\s*\(')
              for m in rx.finditer(text):
                  fn = m.group(1)
                  pos = m.end()
                  depth = 1
                  quote = None
                  escape = False
                  i = pos
                  while i < len(text) and depth:
                      ch = text[i]
                      if quote is not None:
                          if escape:
                              escape = False
                          elif ch == '\\':
                              escape = True
                          elif ch == quote:
                              quote = None
                      else:
                          if ch in ('"', "'"):
                              quote = ch
                          elif ch == '(':
                              depth += 1
                          elif ch == ')':
                              depth -= 1
                      i += 1
                  if depth != 0:
                      failures.append(f'Unbalanced preference call: {fn}')
                      continue
                  args = split_top_level_args(text[pos:i-1])
                  if not args:
                      continue
                  key = normalized(args[0])
                  default = normalized(args[1]) if len(args) > 1 else '<implicit>'
                  calls.append((fn, key, default))
              return calls

          groups = [
              (
                  'Favourites -> Appearance/Manga list',
                  [P + 'FavouritesSettingsFragment.kt'],
                  [P + 'AppearanceSettingsFragment.kt'],
              ),
              (
                  'Reader split',
                  [P + 'ReaderSettingsFragment.kt'],
                  [P + 'ReaderSettingsFragment.kt', P + 'ReaderAdvancedSettingsFragment.kt', P + 'AppearanceSettingsFragment.kt'],
              ),
              (
                  'Appearance/Privacy/Feed split',
                  [P + 'AppearanceSettingsFragment.kt'],
                  [P + 'AppearanceSettingsFragment.kt', P + 'AppearanceAdvancedSettingsFragment.kt', P + 'FeedAppearanceSettingsFragment.kt', P + 'PrivacySecuritySettingsFragment.kt'],
              ),
              (
                  'Storage/Network split',
                  [P + 'StorageAndNetworkSettingsFragment.kt'],
                  [P + 'StorageAndNetworkSettingsFragment.kt', P + 'AdvancedNetworkSettingsFragment.kt', P + 'ProxySettingsFragment.kt'],
              ),
              (
                  'Chapter updates split',
                  [P + 'tracker/TrackerSettingsFragment.kt'],
                  [P + 'tracker/TrackerSettingsFragment.kt', P + 'tracker/TrackerDiagnosticsSettingsFragment.kt', P + 'FeedAppearanceSettingsFragment.kt'],
              ),
              (
                  'Extensions',
                  [P + 'sources/ExtensionsSettingsFragment.kt'],
                  [P + 'sources/ExtensionsSettingsFragment.kt'],
              ),
              (
                  'Downloads',
                  [P + 'DownloadsSettingsFragment.kt'],
                  [P + 'DownloadsSettingsFragment.kt'],
              ),
          ]

          for label, old_paths, new_paths in groups:
              old_calls = Counter(
                  call
                  for path in old_paths
                  for call in pref_calls(show(path))
              )
              new_calls = Counter(
                  call
                  for path in new_paths
                  for call in pref_calls(cur(path))
              )
              for signature, old_count in old_calls.items():
                  new_count = new_calls[signature]
                  if new_count != old_count:
                      fn, key, default = signature
                      alternatives = [x for x in new_calls if x[1] == key]
                      failures.append(
                          f'{label}: {fn}({key}, default={default}) count {old_count} -> {new_count}; '
                          f'current bindings for key={alternatives}'
                      )
              if not any(x.startswith(label + ':') for x in failures):
                  print(f'PASS {label}: binding type, default and count preserved for {sum(old_calls.values())} preference bindings')

          # The obsolete standalone Favourites screen must be truly gone, and an exact
          # reference check must not be confused by PrivateFavouritesSettingsFragment.
          obsolete = P + 'FavouritesSettingsFragment.kt'
          if Path(obsolete).exists():
              failures.append('Obsolete FavouritesSettingsFragment.kt still exists')
          exact = run('git', 'grep', '-n', '-w', 'FavouritesSettingsFragment', 'HEAD', '--', 'app/src/main/kotlin', check=False)
          exact_refs = [x for x in exact.stdout.splitlines() if x.strip()]
          if exact_refs:
              failures.append('Exact obsolete FavouritesSettingsFragment references remain: ' + ' | '.join(exact_refs))
          else:
              print('PASS obsolete screen cleanup: no exact FavouritesSettingsFragment references remain')

          # Upgrade contract: no storage key/default migration was introduced by UI movement.
          app_settings = 'app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/AppSettings.kt'
          if run('git', 'diff', '--exit-code', BASE, 'HEAD', '--', app_settings, check=False).returncode != 0:
              failures.append('AppSettings.kt changed; upgrade preference contract is no longer identical to baseline')
          else:
              print('PASS upgrade preferences: AppSettings.kt remains byte-for-byte identical to baseline')

          private_path = P + 'PrivateFavouritesSettingsFragment.kt'
          if run('git', 'diff', '--exit-code', BASE, 'HEAD', '--', private_path, check=False).returncode != 0:
              failures.append('Private Favourites Settings behavior changed during reorganization')
          else:
              print('PASS Private Favourites Settings behavior file unchanged')

          # Downloads maintenance must remain a grouping-only UI change.
          old_downloads = show(P + 'DownloadsSettingsFragment.kt')
          new_downloads = cur(P + 'DownloadsSettingsFragment.kt')
          marker = '@Composable\nprivate fun DownloadsScreen'
          if marker not in old_downloads or marker not in new_downloads:
              failures.append('Downloads audit marker missing')
          elif old_downloads.split(marker, 1)[0] != new_downloads.split(marker, 1)[0]:
              failures.append('Downloads callback/storage/rebuild implementation changed')
          else:
              print('PASS Downloads non-UI implementation unchanged')

          forbidden_prefixes = [
              'app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/',
              'app/src/main/kotlin/org/koitharu/kotatsu/core/db/',
              'app/src/main/kotlin/org/koitharu/kotatsu/favourites/',
              'app/src/main/kotlin/org/koitharu/kotatsu/reader/',
              'app/src/main/kotlin/org/koitharu/kotatsu/tracker/work/',
              'app/src/main/kotlin/org/koitharu/kotatsu/download/',
              'app/src/main/kotlin/org/koitharu/kotatsu/local/',
              'app/src/main/kotlin/org/koitharu/kotatsu/extensions/',
              'app/src/main/kotlin/org/koitharu/kotatsu/backup/',
              'app/src/main/kotlin/org/koitharu/kotatsu/core/network/',
              'app/src/main/kotlin/org/koitharu/kotatsu/sync/',
              'app/src/main/sqldelight/',
          ]
          changed = run('git', 'diff', '--name-only', BASE, 'HEAD').stdout.splitlines()
          sensitive = [p for p in changed if any(p.startswith(prefix) for prefix in forbidden_prefixes)]
          if sensitive:
              failures.append('Settings reorganization touched sensitive runtime/data files: ' + ', '.join(sensitive))
          else:
              print('PASS runtime isolation: sensitive data/Reader/Download/Local/Extensions/Backup/Network/Sync code untouched')

          # Root and nested route reachability, plus inactive Google Drive visibility policy.
          root = cur(P + 'RootSettingsFragment.kt')
          required_root = [
              'AppearanceSettingsFragment::class.java',
              'ReaderSettingsFragment::class.java',
              'ExtensionsSettingsFragment::class.java',
              'DownloadsSettingsFragment::class.java',
              'TrackerSettingsFragment::class.java',
              'StorageAndNetworkSettingsFragment::class.java',
              'BackupSettingsFragment::class.java',
              'PrivacySecuritySettingsFragment::class.java',
              'ServicesSettingsFragment::class.java',
              'AboutSettingsFragment::class.java',
          ]
          for token in required_root:
              if token not in root:
                  failures.append('Missing root route: ' + token)
          for token in ['FavouritesSettingsFragment::class.java', 'PrivateFavouritesSettingsFragment::class.java', 'SyncSettingsFragment::class.java']:
              if token in root:
                  failures.append('Unexpected old/hidden root route: ' + token)

          route_checks = {
              P + 'PrivacySecuritySettingsFragment.kt': ['PrivateFavouritesSettingsFragment::class.java'],
              P + 'AppearanceSettingsFragment.kt': ['FeedAppearanceSettingsFragment::class.java', 'AppearanceAdvancedSettingsFragment::class.java'],
              P + 'ReaderSettingsFragment.kt': ['ReaderAdvancedSettingsFragment::class.java'],
              P + 'StorageAndNetworkSettingsFragment.kt': ['AdvancedNetworkSettingsFragment::class.java'],
              P + 'tracker/TrackerSettingsFragment.kt': ['TrackerDiagnosticsSettingsFragment::class.java'],
          }
          for path, tokens in route_checks.items():
              text = cur(path)
              for token in tokens:
                  if token not in text:
                      failures.append(f'Missing nested route {token} in {path}')

          search_path = P + 'search/SettingsSearchHelper.kt'
          old_search = show(search_path)
          new_search = cur(search_path)
          sync_start = old_search.find('section(R.string.google_drive_sync')
          if sync_start >= 0:
              sync_end = old_search.find('\n\t\tsection(', sync_start + 1)
              if sync_end < 0:
                  sync_end = len(old_search)
              old_search = old_search[:sync_start] + old_search[sync_end:]

          def search_keys(text):
              return set(x.strip() for x in re.findall(r'addItem\(\s*([^,\n]+)', text) if x.strip() != 'key: String')

          missing_search = sorted(search_keys(old_search) - search_keys(new_search))
          if missing_search:
              failures.append('Search lost baseline entries: ' + ', '.join(missing_search))
          if 'SyncSettingsFragment' in new_search:
              failures.append('Inactive Google Drive Sync remains reachable from Settings search')

          expected_search_routes = {
              'AppSettings.KEY_TITLE_TAP_TO_READ': 'AppearanceSettingsFragment::class.java',
              'AppSettings.KEY_CHECK_DUPLICATES': 'AppearanceSettingsFragment::class.java',
              'AppSettings.KEY_PROTECT_APP': 'PrivacySecuritySettingsFragment::class.java',
              'AppSettings.KEY_PROTECT_APP_TIMEOUT': 'PrivacySecuritySettingsFragment::class.java',
              'AppSettings.KEY_SCREENSHOTS_POLICY': 'PrivacySecuritySettingsFragment::class.java',
              'AppSettings.KEY_FEED_SWIPE_GESTURES': 'FeedAppearanceSettingsFragment::class.java',
              'AppSettings.KEY_FEED_COUNTER_DOT': 'FeedAppearanceSettingsFragment::class.java',
              'AppSettings.KEY_READER_CONTROL_LTR': 'ReaderAdvancedSettingsFragment::class.java',
              'AppSettings.KEY_READER_NAVIGATION_INVERTED': 'ReaderAdvancedSettingsFragment::class.java',
          }
          for key, fragment in expected_search_routes.items():
              if not re.search(r'addItem\(\s*' + re.escape(key) + r'.{0,700}?' + re.escape(fragment), new_search, re.S):
                  failures.append(f'Search route mismatch: {key} -> {fragment}')

          sync_ui = Path('app/src/main/kotlin/org/koitharu/kotatsu/sync/ui/SyncSettingsFragment.kt')
          if not sync_ui.exists():
              failures.append('Google Drive Sync implementation was deleted instead of only hidden')

          print('\n=== FINAL STAGE 1 STATIC AUDIT ===')
          if failures:
              for failure in failures:
                  print('FAIL', failure)
              sys.exit(1)
          print('ALL STAGE 1 WIRING / DEFAULT / DUPLICATE / UPGRADE CHECKS PASSED')

      - name: Stage 2 all debug unit tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Stage 2 compile debug Kotlin
        shell: bash
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
