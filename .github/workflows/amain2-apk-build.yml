name: Amain2 APK Build
run-name: Amain2 Staging APK · ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: amain2-staging-build
  cancel-in-progress: true

jobs:
  guard:
    if: github.ref_name != 'Amain2'
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-Amain2 build
        run: |
          echo "::error::This workflow may only be run with branch Amain2 selected."
          exit 1

  build:
    if: github.ref_name == 'Amain2'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Amain2 candidate
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Require permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode permanent keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Apply Amain2 staging identity and monotonic version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(( $(date -u +%s) - 1577836800 ))
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Generated Android versionCode is too large"
            exit 1
          fi
          export VERSION_CODE

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          gradle = Path('app/build.gradle')
          text = gradle.read_text()
          text, app_count = re.subn(
              r"applicationId\s*=\s*'org\.noirero\.miyorare'",
              "applicationId = 'org.noirero.miyorare.amain2'",
              text,
              count=1,
          )
          text, version_count = re.subn(
              r'versionCode\s*=\s*\d+',
              f"versionCode = {os.environ['VERSION_CODE']}",
              text,
              count=1,
          )
          if app_count != 1 or version_count != 1:
              raise SystemExit('Could not apply Amain2 applicationId/versionCode exactly once')
          gradle.write_text(text)

          strings = Path('app/src/main/res/values/strings.xml')
          if strings.exists():
              value = strings.read_text()
              value, changed = re.subn(
                  r'(<string\s+name="app_name"[^>]*>)(.*?)(</string>)',
                  r'\1Miyorare Amain2\3',
                  value,
                  count=1,
                  flags=re.S,
              )
              if changed == 1:
                  strings.write_text(value)
          PY

          echo "Amain2 versionCode: $VERSION_CODE"
          grep -F "applicationId = 'org.noirero.miyorare.amain2'" app/build.gradle

      - name: Build permanently signed Amain2 APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --max-workers=4 --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=../release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No release APK produced"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "artifact/Miyorare-Amain2-$(basename "$apk")"
          done

      - name: Upload Amain2 staging APK
        uses: actions/upload-artifact@v4
        with:
          name: Miyorare-Amain2-APK
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 14
