name: Amain2 APK Build
run-name: Amain2 Staging APK · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      include_discord_sdk:
        description: Build a password-protected staging APK with the official Discord SDK
        type: boolean
        default: false
      discord_application_id:
        description: Discord Application ID for the SDK-enabled staging build
        type: string
        required: false

concurrency:
  group: amain2-staging-build${{ inputs.include_discord_sdk && '-discord-sdk' || '' }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/Amain2' ||
      (inputs.include_discord_sdk && github.ref == 'refs/heads/fix/amain2-discord-sdk-staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Amain2 candidate
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Provision the pinned Android Discord SDK
        if: inputs.include_discord_sdk
        shell: bash
        env:
          DISCORD_SDK_AAR_URL: ${{ secrets.AMAIN2_DISCORD_SDK_AAR_URL }}
          DISCORD_APPLICATION_ID: ${{ inputs.discord_application_id }}
          APK_TEST_PASSWORD: ${{ secrets.AMAIN2_DISCORD_APK_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$DISCORD_SDK_AAR_URL" != https://* ]]; then
            echo '::error::Set AMAIN2_DISCORD_SDK_AAR_URL to an authorized HTTPS download of the Android AAR.'
            exit 1
          fi
          if [[ ! "$DISCORD_APPLICATION_ID" =~ ^[1-9][0-9]{16,18}$ ]]; then
            echo '::error::Enter the Discord Application ID for the staging build.'
            exit 1
          fi
          if [[ ${#APK_TEST_PASSWORD} -lt 20 ]]; then
            echo '::error::Set AMAIN2_DISCORD_APK_PASSWORD to a strong random password of at least 20 characters.'
            exit 1
          fi

          aar="$RUNNER_TEMP/discord_partner_sdk.aar"
          umask 077
          if ! curl --silent --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 --max-filesize 40000000 --output "$aar" -- "$DISCORD_SDK_AAR_URL"; then
            echo '::error::Could not download the Android Discord AAR. Check the authorized URL and its expiry.'
            exit 1
          fi
          # Discord Social SDK C++ 1.11.24259, Android AAR used for the phone acceptance test.
          printf '%s  %s\n' ea4c080cc7c5ddeccab58f3bdf5682a3e18a7a84a815bb0f33609bfcafba3f99 "$aar" | sha256sum --check --status

      - name: Require permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode permanent keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Apply Amain2 staging identity and monotonic version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(( $(date -u +%s) - 1577836800 ))
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Generated Android versionCode is too large"
            exit 1
          fi
          export VERSION_CODE

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          gradle = Path('app/build.gradle')
          text = gradle.read_text()
          text, app_count = re.subn(
              r"applicationId\s*=\s*'org\.noirero\.miyorare'",
              "applicationId = 'org.noirero.miyorare.amain2'",
              text,
              count=1,
          )
          text, version_count = re.subn(
              r'versionCode\s*=\s*\d+',
              f"versionCode = {os.environ['VERSION_CODE']}",
              text,
              count=1,
          )
          if app_count != 1 or version_count != 1:
              raise SystemExit('Could not apply Amain2 applicationId/versionCode exactly once')
          gradle.write_text(text)

          strings = Path('app/src/main/res/values/strings.xml')
          if strings.exists():
              value = strings.read_text()
              value, changed = re.subn(
                  r'(<string\s+name="app_name"[^>]*>)(.*?)(</string>)',
                  r'\1Miyorare Amain2\3',
                  value,
                  count=1,
                  flags=re.S,
              )
              if changed == 1:
                  strings.write_text(value)
          PY

          echo "Amain2 versionCode: $VERSION_CODE"
          grep -F "applicationId = 'org.noirero.miyorare.amain2'" app/build.gradle

      - name: Build permanently signed Amain2 APK
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          INCLUDE_DISCORD_SDK: ${{ inputs.include_discord_sdk }}
          DISCORD_APPLICATION_ID: ${{ inputs.discord_application_id }}
        run: |
          set -euo pipefail
          discord_args=()
          if [[ "$INCLUDE_DISCORD_SDK" == true ]]; then
            discord_args+=("-PdiscordSocialSdkAar=$RUNNER_TEMP/discord_partner_sdk.aar")
            discord_args+=("-PdiscordPresenceAppId=$DISCORD_APPLICATION_ID")
          fi
          ./gradlew assembleRelease --max-workers=4 --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=../release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            "${discord_args[@]}"

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No release APK produced"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "artifact/Miyorare-Amain2-$(basename "$apk")"
          done

      - name: Upload Amain2 staging APK
        if: ${{ !inputs.include_discord_sdk }}
        uses: actions/upload-artifact@v4
        with:
          name: Miyorare-Amain2-APK
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Verify Discord SDK, staging identity, and permanent APK signature
        if: inputs.include_discord_sdk
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          expected_signer=$(keytool -exportcert -keystore release.keystore -storepass:env RELEASE_STORE_PASSWORD \
            -alias "$RELEASE_KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)

          for apk in artifact/*.apk; do
            package_name=$("$build_tools/aapt2" dump packagename "$apk")
            if [[ "$package_name" != org.noirero.miyorare.amain2 ]]; then
              echo '::error::The APK package name does not match the Amain2 staging identity.'
              exit 1
            fi
            signer_report="$RUNNER_TEMP/amain2-apk-signers.txt"
            if ! "$build_tools/apksigner" verify --print-certs-pem "$apk" > "$signer_report"; then
              echo '::error::Android apksigner rejected the APK signature.'
              exit 1
            fi
            python3 - "$apk" "$signer_report" "$expected_signer" <<'PY'
          import base64
          import hashlib
          import re
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          apk_path, signer_report, expected_signer = sys.argv[1:]
          certificates = re.findall(
              rb"-----BEGIN CERTIFICATE-----\s+(.*?)-----END CERTIFICATE-----",
              Path(signer_report).read_bytes(),
              flags=re.DOTALL,
          )
          signers = {hashlib.sha256(base64.b64decode(cert)).hexdigest() for cert in certificates}
          if signers != {expected_signer}:
              raise SystemExit("APK signer does not match the permanent Amain2 release certificate.")

          abis = ("arm64-v8a", "armeabi-v7a", "x86", "x86_64")
          libraries = ("libdiscord_partner_sdk.so", "libmiyorare_discord_sdk.so")
          with ZipFile(apk_path) as apk:
              entries = set(apk.namelist())
              for abi in abis:
                  for library in libraries:
                      entry = f"lib/{abi}/{library}"
                      if entry not in entries:
                          raise SystemExit(f"Missing Discord native library: {entry}")
                      with apk.open(entry) as binary:
                          if binary.read(4) != b"\x7fELF":
                              raise SystemExit(f"Invalid Discord native library: {entry}")
          PY
            echo "Verified staging package, permanent signer, and Discord SDK for all four ABIs."
          done

      - name: Encrypt staging APK for phone testing
        if: inputs.include_discord_sdk
        shell: bash
        env:
          APK_TEST_PASSWORD: ${{ secrets.AMAIN2_DISCORD_APK_PASSWORD }}
        run: |
          set -euo pipefail
          cd artifact
          7z a -tzip -mem=AES256 "-p$APK_TEST_PASSWORD" Miyorare-Amain2-Discord-test.zip ./*.apk
          7z t "-p$APK_TEST_PASSWORD" Miyorare-Amain2-Discord-test.zip

      - name: Upload protected Discord staging APK
        if: inputs.include_discord_sdk
        uses: actions/upload-artifact@v4
        with:
          name: Miyorare-Amain2-Discord-test
          path: artifact/Miyorare-Amain2-Discord-test.zip
          if-no-files-found: error
          retention-days: 3
