name: README Release Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-release-stats
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh release stats
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Refresh native README release stats
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'miyorare-readme-stats',
          }

          releases = []
          page = 1
          while True:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/releases?per_page=100&page={page}',
                  headers=headers,
              )
              with urllib.request.urlopen(req) as response:
                  batch = json.load(response)
              releases.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          stable = next((r for r in releases if not r['draft'] and not r['prerelease']), None)
          if stable is None:
              raise SystemExit('No stable release found')

          downloads = sum(
              asset.get('download_count', 0)
              for release in releases
              for asset in release.get('assets', [])
          )

          path = Path('README.md')
          text = path.read_text()
          start = '<!-- RELEASE_STATS_START -->'
          end = '<!-- RELEASE_STATS_END -->'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('README release stats markers are missing or duplicated')

          tag = stable['tag_name']
          block = f'''{start}
          <p align="center">
            <a href="https://github.com/{repo}/releases/latest"><strong>Rilis terbaru: {tag}</strong></a>
            &nbsp;•&nbsp;
            <a href="https://github.com/{repo}/releases"><strong>Unduhan: {downloads}</strong></a>
            &nbsp;•&nbsp;
            <a href="LICENSE"><strong>Lisensi: GPL-3.0</strong></a>
          </p>
          {end}'''

          before, remainder = text.split(start, 1)
          _, after = remainder.split(end, 1)
          path.write_text(before + block + after)
          PY

      - name: Open update PR when stats changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README release stats are already current."
            exit 0
          fi

          branch="automation/readme-release-stats"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add README.md
          git commit -m "Update README release stats"
          git push --force-with-lease origin "HEAD:$branch"

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "Update README release stats" \
              --body "Automated lightweight refresh of the native README release version and total GitHub Release asset downloads. No application code is changed."
          fi
