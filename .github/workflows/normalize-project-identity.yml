name: Normalize project identity

on:
  push:
    branches:
      - remove-legacy-upstream-linkage

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-legacy-upstream-linkage
          fetch-depth: 0

      - name: Normalize legacy naming and owned links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          contiguous = "Drop" + "Sauce"
          patterns = [
              re.compile(re.escape(contiguous), re.IGNORECASE),
              re.compile(r"drop[- ]sauce", re.IGNORECASE),
          ]

          def repl(match):
              value = match.group(0)
              if value.isupper():
                  return "MIYORARE"
              if value.islower():
                  return "miyorare"
              return "Miyorare"

          tracked = [p for p in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0") if p]
          helper = ".github/workflows/normalize-project-identity.yml"
          for raw in tracked:
              if raw == helper:
                  continue
              path = Path(raw)
              try:
                  text = path.read_bytes().decode("utf-8")
              except (UnicodeDecodeError, FileNotFoundError, IsADirectoryError):
                  continue
              updated = text
              for pattern in patterns:
                  updated = pattern.sub(repl, updated)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          # Remove the obsolete upstream attribution entirely instead of inventing a renamed project.
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace(
              "Miyorare dikembangkan dari [Miyorare](https://github.com/HuzaifaKhalid1311/Miyorare) dan berdiri di atas karya komunitas open-source Android manga reader.\n",
              "Miyorare berdiri di atas karya komunitas open-source Android manga reader.\n",
          )
          text = text.replace("- [Miyorare](https://github.com/HuzaifaKhalid1311/Miyorare)\n", "")
          readme.write_text(text, encoding="utf-8")

          # Point project-owned UI links to the Miyorare repository until a dedicated site/manual exists.
          constants = Path("app/src/main/res/values/constants.xml")
          text = constants.read_text(encoding="utf-8")
          text = re.sub(
              r'<string name="url_miyorare_website" translatable="false">.*?</string>',
              '<string name="url_miyorare_website" translatable="false">https://github.com/Noirero/Miyorare</string>',
              text,
          )
          text = re.sub(
              r'<string name="url_user_manual" translatable="false">.*?</string>',
              '<string name="url_user_manual" translatable="false">https://github.com/Noirero/Miyorare#readme</string>',
              text,
          )
          constants.write_text(text, encoding="utf-8")

          id_settings = Path("app/src/main/res/values-in/settings_language_stage3.xml")
          text = id_settings.read_text(encoding="utf-8")
          text = re.sub(
              r'<string name="url_user_manual">.*?</string>',
              '<string name="url_user_manual">https://github.com/Noirero/Miyorare#readme</string>',
              text,
          )
          id_settings.write_text(text, encoding="utf-8")

          about = Path("app/src/main/res/values/about_redesign.xml")
          text = about.read_text(encoding="utf-8").replace(
              '<string name="about_user_manual_summary">Miyorare upstream user guide</string>',
              '<string name="about_user_manual_summary">Miyorare user guide</string>',
          )
          about.write_text(text, encoding="utf-8")

          about_id = Path("app/src/main/res/values-in/about_redesign.xml")
          text = about_id.read_text(encoding="utf-8").replace(
              '<string name="about_user_manual_summary">Panduan Miyorare upstream</string>',
              '<string name="about_user_manual_summary">Panduan pengguna Miyorare</string>',
          )
          about_id.write_text(text, encoding="utf-8")
          PY

          git rm -f .github/workflows/normalize-project-identity.yml
          git add -A

          # Fail closed on any active tracked reference to the former upstream or its owner identity.
          if git grep -ni -I -E 'dropsauce|drop-sauce|drop sauce|HuzaifaKhalid1311' -- .; then
            echo "Former upstream reference remains in tracked content" >&2
            exit 1
          fi
          if git ls-files | grep -Ei 'dropsauce|drop-sauce|drop sauce'; then
            echo "Former upstream reference remains in tracked path" >&2
            exit 1
          fi

          git commit -m "Normalize Miyorare project identity"
          git push origin HEAD:remove-legacy-upstream-linkage
