name: PF5 Sync Beta Final

on:
  push:
    branches:
      - pf5

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Merge latest beta into PF5 working tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "pf5"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin beta
          set +e
          git merge --no-ff --no-commit origin/beta
          MERGE_RC=$?
          set -e
          if [ "$MERGE_RC" -ne 0 ]; then
            echo '::error::Merge conflicts detected:'
            git diff --name-only --diff-filter=U
            exit "$MERGE_RC"
          fi
          git status --short
          git diff --check
          git commit -m 'Sync latest beta into pf5 while preserving Private'
          echo "MERGED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION=$(grep 'parsers = ' gradle/libs.versions.toml | sed 's/.*= "\(.*\)"/\1/')
          POM_URL="https://jitpack.io/com/github/YakaTeam/kotatsu-parsers/${PARSERS_VERSION}/kotatsu-parsers-${PARSERS_VERSION}.pom"
          for i in $(seq 1 10); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$POM_URL")
            if [ "$HTTP_STATUS" = "200" ]; then exit 0; fi
            sleep 15
          done
          exit 1

      - name: Compile all JVM unit tests
        run: ./gradlew :app:compileDebugUnitTestKotlin --no-daemon --stacktrace

      - name: Run Private and Beta affected tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests org.koitharu.kotatsu.main.ui.protect.ScreenshotPolicyHelperTest \
            --tests org.koitharu.kotatsu.reader.ui.tts.ReaderTtsPrivacyPolicyTest \
            --tests org.koitharu.kotatsu.history.data.TrackingProgressPolicyTest

      - name: Check changed-file lint inventory
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintPreview --no-daemon --stacktrace
          LINT_RC=$?
          set -e
          REPORT="app/build/intermediates/lint_intermediate_text_report/preview/lintReportPreview/lint-results-preview.txt"
          test -f "$REPORT"
          echo "lint exit code: $LINT_RC"
          for f in \
            ScreenshotPolicyHelper.kt ReaderTtsService.kt ReaderActivity.kt DownloadWorker.kt \
            PrivateFavouritesSecurityStore.kt PrivateFavouritesDao.kt DetailsExpressiveActivity.kt \
            LibraryGroupsRepository.kt LibraryGroupDetailsViewModel.kt LibraryGroupReaderNavigationController.kt; do
            if grep -E "${f}:.*Error:" "$REPORT"; then
              echo "::error::Lint regression found in merged affected file: $f"
              exit 1
            fi
          done

      - name: Require stable signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build signed merged PF5 Preview APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assemblePreview --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=../release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Verify and collect merged APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/preview/output-metadata.json').read_text())
          actual = metadata.get('applicationId')
          expected = 'org.noirero.miyorare.beta'
          if actual != expected:
              raise SystemExit(f'Unexpected applicationId: {actual!r}')
          print(f'Verified applicationId: {actual}')
          PY
          APK=$(find app/build/outputs/apk/preview -name '*.apk' | head -n1)
          test -n "$APK"
          SHORT_SHA=$(git rev-parse --short HEAD)
          DEST="Miyorare-PF5-Merged-${SHORT_SHA}.apk"
          cp "$APK" "$DEST"
          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          echo "apk_name=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "### PF5 merged Beta + Private APK"
            echo ""
            echo "Merged source commit: \`$(git rev-parse HEAD)\`"
            echo "Beta source: \`$(git rev-parse origin/beta)\`"
            echo "File: \`$DEST\`"
            echo "Application ID: \`org.noirero.miyorare.beta\`"
            echo "SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged PF5 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Push validated merge to PF5
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:pf5
