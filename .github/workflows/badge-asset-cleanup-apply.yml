name: One-shot Exclusive Badge asset cleanup

on:
  push:
    branches:
      - fix/beta-badge-asset-cleanup-20260927
    paths:
      - tools/badge/clean_exclusive_badge_assets.py
      - .github/workflows/badge-asset-cleanup-apply.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Clean, normalize and regenerate payload
        run: |
          rm -rf .badge-cleanup-audit
          python tools/badge/clean_exclusive_badge_assets.py \
            --payload app/src/main/badge-assets/exclusive_badge_material_payload.b64 \
            --audit-dir .badge-cleanup-audit

      - name: Verify generated payload materializes
        run: ./gradlew :app:prepareExclusiveBadgeAssets --no-daemon

      - name: Upload static cleanup evidence
        uses: actions/upload-artifact@v4
        with:
          name: exclusive-badge-cleanup-evidence
          path: .badge-cleanup-audit
          if-no-files-found: error

      - name: Commit regenerated payload
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/badge-assets/exclusive_badge_material_payload.b64; then
            echo "Payload is already clean; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/badge-assets/exclusive_badge_material_payload.b64
          git commit -m "fix: clean and normalize Exclusive Badge assets"
          git push origin HEAD:fix/beta-badge-asset-cleanup-20260927
