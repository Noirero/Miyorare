name: Publish Miyorare Source Pack v0.2.0

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/publish-miyorare-source-pack-v020.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.ref_name == 'beta'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_VERSION: 0.2.0
      SOURCE_COMMIT: b23940dc02daa6a6d83f815b48f0d767e73e7ae5
      VERIFIED_RUN_ID: '34691857292'

    steps:
      - name: Download verified staging packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/id dist/en
          gh run download "$VERIFIED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name miyorare-id-staging --dir dist/id
          gh run download "$VERIFIED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name miyorare-en-staging --dir dist/en
          mv dist/id/miyorare-id.jar dist/miyorare-id.jar
          mv dist/id/miyorare-id.jar.sha256 dist/miyorare-id.jar.sha256
          mv dist/en/miyorare-en.jar dist/miyorare-en.jar
          mv dist/en/miyorare-en.jar.sha256 dist/miyorare-en.jar.sha256

      - name: Verify exact staged payload
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/miyorare-id.jar
          test -f dist/miyorare-en.jar
          test -f dist/miyorare-id.jar.sha256
          test -f dist/miyorare-en.jar.sha256
          (cd dist && sha256sum -c miyorare-id.jar.sha256)
          (cd dist && sha256sum -c miyorare-en.jar.sha256)

      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ['SOURCE_VERSION']
          tag = f'miyorare-sources-v{version}'
          packs = []
          for language in ('id', 'en'):
              asset = Path('dist') / f'miyorare-{language}.jar'
              data = asset.read_bytes()
              packs.append({
                  'pluginId': f'miyorare-{language}',
                  'language': language,
                  'assetName': asset.name,
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          manifest = {
              'schema': 1,
              'version': version,
              'tag': tag,
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'packs': packs,
          }
          Path('dist/miyorare-source-packs.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Publish immutable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG="miyorare-sources-v${SOURCE_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi
          gh release create "$TAG" \
            dist/miyorare-id.jar \
            dist/miyorare-en.jar \
            dist/miyorare-id.jar.sha256 \
            dist/miyorare-en.jar.sha256 \
            dist/miyorare-source-packs.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "Miyorare Source Packs v${SOURCE_VERSION}" \
            --notes "Official Miyorare-ID and Miyorare-EN source packs. ID: 29 runtime sources. EN: 65 runtime sources. Published byte-for-byte from successful Miyorare Source Pack Check run ${VERIFIED_RUN_ID}, source commit ${SOURCE_COMMIT}."
