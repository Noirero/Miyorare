name: Apply Novel Auto Translation Reader Guard

on:
  push:
    branches:
      - feature/novel-translation-auto-b5
    paths:
      - 'tools/novel_auto_b5_lifecycle_patch.py'
      - '.github/workflows/novel-auto-b5-lifecycle-apply.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    name: Apply guarded lifecycle patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/novel-translation-auto-b5
          fetch-depth: 0

      - name: Apply exact-match patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/novel_auto_b5_lifecycle_patch.py
          python tools/novel_auto_b5_lifecycle_patch.py
          git diff --check

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git config user.name 'Noirero'
          git config user.email '149634319+Noirero@users.noreply.github.com'
          git add \
            app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt \
            app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/translation/NovelAutoTranslationPolicy.kt \
            app/src/test/kotlin/org/koitharu/kotatsu/reader/ui/epub/translation/NovelAutoTranslationPolicyTest.kt
          git diff --cached --check
          git commit -m 'fix: gate automatic translation to active Reader'
          git push origin HEAD:${GITHUB_REF_NAME}
