name: Add chapter swipe read toggle

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/add-chapter-swipe-read-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add persistent per-chapter read toggle and swipe-right gesture
        shell: python
        run: |
          from pathlib import Path

          # 1) Persist explicit per-chapter read/unread overrides in AppSettings.
          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/AppSettings.kt')
          text = p.read_text()
          anchor = '''\tvar isTitleTapToReadEnabled: Boolean\n\t\tget() = prefs.getBoolean(KEY_TITLE_TAP_TO_READ, false)\n\t\tset(value) = prefs.edit { putBoolean(KEY_TITLE_TAP_TO_READ, value) }\n'''
          addition = anchor + '''\n\tfun getChapterReadOverrides(mangaId: Long): Map<Long, Boolean> {\n\t\tval key = "chapter_read_overrides_$mangaId"\n\t\treturn prefs.getStringSet(key, emptySet()).orEmpty().mapNotNull { entry ->\n\t\t\tval separator = entry.lastIndexOf(':')\n\t\t\tif (separator <= 0) return@mapNotNull null\n\t\t\tval chapterId = entry.substring(0, separator).toLongOrNull() ?: return@mapNotNull null\n\t\t\tval isRead = when (entry.substring(separator + 1)) {\n\t\t\t\t"1" -> true\n\t\t\t\t"0" -> false\n\t\t\t\telse -> return@mapNotNull null\n\t\t\t}\n\t\t\tchapterId to isRead\n\t\t}.toMap()\n\t}\n\n\tfun setChapterReadOverride(mangaId: Long, chapterId: Long, isRead: Boolean) {\n\t\tval key = "chapter_read_overrides_$mangaId"\n\t\tval prefix = "$chapterId:"\n\t\tval values = prefs.getStringSet(key, emptySet()).orEmpty().toMutableSet()\n\t\tvalues.removeAll { it.startsWith(prefix) }\n\t\tvalues.add(prefix + if (isRead) "1" else "0")\n\t\tprefs.edit { putStringSet(key, values) }\n\t}\n'''
          if anchor not in text:
              raise SystemExit('AppSettings insertion anchor not found')
          p.write_text(text.replace(anchor, addition, 1))

          # 2) Let chapter mapper honor explicit read overrides before history-derived state.
          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/details/ui/ChaptersMapper.kt')
          text = p.read_text()
          old_sig = '''\tisGrid: Boolean,\n\tisDownloadedOnly: Boolean,\n): List<ChapterListItem> {'''
          new_sig = '''\tisGrid: Boolean,\n\tisDownloadedOnly: Boolean,\n\treadOverrides: Map<Long, Boolean> = emptyMap(),\n): List<ChapterListItem> {'''
          if old_sig not in text:
              raise SystemExit('ChaptersMapper signature anchor not found')
          text = text.replace(old_sig, new_sig, 1)
          old_remote = '''\t\t\t\tisUnread = isUnread && !isCurrent,\n\t\t\t\tisNew = !isCurrent && isUnread && result.size >= newFrom,'''
          new_remote = '''\t\t\t\tisUnread = readOverrides[chapter.id]?.not() ?: (isUnread && !isCurrent),\n\t\t\t\tisNew = !isCurrent && isUnread && result.size >= newFrom,'''
          if old_remote not in text:
              raise SystemExit('Remote unread mapping anchor not found')
          text = text.replace(old_remote, new_remote, 1)
          old_local = '''\t\t\t\tisUnread = isUnread && !isCurrent,\n\t\t\t\tisNew = false,'''
          new_local = '''\t\t\t\tisUnread = readOverrides[chapter.id]?.not() ?: (isUnread && !isCurrent),\n\t\t\t\tisNew = false,'''
          if old_local not in text:
              raise SystemExit('Local unread mapping anchor not found')
          text = text.replace(old_local, new_local, 1)
          p.write_text(text)

          # 3) Keep override state in the VM and expose a toggle operation.
          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/ChaptersPagesViewModel.kt')
          text = p.read_text()
          old_state = '''\tval isDownloadedOnly = MutableStateFlow(false)\n'''
          new_state = '''\tval isDownloadedOnly = MutableStateFlow(false)\n\tprivate val chapterReadOverrides = MutableStateFlow<Map<Long, Boolean>>(emptyMap())\n'''
          if old_state not in text:
              raise SystemExit('VM state anchor not found')
          text = text.replace(old_state, new_state, 1)

          old_combine = '''\t\tcombine(\n\t\t\tmangaDetails,\n\t\t\treadingState.map { it?.chapterId ?: 0L }.distinctUntilChanged(),\n\t\t\tselectedBranch,\n\t\t\tnewChaptersCount,\n\t\t\tbookmarks,\n\t\t\tisChaptersInGridView,\n\t\t\tisDownloadedOnly,\n\t\t) { manga, currentChapterId, branch, news, bookmarks, grid, downloadedOnly ->\n\t\t\tmanga?.mapChapters(\n\t\t\t\tcurrentChapterId = currentChapterId,\n\t\t\t\tnewCount = news,\n\t\t\t\tbranch = branch,\n\t\t\t\tbookmarks = bookmarks,\n\t\t\t\tisGrid = grid,\n\t\t\t\tisDownloadedOnly = downloadedOnly,\n\t\t\t).orEmpty()\n\t\t},'''
          new_combine = '''\t\tcombine(\n\t\t\tmangaDetails.combine(chapterReadOverrides) { manga, overrides -> manga to overrides },\n\t\t\treadingState.map { it?.chapterId ?: 0L }.distinctUntilChanged(),\n\t\t\tselectedBranch,\n\t\t\tnewChaptersCount,\n\t\t\tbookmarks,\n\t\t\tisChaptersInGridView,\n\t\t\tisDownloadedOnly,\n\t\t) { mangaWithOverrides, currentChapterId, branch, news, bookmarks, grid, downloadedOnly ->\n\t\t\tval (manga, overrides) = mangaWithOverrides\n\t\t\tmanga?.mapChapters(\n\t\t\t\tcurrentChapterId = currentChapterId,\n\t\t\t\tnewCount = news,\n\t\t\t\tbranch = branch,\n\t\t\t\tbookmarks = bookmarks,\n\t\t\t\tisGrid = grid,\n\t\t\t\tisDownloadedOnly = downloadedOnly,\n\t\t\t\treadOverrides = overrides,\n\t\t\t).orEmpty()\n\t\t},'''
          if old_combine not in text:
              raise SystemExit('VM chapters combine anchor not found')
          text = text.replace(old_combine, new_combine, 1)

          old_init = '''\tinit {\n\t\tlaunchJob(Dispatchers.Default) {\n\t\t\tlocalStorageChanges\n\t\t\t\t.collect { onDownloadComplete(it) }\n\t\t}\n'''
          new_init = '''\tinit {\n\t\tlaunchJob(Dispatchers.Default) {\n\t\t\tmangaDetails.map { it?.id }.distinctUntilChanged().filterNotNull().collect { mangaId ->\n\t\t\t\tchapterReadOverrides.value = settings.getChapterReadOverrides(mangaId)\n\t\t\t}\n\t\t}\n\t\tlaunchJob(Dispatchers.Default) {\n\t\t\tlocalStorageChanges\n\t\t\t\t.collect { onDownloadComplete(it) }\n\t\t}\n'''
          if old_init not in text:
              raise SystemExit('VM init anchor not found')
          text = text.replace(old_init, new_init, 1)

          old_mark = '''\tfun markChapterAsCurrent(chapterId: Long) {\n'''
          toggle = '''\tfun toggleChapterReadState(chapterId: Long) {\n\t\tval item = chapters.value.firstOrNull { it.chapter.id == chapterId } ?: return\n\t\tval mangaId = mangaDetails.value?.id ?: return\n\t\tval markRead = item.isUnread\n\t\tsettings.setChapterReadOverride(mangaId, chapterId, markRead)\n\t\tchapterReadOverrides.update { current -> current + (chapterId to markRead) }\n\t}\n\n\tfun markChapterAsCurrent(chapterId: Long) {\n'''
          if old_mark not in text:
              raise SystemExit('VM toggle insertion anchor not found')
          text = text.replace(old_mark, toggle, 1)
          p.write_text(text)

          # 4) Swipe right only on actual list chapter rows, never headers/grid rows.
          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/chapters/ChaptersFragment.kt')
          text = p.read_text()
          old_import = 'import androidx.recyclerview.widget.LinearLayoutManager\n'
          new_import = old_import + 'import androidx.recyclerview.widget.ItemTouchHelper\n'
          if old_import not in text:
              raise SystemExit('Fragment import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_attach = '''\t\t\tadapter = chaptersAdapter\n\t\t\tChapterGridSpanHelper.attach(this)\n\t\t}\n'''
          new_attach = '''\t\t\tadapter = chaptersAdapter\n\t\t\tChapterGridSpanHelper.attach(this)\n\t\t\tItemTouchHelper(object : ItemTouchHelper.SimpleCallback(0, ItemTouchHelper.RIGHT) {\n\t\t\t\toverride fun getSwipeDirs(recyclerView: RecyclerView, viewHolder: RecyclerView.ViewHolder): Int {\n\t\t\t\t\tval position = viewHolder.bindingAdapterPosition\n\t\t\t\t\tval item = chaptersAdapter?.items?.getOrNull(position) as? ChapterListItem\n\t\t\t\t\treturn if (item != null && !item.isGrid) ItemTouchHelper.RIGHT else 0\n\t\t\t\t}\n\n\t\t\t\toverride fun onMove(\n\t\t\t\t\trecyclerView: RecyclerView,\n\t\t\t\t\tviewHolder: RecyclerView.ViewHolder,\n\t\t\t\t\ttarget: RecyclerView.ViewHolder,\n\t\t\t\t): Boolean = false\n\n\t\t\t\toverride fun onSwiped(viewHolder: RecyclerView.ViewHolder, direction: Int) {\n\t\t\t\t\tval position = viewHolder.bindingAdapterPosition\n\t\t\t\t\tval adapter = chaptersAdapter ?: return\n\t\t\t\t\tval item = adapter.items.getOrNull(position) as? ChapterListItem\n\t\t\t\t\tif (item != null) {\n\t\t\t\t\t\tviewModel.toggleChapterReadState(item.chapter.id)\n\t\t\t\t\t}\n\t\t\t\t\tif (position != RecyclerView.NO_POSITION) {\n\t\t\t\t\t\tadapter.notifyItemChanged(position)\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}).attachToRecyclerView(this)\n\t\t}\n'''
          if old_attach not in text:
              raise SystemExit('Fragment swipe insertion anchor not found')
          text = text.replace(old_attach, new_attach, 1)
          p.write_text(text)

      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/AppSettings.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/details/ui/ChaptersMapper.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/ChaptersPagesViewModel.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/details/ui/pager/chapters/ChaptersFragment.kt
          git commit -m "Add swipe-right chapter read toggle"
          git push
