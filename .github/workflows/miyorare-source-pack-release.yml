name: Miyorare Source Pack Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/miyorare-source-pack-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Source pack version (for example 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: miyorare-source-pack-release
  cancel-in-progress: false

jobs:
  build-pack:
    name: Build Miyorare-${{ matrix.pack }}
    if: github.ref_name == 'beta'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: [id, en]

    steps:
      - name: Checkout Miyorare beta
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Verify release branch and version
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "beta" || {
            echo "::error::Official source packs may only be released from beta."
            exit 1
          }
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Version must use MAJOR.MINOR.PATCH."
            exit 1
          }

      - name: Checkout pinned UMA source
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: a0ebc9ffc7de02b7b50cbcb620092d0a9263c785
          path: _upstream/uma
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare curated source pack
        run: |
          python3 extensions/miyorare-sources/tools/prepare_pack.py \
            --manifest extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}'

      - name: Build dexed Tsuki plugin
        working-directory: _upstream/uma
        run: |
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon

      - name: Verify and finalize artifact
        run: |
          python3 extensions/miyorare-sources/tools/finalize_pack.py \
            --manifest extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}' \
            --output build/miyorare-source-packs/${{ matrix.pack }}

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: miyorare-${{ matrix.pack }}-release
          path: build/miyorare-source-packs/${{ matrix.pack }}/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish official source packs
    needs: build-pack
    if: github.ref_name == 'beta'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Download verified packs
        uses: actions/download-artifact@v5
        with:
          pattern: miyorare-*-release
          path: dist
          merge-multiple: true

      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          TAG="miyorare-sources-v${SOURCE_VERSION}"
          [[ "${SOURCE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f dist/miyorare-id.jar
          test -f dist/miyorare-en.jar
          test -f dist/miyorare-id.jar.sha256
          test -f dist/miyorare-en.jar.sha256
          (cd dist && sha256sum -c miyorare-id.jar.sha256)
          (cd dist && sha256sum -c miyorare-en.jar.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Source-pack releases are immutable."
            exit 1
          fi

      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ['SOURCE_VERSION']
          tag = f'miyorare-sources-v{version}'
          packs = []
          for language in ('id', 'en'):
              asset = Path('dist') / f'miyorare-{language}.jar'
              data = asset.read_bytes()
              packs.append({
                  'pluginId': f'miyorare-{language}',
                  'language': language,
                  'assetName': asset.name,
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          manifest = {
              'schema': 1,
              'version': version,
              'tag': tag,
              'sourceCommit': os.environ['GITHUB_SHA'],
              'packs': packs,
          }
          Path('dist/miyorare-source-packs.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Publish immutable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG="miyorare-sources-v${SOURCE_VERSION}"
          gh release create "$TAG" \
            dist/miyorare-id.jar \
            dist/miyorare-en.jar \
            dist/miyorare-id.jar.sha256 \
            dist/miyorare-en.jar.sha256 \
            dist/miyorare-source-packs.json \
            --target "$GITHUB_SHA" \
            --title "Miyorare Source Packs v${SOURCE_VERSION}" \
            --notes "Official Miyorare-ID and Miyorare-EN source packs. Built and verified from beta commit ${GITHUB_SHA}."
