name: Apply fast novel fix
on:
  push:
    branches: [fix/amain2-fast-downloaded-novel-reader]
    paths: [.github/workflows/apply-fast-novel-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/amain2-fast-downloaded-novel-reader
      - name: Apply source edit
        run: echo '' | base64 -d | python
      - name: Commit source fix
        run: |
          git config user.name LatishaLIFE
          git config user.email 149634319+Noirero@users.noreply.github.com
          git add app/src/main/kotlin/org/koitharu/kotatsu/local/data/LocalMangaRepository.kt
          git diff --cached --check
          git commit -m 'Resolve fast novel chapters to EPUB content'
          git push origin HEAD:fix/amain2-fast-downloaded-novel-reader
