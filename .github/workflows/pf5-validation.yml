name: PF5 Validation

on:
  push:
    branches:
      - pf5

permissions:
  contents: read

concurrency:
  group: pf5-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Map private package references
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout pf5
        uses: actions/checkout@v5

      - name: Verify branch
        run: test "${GITHUB_REF_NAME}" = "pf5"

      - name: Map invalid package references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Files in invalid package directory ==='
          find app/src -type f -path '*/org/koitharu/kotatsu/favourites/private/*' -print | sort
          echo '=== Source references ==='
          grep -R -n --include='*.kt' --include='*.java' 'org\.koitharu\.kotatsu\.favourites\.private\|package org\.koitharu\.kotatsu\.favourites\.private' app/src || true
          echo '=== Short symbol references ==='
          grep -R -n --include='*.kt' --include='*.java' 'PrivateFavouritesSecurityStore\|PrivateFavouritesSession\|PrivateFavouritesProtection' app/src || true
          exit 1
