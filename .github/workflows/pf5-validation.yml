name: PF5 Validation

on:
  push:
    branches:
      - pf5

permissions:
  contents: write

concurrency:
  group: pf5-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile and assemble pf5
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout pf5
        uses: actions/checkout@v5

      - name: Verify branch
        run: test "${GITHUB_REF_NAME}" = "pf5"

      - name: Fix invalid Private package if present
        shell: bash
        run: |
          set -euo pipefail
          OLD_DIR='app/src/main/kotlin/org/koitharu/kotatsu/favourites/private'
          NEW_DIR='app/src/main/kotlin/org/koitharu/kotatsu/favourites/vault'
          OLD_PKG='org.koitharu.kotatsu.favourites.private'
          NEW_PKG='org.koitharu.kotatsu.favourites.vault'

          if [ -d "$OLD_DIR" ]; then
            mkdir -p "$(dirname "$NEW_DIR")"
            git mv "$OLD_DIR" "$NEW_DIR"
            while IFS= read -r -d '' file; do
              if grep -qF "$OLD_PKG" "$file"; then
                sed -i "s/${OLD_PKG//./\\.}/${NEW_PKG//./\\.}/g" "$file"
              fi
            done < <(find app/src -type f \( -name '*.kt' -o -name '*.java' \) -print0)
          fi

          if grep -R -n --include='*.kt' --include='*.java' "$OLD_PKG" app/src; then
            echo '::error::Stale invalid package reference remains.'
            exit 1
          fi

      - name: Apply verified compiler fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          auto_fix = Path('app/src/main/kotlin/org/koitharu/kotatsu/alternatives/ui/AutoFixService.kt')
          text = auto_fix.read_text()
          old = 'mangaId?.let(::isPrivateOnly)'
          new = 'mangaId?.let { id -> isPrivateOnly(id) }'
          if old in text:
              auto_fix.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('AutoFixService expected privacy expression not found')

          backup = Path('app/src/main/kotlin/org/koitharu/kotatsu/backup/local/data/LocalBackupRepository.kt')
          text = backup.read_text()
          broken = '''\tprivate suspend fun removeEmptyReadLaterCategory() {
\t\trunCatchingCancellable {
\t\t\tval readLaterTitle = context.getString(R.string.read_later)
\t\t\tval dao = database.getFavouriteCategoriesDao()
\t\t\tval readLater = dao.findAll().firstOrNull { it.title == readLaterTitle } ?: return
\t\t\tif (database.getFavouritesDao().findAll(readLater.categoryId.toLong()).isEmpty()) {
\t\t\t\tdao.delete(readLater.categoryId.toLong())
\t\t\t}
\t}
'''
          fixed = '''\tprivate suspend fun removeEmptyReadLaterCategory() {
\t\trunCatchingCancellable {
\t\t\tval readLaterTitle = context.getString(R.string.read_later)
\t\t\tval dao = database.getFavouriteCategoriesDao()
\t\t\tval readLater = dao.findAll().firstOrNull { it.title == readLaterTitle } ?: return
\t\t\tif (database.getFavouritesDao().findAll(readLater.categoryId.toLong()).isEmpty()) {
\t\t\t\tdao.delete(readLater.categoryId.toLong())
\t\t\t}
\t\t}
\t}
'''
          if broken in text:
              backup.write_text(text.replace(broken, fixed, 1))
          elif fixed not in text:
              raise SystemExit('LocalBackupRepository expected broken/fixed block not found')
          PY

          if ! git diff --quiet -- app/src; then
            git config user.name 'Noirero'
            git config user.email '149634319+Noirero@users.noreply.github.com'
            git add app/src
            git commit -m 'Fix pf5 compile blockers found by validation'
            git push origin HEAD:pf5
          else
            echo 'Verified compile fixes already applied.'
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION=$(grep 'parsers = ' gradle/libs.versions.toml | sed 's/.*= "\(.*\)"/\1/')
          POM_URL="https://jitpack.io/com/github/YakaTeam/kotatsu-parsers/${PARSERS_VERSION}/kotatsu-parsers-${PARSERS_VERSION}.pom"
          for i in $(seq 1 10); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$POM_URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "kotatsu-parsers:${PARSERS_VERSION} ready"
              exit 0
            fi
            echo "Attempt $i returned HTTP ${HTTP_STATUS}"
            sleep 15
          done
          echo "::error::Parser dependency unavailable from JitPack"
          exit 1

      - name: Compile Preview Kotlin
        run: ./gradlew :app:compilePreviewKotlin --no-daemon --stacktrace

      - name: Assemble unsigned Preview APK
        run: ./gradlew :app:assemblePreview --no-daemon --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/preview -name '*.apk' -type f | head -n1)
          test -n "$APK"
          echo "Validated APK: $APK"
          sha256sum "$APK"
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/preview/output-metadata.json').read_text())
          expected = 'org.noirero.miyorare.beta'
          actual = metadata.get('applicationId')
          if actual != expected:
              raise SystemExit(f'applicationId={actual!r}, expected {expected!r}')
          print(f'Validated applicationId: {actual}')
          PY
