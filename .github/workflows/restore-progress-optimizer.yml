name: Improve Local Restore Progress

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/restore-progress-optimizer.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Add live restore progress and skip duplicate manga writes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Expected block not found: {label}')
              return text.replace(old, new, 1)

          repo = Path('app/src/main/kotlin/org/koitharu/kotatsu/backup/local/data/LocalBackupRepository.kt')
          text = repo.read_text()
          text = replace_once(
              text,
              '''\tsuspend fun restoreBackup(\n\t\tinput: ZipInputStream,\n\t\tsections: Set<BackupSection>,\n\t\tprogress: FlowCollector<Progress>?,\n\t): CompositeResult {''',
              '''\tsuspend fun restoreBackup(\n\t\tinput: ZipInputStream,\n\t\tsections: Set<BackupSection>,\n\t\tprogress: FlowCollector<Progress>?,\n\t\titemProgress: (suspend (BackupSection, Int) -> Unit)? = null,\n\t): CompositeResult {''',
              'restoreBackup signature',
          )

          start = text.index('\tsuspend fun restoreBackup(')
          end = text.index('\n\tprivate suspend fun <T> ZipOutputStream.writeJsonArray', start)
          region = text[start:end]
          region = replace_once(
              region,
              '\t\tvar result = CompositeResult.EMPTY\n',
              '\t\tvar result = CompositeResult.EMPTY\n\t\tval restoredMangaIds = HashSet<Long>()\n',
              'restore manga cache',
          )
          region = replace_once(
              region,
              '''\t\t\tif (section in sections) {\n\t\t\t\tresult += when (section) {''',
              '''\t\t\tif (section in sections) {\n\t\t\t\tvar sectionProcessed = 0\n\t\t\t\titemProgress?.invoke(section, sectionProcessed)\n\t\t\t\tsuspend fun reportProcessed(count: Int) {\n\t\t\t\t\tsectionProcessed += count\n\t\t\t\t\titemProgress?.invoke(section, sectionProcessed)\n\t\t\t\t}\n\t\t\t\tresult += when (section) {''',
              'section live progress',
          )
          region = region.replace(
              '.restoreToDb {',
              '.restoreToDb(onBatchProcessed = { count -> reportProcessed(count) }) {',
          )
          region = region.replace(
              'upsertMangaBackup(it.manga)',
              'upsertMangaBackupOnce(it.manga, restoredMangaIds)',
          )
          region = replace_once(
              region,
              'BackupSection.MANGA_PREFS -> restoreMangaPrefs(input)',
              'BackupSection.MANGA_PREFS -> restoreMangaPrefs(\n\t\t\t\t\t\tinput,\n\t\t\t\t\t\trestoredMangaIds,\n\t\t\t\t\t\tonBatchProcessed = { count -> reportProcessed(count) },\n\t\t\t\t\t)',
              'manga prefs live progress',
          )
          region = replace_once(
              region,
              '\t\t\t\tprogress?.emit(commonProgress)\n\t\t\t\tcommonProgress++\n',
              '\t\t\t\tcommonProgress++\n\t\t\t\tprogress?.emit(commonProgress)\n',
              'section progress order',
          )
          text = text[:start] + region + text[end:]

          prefs_start = text.index('\tprivate suspend fun restoreMangaPrefs(')
          prefs_end = text.index('\n\tprivate suspend fun removeEmptyReadLaterCategory', prefs_start)
          old_prefs = text[prefs_start:prefs_end]
          new_prefs = '''\tprivate suspend fun restoreMangaPrefs(\n\t\tinput: InputStream,\n\t\trestoredMangaIds: MutableSet<Long>,\n\t\tonBatchProcessed: suspend (Int) -> Unit,\n\t): CompositeResult {\n\t\tvar result = CompositeResult.EMPTY\n\t\tval items = input.readJsonArray<MangaPrefsBackup>(serializer())\n\t\tfor (batch in items.chunked(RESTORE_DB_BATCH_SIZE)) {\n\t\t\tval prepared = ArrayList<Pair<MangaPrefsBackup, String?>>(batch.size)\n\t\t\tfor (item in batch) {\n\t\t\t\tval preparation = runCatchingCancellable {\n\t\t\t\t\tval prefs = item.prefs\n\t\t\t\t\tval currentCover = database.getPreferencesDao().find(prefs.mangaId)?.coverUrlOverride\n\t\t\t\t\tval resolvedCover = when {\n\t\t\t\t\t\tprefs.coverData != null -> coverCodec.materialize(\n\t\t\t\t\t\t\tmangaId = prefs.mangaId,\n\t\t\t\t\t\t\tcoverData = prefs.coverData,\n\t\t\t\t\t\t\tcoverFileExtension = prefs.coverFileExtension,\n\t\t\t\t\t\t\tpreviousUrl = currentCover,\n\t\t\t\t\t\t) ?: currentCover\n\t\t\t\t\t\tcoverCodec.isPortableCoverUrl(prefs.coverUrlOverride) -> prefs.coverUrlOverride\n\t\t\t\t\t\telse -> currentCover\n\t\t\t\t\t}\n\t\t\t\t\titem to resolvedCover\n\t\t\t\t}\n\t\t\t\tif (preparation.isSuccess) {\n\t\t\t\t\tprepared += preparation.getOrThrow()\n\t\t\t\t} else {\n\t\t\t\t\tresult += preparation\n\t\t\t\t}\n\t\t\t}\n\t\t\tif (prepared.isNotEmpty()) {\n\t\t\t\tval batchRestore = runCatchingCancellable {\n\t\t\t\t\tdatabase.withTransaction {\n\t\t\t\t\t\tfor ((item, resolvedCover) in prepared) {\n\t\t\t\t\t\t\tdatabase.upsertMangaBackupOnce(item.manga, restoredMangaIds)\n\t\t\t\t\t\t\tdatabase.getPreferencesDao().upsert(item.prefs.toEntity(resolvedCover))\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tif (batchRestore.isSuccess) {\n\t\t\t\t\trepeat(prepared.size) { result += Result.success(Unit) }\n\t\t\t\t} else {\n\t\t\t\t\tfor ((item, resolvedCover) in prepared) {\n\t\t\t\t\t\tresult += runCatchingCancellable {\n\t\t\t\t\t\t\tdatabase.withTransaction {\n\t\t\t\t\t\t\t\tdatabase.upsertMangaBackupOnce(item.manga, restoredMangaIds)\n\t\t\t\t\t\t\t\tdatabase.getPreferencesDao().upsert(item.prefs.toEntity(resolvedCover))\n\t\t\t\t\t\t\t}\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\t\t\tonBatchProcessed(batch.size)\n\t\t}\n\t\treturn result\n\t}\n'''
          text = text[:prefs_start] + new_prefs + text[prefs_end:]

          marker = '''\tprivate suspend fun MangaDatabase.upsertMangaBackup(manga: MangaBackup) {\n\t\tval tags = manga.tags.map { it.toEntity() }\n\t\tif (tags.isNotEmpty()) getTagsDao().upsert(tags)\n\t\tgetMangaDao().upsert(manga.toEntity(), tags)\n\t}\n'''
          helper = marker + '''\n\tprivate suspend fun MangaDatabase.upsertMangaBackupOnce(\n\t\tmanga: MangaBackup,\n\t\trestoredMangaIds: MutableSet<Long>,\n\t) {\n\t\tif (!restoredMangaIds.add(manga.id)) return\n\t\ttry {\n\t\t\tupsertMangaBackup(manga)\n\t\t} catch (error: Throwable) {\n\t\t\trestoredMangaIds.remove(manga.id)\n\t\t\tthrow error\n\t\t}\n\t}\n'''
          text = replace_once(text, marker, helper, 'upsertMangaBackupOnce helper')

          helper_start = text.index('\tprivate suspend inline fun <T> Sequence<T>.restoreToDb(')
          helper_end = text.index('\n\tprivate fun restoreAppSettings', helper_start)
          new_restore_helper = '''\tprivate suspend fun <T> Sequence<T>.restoreToDb(\n\t\tonBatchProcessed: suspend (Int) -> Unit = {},\n\t\tblock: suspend MangaDatabase.(T) -> Unit,\n\t): CompositeResult {\n\t\tvar result = CompositeResult.EMPTY\n\t\tfor (batch in chunked(RESTORE_DB_BATCH_SIZE)) {\n\t\t\tval batchRestore = runCatchingCancellable {\n\t\t\t\tdatabase.withTransaction {\n\t\t\t\t\tfor (item in batch) {\n\t\t\t\t\t\tdatabase.block(item)\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\t\t\tif (batchRestore.isSuccess) {\n\t\t\t\trepeat(batch.size) { result += Result.success(Unit) }\n\t\t\t} else {\n\t\t\t\tfor (item in batch) {\n\t\t\t\t\tresult += runCatchingCancellable {\n\t\t\t\t\t\tdatabase.withTransaction { database.block(item) }\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\t\t\tonBatchProcessed(batch.size)\n\t\t}\n\t\treturn result\n\t}\n'''
          text = text[:helper_start] + new_restore_helper + text[helper_end:]
          repo.write_text(text)

          tracker = Path('app/src/main/kotlin/org/koitharu/kotatsu/backup/BackupOperationTracker.kt')
          text = tracker.read_text()
          text = replace_once(
              text,
              '''\t\tdata class Running(\n\t\t\tval id: Long,\n\t\t\tval kind: Kind,\n\t\t\t@StringRes val stageRes: Int,\n\t\t\tval progress: Progress,\n\t\t) : State''',
              '''\t\tdata class Running(\n\t\t\tval id: Long,\n\t\t\tval kind: Kind,\n\t\t\t@StringRes val stageRes: Int,\n\t\t\tval progress: Progress,\n\t\t\tval details: String? = null,\n\t\t) : State''',
              'running details',
          )
          insert_after = '''\tfun update(\n\t\tkind: Kind,\n\t\tprogress: Progress,\n\t\t@StringRes stageRes: Int = currentStage(kind),\n\t) {\n\t\tval current = mutableState.value as? State.Running ?: return\n\t\tif (current.kind != kind) return\n\t\tmutableState.value = current.copy(stageRes = stageRes, progress = progress)\n\t}\n'''
          addition = insert_after + '''\n\tfun updateDetails(\n\t\tkind: Kind,\n\t\t@StringRes stageRes: Int,\n\t\tdetails: String?,\n\t) {\n\t\tval current = mutableState.value as? State.Running ?: return\n\t\tif (current.kind != kind) return\n\t\tmutableState.value = current.copy(stageRes = stageRes, details = details)\n\t}\n'''
          text = replace_once(text, insert_after, addition, 'updateDetails')
          tracker.write_text(text)

          service = Path('app/src/main/kotlin/org/koitharu/kotatsu/backup/local/ui/restore/RestoreService.kt')
          text = service.read_text()
          text = replace_once(text, 'import androidx.annotation.CheckResult\n', 'import androidx.annotation.CheckResult\nimport androidx.annotation.StringRes\n', 'StringRes import')
          text = replace_once(text, 'import java.io.FileNotFoundException\n', 'import java.io.FileNotFoundException\nimport java.text.NumberFormat\n', 'NumberFormat import')
          old_collect = '''\t\t\t\tprogress.collect { value ->\n\t\t\t\t\tBackupOperationTracker.update(\n\t\t\t\t\t\tBackupOperationTracker.Kind.LOCAL_RESTORE,\n\t\t\t\t\t\tvalue,\n\t\t\t\t\t\tR.string.backup_operation_restoring,\n\t\t\t\t\t)\n\t\t\t\t\tif (canNotify) {\n\t\t\t\t\t\tnotificationManager.notify(FOREGROUND_NOTIFICATION_ID, buildNotification(value))\n\t\t\t\t\t}\n\t\t\t\t}\n'''
          new_collect = '''\t\t\t\tprogress.collect { value ->\n\t\t\t\t\tBackupOperationTracker.update(BackupOperationTracker.Kind.LOCAL_RESTORE, value)\n\t\t\t\t\tif (canNotify) {\n\t\t\t\t\t\tval running = BackupOperationTracker.state.value as? BackupOperationTracker.State.Running\n\t\t\t\t\t\tnotificationManager.notify(\n\t\t\t\t\t\t\tFOREGROUND_NOTIFICATION_ID,\n\t\t\t\t\t\t\tbuildNotification(\n\t\t\t\t\t\t\t\tvalue,\n\t\t\t\t\t\t\t\trunning?.stageRes ?: R.string.backup_operation_restoring,\n\t\t\t\t\t\t\t\trunning?.details,\n\t\t\t\t\t\t\t),\n\t\t\t\t\t\t)\n\t\t\t\t\t}\n\t\t\t\t}\n'''
          text = replace_once(text, old_collect, new_collect, 'progress collector')
          old_call = '\t\t\t\t\trepository.restoreBackup(input, sections, progress)\n'
          new_call = '''\t\t\t\t\trepository.restoreBackup(input, sections, progress) { section, processed ->\n\t\t\t\t\t\tval detail = applicationContext.getString(\n\t\t\t\t\t\t\tR.string.backup_operation_items_processed,\n\t\t\t\t\t\t\tNumberFormat.getIntegerInstance().format(processed),\n\t\t\t\t\t\t)\n\t\t\t\t\t\tBackupOperationTracker.updateDetails(\n\t\t\t\t\t\t\tBackupOperationTracker.Kind.LOCAL_RESTORE,\n\t\t\t\t\t\t\tsection.titleResId,\n\t\t\t\t\t\t\tdetail,\n\t\t\t\t\t\t)\n\t\t\t\t\t\tif (canNotify) {\n\t\t\t\t\t\t\tnotificationManager.notify(\n\t\t\t\t\t\t\t\tFOREGROUND_NOTIFICATION_ID,\n\t\t\t\t\t\t\t\tbuildNotification(progress.value, section.titleResId, detail),\n\t\t\t\t\t\t\t)\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n'''
          text = replace_once(text, old_call, new_call, 'restore callback')
          old_sig = '\tprivate fun IntentJobContext.buildNotification(progress: Progress): Notification {\n'
          new_sig = '''\tprivate fun IntentJobContext.buildNotification(\n\t\tprogress: Progress,\n\t\t@StringRes stageRes: Int = R.string.backup_operation_restoring,\n\t\tdetails: String? = null,\n\t): Notification {\n'''
          text = replace_once(text, old_sig, new_sig, 'notification signature')
          old_content = '''\t\t\t.setContentText(\n\t\t\t\tif (progress.isIndeterminate) {\n\t\t\t\t\tgetString(R.string.processing_)\n\t\t\t\t} else {\n\t\t\t\t\tgetString(R.string.fraction_pattern, progress.progress, progress.total)\n\t\t\t\t},\n\t\t\t)\n'''
          new_content = '''\t\t\t.setContentText(\n\t\t\t\tdetails?.let { "${getString(stageRes)} • $it" } ?: if (progress.isIndeterminate) {\n\t\t\t\t\tgetString(R.string.processing_)\n\t\t\t\t} else {\n\t\t\t\t\tgetString(R.string.fraction_pattern, progress.progress, progress.total)\n\t\t\t\t},\n\t\t\t)\n'''
          text = replace_once(text, old_content, new_content, 'notification live text')
          service.write_text(text)

          screen = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/BackupSettingsFragment.kt')
          text = screen.read_text()
          old_subtitle = '''\tval subtitle = if (!progress.isIndeterminate && progress.total > 0) {\n\t\t"$stage • ${stringResource(R.string.backup_operation_progress_fraction, progress.progress, progress.total)} • " +\n\t\t\tformatProgressPercent(progress)\n\t} else {\n\t\tstage\n\t}\n'''
          new_subtitle = '''\tval subtitle = buildString {\n\t\tappend(stage)\n\t\tif (!progress.isIndeterminate && progress.total > 0) {\n\t\t\tappend(" • ")\n\t\t\tappend(stringResource(R.string.backup_operation_progress_fraction, progress.progress, progress.total))\n\t\t\tappend(" • ")\n\t\t\tappend(formatProgressPercent(progress))\n\t\t}\n\t\tstate.details?.takeIf { it.isNotBlank() }?.let {\n\t\t\tappend(" • ")\n\t\t\tappend(it)\n\t\t}\n\t}\n'''
          text = replace_once(text, old_subtitle, new_subtitle, 'progress subtitle')
          screen.write_text(text)

          for path, line in [
              (Path('app/src/main/res/values/strings_backup_progress.xml'), '    <string name="backup_operation_items_processed">%1$s items processed</string>\n'),
              (Path('app/src/main/res/values-in/strings_backup_progress.xml'), '    <string name="backup_operation_items_processed">%1$s item diproses</string>\n'),
          ]:
              xml = path.read_text()
              if 'backup_operation_items_processed' not in xml:
                  xml = xml.replace('    <string name="backup_operation_restored_count">', line + '    <string name="backup_operation_restored_count">', 1)
              path.write_text(xml)
          PY

          git diff --check
          git diff --stat

      - name: Commit restore progress improvements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-progress-optimizer.yml
          git add app/src/main/kotlin/org/koitharu/kotatsu/backup/local/data/LocalBackupRepository.kt
          git add app/src/main/kotlin/org/koitharu/kotatsu/backup/local/ui/restore/RestoreService.kt
          git add app/src/main/kotlin/org/koitharu/kotatsu/backup/BackupOperationTracker.kt
          git add app/src/main/kotlin/org/koitharu/kotatsu/settings/BackupSettingsFragment.kt
          git add app/src/main/res/values/strings_backup_progress.xml
          git add app/src/main/res/values-in/strings_backup_progress.xml
          git commit -m "Show live progress during large local restores"
          git push origin HEAD:beta
