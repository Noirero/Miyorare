name: Patch novel translation replacement

on:
  push:
    branches:
      - fix/novel-translation-replace-source
    paths:
      - .github/workflows/patch-novel-translation-replace-source.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/novel-translation-replace-source
      - name: Apply exact translation renderer patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt')
          text = path.read_text()

          old = '''\tprivate fun buildInlineTranslatedSpanned(original: Spanned, translations: List<InlineTranslation>): Spanned {
          \t\tif (translations.isEmpty()) return SpannedString(original)
          \t\tval output = SpannableStringBuilder(original)
          \t\ttranslations.sortedBy { it.start }.asReversed().forEach { item ->
          \t\t\tval insertAt = item.end.coerceIn(0, original.length)
          \t\t\tval block = inlineTranslationBlock(item)
          \t\t\toutput.insert(insertAt, block)
          \t\t\tval end = insertAt + block.length
          \t\t\toutput.setSpan(RelativeSizeSpan(0.94f), insertAt, end, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
          \t\t\toutput.setSpan(StyleSpan(Typeface.ITALIC), insertAt, end, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
          \t\t}
          \t\treturn SpannedString(output)
          \t}

          \tprivate fun inlineTranslationBlock(item: InlineTranslation): String =
          \t\t"\\n${item.translatedText.trim()}\\n"
          '''.replace('          ', '')
          new = '''\tprivate fun buildInlineTranslatedSpanned(original: Spanned, translations: List<InlineTranslation>): Spanned {
          \t\tif (translations.isEmpty()) return SpannedString(original)
          \t\tval output = SpannableStringBuilder(original)
          \t\ttranslations.sortedBy { it.start }.asReversed().forEach { item ->
          \t\t\tval start = item.start.coerceIn(0, original.length)
          \t\t\tval end = item.end.coerceIn(start, original.length)
          \t\t\toutput.replace(start, end, inlineTranslationText(item))
          \t\t}
          \t\treturn SpannedString(output)
          \t}

          \tprivate fun inlineTranslationText(item: InlineTranslation): String = item.translatedText.trim()
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('renderer anchor not found')
          text = text.replace(old, new, 1)

          old = '''\tprivate fun sourceToDisplayOffset(chapterId: Long, sourceOffset: Int, afterBoundary: Boolean = false): Int {
          \t\tval sourceLength = translationOriginals[chapterId]?.length
          \t\tval clamped = sourceLength?.let { sourceOffset.coerceIn(0, it) } ?: sourceOffset.coerceAtLeast(0)
          \t\tvar delta = 0
          \t\tinlineTranslations[chapterId].orEmpty().sortedBy { it.start }.forEach { item ->
          \t\t\tif (item.end > clamped || (!afterBoundary && item.end == clamped)) return@forEach
          \t\t\tdelta += inlineTranslationBlock(item).length
          \t\t}
          \t\treturn clamped + delta
          \t}
          '''.replace('          ', '')
          new = '''\tprivate fun sourceToDisplayOffset(chapterId: Long, sourceOffset: Int, afterBoundary: Boolean = false): Int {
          \t\tval sourceLength = translationOriginals[chapterId]?.length
          \t\tval clamped = sourceLength?.let { sourceOffset.coerceIn(0, it) } ?: sourceOffset.coerceAtLeast(0)
          \t\tvar delta = 0
          \t\tinlineTranslations[chapterId].orEmpty().sortedBy { it.start }.forEach { item ->
          \t\t\tval sourceStart = item.start
          \t\t\tval sourceEnd = item.end.coerceAtLeast(sourceStart)
          \t\t\tval replacementLength = inlineTranslationText(item).length
          \t\t\tif (clamped < sourceStart || (!afterBoundary && clamped == sourceStart)) return clamped + delta
          \t\t\tif (clamped <= sourceEnd) {
          \t\t\t\tval sourceSpan = (sourceEnd - sourceStart).coerceAtLeast(1)
          \t\t\t\tval relative = (clamped - sourceStart).coerceIn(0, sourceSpan)
          \t\t\t\treturn sourceStart + delta + (relative.toLong() * replacementLength / sourceSpan).toInt()
          \t\t\t}
          \t\t\tdelta += replacementLength - (sourceEnd - sourceStart)
          \t\t}
          \t\treturn clamped + delta
          \t}
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('sourceToDisplayOffset anchor not found')
          text = text.replace(old, new, 1)

          old = '''\tprivate fun displayToSourceOffset(chapterId: Long, displayOffset: Int): Int {
          \t\tval sourceLength = translationOriginals[chapterId]?.length
          \t\tvar delta = 0
          \t\tinlineTranslations[chapterId].orEmpty().sortedBy { it.start }.forEach { item ->
          \t\t\tval insertionStart = item.end + delta
          \t\t\tval insertionEnd = insertionStart + inlineTranslationBlock(item).length
          \t\t\tif (displayOffset < insertionStart) {
          \t\t\t\treturn (displayOffset - delta).let { value -> sourceLength?.let { value.coerceIn(0, it) } ?: value.coerceAtLeast(0) }
          \t\t\t}
          \t\t\tif (displayOffset <= insertionEnd) return item.end
          \t\t\tdelta = insertionEnd - item.end
          \t\t}
          \t\tval mapped = displayOffset - delta
          \t\treturn sourceLength?.let { mapped.coerceIn(0, it) } ?: mapped.coerceAtLeast(0)
          \t}

          \tprivate fun displayRangeTouchesInlineTranslation(chapterId: Long, displayStart: Int, displayEnd: Int): Boolean {
          \t\tvar delta = 0
          \t\tinlineTranslations[chapterId].orEmpty().sortedBy { it.start }.forEach { item ->
          \t\t\tval insertionStart = item.end + delta
          \t\t\tval insertionEnd = insertionStart + inlineTranslationBlock(item).length
          \t\t\tif (displayStart < insertionEnd && displayEnd > insertionStart) return true
          \t\t\tdelta = insertionEnd - item.end
          \t\t}
          \t\treturn false
          \t}
          '''.replace('          ', '')
          new = '''\tprivate fun displayToSourceOffset(chapterId: Long, displayOffset: Int): Int {
          \t\tval sourceLength = translationOriginals[chapterId]?.length
          \t\tvar delta = 0
          \t\tinlineTranslations[chapterId].orEmpty().sortedBy { it.start }.forEach { item ->
          \t\t\tval sourceStart = item.start
          \t\t\tval sourceEnd = item.end.coerceAtLeast(sourceStart)
          \t\t\tval replacementLength = inlineTranslationText(item).length
          \t\t\tval replacementStart = sourceStart + delta
          \t\t\tval replacementEnd = replacementStart + replacementLength
          \t\t\tif (displayOffset < replacementStart) return clampSourceOffset(displayOffset - delta, sourceLength)
          \t\t\tif (displayOffset <= replacementEnd) {
          \t\t\t\tval sourceSpan = sourceEnd - sourceStart
          \t\t\t\tif (replacementLength == 0 || sourceSpan == 0) return sourceEnd
          \t\t\t\tval relative = (displayOffset - replacementStart).coerceIn(0, replacementLength)
          \t\t\t\treturn clampSourceOffset(sourceStart + (relative.toLong() * sourceSpan / replacementLength).toInt(), sourceLength)
          \t\t\t}
          \t\t\tdelta += replacementLength - sourceSpan
          \t\t}
          \t\treturn clampSourceOffset(displayOffset - delta, sourceLength)
          \t}

          \tprivate fun clampSourceOffset(value: Int, sourceLength: Int?): Int =
          \t\tsourceLength?.let { value.coerceIn(0, it) } ?: value.coerceAtLeast(0)

          \tprivate fun displayRangeTouchesInlineTranslation(chapterId: Long, displayStart: Int, displayEnd: Int): Boolean {
          \t\tvar delta = 0
          \t\tinlineTranslations[chapterId].orEmpty().sortedBy { it.start }.forEach { item ->
          \t\t\tval replacementStart = item.start + delta
          \t\t\tval replacementEnd = replacementStart + inlineTranslationText(item).length
          \t\t\tif (displayStart < replacementEnd && displayEnd > replacementStart) return true
          \t\t\tdelta += inlineTranslationText(item).length - (item.end - item.start)
          \t\t}
          \t\treturn false
          \t}
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('display mapping anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt
          git diff --cached --check
          git commit -m "Replace source text with novel translations"
          git push origin HEAD:fix/novel-translation-replace-source
