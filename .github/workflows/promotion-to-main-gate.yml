name: Promotion to Main Gate

# Promotion policy:
# - release/promote-main-* is a frozen, selectively constructed release candidate.
# - The source integration branch may be Amain2; validation is against the current main base.
# - This gate is intentionally independent from the legacy beta -> main gate.
# - `skip-device-test` suppresses only the owner-facing exact-head debug APK artifact.
# - Automated Android 15 acceptance still runs whenever the runtime classifier requires it.
# - Full Android 15 acceptance remains the default for runtime-sensitive promotions.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promotion-main-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify promotion candidate
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/promote-main-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout exact promotion head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test runtime-smoke path classifier
        run: python3 .github/scripts/test_runtime_smoke_paths.py

      - name: Compile and run JVM regression suite
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

  classify-runtime-smoke:
    name: Classify promotion runtime smoke
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/promote-main-')
    runs-on: ubuntu-latest
    outputs:
      run_smoke: ${{ steps.classify.outputs.run_smoke }}

    steps:
      - name: Checkout exact promotion head with history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Classify promotion changes
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p build
          changed_file_list=build/runtime-smoke-changed-files.txt
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$changed_file_list"
          echo "Changed files considered for runtime smoke:"
          sed 's/^/  - /' "$changed_file_list"
          run_smoke="$(python3 .github/scripts/runtime_smoke_paths.py --paths-file "$changed_file_list")"
          [[ "$run_smoke" == "true" || "$run_smoke" == "false" ]]
          echo "run_smoke=$run_smoke" >> "$GITHUB_OUTPUT"

  runtime-smoke:
    name: Promotion Android 15 acceptance
    needs: classify-runtime-smoke
    if: needs.classify-runtime-smoke.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout exact promotion head with history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Build base and promotion APKs with identical debug signing
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          patch_settings_export() {
            python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          old = '''<activity
\t\t\tandroid:name="org.koitharu.kotatsu.settings.SettingsActivity"
\t\t\tandroid:exported="false"'''
          new = '''<activity
\t\t\tandroid:name="org.koitharu.kotatsu.settings.SettingsActivity"
\t\t\tandroid:exported="true"'''
          if old not in text:
              raise SystemExit('SettingsActivity export marker not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          }

          git checkout --force "$BASE_SHA"
          patch_settings_export
          chmod +x gradlew
          rm -rf app/build/outputs/apk/debug
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          BASE_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$BASE_APK"
          cp "$BASE_APK" /tmp/miyorare-main-base-debug.apk

          git checkout --force "$HEAD_SHA"
          patch_settings_export
          chmod +x gradlew
          rm -rf app/build/outputs/apk/debug
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          CANDIDATE_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$CANDIDATE_APK"
          cp "$CANDIDATE_APK" /tmp/miyorare-promotion-debug.apk

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Run consolidated Android 15 promotion acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            cp /tmp/miyorare-main-base-debug.apk /tmp/miyorare-main-debug.apk
            cp /tmp/miyorare-promotion-debug.apk /tmp/miyorare-beta-debug.apk
            bash .github/scripts/beta-main-runtime-smoke.sh
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.core.db.ChapterPersistenceRegressionTest,org.koitharu.kotatsu.alternatives.domain.ProfileMigrationPersistenceRegressionTest,org.koitharu.kotatsu.backup.local.LocalBackupIdentityTest,org.koitharu.kotatsu.settings.backup.AppBackupAgentTest

      - name: Build exact-head APK for owner device test
        if: success() && !contains(github.event.pull_request.labels.*.name, 'skip-device-test')
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git checkout --force "$HEAD_SHA"
          chmod +x gradlew
          rm -rf app/build/outputs/apk/debug
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          DEVICE_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$DEVICE_APK"
          mkdir -p promotion-device-test
          cp "$DEVICE_APK" "promotion-device-test/Miyorare-promotion-${HEAD_SHA}.apk"
          printf '%s\n' "$HEAD_SHA" > promotion-device-test/HEAD_SHA.txt

      - name: Upload exact-head APK for owner device test
        if: success() && !contains(github.event.pull_request.labels.*.name, 'skip-device-test')
        uses: actions/upload-artifact@v4
        with:
          name: promotion-device-test-apk-${{ github.event.pull_request.head.sha }}
          path: promotion-device-test/
          if-no-files-found: error
          retention-days: 7

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-main-gate-runtime
          path: |
            release-gate-runtime/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7
