name: Real Downloaded Novel Boundary Probe

on:
  push:
    branches:
      - test/amain2-real-downloaded-novel-boundary

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile diagnostic Android test
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon --stacktrace
