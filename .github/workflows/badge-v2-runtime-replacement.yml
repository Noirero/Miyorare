name: Badge V2 Runtime Replacement

on:
  push:
    branches:
      - fix/beta-badge-v2-static-20260927
    paths:
      - '.badge-runtime-staging/**'
      - 'tools/install_badge_runtime_staging.py'
      - '.github/workflows/badge-v2-runtime-replacement.yml'

permissions:
  contents: write

concurrency:
  group: badge-v2-runtime-replacement
  cancel-in-progress: false

jobs:
  replace-build-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BADGE_BASELINE_SHA: bd93f0c7a14dbd6aa0bc41b16966224fdfedf8f3
      BADGE_BUDGET_BYTES: '1048576'

    steps:
      - name: Checkout staged feature head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: head
          fetch-depth: 0

      - name: Checkout pre-Badge baseline
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BADGE_BASELINE_SHA }}
          path: base
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Grant execute permission
        run: |
          chmod +x base/gradlew
          chmod +x head/gradlew

      - name: Install exact Badge V2 runtime and regenerate payload
        working-directory: head
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/install_badge_runtime_staging.py
          python3 tools/regenerate_badge_v2_payload.py
          python3 tools/regenerate_badge_v2_payload.py --check

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("app/src/main/badge-assets")
          manifest = json.loads((root / "v2-source-manifest.json").read_text())
          assets = manifest["assets"]
          total = sum(int(item["size"]) for item in assets)
          assert len(assets) == 24, len(assets)
          assert total == 773_682, total
          files = sorted((root / "v2-source").glob("*.webp"))
          assert len(files) == 24, len(files)
          assert sum(p.stat().st_size for p in files) == 773_682
          print(f"Verified 24 runtime assets = {total} bytes")
          print(f"Regenerated payload bytes = {(root / 'exclusive_badge_material_payload.b64').stat().st_size}")
          PY

      - name: Create clean local production commit
        working-directory: head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .badge-runtime-staging
          rm -f tools/install_badge_runtime_staging.py
          rm -f .github/workflows/badge-v2-runtime-replacement.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A --             .badge-runtime-staging             app/src/main/badge-assets             tools/install_badge_runtime_staging.py             .github/workflows/badge-v2-runtime-replacement.yml
          git commit -m "assets: replace Badge V2 production runtime"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          echo "Final tree changes:"
          git show --stat --oneline --summary HEAD

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("head/gradle/libs.versions.toml").read_text(encoding="utf-8"))
          value = str(data.get("versions", {}).get("parsers", "")).strip()
          if not value:
              raise SystemExit("Missing versions.parsers")
          print(value)
          PY
          )"
          POM_URL="https://jitpack.io/com/github/Gekkoushi/plugin-source/${PARSERS_VERSION}/plugin-source-${PARSERS_VERSION}.pom"
          for i in $(seq 1 12); do
            status="$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$POM_URL" || true)"
            if [ "$status" = "200" ]; then
              echo "Parser artifact ready"
              exit 0
            fi
            echo "Attempt $i: HTTP ${status:-000}"
            sleep 20
          done
          echo "::error::Parser artifact is not ready on JitPack"
          exit 1

      - name: Build pre-Badge Beta Preview APK
        working-directory: base
        run: ./gradlew :app:assemblePreview --no-daemon --stacktrace

      - name: Build Beta Preview APK with Badge V2 runtime
        working-directory: head
        run: ./gradlew :app:assemblePreview --no-daemon --stacktrace

      - name: Audit packaged Badge V2 resources
        shell: bash
        run: |
          set -euo pipefail
          HEAD_APK="$(find head/app/build/outputs/apk/preview -type f -name '*.apk' | sort | head -n1)"
          test -n "$HEAD_APK"
          python3 - "$HEAD_APK" <<'PY'
          import hashlib
          import json
          from pathlib import Path, PurePosixPath
          import sys
          import zipfile

          apk = Path(sys.argv[1])
          manifest = json.loads(Path("head/app/src/main/badge-assets/v2-source-manifest.json").read_text())
          expected = {item["name"]: item for item in manifest["assets"]}

          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              forbidden_fragments = (
                  "exclusive_badge_material_payload.b64",
                  "v2-source-manifest.json",
                  "badge-assets/v2-source",
                  ".badge-runtime-staging",
                  "runtime.b64.part",
              )
              forbidden = [name for name in names if any(fragment in name for fragment in forbidden_fragments)]
              assert not forbidden, f"Source/payload/staging unexpectedly packaged: {forbidden}"

              packaged = []
              for filename, meta in expected.items():
                  matches = [name for name in names if PurePosixPath(name).name == filename]
                  assert len(matches) == 1, f"{filename}: expected exactly one packaged resource, got {matches}"
                  entry = matches[0]
                  data = z.read(entry)
                  digest = hashlib.sha256(data).hexdigest()
                  assert len(data) == int(meta["size"]), f"{filename}: packaged size changed"
                  assert digest == meta["sha256"], f"{filename}: packaged bytes changed"
                  packaged.append({
                      "resource": filename,
                      "apk_entry": entry,
                      "bytes": len(data),
                      "sha256": digest,
                  })

          total = sum(item["bytes"] for item in packaged)
          assert len(packaged) == 24
          assert total == 773_682, total
          report = {
              "apk": str(apk),
              "runtime_resource_count": len(packaged),
              "runtime_uncompressed_bytes": total,
              "duplicate_runtime_resources": False,
              "payload_or_source_assets_packaged": False,
              "resources": packaged,
          }
          Path("badge-v2-apk-audit.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps({k: v for k, v in report.items() if k != "resources"}, indent=2))
          PY

      - name: Measure exact APK delta and evaluate 1 MiB budget
        id: size
        shell: bash
        run: |
          set -euo pipefail
          BASE_APK="$(find base/app/build/outputs/apk/preview -type f -name '*.apk' | sort | head -n1)"
          HEAD_APK="$(find head/app/build/outputs/apk/preview -type f -name '*.apk' | sort | head -n1)"
          test -n "$BASE_APK"
          test -n "$HEAD_APK"

          BASE_BYTES="$(stat -c%s "$BASE_APK")"
          HEAD_BYTES="$(stat -c%s "$HEAD_APK")"
          DELTA_BYTES="$((HEAD_BYTES - BASE_BYTES))"
          PASS=false
          if [ "$DELTA_BYTES" -le "$BADGE_BUDGET_BYTES" ]; then
            PASS=true
          fi

          python3 - "$BADGE_BASELINE_SHA" "$FINAL_SHA" "$BASE_BYTES" "$HEAD_BYTES" "$DELTA_BYTES" "$BADGE_BUDGET_BYTES" "$PASS" <<'PY'
          import json
          from pathlib import Path
          import sys

          base_sha, final_sha, base_b, head_b, delta_b, budget_b, passed = sys.argv[1:]
          payload = {
              "build_variant": "preview",
              "distribution_target": "Beta",
              "baseline_sha": base_sha,
              "candidate_sha": final_sha,
              "baseline_apk_bytes": int(base_b),
              "apk_with_badges_bytes": int(head_b),
              "delta_bytes": int(delta_b),
              "hard_budget_bytes": int(budget_b),
              "budget_pass": passed == "true",
              "runtime_asset_bytes": 773682,
          }
          Path("badge-v2-runtime-size-evidence.json").write_text(json.dumps(payload, indent=2) + "\n")
          print(json.dumps(payload, indent=2))
          PY

          echo "base_apk=$BASE_APK" >> "$GITHUB_OUTPUT"
          echo "head_apk=$HEAD_APK" >> "$GITHUB_OUTPUT"
          echo "base_bytes=$BASE_BYTES" >> "$GITHUB_OUTPUT"
          echo "head_bytes=$HEAD_BYTES" >> "$GITHUB_OUTPUT"
          echo "delta_bytes=$DELTA_BYTES" >> "$GITHUB_OUTPUT"
          echo "budget_pass=$PASS" >> "$GITHUB_OUTPUT"

          {
            echo "## Badge V2 production runtime — exact Beta APK budget"
            echo
            echo "| Measurement | Bytes |"
            echo "| --- | ---: |"
            echo "| Pre-Badge baseline APK | $BASE_BYTES |"
            echo "| APK with Badge V2 | $HEAD_BYTES |"
            echo "| Exact delta | $DELTA_BYTES |"
            echo "| Hard limit | $BADGE_BUDGET_BYTES |"
            echo "| Runtime assets | 773682 |"
            echo
            echo "Duplicate runtime resources: none."
            echo "Payload/source/staging files packaged: none."
            echo "Budget pass: $PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Beta APK and size evidence
        if: always() && steps.size.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: badge-v2-beta-apk-budget-${{ github.run_id }}
          path: |
            ${{ steps.size.outputs.head_apk }}
            badge-v2-apk-audit.json
            badge-v2-runtime-size-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce hard 1 MiB Badge delta
        if: steps.size.outputs.budget_pass != 'true'
        shell: bash
        run: |
          echo "::error::APK_WITH_BADGES - APK_BASELINE = ${{ steps.size.outputs.delta_bytes }} bytes, above 1,048,576-byte hard requirement. Packaged duplicate/source/payload audit already ran before this check."
          exit 1

      - name: Push clean production replacement
        if: steps.size.outputs.budget_pass == 'true'
        working-directory: head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/beta-badge-v2-static-20260927
