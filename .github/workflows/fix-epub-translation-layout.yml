name: Fix EPUB translation paragraph layout

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-epub-translation-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve original EPUB spans during translation
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt')
          text = path.read_text()

          old_call = 'val chunks = splitTranslationText(original.toString())'
          new_call = 'val chunks = splitTranslationText(original)'
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('Could not locate splitTranslationText call')

          old_translate_call = 'translateChunks(translator, chunks, 0, ArrayList(), generation)'
          new_translate_call = 'translateChunks(translator, original, chunks, 0, ArrayList(), generation)'
          if old_translate_call in text:
              text = text.replace(old_translate_call, new_translate_call, 1)
          elif new_translate_call not in text:
              raise SystemExit('Could not locate translateChunks call')

          start_marker = '\tprivate fun splitTranslationText('
          end_marker = '\n\toverride fun onDestroyView() {'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate EPUB translation helper block')

          replacement = "\n".join([
              '\tprivate data class EpubTranslationChunk(',
              '\t\tval start: Int,',
              '\t\tval end: Int,',
              '\t\tval text: String,',
              '\t)',
              '',
              '\tprivate data class EpubTranslatedChunk(',
              '\t\tval source: EpubTranslationChunk,',
              '\t\tval translatedText: String,',
              '\t)',
              '',
              '\t/**',
              '\t * Splits only translatable text. Newline runs stay untouched in the source Spanned,',
              '\t * so blank lines and paragraph boundaries are preserved exactly.',
              '\t */',
              '\tprivate fun splitTranslationText(text: Spanned, maxChars: Int = 2500): List<EpubTranslationChunk> {',
              '\t\tif (text.isEmpty()) return emptyList()',
              '\t\tval plain = text.toString()',
              '\t\tval result = ArrayList<EpubTranslationChunk>()',
              '',
              '\t\tfun appendRange(start: Int, end: Int) {',
              '\t\t\tvar cursor = start',
              '\t\t\twhile (cursor < end) {',
              '\t\t\t\tval next = (cursor + maxChars).coerceAtMost(end)',
              '\t\t\t\tresult += EpubTranslationChunk(',
              '\t\t\t\t\tstart = cursor,',
              '\t\t\t\t\tend = next,',
              '\t\t\t\t\ttext = plain.substring(cursor, next),',
              '\t\t\t\t)',
              '\t\t\t\tcursor = next',
              '\t\t\t}',
              '\t\t}',
              '',
              '\t\tvar paragraphStart = 0',
              '\t\tRegex("\\\\n+").findAll(plain).forEach { match ->',
              '\t\t\tappendRange(paragraphStart, match.range.first)',
              '\t\t\tparagraphStart = match.range.last + 1',
              '\t\t}',
              '\t\tappendRange(paragraphStart, plain.length)',
              '\t\treturn result',
              '\t}',
              '',
              '\tprivate fun translateChunks(',
              '\t\ttranslator: Translator,',
              '\t\toriginal: Spanned,',
              '\t\tchunks: List<EpubTranslationChunk>,',
              '\t\tindex: Int,',
              '\t\tresult: MutableList<EpubTranslatedChunk>,',
              '\t\tgeneration: Int,',
              '\t\tonComplete: (Spanned?, Throwable?) -> Unit,',
              '\t) {',
              '\t\tif (generation != translationGeneration) return',
              '\t\tif (index >= chunks.size) {',
              '\t\t\tonComplete(buildTranslatedSpanned(original, result), null)',
              '\t\t\treturn',
              '\t\t}',
              '',
              '\t\tval chunk = chunks[index]',
              '\t\tif (chunk.text.isBlank()) {',
              '\t\t\tresult += EpubTranslatedChunk(chunk, chunk.text)',
              '\t\t\tif (isAdded) updateTranslationStatus(',
              '\t\t\t\tgetString(R.string.epub_translate_translating_progress, index + 1, chunks.size),',
              '\t\t\t)',
              '\t\t\ttranslateChunks(translator, original, chunks, index + 1, result, generation, onComplete)',
              '\t\t\treturn',
              '\t\t}',
              '',
              '\t\ttranslator.translate(chunk.text)',
              '\t\t\t.addOnSuccessListener { translated ->',
              '\t\t\t\tif (generation != translationGeneration) return@addOnSuccessListener',
              '\t\t\t\tresult += EpubTranslatedChunk(chunk, translated)',
              '\t\t\t\tif (isAdded) updateTranslationStatus(',
              '\t\t\t\t\tgetString(R.string.epub_translate_translating_progress, index + 1, chunks.size),',
              '\t\t\t\t)',
              '\t\t\t\ttranslateChunks(translator, original, chunks, index + 1, result, generation, onComplete)',
              '\t\t\t}',
              '\t\t\t.addOnFailureListener { error ->',
              '\t\t\t\tif (generation == translationGeneration) onComplete(null, error)',
              '\t\t\t}',
              '\t}',
              '',
              '\t/**',
              '\t * Rebuilds the translated chapter and remaps every copyable source span.',
              '\t * Paragraph spacing, margins, line-height, alignment and inline formatting survive.',
              '\t */',
              '\tprivate fun buildTranslatedSpanned(',
              '\t\toriginal: Spanned,',
              '\t\ttranslatedChunks: List<EpubTranslatedChunk>,',
              '\t): Spanned {',
              '\t\tif (translatedChunks.isEmpty()) return SpannedString(original)',
              '\t\tval ordered = translatedChunks.sortedBy { it.source.start }',
              '\t\tval plain = StringBuilder(original.toString())',
              '\t\tordered.asReversed().forEach { item ->',
              '\t\t\tplain.replace(item.source.start, item.source.end, item.translatedText)',
              '\t\t}',
              '',
              '\t\tval output = SpannableStringBuilder(plain.toString())',
              '\t\toriginal.getSpans(0, original.length, Any::class.java).forEach { span ->',
              '\t\t\tif (span is NoCopySpan) return@forEach',
              '\t\t\tval sourceStart = original.getSpanStart(span)',
              '\t\t\tval sourceEnd = original.getSpanEnd(span)',
              '\t\t\tif (sourceStart < 0 || sourceEnd < sourceStart) return@forEach',
              '\t\t\tval mappedStart = mapTranslationOffset(sourceStart, ordered).coerceIn(0, output.length)',
              '\t\t\tval mappedEnd = mapTranslationOffset(sourceEnd, ordered).coerceIn(mappedStart, output.length)',
              '\t\t\trunCatching {',
              '\t\t\t\toutput.setSpan(span, mappedStart, mappedEnd, original.getSpanFlags(span))',
              '\t\t\t}',
              '\t\t}',
              '\t\treturn SpannedString(output)',
              '\t}',
              '',
              '\tprivate fun mapTranslationOffset(',
              '\t\toffset: Int,',
              '\t\tchunks: List<EpubTranslatedChunk>,',
              '\t): Int {',
              '\t\tvar delta = 0',
              '\t\tfor (item in chunks) {',
              '\t\t\tval source = item.source',
              '\t\t\tif (offset < source.start) break',
              '\t\t\tval sourceLength = source.end - source.start',
              '\t\t\tval translatedLength = item.translatedText.length',
              '\t\t\tif (offset <= source.end) {',
              '\t\t\t\tval translatedStart = source.start + delta',
              '\t\t\t\tif (sourceLength <= 0 || offset == source.start) return translatedStart',
              '\t\t\t\tif (offset == source.end) return translatedStart + translatedLength',
              '\t\t\t\tval relative = offset - source.start',
              '\t\t\t\treturn translatedStart + ((relative.toLong() * translatedLength) / sourceLength).toInt()',
              '\t\t\t}',
              '\t\t\tdelta += translatedLength - sourceLength',
              '\t\t}',
              '\t\treturn offset + delta',
              '\t}',
              '',
          ])

          text = text[:start] + replacement + text[end:]
          path.write_text(text)

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt
          git diff --cached --quiet && exit 0
          git commit -m "Preserve EPUB spans during translation"
          git push
