name: Add Favourites list loading mode

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/add-favourites-loading-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Favourites loading mode
        shell: python
        run: |
          from pathlib import Path

          def must_replace(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              p.write_text(text.replace(old, new, 1))

          Path('app/src/main/kotlin/org/koitharu/kotatsu/favourites/domain/FavouriteListLoadingMode.kt').write_text(
              "package org.koitharu.kotatsu.favourites.domain\n\n"
              "import androidx.annotation.StringRes\n"
              "import org.koitharu.kotatsu.R\n\n"
              "/** Controls whether Favourites/Downloaded metadata is paged or fully prepared. */\n"
              "enum class FavouriteListLoadingMode(@StringRes val titleResId: Int) {\n"
              "\tPAGED(R.string.favourites_loading_mode_paged),\n"
              "\tFULL(R.string.favourites_loading_mode_full),\n"
              "}\n"
          )

          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/AppSettings.kt')
          t = p.read_text()
          if 'import org.koitharu.kotatsu.favourites.domain.FavouriteListLoadingMode' not in t:
              a = 'import org.koitharu.kotatsu.explore.data.SourcesSortOrder\n'
              if a not in t: raise SystemExit('AppSettings import anchor not found')
              t = t.replace(a, a + 'import org.koitharu.kotatsu.favourites.domain.FavouriteListLoadingMode\n', 1)
          if 'val favouritesListLoadingMode:' not in t:
              a = '\tvar allFavoritesSortOrder: ListSortOrder\n\t\tget() = prefs.getEnumValue(KEY_FAVORITES_ORDER, ListSortOrder.NEWEST)\n\t\tset(value) = prefs.edit { putEnumValue(KEY_FAVORITES_ORDER, value) }\n'
              if a not in t: raise SystemExit('AppSettings favourites property anchor not found')
              t = t.replace(a, a + '\n\tval favouritesListLoadingMode: FavouriteListLoadingMode\n\t\tget() = prefs.getEnumValue(KEY_FAVOURITES_LIST_LOADING_MODE, FavouriteListLoadingMode.PAGED)\n', 1)
          if 'KEY_FAVOURITES_LIST_LOADING_MODE' not in t:
              a = '\t\tconst val KEY_FAVORITES_ORDER = "fav_order"\n'
              if a not in t: raise SystemExit('AppSettings favourites key anchor not found')
              t = t.replace(a, a + '\t\tconst val KEY_FAVOURITES_LIST_LOADING_MODE = "favourites_list_loading_mode"\n', 1)
          p.write_text(t)

          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/FavouritesSettingsFragment.kt')
          t = p.read_text()
          if 'FavouriteListLoadingMode' not in t:
              a = 'import org.koitharu.kotatsu.favourites.domain.FavouriteHeaderScrollMode\n'
              if a not in t: raise SystemExit('Favourites settings import anchor not found')
              t = t.replace(a, a + 'import org.koitharu.kotatsu.favourites.domain.FavouriteListLoadingMode\nimport org.koitharu.kotatsu.core.prefs.AppSettings\n', 1)
          if 'PlainInfoSettingsItem' not in t:
              a = 'import org.koitharu.kotatsu.settings.compose.ListSettingsItem\n'
              if a not in t: raise SystemExit('Favourites info import anchor not found')
              t = t.replace(a, a + 'import org.koitharu.kotatsu.settings.compose.PlainInfoSettingsItem\n', 1)
          if 'loadingMode by rememberStringPref' not in t:
              a = '\tval values = remember { FavouriteHeaderScrollMode.entries.map { it.name } }\n\tvar mode by rememberStringPref(\n\t\tFavouriteHeaderScrollMode.KEY_PREFERENCE,\n\t\tFavouriteHeaderScrollMode.SCROLL_AWAY.name,\n\t)\n'
              b = '\tval values = remember { FavouriteHeaderScrollMode.entries.map { it.name } }\n\tval loadingEntries = remember { FavouriteListLoadingMode.entries.map { context.getString(it.titleResId) } }\n\tval loadingValues = remember { FavouriteListLoadingMode.entries.map { it.name } }\n\tvar mode by rememberStringPref(\n\t\tFavouriteHeaderScrollMode.KEY_PREFERENCE,\n\t\tFavouriteHeaderScrollMode.SCROLL_AWAY.name,\n\t)\n\tvar loadingMode by rememberStringPref(\n\t\tAppSettings.KEY_FAVOURITES_LIST_LOADING_MODE,\n\t\tFavouriteListLoadingMode.PAGED.name,\n\t)\n'
              if a not in t: raise SystemExit('Favourites settings vars anchor not found')
              t = t.replace(a, b, 1)
          if 'title = stringResource(R.string.favourites_loading_mode)' not in t:
              a = '\t\t\t\titem { pos ->\n\t\t\t\t\tListSettingsItem(\n\t\t\t\t\t\ttitle = stringResource(R.string.favourites_scroll_mode),\n\t\t\t\t\t\tentries = entries,\n\t\t\t\t\t\tentryValues = values,\n\t\t\t\t\t\tselectedValue = mode,\n\t\t\t\t\t\tonValueChange = { mode = it },\n\t\t\t\t\t\ticon = R.drawable.ic_list,\n\t\t\t\t\t\tshape = pos.shape,\n\t\t\t\t\t)\n\t\t\t\t}\n'
              b = a + '\t\t\t\titem { pos ->\n\t\t\t\t\tListSettingsItem(\n\t\t\t\t\t\ttitle = stringResource(R.string.favourites_loading_mode),\n\t\t\t\t\t\tentries = loadingEntries,\n\t\t\t\t\t\tentryValues = loadingValues,\n\t\t\t\t\t\tselectedValue = loadingMode,\n\t\t\t\t\t\tonValueChange = { loadingMode = it },\n\t\t\t\t\t\ticon = R.drawable.ic_list,\n\t\t\t\t\t\tshape = pos.shape,\n\t\t\t\t\t)\n\t\t\t\t}\n'
              if a not in t: raise SystemExit('Favourites settings row anchor not found')
              t = t.replace(a, b, 1)
          if 'favourites_loading_mode_summary' not in t:
              a = '\t\titem { Spacer(Modifier.height(24.dp).fillMaxWidth()) }\n'
              b = '\t\titem { PlainInfoSettingsItem(text = stringResource(R.string.favourites_loading_mode_summary), icon = R.drawable.ic_info_outline) }\n' + a
              if a not in t: raise SystemExit('Favourites settings info anchor not found')
              t = t.replace(a, b, 1)
          p.write_text(t)

          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt')
          t = p.read_text()
          if 'import org.koitharu.kotatsu.favourites.domain.FavouriteListLoadingMode' not in t:
              a = 'import org.koitharu.kotatsu.favourites.domain.FavouriteContentTypeStore\n'
              if a not in t: raise SystemExit('ViewModel import anchor not found')
              t = t.replace(a, a + 'import org.koitharu.kotatsu.favourites.domain.FavouriteListLoadingMode\n', 1)
          if 'private val loadingMode = settings.observeAsFlow' not in t:
              a = '\tprivate val refreshTrigger = MutableStateFlow(Any())\n\tprivate val limit = MutableStateFlow(PAGE_SIZE)\n\tprivate val databaseWindow = MutableStateFlow(DATABASE_WINDOW_INITIAL)\n\tprivate val fromBottom = MutableStateFlow(false)\n'
              b = '\tprivate val refreshTrigger = MutableStateFlow(Any())\n\tprivate val limit = MutableStateFlow(PAGE_SIZE)\n\tprivate val databaseWindow = MutableStateFlow(DATABASE_WINDOW_INITIAL)\n\tprivate val loadingMode = settings.observeAsFlow(AppSettings.KEY_FAVOURITES_LIST_LOADING_MODE) { favouritesListLoadingMode }.stateIn(\n\t\tviewModelScope + Dispatchers.Default, SharingStarted.Eagerly, settings.favouritesListLoadingMode,\n\t)\n\tprivate val effectiveListLimit = combine(limit, loadingMode) { pageLimit, mode ->\n\t\tif (mode == FavouriteListLoadingMode.FULL) Int.MAX_VALUE else pageLimit\n\t}.stateIn(viewModelScope + Dispatchers.Default, SharingStarted.Eagerly, if (settings.favouritesListLoadingMode == FavouriteListLoadingMode.FULL) Int.MAX_VALUE else PAGE_SIZE)\n\tprivate val effectiveDatabaseWindow = combine(databaseWindow, loadingMode) { window, mode ->\n\t\tif (mode == FavouriteListLoadingMode.FULL) Int.MAX_VALUE else window\n\t}.stateIn(viewModelScope + Dispatchers.Default, SharingStarted.Eagerly, if (settings.favouritesListLoadingMode == FavouriteListLoadingMode.FULL) Int.MAX_VALUE else DATABASE_WINDOW_INITIAL)\n\tprivate val fromBottom = MutableStateFlow(false)\n'
              if a not in t: raise SystemExit('ViewModel state anchor not found')
              t = t.replace(a, b, 1)
          t = t.replace('\t\tlimit,\n\t\tdisplayPreferences.state,\n', '\t\teffectiveListLimit,\n\t\tdisplayPreferences.state,\n', 1)
          t = t.replace('\t\tval currentWindow = databaseWindow.value\n', '\t\tval currentWindow = effectiveDatabaseWindow.value\n', 1)
          if '\t\tif (loadingMode.value == FavouriteListLoadingMode.FULL) return\n' not in t:
              a = '\tfun requestMoreItems() {\n\t\tif (!isPaginationReady.compareAndSet(true, false)) return\n'
              b = '\tfun requestMoreItems() {\n\t\tif (loadingMode.value == FavouriteListLoadingMode.FULL) return\n\t\tif (!isPaginationReady.compareAndSet(true, false)) return\n'
              if a not in t: raise SystemExit('requestMoreItems anchor not found')
              t = t.replace(a, b, 1)
          t = t.replace('\tfun requestBottomPage(): Boolean {\n\t\tif (fromBottom.value) return false\n', '\tfun requestBottomPage(): Boolean {\n\t\tif (loadingMode.value == FavouriteListLoadingMode.FULL) return false\n\t\tif (fromBottom.value) return false\n', 1)
          t = t.replace('\tfun requestTopPage(): Boolean {\n\t\tif (!fromBottom.value) return false\n', '\tfun requestTopPage(): Boolean {\n\t\tif (loadingMode.value == FavouriteListLoadingMode.FULL) return false\n\t\tif (!fromBottom.value) return false\n', 1)
          t = t.replace('\t\tdatabaseWindow,\n\t\tcontentTypeStore.selectedType,\n', '\t\teffectiveDatabaseWindow,\n\t\tcontentTypeStore.selectedType,\n', 1)
          p.write_text(t)

          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/RootSettingsFragment.kt')
          t = p.read_text()
          if 'R.string.favourites_loading_mode' not in t:
              a = 'intArrayOf(R.string.favourites_scroll_mode),'
              if a not in t: raise SystemExit('Root settings anchor not found')
              p.write_text(t.replace(a, 'intArrayOf(R.string.favourites_scroll_mode, R.string.favourites_loading_mode),', 1))

          for path, entries in [
              ('app/src/main/res/values/strings_favourites_scroll.xml', [
                  '\t<string name="favourites_loading_mode">List loading mode</string>',
                  '\t<string name="favourites_loading_mode_paged">Paged (recommended)</string>',
                  '\t<string name="favourites_loading_mode_full">Full (all items)</string>',
                  '\t<string name="favourites_loading_mode_summary">Applies only to Favourites and Downloaded. Paged uses adaptive batches for lower memory use. Full prepares all list metadata so very large libraries can be scrolled directly; covers still load only near the screen. Explore and History are not affected.</string>',
              ]),
              ('app/src/main/res/values-in/strings_favourites_scroll.xml', [
                  '\t<string name="favourites_loading_mode">Mode pemuatan daftar</string>',
                  '\t<string name="favourites_loading_mode_paged">Bertahap (direkomendasikan)</string>',
                  '\t<string name="favourites_loading_mode_full">Penuh (semua item)</string>',
                  '\t<string name="favourites_loading_mode_summary">Hanya berlaku untuk Disukai dan Didownload. Bertahap memakai batch adaptif agar lebih hemat RAM. Penuh menyiapkan seluruh metadata daftar agar koleksi sangat besar bisa digulir langsung; cover tetap dimuat hanya saat mendekati layar. Jelajah dan Riwayat tidak terpengaruh.</string>',
              ]),
          ]:
              p = Path(path)
              t = p.read_text()
              if 'name="favourites_loading_mode"' not in t:
                  if '</resources>' not in t: raise SystemExit(f'{path} resources end not found')
                  p.write_text(t.replace('</resources>', '\n'.join(entries) + '\n</resources>', 1))

      - name: Verify Favourites loading mode
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FULL(R.string.favourites_loading_mode_full)' app/src/main/kotlin/org/koitharu/kotatsu/favourites/domain/FavouriteListLoadingMode.kt
          grep -q 'KEY_FAVOURITES_LIST_LOADING_MODE' app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/AppSettings.kt
          grep -q 'title = stringResource(R.string.favourites_loading_mode)' app/src/main/kotlin/org/koitharu/kotatsu/settings/FavouritesSettingsFragment.kt
          grep -q 'effectiveListLimit' app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt
          grep -q 'effectiveDatabaseWindow' app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt
          grep -q 'Penuh (semua item)' app/src/main/res/values-in/strings_favourites_scroll.xml

      - name: Commit Favourites loading mode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-favourites-loading-mode.yml
          git add app/src/main/kotlin/org/koitharu/kotatsu/favourites/domain/FavouriteListLoadingMode.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/AppSettings.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/FavouritesSettingsFragment.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/RootSettingsFragment.kt \
                  app/src/main/res/values/strings_favourites_scroll.xml \
                  app/src/main/res/values-in/strings_favourites_scroll.xml
          git commit -m "Add Favourites full list loading mode"
          git push
