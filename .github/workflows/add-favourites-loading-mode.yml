name: Add Favourites list loading mode

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/add-favourites-loading-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add paged and full Favourites loading modes
        shell: python
        run: |
          from pathlib import Path

          # Typed mode shared by Settings and Favourites list logic.
          mode_file = Path('app/src/main/kotlin/org/koitharu/kotatsu/favourites/domain/FavouriteListLoadingMode.kt')
          mode_file.write_text('''package org.koitharu.kotatsu.favourites.domain

import androidx.annotation.StringRes
import org.koitharu.kotatsu.R

/** Controls how much Favourites/Downloaded list metadata is exposed to RecyclerView. */
enum class FavouriteListLoadingMode(
\t@StringRes val titleResId: Int,
) {
\tPAGED(R.string.favourites_loading_mode_paged),
\tFULL(R.string.favourites_loading_mode_full),
}
''')

          # AppSettings: persisted mode, PAGED by default.
          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/AppSettings.kt')
          text = p.read_text()
          import_anchor = 'import org.koitharu.kotatsu.favourites.ui.list.FavouritesListFragment.Companion.NO_ID\n'
          # The exact import anchor above may not exist in AppSettings; use a stable nearby domain import instead.
          if 'import org.koitharu.kotatsu.favourites.domain.FavouriteListLoadingMode' not in text:
              anchor = 'import org.koitharu.kotatsu.explore.data.SourcesSortOrder\n'
              if anchor not in text:
                  raise SystemExit('AppSettings import anchor not found')
              text = text.replace(anchor, anchor + 'import org.koitharu.kotatsu.favourites.domain.FavouriteListLoadingMode\n', 1)
          prop_anchor = '''\tvar allFavoritesSortOrder: ListSortOrder
\t\tget() = prefs.getEnumValue(KEY_FAVORITES_ORDER, ListSortOrder.NEWEST)
\t\tset(value) = prefs.edit { putEnumValue(KEY_FAVORITES_ORDER, value) }
'''
          prop_insert = '''\n\tval favouritesListLoadingMode: FavouriteListLoadingMode
\t\tget() = prefs.getEnumValue(KEY_FAVOURITES_LIST_LOADING_MODE, FavouriteListLoadingMode.PAGED)
'''
          if 'val favouritesListLoadingMode:' not in text:
              if prop_anchor not in text:
                  raise SystemExit('AppSettings favourites property anchor not found')
              text = text.replace(prop_anchor, prop_anchor + prop_insert, 1)
          key_anchor = '\t\tconst val KEY_FAVORITES_ORDER = "fav_order"\n'
          if 'KEY_FAVOURITES_LIST_LOADING_MODE' not in text:
              if key_anchor not in text:
                  raise SystemExit('AppSettings favourites key anchor not found')
              text = text.replace(key_anchor, key_anchor + '\t\tconst val KEY_FAVOURITES_LIST_LOADING_MODE = "favourites_list_loading_mode"\n', 1)
          p.write_text(text)

          # Favourites settings UI: explicit two-choice list.
          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/FavouritesSettingsFragment.kt')
          text = p.read_text()
          if 'FavouriteListLoadingMode' not in text:
              text = text.replace(
                  'import org.koitharu.kotatsu.favourites.domain.FavouriteHeaderScrollMode\n',
                  'import org.koitharu.kotatsu.favourites.domain.FavouriteHeaderScrollMode\nimport org.koitharu.kotatsu.favourites.domain.FavouriteListLoadingMode\nimport org.koitharu.kotatsu.core.prefs.AppSettings\n',
                  1,
              )
          if 'PlainInfoSettingsItem' not in text:
              text = text.replace(
                  'import org.koitharu.kotatsu.settings.compose.ListSettingsItem\n',
                  'import org.koitharu.kotatsu.settings.compose.ListSettingsItem\nimport org.koitharu.kotatsu.settings.compose.PlainInfoSettingsItem\n',
                  1,
              )
          vars_anchor = '''\tval values = remember { FavouriteHeaderScrollMode.entries.map { it.name } }
\tvar mode by rememberStringPref(
\t\tFavouriteHeaderScrollMode.KEY_PREFERENCE,
\t\tFavouriteHeaderScrollMode.SCROLL_AWAY.name,
\t)
'''
          vars_new = '''\tval values = remember { FavouriteHeaderScrollMode.entries.map { it.name } }
\tval loadingEntries = remember {
\t\tFavouriteListLoadingMode.entries.map { context.getString(it.titleResId) }
\t}
\tval loadingValues = remember { FavouriteListLoadingMode.entries.map { it.name } }
\tvar mode by rememberStringPref(
\t\tFavouriteHeaderScrollMode.KEY_PREFERENCE,
\t\tFavouriteHeaderScrollMode.SCROLL_AWAY.name,
\t)
\tvar loadingMode by rememberStringPref(
\t\tAppSettings.KEY_FAVOURITES_LIST_LOADING_MODE,
\t\tFavouriteListLoadingMode.PAGED.name,
\t)
'''
          if 'loadingMode by rememberStringPref' not in text:
              if vars_anchor not in text:
                  raise SystemExit('Favourites settings variables anchor not found')
              text = text.replace(vars_anchor, vars_new, 1)
          row_anchor = '''\t\t\t\titem { pos ->
\t\t\t\t\tListSettingsItem(
\t\t\t\t\t\ttitle = stringResource(R.string.favourites_scroll_mode),
\t\t\t\t\t\tentries = entries,
\t\t\t\t\t\tentryValues = values,
\t\t\t\t\t\tselectedValue = mode,
\t\t\t\t\t\tonValueChange = { mode = it },
\t\t\t\t\t\ticon = R.drawable.ic_list,
\t\t\t\t\t\tshape = pos.shape,
\t\t\t\t\t)
\t\t\t\t}
'''
          row_new = row_anchor + '''\t\t\t\titem { pos ->
\t\t\t\t\tListSettingsItem(
\t\t\t\t\t\ttitle = stringResource(R.string.favourites_loading_mode),
\t\t\t\t\t\tentries = loadingEntries,
\t\t\t\t\t\tentryValues = loadingValues,
\t\t\t\t\t\tselectedValue = loadingMode,
\t\t\t\t\t\tonValueChange = { loadingMode = it },
\t\t\t\t\t\ticon = R.drawable.ic_list,
\t\t\t\t\t\tshape = pos.shape,
\t\t\t\t\t)
\t\t\t\t}
'''
          if 'title = stringResource(R.string.favourites_loading_mode)' not in text:
              if row_anchor not in text:
                  raise SystemExit('Favourites settings row anchor not found')
              text = text.replace(row_anchor, row_new, 1)
          info_anchor = '\t\titem { Spacer(Modifier.height(24.dp).fillMaxWidth()) }\n'
          info_new = '''\t\titem {
\t\t\tPlainInfoSettingsItem(
\t\t\t\ttext = stringResource(R.string.favourites_loading_mode_summary),
\t\t\t\ticon = R.drawable.ic_info_outline,
\t\t\t)
\t\t}
\t\titem { Spacer(Modifier.height(24.dp).fillMaxWidth()) }
'''
          if 'favourites_loading_mode_summary' not in text:
              if info_anchor not in text:
                  raise SystemExit('Favourites settings info anchor not found')
              text = text.replace(info_anchor, info_new, 1)
          p.write_text(text)

          # ViewModel: FULL exposes all metadata/list positions, PAGED keeps adaptive pagination.
          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt')
          text = p.read_text()
          if 'FavouriteListLoadingMode' not in text:
              import_anchor = 'import org.koitharu.kotatsu.favourites.domain.FavouriteContentTypeStore\n'
              if import_anchor not in text:
                  raise SystemExit('ViewModel import anchor not found')
              text = text.replace(import_anchor, import_anchor + 'import org.koitharu.kotatsu.favourites.domain.FavouriteListLoadingMode\n', 1)
          state_anchor = '''\tprivate val refreshTrigger = MutableStateFlow(Any())
\tprivate val limit = MutableStateFlow(PAGE_SIZE)
\tprivate val databaseWindow = MutableStateFlow(DATABASE_WINDOW_INITIAL)
\tprivate val fromBottom = MutableStateFlow(false)
'''
          state_new = '''\tprivate val refreshTrigger = MutableStateFlow(Any())
\tprivate val limit = MutableStateFlow(PAGE_SIZE)
\tprivate val databaseWindow = MutableStateFlow(DATABASE_WINDOW_INITIAL)
\tprivate val loadingMode = settings.observeAsFlow(
\t\tAppSettings.KEY_FAVOURITES_LIST_LOADING_MODE,
\t) { favouritesListLoadingMode }.stateIn(
\t\tviewModelScope + Dispatchers.Default,
\t\tSharingStarted.Eagerly,
\t\tsettings.favouritesListLoadingMode,
\t)
\tprivate val effectiveListLimit = combine(limit, loadingMode) { pageLimit, mode ->
\t\tif (mode == FavouriteListLoadingMode.FULL) Int.MAX_VALUE else pageLimit
\t}.stateIn(
\t\tviewModelScope + Dispatchers.Default,
\t\tSharingStarted.Eagerly,
\t\tif (settings.favouritesListLoadingMode == FavouriteListLoadingMode.FULL) Int.MAX_VALUE else PAGE_SIZE,
\t)
\tprivate val effectiveDatabaseWindow = combine(databaseWindow, loadingMode) { window, mode ->
\t\tif (mode == FavouriteListLoadingMode.FULL) Int.MAX_VALUE else window
\t}.stateIn(
\t\tviewModelScope + Dispatchers.Default,
\t\tSharingStarted.Eagerly,
\t\tif (settings.favouritesListLoadingMode == FavouriteListLoadingMode.FULL) Int.MAX_VALUE else DATABASE_WINDOW_INITIAL,
\t)
\tprivate val fromBottom = MutableStateFlow(false)
'''
          if 'private val loadingMode = settings.observeAsFlow' not in text:
              if state_anchor not in text:
                  raise SystemExit('ViewModel state anchor not found')
              text = text.replace(state_anchor, state_new, 1)
          text = text.replace(
              '\t\tlimit,\n\t\tdisplayPreferences.state,\n',
              '\t\teffectiveListLimit,\n\t\tdisplayPreferences.state,\n',
              1,
          )
          text = text.replace(
              '\t\tval currentWindow = databaseWindow.value\n',
              '\t\tval currentWindow = effectiveDatabaseWindow.value\n',
              1,
          )
          request_anchor = '''\tfun requestMoreItems() {
\t\tif (!isPaginationReady.compareAndSet(true, false)) return
'''
          request_new = '''\tfun requestMoreItems() {
\t\tif (loadingMode.value == FavouriteListLoadingMode.FULL) return
\t\tif (!isPaginationReady.compareAndSet(true, false)) return
'''
          if 'if (loadingMode.value == FavouriteListLoadingMode.FULL) return' not in text:
              if request_anchor not in text:
                  raise SystemExit('requestMoreItems anchor not found')
              text = text.replace(request_anchor, request_new, 1)
          bottom_anchor = '''\tfun requestBottomPage(): Boolean {
\t\tif (fromBottom.value) return false
'''
          bottom_new = '''\tfun requestBottomPage(): Boolean {
\t\tif (loadingMode.value == FavouriteListLoadingMode.FULL) return false
\t\tif (fromBottom.value) return false
'''
          if bottom_anchor not in text:
              raise SystemExit('requestBottomPage anchor not found')
          text = text.replace(bottom_anchor, bottom_new, 1)
          top_anchor = '''\tfun requestTopPage(): Boolean {
\t\tif (!fromBottom.value) return false
'''
          top_new = '''\tfun requestTopPage(): Boolean {
\t\tif (loadingMode.value == FavouriteListLoadingMode.FULL) return false
\t\tif (!fromBottom.value) return false
'''
          if top_anchor not in text:
              raise SystemExit('requestTopPage anchor not found')
          text = text.replace(top_anchor, top_new, 1)
          text = text.replace(
              '\t\tdatabaseWindow,\n\t\tcontentTypeStore.selectedType,\n',
              '\t\teffectiveDatabaseWindow,\n\t\tcontentTypeStore.selectedType,\n',
              1,
          )
          p.write_text(text)

          # Settings search should find the new Favourites option.
          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/RootSettingsFragment.kt')
          text = p.read_text()
          old = 'intArrayOf(R.string.favourites_scroll_mode),'
          new = 'intArrayOf(R.string.favourites_scroll_mode, R.string.favourites_loading_mode),'
          if new not in text:
              if old not in text:
                  raise SystemExit('Root settings search anchor not found')
              text = text.replace(old, new, 1)
          p.write_text(text)

          # Localized strings.
          p = Path('app/src/main/res/values/strings.xml')
          text = p.read_text()
          if 'name="favourites_loading_mode"' not in text:
              anchor = '    <string name="favourites_scroll_mode">Favourites header scrolling</string>'
              if anchor not in text:
                  raise SystemExit('English favourites string anchor not found')
              insert = anchor + '''
    <string name="favourites_loading_mode">List loading mode</string>
    <string name="favourites_loading_mode_paged">Paged (recommended)</string>
    <string name="favourites_loading_mode_full">Full (all items)</string>
    <string name="favourites_loading_mode_summary">Applies only to Favourites and Downloaded. Paged uses adaptive batches for lower memory use. Full prepares all list metadata so you can scroll directly through very large libraries; covers still load only near the screen. Explore and History are not affected.</string>'''
              text = text.replace(anchor, insert, 1)
              p.write_text(text)

          p = Path('app/src/main/res/values-in/strings.xml')
          text = p.read_text()
          if 'name="favourites_loading_mode"' not in text:
              anchor = '    <string name="favourites_scroll_mode">Mode gulir header Disukai</string>'
              if anchor not in text:
                  # fall back to a stable location if wording differs
                  anchor = '    <string name="download_page_progress">Halaman %1$d/%2$d</string>'
              if anchor not in text:
                  raise SystemExit('Indonesian string anchor not found')
              insert = anchor + '''
    <string name="favourites_loading_mode">Mode pemuatan daftar</string>
    <string name="favourites_loading_mode_paged">Bertahap (direkomendasikan)</string>
    <string name="favourites_loading_mode_full">Penuh (semua item)</string>
    <string name="favourites_loading_mode_summary">Hanya berlaku untuk Disukai dan Didownload. Bertahap memakai batch adaptif agar lebih hemat RAM. Penuh menyiapkan seluruh metadata daftar agar koleksi sangat besar bisa digulir langsung; cover tetap dimuat hanya saat mendekati layar. Jelajah dan Riwayat tidak terpengaruh.</string>'''
              text = text.replace(anchor, insert, 1)
              p.write_text(text)

      - name: Verify Favourites loading mode patch
        shell: bash
        run: |
          set -euo pipefail
          MODE=app/src/main/kotlin/org/koitharu/kotatsu/favourites/domain/FavouriteListLoadingMode.kt
          VM=app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt
          SET=app/src/main/kotlin/org/koitharu/kotatsu/settings/FavouritesSettingsFragment.kt
          APP=app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/AppSettings.kt
          ROOT=app/src/main/kotlin/org/koitharu/kotatsu/settings/RootSettingsFragment.kt
          grep -q 'PAGED(R.string.favourites_loading_mode_paged)' "$MODE"
          grep -q 'FULL(R.string.favourites_loading_mode_full)' "$MODE"
          grep -q 'KEY_FAVOURITES_LIST_LOADING_MODE' "$APP"
          grep -q 'FavouriteListLoadingMode.PAGED' "$APP"
          grep -q 'title = stringResource(R.string.favourites_loading_mode)' "$SET"
          grep -q 'FavouriteListLoadingMode.FULL) Int.MAX_VALUE' "$VM"
          grep -q 'if (loadingMode.value == FavouriteListLoadingMode.FULL) return' "$VM"
          grep -q 'effectiveDatabaseWindow' "$VM"
          grep -q 'R.string.favourites_loading_mode' "$ROOT"
          ! grep -q 'Explore.*KEY_FAVOURITES_LIST_LOADING_MODE' "$VM"

      - name: Commit Favourites loading mode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-favourites-loading-mode.yml
          git add app/src/main/kotlin/org/koitharu/kotatsu/favourites/domain/FavouriteListLoadingMode.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/AppSettings.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/FavouritesSettingsFragment.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/settings/RootSettingsFragment.kt \
                  app/src/main/res/values/strings.xml \
                  app/src/main/res/values-in/strings.xml
          git commit -m "Add Favourites full list loading mode"
          git push
