name: Fix Details interactions once

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/fix-details-interactions-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix favourite feedback and download spinner actions
        shell: python
        run: |
          from pathlib import Path

          details = Path('app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsChapterComponents.kt')
          text = details.read_text()

          import_anchor = 'import androidx.compose.material3.CircularProgressIndicator\n'
          import_replacement = import_anchor + 'import androidx.compose.material3.DropdownMenu\nimport androidx.compose.material3.DropdownMenuItem\n'
          if 'import androidx.compose.material3.DropdownMenu\n' not in text:
              if import_anchor not in text:
                  raise SystemExit('Details Material3 import anchor not found')
              text = text.replace(import_anchor, import_replacement, 1)

          runtime_anchor = 'import androidx.compose.runtime.Composable\n'
          runtime_replacement = runtime_anchor + 'import androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.setValue\n'
          if 'import androidx.compose.runtime.mutableStateOf\n' not in text:
              if runtime_anchor not in text:
                  raise SystemExit('Details runtime import anchor not found')
              text = text.replace(runtime_anchor, runtime_replacement, 1)

          state_anchor = '\tval context = LocalContext.current\n\tval palette = LocalMiyorareVisualPalette.current\n'
          state_replacement = state_anchor + '\tvar showDownloadMenu by remember(item.chapter.id, item.chapter.url) { mutableStateOf(false) }\n'
          if 'var showDownloadMenu by remember(item.chapter.id, item.chapter.url)' not in text:
              if state_anchor not in text:
                  raise SystemExit('InlineChapterCard state anchor not found')
              # This anchor exists only in InlineChapterCard in the current file.
              text = text.replace(state_anchor, state_replacement, 1)

          old_spinner = '''\t\t\t\titem.isDownloading -> Box(modifier = Modifier.size(48.dp), contentAlignment = Alignment.Center) {\n\t\t\t\t\tCircularProgressIndicator(\n\t\t\t\t\t\tmodifier = Modifier.size(if (palette.isModern) 18.dp else 20.dp),\n\t\t\t\t\t\tstrokeWidth = 2.dp,\n\t\t\t\t\t\tcolor = if (palette.isModern) palette.primary else accent,\n\t\t\t\t\t)\n\t\t\t\t}\n'''
          new_spinner = '''\t\t\t\titem.isDownloading -> Box {\n\t\t\t\t\tBox(\n\t\t\t\t\t\tmodifier = Modifier\n\t\t\t\t\t\t\t.size(48.dp)\n\t\t\t\t\t\t\t.clickable { showDownloadMenu = true },\n\t\t\t\t\t\tcontentAlignment = Alignment.Center,\n\t\t\t\t\t) {\n\t\t\t\t\t\tCircularProgressIndicator(\n\t\t\t\t\t\t\tmodifier = Modifier.size(if (palette.isModern) 18.dp else 20.dp),\n\t\t\t\t\t\t\tstrokeWidth = 2.dp,\n\t\t\t\t\t\t\tcolor = if (palette.isModern) palette.primary else accent,\n\t\t\t\t\t\t)\n\t\t\t\t\t}\n\t\t\t\t\tDropdownMenu(\n\t\t\t\t\t\texpanded = showDownloadMenu,\n\t\t\t\t\t\tonDismissRequest = { showDownloadMenu = false },\n\t\t\t\t\t) {\n\t\t\t\t\t\tDropdownMenuItem(\n\t\t\t\t\t\t\ttext = { Text(stringResource(R.string.chapter_download_start_now)) },\n\t\t\t\t\t\t\tonClick = {\n\t\t\t\t\t\t\t\tshowDownloadMenu = false\n\t\t\t\t\t\t\t\tonDownloadClick()\n\t\t\t\t\t\t\t},\n\t\t\t\t\t\t)\n\t\t\t\t\t\tDropdownMenuItem(\n\t\t\t\t\t\t\ttext = { Text(stringResource(android.R.string.cancel)) },\n\t\t\t\t\t\t\tonClick = { showDownloadMenu = false },\n\t\t\t\t\t\t)\n\t\t\t\t\t}\n\t\t\t\t}\n'''
          if old_spinner not in text:
              raise SystemExit('Downloading spinner anchor not found')
          text = text.replace(old_spinner, new_spinner, 1)
          details.write_text(text)

          duplicates = Path('app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/duplicates/DuplicatesSheet.kt')
          text = duplicates.read_text()

          compose_import_anchor = 'import androidx.compose.runtime.collectAsState\n'
          compose_imports = '''import androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.padding\nimport androidx.compose.material3.CircularProgressIndicator\nimport androidx.compose.material3.MaterialTheme\n''' + compose_import_anchor
          if 'import androidx.compose.foundation.layout.Box\n' not in text:
              if compose_import_anchor not in text:
                  raise SystemExit('Duplicates Compose import anchor not found')
              text = text.replace(compose_import_anchor, compose_imports, 1)

          ui_import_anchor = 'import androidx.compose.ui.platform.ViewCompositionStrategy\n'
          ui_imports = 'import androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\n' + ui_import_anchor + 'import androidx.compose.ui.unit.dp\n'
          if 'import androidx.compose.ui.Alignment\n' not in text:
              if ui_import_anchor not in text:
                  raise SystemExit('Duplicates UI import anchor not found')
              text = text.replace(ui_import_anchor, ui_imports, 1)

          old_content = '''\t\t\tDropSauceTheme {\n\t\t\t\tval state by viewModel.state.collectAsState()\n\t\t\t\tif (state is DuplicatesState.Ask) {\n\t\t\t\t\tDuplicatesContent(\n\t\t\t\t\t\tstate = state as DuplicatesState.Ask,\n\t\t\t\t\t\timageLoader = coil,\n\t\t\t\t\t\tonSkip = viewModel::skip,\n\t\t\t\t\t\tonAddAnyway = viewModel::addAnyway,\n\t\t\t\t\t\t// Preview opens the real details screen; the sheet survives behind it and is\n\t\t\t\t\t\t// still waiting on this same card when the user comes back.\n\t\t\t\t\t\tonPreview = { router.openDetails(it.manga) },\n\t\t\t\t\t\tonReplace = { viewModel.replaceWith(it.manga) },\n\t\t\t\t\t\tonDisableCheck = viewModel::disableDuplicateCheck,\n\t\t\t\t\t\tonMigrateProgressChanged = viewModel::setProgressMigrated,\n\t\t\t\t\t)\n\t\t\t\t}\n\t\t\t}\n'''
          new_content = '''\t\t\tDropSauceTheme {\n\t\t\t\tval state by viewModel.state.collectAsState()\n\t\t\t\twhen (val current = state) {\n\t\t\t\t\tis DuplicatesState.Checking -> Box(\n\t\t\t\t\t\tmodifier = Modifier\n\t\t\t\t\t\t\t.fillMaxWidth()\n\t\t\t\t\t\t\t.padding(vertical = 28.dp),\n\t\t\t\t\t\tcontentAlignment = Alignment.Center,\n\t\t\t\t\t) {\n\t\t\t\t\t\tCircularProgressIndicator(color = MaterialTheme.colorScheme.primary)\n\t\t\t\t\t}\n\n\t\t\t\t\tis DuplicatesState.Ask -> DuplicatesContent(\n\t\t\t\t\t\tstate = current,\n\t\t\t\t\t\timageLoader = coil,\n\t\t\t\t\t\tonSkip = viewModel::skip,\n\t\t\t\t\t\tonAddAnyway = viewModel::addAnyway,\n\t\t\t\t\t\t// Preview opens the real details screen; the sheet survives behind it and is\n\t\t\t\t\t\t// still waiting on this same card when the user comes back.\n\t\t\t\t\t\tonPreview = { router.openDetails(it.manga) },\n\t\t\t\t\t\tonReplace = { viewModel.replaceWith(it.manga) },\n\t\t\t\t\t\tonDisableCheck = viewModel::disableDuplicateCheck,\n\t\t\t\t\t\tonMigrateProgressChanged = viewModel::setProgressMigrated,\n\t\t\t\t\t)\n\t\t\t\t}\n\t\t\t}\n'''
          if old_content not in text:
              raise SystemExit('Duplicates content anchor not found')
          text = text.replace(old_content, new_content, 1)

          if '\t\tsetContentVisible(false)\n' not in text:
              raise SystemExit('Initial hidden-state anchor not found')
          text = text.replace('\t\tsetContentVisible(false)\n', '\t\tsetContentVisible(true)\n', 1)

          old_start = '\t\tsetContentVisible(viewModel.state.value !is DuplicatesState.Checking)\n'
          if old_start not in text:
              raise SystemExit('onStart visibility anchor not found')
          text = text.replace(old_start, '\t\tsetContentVisible(true)\n', 1)

          old_checking = '\t\t\tis DuplicatesState.Checking -> setContentVisible(false)\n'
          if old_checking not in text:
              raise SystemExit('Checking visibility anchor not found')
          text = text.replace(old_checking, '\t\t\tis DuplicatesState.Checking -> setContentVisible(true)\n', 1)

          old_comment = '''\t/**\n\t * The sheet starts transparent while its cheap duplicate query resolves. If the check ever grows\n\t * slow enough to be visible here, move it in front of the sheet instead of adding a spinner.\n\t */\n'''
          new_comment = '''\t/** Keep the sheet visible while duplicate checking runs so a favourite tap responds immediately. */\n'''
          if old_comment not in text:
              raise SystemExit('Visibility comment anchor not found')
          text = text.replace(old_comment, new_comment, 1)
          duplicates.write_text(text)

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'item.isDownloading -> Box {' app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsChapterComponents.kt
          grep -q 'clickable { showDownloadMenu = true }' app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsChapterComponents.kt
          grep -q 'R.string.chapter_download_start_now' app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsChapterComponents.kt
          grep -q 'DuplicatesState.Checking -> Box' app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/duplicates/DuplicatesSheet.kt

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-details-interactions-once.yml
          git add app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsChapterComponents.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/duplicates/DuplicatesSheet.kt \
                  .github/workflows/fix-details-interactions-once.yml
          git commit -m "Fix favourite response and download spinner actions"
          git push
