name: Release Build Profile

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Explicit candidate version name (must be greater than the latest stable tag).'
        required: true
        type: string
      version_code:
        description: 'Explicit candidate Android versionCode (must be greater than the latest stable APK).'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-release:
    name: Profile release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Require beta for manual profiling
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "beta" ]] || {
            echo "::error::Manual release profiling is allowed only from beta."
            exit 1
          }

      - name: Require final identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "applicationId = 'org.noirero.miyorare'" app/build.gradle
          python3 .github/scripts/release_build_config_guard.py app/build.gradle
          grep -Fq '<string name="github_updates_repo" translatable="false">Noirero/Miyorare</string>' app/src/main/res/values/constants.xml

      - name: Validate explicit candidate version
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          STABLE_VERSION_CODE: '212453408'
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Candidate version_name must be a three-part numeric version."
            exit 1
          }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || {
            echo "::error::Candidate version_code must be numeric."
            exit 1
          }
          (( VERSION_CODE > STABLE_VERSION_CODE )) || {
            echo "::error::Candidate versionCode must be greater than stable v1.4.4 ($STABLE_VERSION_CODE)."
            exit 1
          }
          (( VERSION_CODE <= 2100000000 )) || {
            echo "::error::Candidate versionCode is too large."
            exit 1
          }

      - name: Require stable release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Apply build-only version
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path('app/build.gradle')
          text = path.read_text()
          text, count_name = re.subn(r"versionName = '[^']+'", f"versionName = '{os.environ['VERSION_NAME']}'", text, count=1)
          text, count_code = re.subn(r'versionCode = \\d+', f"versionCode = {os.environ['VERSION_CODE']}", text, count=1)
          if count_name != 1 or count_code != 1:
              raise SystemExit('Could not update versionName/versionCode exactly once')
          path.write_text(text)
          PY

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test profile summarizer
        run: python3 .github/scripts/test_summarize_gradle_profile.py

      - name: Profile release build
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/ci-profile
          /usr/bin/time -v \
            -o build/ci-profile/resource-usage.txt \
            ./gradlew :app:assembleRelease \
              -PRELEASE_STORE_FILE=../release.keystore \
              -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
              --profile \
              --max-workers=4 \
              --no-daemon \
              --stacktrace \
            2>&1 | tee build/ci-profile/gradle-release.log

          echo "Resource usage:"
          cat build/ci-profile/resource-usage.txt

      - name: Summarize slowest Gradle tasks
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/summarize_gradle_profile.py \
            --profile-dir build/reports/profile \
            --top 20 \
            | tee build/ci-profile/top-tasks.txt

          {
            echo "### Release build profile"
            echo
            cat build/ci-profile/top-tasks.txt
            echo
            echo "Resource usage:"
            cat build/ci-profile/resource-usage.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record release APK checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          sha256sum "$APK_PATH" | tee build/ci-profile/release-apk.sha256

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload profiling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-profile-${{ github.sha }}
          path: |
            build/reports/profile/
            build/ci-profile/
          if-no-files-found: warn
          retention-days: 14
