name: Fix download constraint state

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/fix-download-constraint-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Preserve task data on constraint update
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/org/koitharu/kotatsu/download/ui/worker/DownloadWorker.kt')
          text = path.read_text()
          old = '''\t\t\t\tval request = OneTimeWorkRequestBuilder<DownloadWorker>()\n\t\t\t\t\t.setConstraints(constraints)\n\t\t\t\t\t.addTag(TAG)\n\t\t\t\t\t.setId(work.id)\n\t\t\t\t\t.setExpedited(OutOfQuotaPolicy.RUN_AS_NON_EXPEDITED_WORK_REQUEST)\n\t\t\t\t\t.build()\n'''
          new = '''\t\t\t\tval inputData = workManager.getWorkInputData(work.id) ?: continue\n\t\t\t\tval request = OneTimeWorkRequestBuilder<DownloadWorker>()\n\t\t\t\t\t.setConstraints(constraints)\n\t\t\t\t\t.addTag(TAG)\n\t\t\t\t\t.keepResultsForAtLeast(30, TimeUnit.DAYS)\n\t\t\t\t\t.setBackoffCriteria(BackoffPolicy.LINEAR, 10, TimeUnit.SECONDS)\n\t\t\t\t\t.setInputData(inputData)\n\t\t\t\t\t.setId(work.id)\n\t\t\t\t\t.setExpedited(OutOfQuotaPolicy.RUN_AS_NON_EXPEDITED_WORK_REQUEST)\n\t\t\t\t\t.build()\n'''
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'Expected exactly one constraint update block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git add app/src/main/kotlin/org/koitharu/kotatsu/download/ui/worker/DownloadWorker.kt
          git diff --cached --check
          git commit -m "Preserve download task data when updating constraints"
          git push
