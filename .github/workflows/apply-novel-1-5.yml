name: Apply Novel 1-5 cleanup

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/apply-novel-1-5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Centralize Favourites Novel classification
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt')
          text = path.read_text()

          def once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Favourites patch expected 1 match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          once(
              'import org.koitharu.kotatsu.core.model.isLocal\nimport org.koitharu.kotatsu.core.model.isNovelSource\n',
              'import org.koitharu.kotatsu.core.model.isLocal\nimport org.koitharu.kotatsu.core.model.isNovelContent\n',
          )
          once(
              'val typed = candidates.filter { manga -> isNovelContent(manga) == wantNovel }',
              'val typed = candidates.filter { manga -> manga.isNovelContent == wantNovel }',
          )
          once(
              '''\n\tprivate fun isNovelContent(manga: Manga): Boolean {\n\t\tif (!manga.source.isLocal) return manga.source.isNovelSource\n\t\tval normalizedUrl = manga.url.replace('\\\\', '/')\n\t\treturn normalizedUrl.contains("/00.Novel/", ignoreCase = true) ||\n\t\t\tnormalizedUrl.substringBefore('#').substringBefore('?').endsWith(".epub", ignoreCase = true)\n\t}\n''',
              '\n',
          )
          path.write_text(text)
          PY
          git diff --check
          git add app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/list/FavouritesListViewModel.kt
          git diff --cached --check
          git commit -m "Use unified Novel classification in favourites list"
          git push

      - name: Make Novel download format explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fragment = Path('app/src/main/kotlin/org/koitharu/kotatsu/download/ui/dialog/DownloadDialogFragment.kt')
          text = fragment.read_text()

          def once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Download dialog patch expected 1 match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          once(
              'import org.koitharu.kotatsu.R\nimport org.koitharu.kotatsu.core.nav.AppRouter\n',
              'import org.koitharu.kotatsu.R\nimport org.koitharu.kotatsu.core.model.isNovelContent\nimport org.koitharu.kotatsu.core.nav.AppRouter\n',
          )
          once(
              '\t\tval isOptionsLoading by viewModel.isOptionsLoading.collectAsState()\n\n\t\tvar selectedOption',
              '\t\tval isOptionsLoading by viewModel.isOptionsLoading.collectAsState()\n\t\tval isNovelOnly = remember { viewModel.manga.isNotEmpty() && viewModel.manga.all { it.isNovelContent } }\n\n\t\tvar selectedOption',
          )
          once(
              '\t\tLaunchedEffect(defaultFormat) { defaultFormat?.let { formatIndex = it.ordinal } }',
              '\t\tLaunchedEffect(defaultFormat, isNovelOnly) {\n\t\t\tformatIndex = if (isNovelOnly) -1 else defaultFormat?.ordinal ?: -1\n\t\t}',
          )
          once(
              '''\t\t\t\t\t\tSelectorField(\n\t\t\t\t\t\t\tlabel = stringResource(R.string.preferred_download_format),\n\t\t\t\t\t\t\tcurrent = formatLabels.getOrNull(formatIndex) ?: "",\n\t\t\t\t\t\t\titems = formatLabels.toList(),\n\t\t\t\t\t\t\tonSelect = { formatIndex = it },\n\t\t\t\t\t\t)\n''',
              '''\t\t\t\t\t\tif (isNovelOnly) {\n\t\t\t\t\t\t\tStaticField(\n\t\t\t\t\t\t\t\tlabel = stringResource(R.string.preferred_download_format),\n\t\t\t\t\t\t\t\tcurrent = stringResource(R.string.novel_download_format_epub),\n\t\t\t\t\t\t\t)\n\t\t\t\t\t\t} else {\n\t\t\t\t\t\t\tSelectorField(\n\t\t\t\t\t\t\t\tlabel = stringResource(R.string.preferred_download_format),\n\t\t\t\t\t\t\t\tcurrent = formatLabels.getOrNull(formatIndex) ?: "",\n\t\t\t\t\t\t\t\titems = formatLabels.toList(),\n\t\t\t\t\t\t\t\tonSelect = { formatIndex = it },\n\t\t\t\t\t\t\t)\n\t\t\t\t\t\t}\n''',
          )
          once(
              '\t@Composable\n\tprivate fun SelectorField(\n',
              '''\t@Composable\n\tprivate fun StaticField(\n\t\tlabel: String,\n\t\tcurrent: String,\n\t) {\n\t\tColumn(modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp)) {\n\t\t\tText(\n\t\t\t\ttext = label,\n\t\t\t\tstyle = MaterialTheme.typography.titleSmall,\n\t\t\t\tcolor = MaterialTheme.colorScheme.onSurface,\n\t\t\t\tmodifier = Modifier.padding(bottom = 4.dp),\n\t\t\t)\n\t\t\tText(\n\t\t\t\ttext = current,\n\t\t\t\tstyle = MaterialTheme.typography.bodyLarge,\n\t\t\t\tcolor = MaterialTheme.colorScheme.onSurfaceVariant,\n\t\t\t\tmodifier = Modifier.padding(vertical = 8.dp),\n\t\t\t)\n\t\t}\n\t}\n\n\t@Composable\n\tprivate fun SelectorField(\n''',
          )
          fragment.write_text(text)

          vm = Path('app/src/main/kotlin/org/koitharu/kotatsu/download/ui/dialog/DownloadDialogViewModel.kt')
          vm_text = vm.read_text()
          old = 'import org.koitharu.kotatsu.R\nimport org.koitharu.kotatsu.core.model.getPreferredBranch\n'
          new = 'import org.koitharu.kotatsu.R\nimport org.koitharu.kotatsu.core.model.getPreferredBranch\nimport org.koitharu.kotatsu.core.model.isNovelContent\n'
          if vm_text.count(old) != 1:
              raise RuntimeError('DownloadDialogViewModel import target mismatch')
          vm_text = vm_text.replace(old, new, 1)
          old = '\t\t\t\t\tformat = format,\n'
          new = '\t\t\t\t\tformat = if (m.isNovelContent) null else format,\n'
          if vm_text.count(old) != 1:
              raise RuntimeError('DownloadDialogViewModel format target mismatch')
          vm.write_text(vm_text.replace(old, new, 1))

          values = Path('app/src/main/res/values/strings_novel_download.xml')
          values_in = Path('app/src/main/res/values-in/strings_novel_download.xml')
          values.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="novel_download_format_epub">EPUB (Novel)</string>\n</resources>\n''')
          values_in.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="novel_download_format_epub">EPUB (Novel)</string>\n</resources>\n''')
          PY
          git diff --check
          git add app/src/main/kotlin/org/koitharu/kotatsu/download/ui/dialog/DownloadDialogFragment.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/download/ui/dialog/DownloadDialogViewModel.kt \
                  app/src/main/res/values/strings_novel_download.xml \
                  app/src/main/res/values-in/strings_novel_download.xml
          git diff --cached --check
          git commit -m "Show EPUB-only format for Novel downloads"
          git push
