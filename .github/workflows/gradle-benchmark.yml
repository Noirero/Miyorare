name: Gradle Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - beta
    paths:
      - '.github/workflows/gradle-benchmark.yml'
      - '.github/scripts/gradle_benchmark_summary.py'
      - '.github/scripts/test_gradle_benchmark_summary.py'

permissions:
  contents: read

concurrency:
  group: gradle-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  benchmark:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline-8w-8g
            workers: 8
            heap: 8g
          - label: 4w-8g
            workers: 4
            heap: 8g
          - label: 4w-6g
            workers: 4
            heap: 6g
          - label: 4w-4g
            workers: 4
            heap: 4g
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Benchmark controlled Gradle configuration
        shell: bash
        env:
          WORKERS: ${{ matrix.workers }}
          HEAP: ${{ matrix.heap }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p build/ci-benchmark
          common=(
            --no-daemon
            --stacktrace
            "--max-workers=$WORKERS"
            "-Dorg.gradle.jvmargs=-Xmx$HEAP"
            "-Dkotlin.daemon.jvm.options=-Xmx$HEAP"
          )

          measure() {
            local name="$1"
            shift
            /usr/bin/time -f '{"elapsed_seconds":%e,"max_rss_kb":%M}'               -o "build/ci-benchmark/$name.resource.json"               ./gradlew "$@" "${common[@]}"               2>&1 | tee "build/ci-benchmark/$name.log"
          }

          ./gradlew clean "${common[@]}"
          measure cold-unit :app:testDebugUnitTest

          measure warm-unit :app:testDebugUnitTest

          ./gradlew clean "${common[@]}"
          measure cold-preview :app:assemblePreview

          measure warm-preview :app:assemblePreview

          ./gradlew clean "${common[@]}"
          measure compile :app:compileDebugUnitTestKotlin

          python3 .github/scripts/gradle_benchmark_summary.py             --input build/ci-benchmark             --label "$LABEL"             --workers "$WORKERS"             --heap "$HEAP"             --output "build/ci-benchmark/$LABEL.json"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-benchmark-${{ matrix.label }}-${{ github.sha }}
          path: build/ci-benchmark/
          if-no-files-found: error
          retention-days: 30
