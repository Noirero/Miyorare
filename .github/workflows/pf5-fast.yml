name: PF5 Fast Gate

on:
  push:
    branches:
      - pf5
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fast:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply Private workspace batch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "pf5"
          python3 tools/pf5_private_workspace_batch.py
          python3 tools/pf5_private_workspace_fix1.py
          git diff --check
          grep -q 'PrivateWorkspaceFragment' app/src/main/kotlin/org/koitharu/kotatsu/favourites/ui/FavouritesActivity.kt
          grep -q 'private_nav_feed' app/src/main/res/menu/menu_private_workspace.xml
          grep -q 'observeAllPrivate' app/src/main/kotlin/org/koitharu/kotatsu/history/data/HistoryDao.kt
          grep -q 'observeAllPrivate' app/src/main/kotlin/org/koitharu/kotatsu/core/db/dao/TrackLogsDao.kt
          ! grep -q 'private_action_settings' app/src/main/res/layout/fragment_favourites_container.xml

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION=$(grep 'parsers = ' gradle/libs.versions.toml | sed 's/.*= "\(.*\)"/\1/')
          POM_URL="https://jitpack.io/com/github/YakaTeam/kotatsu-parsers/${PARSERS_VERSION}/kotatsu-parsers-${PARSERS_VERSION}.pom"
          for i in $(seq 1 8); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$POM_URL")" = "200" ] && exit 0
            sleep 10
          done
          exit 1

      - name: Compile JVM source
        run: ./gradlew :app:compileDebugUnitTestKotlin --no-daemon --stacktrace

      - name: Targeted Private regression
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests org.koitharu.kotatsu.main.ui.protect.ScreenshotPolicyHelperTest \
            --tests org.koitharu.kotatsu.reader.ui.tts.ReaderTtsPrivacyPolicyTest \
            --tests org.koitharu.kotatsu.history.data.TrackingProgressPolicyTest

      - name: Require stable signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build signed PF5 APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assemblePreview --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=../release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          APK=$(find app/build/outputs/apk/preview -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" Miyorare-PF5-PrivateWorkspace.apk

      - name: Commit validated batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main
          git commit -m 'Add complete Private workspace navigation'
          git push origin HEAD:pf5

      - name: Upload PF5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Miyorare-PF5-PrivateWorkspace
          path: Miyorare-PF5-PrivateWorkspace.apk
          if-no-files-found: error
          retention-days: 14
