name: PF5 Fast Gate

# Automatic source validation for ordinary PF5 development commits.
# This workflow never signs, builds, or uploads an APK.
on:
  push:
    branches:
      - pf5
    paths:
      - 'app/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Diff sanity
        run: git diff --check HEAD^ HEAD

      - name: Pre-warm JitPack dependencies
        shell: bash
        run: bash .github/scripts/prewarm_jitpack.sh

      - name: Compile JVM source
        run: ./gradlew :app:compileDebugUnitTestKotlin --no-daemon --stacktrace

      - name: Targeted Private regression
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests org.koitharu.kotatsu.main.ui.protect.ScreenshotPolicyHelperTest \
            --tests org.koitharu.kotatsu.reader.ui.tts.ReaderTtsPrivacyPolicyTest \
            --tests org.koitharu.kotatsu.history.data.TrackingProgressPolicyTest
