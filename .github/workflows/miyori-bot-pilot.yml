name: Miyori Bot Pilot

on:
  workflow_dispatch:
    inputs:
      target_number:
        description: 'Issue or pull request number that Miyori Bot should comment on'
        required: true
        type: string
  push:
    branches:
      - feat/miyori-bot-pr-comments

permissions:
  contents: read

concurrency:
  group: miyori-bot-pilot
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Miyori Bot identity
    runs-on: ubuntu-latest
    env:
      TARGET_NUMBER: ${{ inputs.target_number || '772' }}
    steps:
      - name: Validate target number
        shell: bash
        env:
          TARGET_NUMBER: ${{ env.TARGET_NUMBER }}
        run: |
          set -euo pipefail
          [[ "$TARGET_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::target_number must be a positive integer."
            exit 1
          }

      - name: Generate Miyori Bot installation token
        id: miyori-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MIYORI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MIYORI_BOT_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Verify GitHub App bot identity
        shell: bash
        env:
          GH_TOKEN: ${{ steps.miyori-token.outputs.token }}
          APP_SLUG: ${{ steps.miyori-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          [[ -n "$APP_SLUG" ]] || {
            echo "::error::GitHub App token did not return an app slug."
            exit 1
          }

          BOT_LOGIN="${APP_SLUG}[bot]"
          ACTUAL_LOGIN="$(gh api "/users/${BOT_LOGIN}" --jq '.login')"
          [[ "$ACTUAL_LOGIN" == "$BOT_LOGIN" ]] || {
            echo "::error::Resolved bot login '$ACTUAL_LOGIN' did not match expected '$BOT_LOGIN'."
            exit 1
          }

          echo "Authenticated GitHub App bot: $BOT_LOGIN"

      - name: Post pilot verification comment as Miyori Bot
        shell: bash
        env:
          GH_TOKEN: ${{ steps.miyori-token.outputs.token }}
          TARGET_NUMBER: ${{ env.TARGET_NUMBER }}
          APP_SLUG: ${{ steps.miyori-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          🌸 **Miyori Bot PR-comment pilot passed.**

          Authentication succeeded as \`${APP_SLUG}[bot]\` using a repository-scoped GitHub App installation token.

          This pilot can write issue/PR conversation comments. It does not push code, merge branches, publish releases, or replace \`github-actions[bot]\`.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${TARGET_NUMBER}/comments" \
            -f body="$BODY"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Miyori Bot pilot"
            echo
            echo "- Target issue/PR: #${TARGET_NUMBER}"
            echo "- App slug: \`${{ steps.miyori-token.outputs.app-slug }}\`"
            echo "- Scope: issue/PR conversation comments only"
            echo "- Existing github-actions[bot] automation: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
