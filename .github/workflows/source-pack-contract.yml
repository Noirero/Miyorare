name: Source Pack Compatibility Contract

on:
  pull_request:
    paths:
      - 'compatibility/miyorare-source-pack-contract.v1.json'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/tsuki/**'
      - '.github/workflows/source-pack-contract.yml'
      - '.github/workflows/main-build.yml'
      - '.github/scripts/source_pack_readiness.py'
      - '.github/scripts/test_source_pack_readiness.py'
      - '.github/scripts/release_version.py'
      - '.github/scripts/test_release_version.py'
      - '.github/workflows/miyorare-farm-pack-membership-sync.yml'
      - 'extensions/miyorare-sources/tools/sync_approved_farm_sources.py'
      - 'extensions/miyorare-sources/tools/test_sync_approved_farm_sources.py'
  push:
    branches: [main, beta]
    paths:
      - 'compatibility/miyorare-source-pack-contract.v1.json'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/tsuki/**'
      - '.github/workflows/source-pack-contract.yml'
      - '.github/workflows/main-build.yml'
      - '.github/scripts/source_pack_readiness.py'
      - '.github/scripts/test_source_pack_readiness.py'
      - '.github/scripts/release_version.py'
      - '.github/scripts/test_release_version.py'
      - '.github/workflows/miyorare-farm-pack-membership-sync.yml'
      - 'extensions/miyorare-sources/tools/sync_approved_farm_sources.py'
      - 'extensions/miyorare-sources/tools/test_sync_approved_farm_sources.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Miyorare
        uses: actions/checkout@v5

      - name: Test stable Source Pack readiness gate
        run: |
          python3 -m py_compile .github/scripts/source_pack_readiness.py
          python3 .github/scripts/test_source_pack_readiness.py

      - name: Test stable release version resolver
        run: |
          python3 -m py_compile .github/scripts/release_version.py
          python3 .github/scripts/test_release_version.py

      - name: Test Compatibility Farm membership sync engine
        run: |
          python3 -m py_compile extensions/miyorare-sources/tools/sync_approved_farm_sources.py
          python3 extensions/miyorare-sources/tools/test_sync_approved_farm_sources.py

      - name: Checkout Source Packs contract
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare-Source-Packs
          ref: main
          path: source-packs
          sparse-checkout: |
            compatibility/miyorare-source-pack-contract.v1.json
          sparse-checkout-cone-mode: false

      - name: Validate identical contract and runtime enforcement
        shell: bash
        run: |
          set -euo pipefail
          LOCAL=compatibility/miyorare-source-pack-contract.v1.json
          REMOTE=source-packs/compatibility/miyorare-source-pack-contract.v1.json
          cmp --silent "$LOCAL" "$REMOTE" || {
            echo "::error::Miyorare and Source Packs compatibility contracts differ."
            diff -u "$REMOTE" "$LOCAL" || true
            exit 1
          }

          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path('compatibility/miyorare-source-pack-contract.v1.json').read_text(encoding='utf-8'))
          assert contract['schemaVersion'] == 1
          assert contract['consumer']['repository'] == 'Noirero/Miyorare'
          assert contract['consumer']['applicationId'] == 'org.noirero.miyorare'
          assert contract['producer']['repository'] == 'Noirero/Miyorare-Source-Packs'
          assert contract['format']['digestAlgorithm'] == 'sha256'
          assert contract['format']['logicalPackManifestSchema'] == 2
          assert contract['runtime']['atomicLogicalPackInstall'] is True
          assert contract['runtime']['rollbackOnPartialInstallFailure'] is True
          assert contract['runtime']['downgradeProtection'] is True
          assert contract['runtime']['githubReleaseAssetDigestRequired'] is True
          assert contract['compatibility']['unknownManifestSchema'] == 'reject'
          assert contract['compatibility']['candidateValidationFailure'] == 'held'
          PY

          grep -Fq 'requireSha256 = true' app/src/main/kotlin/org/koitharu/kotatsu/tsuki/TsukiPluginInstaller.kt
          grep -Fq 'Unexpected plugin download origin' app/src/main/kotlin/org/koitharu/kotatsu/tsuki/TsukiPluginInstaller.kt
          grep -Fq 'Refusing to downgrade' app/src/main/kotlin/org/koitharu/kotatsu/tsuki/TsukiPluginInstaller.kt
          grep -Fq 'rollback' app/src/main/kotlin/org/koitharu/kotatsu/tsuki/TsukiPluginInstaller.kt

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/main-build.yml').read_text(encoding='utf-8')
          gate = workflow.index('Require compatible stable Source Pack')
          signing = workflow.index('Require stable release signing key')
          build = workflow.index('Build Release APK')
          assert gate < signing < build
          assert 'source_pack_readiness.py validate' in workflow
          assert '.github/scripts/release_version.py' in workflow
          assert '--tags-file "$TAGS_FILE"' in workflow
          assert '--requested "$REQUESTED"' in workflow
          assert 'miyorare-release-lock.json' in workflow
          assert 'miyorare-release-lock.sha256' in workflow
          assert 'steps.version.outputs.code' in workflow
          assert 'compatibility_snapshot_id' in workflow
          assert 'farm_commit' in workflow
          assert 'Compatibility snapshot ID' in workflow
          assert 'compatibilitySnapshotId' in Path('.github/scripts/source_pack_readiness.py').read_text(encoding='utf-8')
          assert 'release lock compatibility snapshot does not match manifest' in Path('.github/scripts/source_pack_readiness.py').read_text(encoding='utf-8')
          assert 'Compatibility snapshot ID does not match immutable release inputs' in Path('app/src/main/kotlin/org/koitharu/kotatsu/tsuki/MiyorareSourcePackReleasePolicy.kt').read_text(encoding='utf-8')

          manager = Path('app/src/main/kotlin/org/koitharu/kotatsu/tsuki/TsukiPluginManager.kt').read_text(encoding='utf-8')
          installer = Path('app/src/main/kotlin/org/koitharu/kotatsu/tsuki/TsukiPluginInstaller.kt').read_text(encoding='utf-8')
          detail = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/sources/MiyorareSourcePackDetailSettingsFragment.kt').read_text(encoding='utf-8')
          assert '.put("compatibilitySnapshotId", compatibilitySnapshotId' in manager
          assert '.put("compatibilityFarmCommit", compatibilityFarmCommit' in manager
          assert 'Compatibility snapshot provenance is reserved for official Miyorare Source Packs' in manager
          assert 'compatibilitySnapshotId = release.compatibilitySnapshotId' in installer
          assert 'compatibilityFarmCommit = release.compatibilityFarmCommit' in installer
          assert 'compatibilitySnapshotId = old.compatibilitySnapshotId' in installer
          assert 'miyorare_source_pack_snapshot_details' in detail

          sync = Path('.github/workflows/miyorare-farm-pack-membership-sync.yml').read_text(encoding='utf-8')
          assert 'farm_sha:' in sync
          assert 'REQUESTED_FARM_SHA' in sync
          assert 'mode="event"' in sync
          assert 'mode="recovery"' in sync
          assert 'cancel-in-progress: true' in sync
          assert '$GITHUB_RUN_ATTEMPT' in sync
          assert 'automation/farm-pack-sync-${FARM_SHA:0:12}-$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT' in sync
          assert 'raw.githubusercontent.com/$FARM_REPOSITORY/$sha/compatibility/source-registry.json' in sync
          PY
