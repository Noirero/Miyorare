name: Verify Source Repository Migration

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/verify-source-repo-migration.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run source-pack unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --tests org.koitharu.kotatsu.tsuki.MiyorareOfficialSourcePacksTest

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
