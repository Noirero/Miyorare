name: Experimental Build
run-name: Owner validation APK · ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact validated production-fix commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: favourites-fix-owner-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build production-code owner validation APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify exact clean production source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = build/favourites-fix-owner-apk
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git diff --check
          grep -Fq "applicationId = 'org.noirero.miyorare'" app/build.gradle
          test ! -d app/src/main/kotlin/org/koitharu/kotatsu/core/diagnostics
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Apply build-only owner APK identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('app/build.gradle')
          text = p.read_text()
          for old, new in [
              ("variant.applicationId.set('org.noirero.miyorare.beta')", "variant.applicationId.set('org.noirero.miyorare.favouritesfix2')"),
              ("versionNameSuffix = '-beta'", "versionNameSuffix = '-favouritesfix2'"),
              ("versionName = '1.2.0'", "versionName = '1.4.7'"),
          ]:
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          p.write_text(text)
          p = Path('app/src/preview/res/values/strings.xml')
          text = p.read_text()
          old = '<string name="app_name_beta" translatable="false">Miyorare Beta</string>'
          assert text.count(old) == 1
          p.write_text(text.replace(old, '<string name="app_name_beta" translatable="false">Miyorare Favourites Fix 2</string>', 1))
          PYCODE
          mkdir -p build/owner-apk
          git diff -- app/build.gradle app/src/preview/res/values/strings.xml > build/owner-apk/BUILD-ONLY-IDENTITY.patch
          python3 - <<'PYCODE'
          import subprocess
          allowed = {'app/build.gradle', 'app/src/preview/res/values/strings.xml'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == allowed, changed
          PYCODE
      - name: Decode permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Build standard Preview from exact production code
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assemblePreview --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=../release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
      - name: Verify and collect owner APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/preview -name '*.apk' -type f | head -n1)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" > build/owner-apk/APK-BADGING.txt
          grep -Fq "package: name='org.noirero.miyorare.favouritesfix2'" build/owner-apk/APK-BADGING.txt
          grep -Fq "application-label:'Miyorare Favourites Fix 2'" build/owner-apk/APK-BADGING.txt
          "$BUILD_TOOLS/apksigner" verify "$APK"
          cp "$APK" "build/owner-apk/Miyorare-Favourites-Fix-2-${SOURCE_SHA:0:8}.apk"
          sha256sum build/owner-apk/*.apk > build/owner-apk/SHA256SUMS.txt
          printf 'Production source SHA: %s\nWorkflow SHA: %s\nVariant: normal Preview, build-only package/label/version changes\nNo diagnostic recorder/export/experiment flags\n' "$SOURCE_SHA" "$GITHUB_SHA" > build/owner-apk/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Miyorare-Favourites-Fix-2-${{ inputs.source_sha }}
          path: build/owner-apk/
          if-no-files-found: error
          retention-days: 14
