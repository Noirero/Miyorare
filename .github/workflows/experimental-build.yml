name: Experimental Build
run-name: Miyorare PR577 isolated APK · ${{ github.ref_name }}

# Temporary isolated APK builder for runtime comparison of PR #577.
# Source is pinned to the exact CI-validated PR head; build-only identity changes
# happen in the runner and are never committed to the PR source.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PR577_SHA: 4b6f0f02b5975c8beecbe9596e459c8a44c3db86

concurrency:
  group: pr577-isolated-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build isolated release-like PR577 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact PR577 source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.PR577_SHA }}
          fetch-depth: 0

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$PR577_SHA" ]; then
            echo "::error::Checked out $ACTUAL, expected exact PR577 head $PR577_SHA"
            exit 1
          fi
          echo "Building exact PR577 source at $ACTUAL"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Require signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Apply build-only isolated PR577 identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle')
          text = gradle.read_text()
          text, count = re.subn(
              r"applicationId\s*=\s*'org\.noirero\.miyorare'",
              "applicationId = 'org.noirero.miyorare.pr577'",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not isolate PR577 applicationId exactly once')
          gradle.write_text(text)

          strings = Path('app/src/main/res/values/strings.xml')
          text = strings.read_text()
          text, count = re.subn(
              r'(<string\s+name="app_name"[^>]*>)(.*?)(</string>)',
              r'\1Miyorare PR577\3',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not set PR577 app name exactly once')
          strings.write_text(text)
          PY

      - name: Build release-like PR577 APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --max-workers=4 --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=../release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Verify built identity and collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          METADATA=app/build/outputs/apk/release/output-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          expected = 'org.noirero.miyorare.pr577'
          actual = metadata.get('applicationId')
          if actual != expected:
              raise SystemExit(f'Built applicationId is {actual!r}, expected {expected!r}')
          print(f'Verified isolated applicationId: {actual}')
          PY
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n1)
          [ -n "$APK" ] || { echo "::error::No release APK found"; exit 1; }
          DEST="Miyorare-PR577-4b6f0f0-release.apk"
          cp "$APK" "$DEST"
          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          SIZE=$(du -h "$DEST" | cut -f1)
          echo "apk_name=$DEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Miyorare PR577 isolated runtime-test APK"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Exact source | \`$PR577_SHA\` |"
            echo "| Application ID | \`org.noirero.miyorare.pr577\` |"
            echo "| App name | \`Miyorare PR577\` |"
            echo "| Build type | \`release\` |"
            echo "| APK | \`$DEST\` |"
            echo "| Size | $SIZE |"
            echo "| SHA-256 | \`$SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PR577 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14
