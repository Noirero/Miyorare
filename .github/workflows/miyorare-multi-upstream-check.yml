name: Miyorare Multi-Upstream Check

on:
  pull_request:
    branches:
      - beta
      - Amain2
    paths:
      - 'app/src/main/kotlin/org/koitharu/kotatsu/sources/compat/**'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/sources/compat/**'
      - 'extensions/miyorare-sources/multi-upstream.json'
      - 'extensions/miyorare-sources/packs.json'
      - 'extensions/miyorare-sources/tools/verify_multi_upstream.py'
      - 'extensions/miyorare-sources/README.md'
      - '.github/workflows/miyorare-multi-upstream-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miyorare-multi-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Keiyoushi + UMA source intake
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Miyorare
        uses: actions/checkout@v5

      - name: Resolve pinned upstream revisions
        id: upstream-pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path('extensions/miyorare-sources/multi-upstream.json').read_text(encoding='utf-8'))
          if manifest.get('schema') != 1 or not isinstance(manifest.get('upstreams'), dict):
              raise SystemExit('Invalid multi-upstream manifest schema/upstreams')
          expected = {'uma': 'InvalidDavid/UMA', 'keiyoushi': 'keiyoushi/extensions-source'}
          pins = {}
          for name, repository in expected.items():
              entry = manifest['upstreams'].get(name)
              if not isinstance(entry, dict) or entry.get('repository') != repository:
                  raise SystemExit(f'Invalid {name} upstream repository')
              commit = entry.get('commit')
              if not isinstance(commit, str) or not re.fullmatch(r'[0-9a-f]{40}', commit):
                  raise SystemExit(f'{name} must use an exact 40-character commit SHA')
              pins[name] = commit
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for name, commit in pins.items():
                  print(f'{name}={commit}', file=output)
          PY

      - name: Checkout pinned UMA
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: ${{ steps.upstream-pins.outputs.uma }}
          path: _upstream/uma

      - name: Checkout pinned Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ steps.upstream-pins.outputs.keiyoushi }}
          path: _upstream/keiyoushi

      - name: Verify normalized multi-upstream aliases
        run: |
          python3 extensions/miyorare-sources/tools/verify_multi_upstream.py \
            --manifest extensions/miyorare-sources/multi-upstream.json \
            --packs extensions/miyorare-sources/packs.json \
            --uma _upstream/uma \
            --keiyoushi _upstream/keiyoushi \
            --output build/miyorare-multi-upstream/intake.json

      - name: Upload normalized intake metadata
        uses: actions/upload-artifact@v4
        with:
          name: miyorare-multi-upstream-intake
          path: build/miyorare-multi-upstream/intake.json
          if-no-files-found: error
          retention-days: 1
