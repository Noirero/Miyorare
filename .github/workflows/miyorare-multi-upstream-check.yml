name: Miyorare Multi-Upstream Check

on:
  pull_request:
    branches:
      - beta
      - Amain2
    paths:
      - 'app/src/main/kotlin/org/koitharu/kotatsu/sources/compat/**'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/sources/compat/**'
      - 'extensions/miyorare-sources/multi-upstream.json'
      - 'extensions/miyorare-sources/packs.json'
      - 'extensions/miyorare-sources/tools/verify_multi_upstream.py'
      - 'extensions/miyorare-sources/tools/discover_keiyoushi_en_aliases.py'
      - 'extensions/miyorare-sources/tools/audit_keiyoushi_en_unmapped.py'
      - 'extensions/miyorare-sources/README.md'
      - '.github/workflows/miyorare-multi-upstream-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miyorare-multi-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Keiyoushi + UMA source intake
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Miyorare
        uses: actions/checkout@v5

      - name: Read pinned upstream revisions
        id: pins
        shell: bash
        run: |
          echo "uma=$(jq -r '.upstreams.uma.commit' extensions/miyorare-sources/multi-upstream.json)" >> "$GITHUB_OUTPUT"
          echo "keiyoushi=$(jq -r '.upstreams.keiyoushi.commit' extensions/miyorare-sources/multi-upstream.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned UMA
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: ${{ steps.pins.outputs.uma }}
          path: _upstream/uma

      - name: Checkout pinned Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ steps.pins.outputs.keiyoushi }}
          path: _upstream/keiyoushi

      - name: Inventory proven EN overlap
        run: |
          python3 extensions/miyorare-sources/tools/discover_keiyoushi_en_aliases.py \
            --manifest extensions/miyorare-sources/multi-upstream.json \
            --packs extensions/miyorare-sources/packs.json \
            --uma _upstream/uma \
            --keiyoushi _upstream/keiyoushi \
            --output build/miyorare-multi-upstream/en-overlap.json

      - name: Require complete proven EN coverage
        shell: bash
        run: |
          exact=$(jq -r '.summary.missingExactAliases' build/miyorare-multi-upstream/en-overlap.json)
          literal=$(jq -r '.summary.missingNameAndLiteralHostAliases' build/miyorare-multi-upstream/en-overlap.json)
          test "$exact" -eq 0
          test "$literal" -eq 0

      - name: Audit unmapped EN sources
        run: |
          python3 extensions/miyorare-sources/tools/audit_keiyoushi_en_unmapped.py \
            --manifest extensions/miyorare-sources/multi-upstream.json \
            --packs extensions/miyorare-sources/packs.json \
            --uma _upstream/uma \
            --keiyoushi _upstream/keiyoushi \
            --output build/miyorare-multi-upstream/en-unmapped-review.json

      - name: Verify normalized multi-upstream aliases
        run: |
          python3 extensions/miyorare-sources/tools/verify_multi_upstream.py \
            --manifest extensions/miyorare-sources/multi-upstream.json \
            --packs extensions/miyorare-sources/packs.json \
            --uma _upstream/uma \
            --keiyoushi _upstream/keiyoushi \
            --output build/miyorare-multi-upstream/intake.json

      - name: Upload multi-upstream evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miyorare-multi-upstream-intake
          path: |
            build/miyorare-multi-upstream/intake.json
            build/miyorare-multi-upstream/en-overlap.json
            build/miyorare-multi-upstream/en-unmapped-review.json
          if-no-files-found: error
