name: PF5 Private Screenshot Implementation

on:
  push:
    branches:
      - pf5

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Implement isolated Private screenshot permission
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          # 1) Security store: persisted, Private-only setting + observable runtime state.
          path = 'app/src/main/kotlin/org/koitharu/kotatsu/favourites/vault/PrivateFavouritesSecurityStore.kt'
          replace_once(
              path,
              'import dagger.hilt.android.qualifiers.ApplicationContext\n',
              'import dagger.hilt.android.qualifiers.ApplicationContext\n'
              'import kotlinx.coroutines.flow.MutableStateFlow\n'
              'import kotlinx.coroutines.flow.StateFlow\n'
              'import kotlinx.coroutines.flow.asStateFlow\n',
          )
          replace_once(
              path,
              '\tprivate val file = File(context.noBackupFilesDir, FILE_NAME)\n\tprivate val lock = Any()\n',
              '\tprivate val file = File(context.noBackupFilesDir, FILE_NAME)\n'
              '\tprivate val lock = Any()\n'
              '\tprivate val allowPrivateScreenshotsState = MutableStateFlow(\n'
              '\t\tsynchronized(lock) {\n'
              '\t\t\tread().getProperty(KEY_ALLOW_SCREENSHOTS)?.toBooleanStrictOrNull() ?: false\n'
              '\t\t},\n'
              '\t)\n'
              '\tval allowPrivateScreenshotsFlow: StateFlow<Boolean> = allowPrivateScreenshotsState.asStateFlow()\n',
          )
          replace_once(
              path,
              '\tvar includePrivateInBackup: Boolean\n'
              '\t\tget() = synchronized(lock) { read().getProperty(KEY_INCLUDE_BACKUP)?.toBooleanStrictOrNull() ?: false }\n'
              '\t\tset(value) = synchronized(lock) {\n'
              '\t\t\twrite(read().apply { setProperty(KEY_INCLUDE_BACKUP, value.toString()) })\n'
              '\t\t}\n',
              '\tvar includePrivateInBackup: Boolean\n'
              '\t\tget() = synchronized(lock) { read().getProperty(KEY_INCLUDE_BACKUP)?.toBooleanStrictOrNull() ?: false }\n'
              '\t\tset(value) = synchronized(lock) {\n'
              '\t\t\twrite(read().apply { setProperty(KEY_INCLUDE_BACKUP, value.toString()) })\n'
              '\t\t}\n\n'
              '\t/** Independent from the general screenshot policy and false on every existing install. */\n'
              '\tvar allowPrivateScreenshots: Boolean\n'
              '\t\tget() = allowPrivateScreenshotsState.value\n'
              '\t\tset(value) = synchronized(lock) {\n'
              '\t\t\twrite(read().apply { setProperty(KEY_ALLOW_SCREENSHOTS, value.toString()) })\n'
              '\t\t\tallowPrivateScreenshotsState.value = value\n'
              '\t\t}\n\n'
              '\tvar privateScreenshotWarningAcknowledged: Boolean\n'
              '\t\tget() = synchronized(lock) {\n'
              '\t\t\tread().getProperty(KEY_SCREENSHOT_WARNING_ACK)?.toBooleanStrictOrNull() ?: false\n'
              '\t\t}\n'
              '\t\tset(value) = synchronized(lock) {\n'
              '\t\t\twrite(read().apply { setProperty(KEY_SCREENSHOT_WARNING_ACK, value.toString()) })\n'
              '\t\t}\n',
          )
          replace_once(
              path,
              '\t\tconst val KEY_INCLUDE_BACKUP = "include_private_backup"\n',
              '\t\tconst val KEY_INCLUDE_BACKUP = "include_private_backup"\n'
              '\t\tconst val KEY_ALLOW_SCREENSHOTS = "allow_private_screenshots"\n'
              '\t\tconst val KEY_SCREENSHOT_WARNING_ACK = "private_screenshot_warning_ack"\n',
          )

          # 2) Private settings UI: own toggle, default off, first-enable warning.
          path = 'app/src/main/kotlin/org/koitharu/kotatsu/settings/PrivateFavouritesSettingsFragment.kt'
          replace_once(
              path,
              '\tprivate val backupState = MutableStateFlow(false)\n',
              '\tprivate val backupState = MutableStateFlow(false)\n'
              '\tprivate val screenshotsState = MutableStateFlow(false)\n',
          )
          replace_once(
              path,
              '\t\t\t\tval includeBackup by backupState.collectAsState()\n',
              '\t\t\t\tval includeBackup by backupState.collectAsState()\n'
              '\t\t\t\tval allowScreenshots by screenshotsState.collectAsState()\n',
          )
          replace_once(
              path,
              '\t\t\t\t\tincludeBackup = includeBackup,\n',
              '\t\t\t\t\tincludeBackup = includeBackup,\n'
              '\t\t\t\t\tallowScreenshots = allowScreenshots,\n',
          )
          replace_once(
              path,
              '\t\t\t\t\tonIncludeBackupChange = ::changeBackupInclusion,\n',
              '\t\t\t\t\tonIncludeBackupChange = ::changeBackupInclusion,\n'
              '\t\t\t\t\tonAllowScreenshotsChange = ::changePrivateScreenshots,\n',
          )
          replace_once(
              path,
              '\t\tbackupState.value = security.includePrivateInBackup\n',
              '\t\tbackupState.value = security.includePrivateInBackup\n'
              '\t\tscreenshotsState.value = security.allowPrivateScreenshots\n',
          )
          marker = '\n\tprivate fun changeBackupInclusion(include: Boolean) {\n'
          insert = '''
	private fun changePrivateScreenshots(allow: Boolean) {
		if (!allow) {
			security.allowPrivateScreenshots = false
			refreshState()
			return
		}
		if (security.privateScreenshotWarningAcknowledged) {
			security.allowPrivateScreenshots = true
			refreshState()
			return
		}
		buildAlertDialog(requireContext(), isCentered = true) {
			setTitle(R.string.private_favourites_screenshot_warning_title)
			setMessage(R.string.private_favourites_screenshot_warning_message)
			setPositiveButton(R.string.private_favourites_screenshot_allow_button) { _, _ ->
				security.privateScreenshotWarningAcknowledged = true
				security.allowPrivateScreenshots = true
				refreshState()
			}
			setNegativeButton(android.R.string.cancel, null)
		}.show()
	}
'''
          p = Path(path)
          s = p.read_text()
          if marker not in s:
              raise SystemExit('changeBackupInclusion marker not found')
          p.write_text(s.replace(marker, '\n' + insert + marker, 1))

          replace_once(
              path,
              '\tincludeBackup: Boolean,\n',
              '\tincludeBackup: Boolean,\n\tallowScreenshots: Boolean,\n',
          )
          replace_once(
              path,
              '\tonIncludeBackupChange: (Boolean) -> Unit,\n',
              '\tonIncludeBackupChange: (Boolean) -> Unit,\n\tonAllowScreenshotsChange: (Boolean) -> Unit,\n',
          )
          backup_group = '''
		item { Spacer(Modifier.height(8.dp).fillMaxWidth()) }
		item {
			SettingsGroup(title = stringResource(R.string.private_favourites_backup_group)) {
'''
          privacy_group = '''
		item { Spacer(Modifier.height(8.dp).fillMaxWidth()) }
		item {
			SettingsGroup(title = stringResource(R.string.private_favourites_privacy_group)) {
				item { pos ->
					SwitchSettingsItem(
						title = stringResource(R.string.private_favourites_allow_screenshots),
						subtitle = stringResource(R.string.private_favourites_allow_screenshots_summary),
						checked = allowScreenshots,
						onCheckedChange = onAllowScreenshotsChange,
						icon = R.drawable.ic_lock,
						shape = pos.shape,
					)
				}
			}
		}
		item { Spacer(Modifier.height(8.dp).fillMaxWidth()) }
		item {
			SettingsGroup(title = stringResource(R.string.private_favourites_backup_group)) {
'''
          replace_once(path, backup_group, privacy_group)

          # 3) Window policy: Private toggle overrides general screenshot policy only after auth,
          # while UNKNOWN/loading/background/app-lock remain fail-closed.
          path = 'app/src/main/kotlin/org/koitharu/kotatsu/main/ui/protect/ScreenshotPolicyHelper.kt'
          replace_once(
              path,
              'import kotlinx.coroutines.flow.Flow\n',
              'import kotlinx.coroutines.flow.Flow\nimport kotlinx.coroutines.flow.MutableStateFlow\n',
          )
          replace_once(
              path,
              'import org.koitharu.kotatsu.favourites.vault.PrivateFavouritesSession\n',
              'import org.koitharu.kotatsu.favourites.vault.PrivateFavouritesSecurityStore\n'
              'import org.koitharu.kotatsu.favourites.vault.PrivateFavouritesSession\n',
          )
          replace_once(
              path,
              '\tprivate val favouritesRepository: FavouritesRepository,\n\tprivate val privateSession: PrivateFavouritesSession,\n',
              '\tprivate val favouritesRepository: FavouritesRepository,\n'
              '\tprivate val privateSecurity: PrivateFavouritesSecurityStore,\n'
              '\tprivate val privateSession: PrivateFavouritesSession,\n',
          )
          replace_once(
              path,
              '\tprivate val privateContentState = WeakHashMap<Activity, Boolean>()\n',
              '\tprivate val privateContentState = WeakHashMap<Activity, Boolean>()\n'
              '\tprivate val activityResumedState = WeakHashMap<Activity, MutableStateFlow<Boolean>>()\n',
          )
          replace_once(
              path,
              '\t\tval container = activity as? ContentContainer ?: return\n',
              '\t\tval container = activity as? ContentContainer ?: return\n'
              '\t\tactivityResumedState[activity] = MutableStateFlow(false)\n',
          )
          replace_once(
              path,
              '\toverride fun onActivityResumed(activity: Activity) {\n\t\tif (activity is FavouritesActivity) return\n',
              '\toverride fun onActivityResumed(activity: Activity) {\n'
              '\t\tactivityResumedState[activity]?.value = true\n'
              '\t\tif (activity is FavouritesActivity) return\n',
          )
          resume_block = '''
	private fun ContentContainer.setupScreenshotPolicy(activity: Activity) =
'''
          pause_block = '''
	override fun onActivityPaused(activity: Activity) {
		activityResumedState[activity]?.value = false
		// The task snapshot can be captured before ProcessLifecycleOwner reaches onStop. Re-secure
		// synchronously on pause so allowing foreground screenshots never exposes Recents/task preview.
		if (privateContentState[activity] == true) {
			activity.window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
		}
	}

	override fun onActivityDestroyed(activity: Activity) {
		privateContentState.remove(activity)
		activityResumedState.remove(activity)
	}

	private fun ContentContainer.setupScreenshotPolicy(activity: Activity) =
'''
          replace_once(path, resume_block, pause_block)

          old = '''
			val protectAppFlow = settings.observeAsFlow(AppSettings.KEY_PROTECT_APP) { isAppProtectionEnabled }
			val privateMembershipState = observePrivateContent(activity)
'''
          new = '''
			val protectAppFlow = settings.observeAsFlow(AppSettings.KEY_PROTECT_APP) { isAppProtectionEnabled }
			val appProtectionSecureFlow = combine(
				protectAppFlow,
				protectHelper.isUnlockedFlow,
			) { enabled, unlocked -> enabled && !unlocked }.distinctUntilChanged()
			val resumedFlow = activityResumedState.getOrPut(activity) { MutableStateFlow(false) }
			val privateScreenshotsAllowedFlow = combine(
				privateSecurity.allowPrivateScreenshotsFlow,
				privateSession.isUnlocked,
				resumedFlow,
			) { allowed, unlocked, resumed -> allowed && unlocked && resumed }.distinctUntilChanged()
			val privateMembershipState = observePrivateContent(activity)
'''
          replace_once(path, old, new)

          old = '''
			combine(
				screenshotPolicyFlow,
				protectAppFlow,
				protectHelper.isUnlockedFlow,
				privateVaultFlow,
				sensitiveScreenFlow,
			) { screenshotSecure, protectEnabled, isUnlocked, privateVault, sensitiveScreen ->
				SecurityState(
					isSecure = screenshotSecure || privateVault || sensitiveScreen || (protectEnabled && !isUnlocked),
					isPrivateVault = privateVault,
				)
			}.collect { state ->
'''
          new = '''
			combine(
				screenshotPolicyFlow,
				privateVaultFlow,
				sensitiveScreenFlow,
				privateScreenshotsAllowedFlow,
				appProtectionSecureFlow,
			) { screenshotSecure, privateVault, sensitiveScreen, privateScreenshotsAllowed, appProtectionSecure ->
				SecurityState(
					isSecure = shouldSecureWindow(
						screenshotSecure = screenshotSecure,
						privateVault = privateVault,
						sensitiveScreen = sensitiveScreen,
						privateScreenshotsAllowed = privateScreenshotsAllowed,
						appProtectionSecure = appProtectionSecure,
					),
					isPrivateVault = privateVault,
				)
			}.collect { state ->
'''
          replace_once(path, old, new)

          # Add pure policy function for regression testing.
          p = Path(path)
          s = p.read_text()
          append = '''

/**
 * Private screenshot permission is intentionally independent from the general screenshot policy.
 * The caller folds authentication + foreground state into [privateScreenshotsAllowed].
 */
internal fun shouldSecureWindow(
	screenshotSecure: Boolean,
	privateVault: Boolean,
	sensitiveScreen: Boolean,
	privateScreenshotsAllowed: Boolean,
	appProtectionSecure: Boolean,
): Boolean = if (privateVault) {
	!privateScreenshotsAllowed || appProtectionSecure
} else {
	screenshotSecure || sensitiveScreen || appProtectionSecure
}
'''
          if 'internal fun shouldSecureWindow(' in s:
              raise SystemExit('shouldSecureWindow already exists')
          p.write_text(s + append)

          # 4) AssistContent remains private even while FLAG_SECURE is deliberately relaxed.
          path = 'app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsExpressiveActivity.kt'
          replace_once(
              path,
              '\t\tif (window.attributes.flags and WindowManager.LayoutParams.FLAG_SECURE != 0) return\n',
              '\t\tif (privateContentStateFlow.value != PrivateContentState.NORMAL ||\n'
              '\t\t\twindow.attributes.flags and WindowManager.LayoutParams.FLAG_SECURE != 0\n'
              '\t\t) return\n',
          )

          # 5) Regression test for the policy contract.
          test = Path('app/src/test/kotlin/org/koitharu/kotatsu/main/ui/protect/ScreenshotPolicyHelperTest.kt')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''package org.koitharu.kotatsu.main.ui.protect

import org.junit.Assert.assertFalse
import org.junit.Assert.assertTrue
import org.junit.Test

class ScreenshotPolicyHelperTest {

	@Test
	fun `private is secure by default`() {
		assertTrue(
			shouldSecureWindow(
				screenshotSecure = false,
				privateVault = true,
				sensitiveScreen = false,
				privateScreenshotsAllowed = false,
				appProtectionSecure = false,
			),
		)
	}

	@Test
	fun `private permission is independent from general screenshot block`() {
		assertFalse(
			shouldSecureWindow(
				screenshotSecure = true,
				privateVault = true,
				sensitiveScreen = true,
				privateScreenshotsAllowed = true,
				appProtectionSecure = false,
			),
		)
	}

	@Test
	fun `app protection still secures private`() {
		assertTrue(
			shouldSecureWindow(
				screenshotSecure = false,
				privateVault = true,
				sensitiveScreen = false,
				privateScreenshotsAllowed = true,
				appProtectionSecure = true,
			),
		)
	}

	@Test
	fun `normal content keeps general screenshot policy`() {
		assertTrue(
			shouldSecureWindow(
				screenshotSecure = true,
				privateVault = false,
				sensitiveScreen = false,
				privateScreenshotsAllowed = true,
				appProtectionSecure = false,
			),
		)
	}

	@Test
	fun `unknown sensitive classification is fail closed`() {
		assertTrue(
			shouldSecureWindow(
				screenshotSecure = false,
				privateVault = false,
				sensitiveScreen = true,
				privateScreenshotsAllowed = true,
				appProtectionSecure = false,
			),
		)
	}
}
''')

          # 6) Add this test to the temporary pf5 regression gate.
          path = '.github/workflows/pf5-regression-audit.yml'
          replace_once(
              path,
              '            --tests org.koitharu.kotatsu.mihon.MihonWebViewTokenErrorTest\n',
              '            --tests org.koitharu.kotatsu.mihon.MihonWebViewTokenErrorTest \\\n'
              '            --tests org.koitharu.kotatsu.main.ui.protect.ScreenshotPolicyHelperTest\n',
          )

          # 7) Isolated resource files avoid touching the large shared strings catalogs.
          Path('app/src/main/res/values/private_favourites_screenshot.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="private_favourites_privacy_group">Privacy</string>
    <string name="private_favourites_allow_screenshots">Allow screenshots in Private</string>
    <string name="private_favourites_allow_screenshots_summary">Allow device screenshots only while Private is unlocked and visible. This is independent from the general screenshot policy.</string>
    <string name="private_favourites_screenshot_warning_title">Allow screenshots in Private?</string>
    <string name="private_favourites_screenshot_warning_message">Private screenshots may be saved to your gallery or accessed by other apps. On some devices, allowing screenshots may also allow screen recording or casting. Private remains protected while locked, loading, or in the background.</string>
    <string name="private_favourites_screenshot_allow_button">Allow</string>
</resources>
''')
          Path('app/src/main/res/values-in/private_favourites_screenshot.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="private_favourites_privacy_group">Privasi</string>
    <string name="private_favourites_allow_screenshots">Izinkan tangkapan layar di Private</string>
    <string name="private_favourites_allow_screenshots_summary">Izinkan tangkapan layar perangkat hanya saat Private sudah terbuka dan terlihat. Pengaturan ini terpisah dari kebijakan tangkapan layar umum.</string>
    <string name="private_favourites_screenshot_warning_title">Izinkan tangkapan layar di Private?</string>
    <string name="private_favourites_screenshot_warning_message">Tangkapan layar Private dapat tersimpan di Galeri atau diakses aplikasi lain. Pada sebagian perangkat, mengizinkan tangkapan layar juga dapat memungkinkan perekaman layar atau casting. Private tetap terlindungi saat terkunci, loading, atau aplikasi berada di latar belakang.</string>
    <string name="private_favourites_screenshot_allow_button">Izinkan</string>
</resources>
''')
          PY

          git diff --check
          git status --short
          grep -R -n 'allowPrivateScreenshots' app/src/main/kotlin/org/koitharu/kotatsu/{favourites,settings,main} | head -n 50

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main .github/workflows/pf5-regression-audit.yml
          git commit -m 'Add isolated Private screenshot permission'
          git push origin HEAD:pf5
