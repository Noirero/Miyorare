name: PF5 Private Screenshot Implementation

on:
  push:
    branches:
      - pf5

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Apply Private screenshot implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/pf5_private_screenshot_patch.py
          git diff --check
          git status --short
          grep -R -n 'allowPrivateScreenshots' app/src/main/kotlin/org/koitharu/kotatsu/{favourites,settings,main} | head -n 50
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main app/src/test .github/workflows/pf5-regression-audit.yml
          git commit -m 'Add isolated Private screenshot permission'
          git push origin HEAD:pf5
