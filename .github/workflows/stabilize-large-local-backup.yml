name: Stabilize Large Local Backup

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/stabilize-large-local-backup.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0

      - name: Apply stabilization
        shell: bash
        run: |
          set -euo pipefail
          echo '...' | base64 -d > /tmp/stabilize_backup.py
          python3 /tmp/stabilize_backup.py
          git diff --check
          grep -q 'findAllBySourceForBackup' app/src/main/kotlin/org/koitharu/kotatsu/core/db/dao/MangaDao.kt
          grep -q 'decodeFromStream<FeedBackup>' app/src/main/kotlin/org/koitharu/kotatsu/backup/local/data/LocalBackupRepository.kt
          grep -q 'val window = 64' app/src/main/kotlin/org/koitharu/kotatsu/history/data/HistoryDao.kt
          grep -q 'val window = 32' app/src/main/kotlin/org/koitharu/kotatsu/bookmarks/data/BookmarksDao.kt

      - name: Commit stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stabilize-large-local-backup.yml
          git add app/src/main/kotlin/org/koitharu/kotatsu
          git commit -m "Stabilize local backup restore for large libraries"
          git push origin HEAD:beta
