name: Stabilize Large Local Backup

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/stabilize-large-local-backup.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0
      - name: Patch bounded paging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_after(path, marker, old, new):
              p = Path(path)
              text = p.read_text()
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'marker missing: {path}')
              pos = text.find(old, start)
              if pos < 0:
                  raise SystemExit(f'value missing: {path}')
              p.write_text(text[:pos] + new + text[pos + len(old):])

          replace_after('app/src/main/kotlin/org/koitharu/kotatsu/history/data/HistoryDao.kt', 'fun dump(): Flow<HistoryWithManga>', 'val window = 10', 'val window = 64')
          replace_after('app/src/main/kotlin/org/koitharu/kotatsu/bookmarks/data/BookmarksDao.kt', 'fun dump(): Flow<Pair<MangaWithTags, List<BookmarkEntity>>>', 'val window = 4', 'val window = 32')
          replace_after('app/src/main/kotlin/org/koitharu/kotatsu/stats/data/StatsDao.kt', 'fun dumpEnabled(): Flow<StatsEntity>', 'val window = 10', 'val window = 256')
          replace_after('app/src/main/kotlin/org/koitharu/kotatsu/scrobbling/common/data/ScrobblingDao.kt', 'fun dumpEnabled(): Flow<ScrobblingEntity>', 'val window = 10', 'val window = 256')
          replace_after('app/src/main/kotlin/org/koitharu/kotatsu/core/db/dao/MangaSourcesDao.kt', 'fun dumpEnabled(): Flow<MangaSourceEntity>', 'val window = 10', 'val window = 256')

          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/backup/local/data/LocalBackupRepository.kt')
          text = p.read_text()
          text = text.replace('const val BACKUP_DB_BATCH_SIZE = 256', 'const val BACKUP_DB_BATCH_SIZE = 128', 1)
          text = text.replace('const val RESTORE_DB_BATCH_SIZE = 256', 'const val RESTORE_DB_BATCH_SIZE = 128', 1)
          p.write_text(text)
          PY
          git diff --check
          grep -q 'val window = 64' app/src/main/kotlin/org/koitharu/kotatsu/history/data/HistoryDao.kt
          grep -q 'val window = 32' app/src/main/kotlin/org/koitharu/kotatsu/bookmarks/data/BookmarksDao.kt
          grep -q 'const val RESTORE_DB_BATCH_SIZE = 128' app/src/main/kotlin/org/koitharu/kotatsu/backup/local/data/LocalBackupRepository.kt
      - name: Commit paging stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stabilize-large-local-backup.yml
          git add app/src/main/kotlin/org/koitharu/kotatsu
          git commit -m "Bound local backup restore paging for large libraries"
          git push origin HEAD:beta
