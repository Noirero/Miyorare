name: Release Worker Benchmark

on:
  pull_request:
    branches:
      - beta
    paths:
      - '.github/workflows/release-worker-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    name: Release profile · ${{ matrix.workers }} workers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        workers: [4, 8]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout benchmark head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Benchmark release build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/worker-benchmark
          {
            /usr/bin/time -p ./gradlew :app:assembleRelease \
              --profile \
              --max-workers=${{ matrix.workers }} \
              --no-daemon \
              --stacktrace
          } 2>&1 | tee "build/worker-benchmark/workers-${{ matrix.workers }}.log"

      - name: Summarize task durations
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/summarize_gradle_profile.py \
            --profile-dir build/reports/profile \
            --top 10 \
            | tee "build/worker-benchmark/workers-${{ matrix.workers }}-top.txt"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-worker-benchmark-${{ matrix.workers }}
          path: |
            build/reports/profile/
            build/worker-benchmark/
          if-no-files-found: warn
          retention-days: 7
