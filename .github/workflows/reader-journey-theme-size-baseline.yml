name: Reader Journey Theme Size Baseline

on:
  pull_request:
    branches:
      - beta
    paths:
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/ui/MiyorareColorScheme.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/settings/developer/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/domain/ReaderProfileShareModel.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/share/ReaderProfileShareCard.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/ui/StatsScreen.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/ui/StatsActivity.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/ui/ReaderJourneyFragment.kt'
      - 'app/src/main/res/values/strings.xml'
      - 'app/src/main/res/values-in/strings.xml'
      - 'app/src/main/res/drawable-nodpi/nameplate_*.webp'
      - 'app/src/main/res/values/settings_developer_diagnostics.xml'
      - 'app/src/main/res/values-in/settings_developer_diagnostics.xml'
      # Preview contains all main resources and explicitly includes release resources.
      # Unknown payload/resources stay conservative; audited shared strings are gated cheaply.
      - 'app/src/main/res/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/resources/**'
      - 'app/src/main/jniLibs/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/preview/**'
      - 'app/src/release/**'
      - 'app/src/main/badge-assets/**'
      - 'tools/regenerate_badge_v2_payload.py'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/ui/ReaderJourneyExclusiveCollection.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/ui/StatsComponents.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/AppSettings.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsState.kt'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle.lockfile'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - '**/gradle.lockfile'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'buildSrc/**'
      - 'build-logic/**'
      - 'app/proguard-rules.pro'
      - '.github/scripts/theme_size_paths.py'
      - '.github/scripts/test_theme_size_paths.py'
      # Shared parser is reused without changing stage 2 behavior.
      - '.github/scripts/exclusive_visual_paths.py'
      - '.github/workflows/reader-journey-theme-size-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-journey-theme-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Theme Size inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_size: ${{ steps.classify.outputs.run_size }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      head_sha: ${{ steps.candidate.outputs.head_sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Pin size comparison candidates
        id: candidate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch --no-tags origin beta
            BASE_SHA="$(git rev-parse FETCH_HEAD)"
          fi
          git cat-file -e "${BASE_SHA}^{commit}" || git fetch --no-tags origin "$BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify size routing policy
        run: python3 .github/scripts/test_theme_size_paths.py

      - name: Classify size changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          run_size=true
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            # Script errors/missing output must never silently bypass APK validation.
            decision="$(python3 .github/scripts/theme_size_paths.py --base "$BASE_SHA" --head "$HEAD_SHA")" || decision=true
            if [ "$decision" = "false" ]; then run_size=false; fi
          fi
          echo "run_size=$run_size" >> "$GITHUB_OUTPUT"
          {
            echo "Theme Size full Preview APK baseline required: $run_size"
            echo "Base: $BASE_SHA; exact candidate: $HEAD_SHA"
            if [ "$run_size" = "false" ]; then
              echo "Audited generic loading/statistics/text or metadata changes; no JDK, Gradle or APK work."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  preview-apk-size:
    name: Preview APK before vs after
    needs: classify
    # Failed/uncertain classification runs the full audit. Cancellation stays cancelled.
    if: always() && !cancelled() && needs.classify.outputs.run_size != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout base beta candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.classify.outputs.base_sha || github.event.pull_request.base.sha || 'beta' }}
          path: base
          fetch-depth: 1

      - name: Checkout exact feature head
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.classify.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          path: head
          fetch-depth: 0

      - name: Verify and record exact build candidates
        shell: bash
        env:
          EXPECTED_BASE: ${{ needs.classify.outputs.base_sha || github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ needs.classify.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha="$(git -C base rev-parse HEAD)"
          head_sha="$(git -C head rev-parse HEAD)"
          if [ -n "$EXPECTED_BASE" ]; then test "$base_sha" = "$EXPECTED_BASE"; fi
          test "$head_sha" = "$EXPECTED_HEAD"
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$head_sha" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Grant execute permission
        run: |
          chmod +x base/gradlew
          chmod +x head/gradlew

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("head/gradle/libs.versions.toml").read_text(encoding="utf-8"))
          value = str(data.get("versions", {}).get("parsers", "")).strip()
          if not value:
              raise SystemExit("Missing versions.parsers in head/gradle/libs.versions.toml")
          print(value)
          PY
          )"
          POM_URL="https://jitpack.io/com/github/Gekkoushi/plugin-source/${PARSERS_VERSION}/plugin-source-${PARSERS_VERSION}.pom"
          for i in $(seq 1 12); do
            HTTP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$POM_URL" || true)"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Parser artifact is ready (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: parser artifact returned HTTP ${HTTP_STATUS:-000}"
            sleep 20
          done
          echo "::error::Parser artifact ${PARSERS_VERSION} is not ready on JitPack"
          exit 1

      - name: Build base Preview APK
        working-directory: base
        run: ./gradlew :app:assemblePreview --no-daemon --stacktrace || ./gradlew :app:assemblePreview --no-daemon --stacktrace --refresh-dependencies

      - name: Build feature Preview APK
        working-directory: head
        run: ./gradlew :app:assemblePreview --no-daemon --stacktrace

      - name: Audit packaged final rank-title Nameplate resources
        shell: bash
        run: |
          set -euo pipefail
          HEAD_APK="$(find head/app/build/outputs/apk/preview -type f -name '*.apk' | sort | head -n1)"
          test -n "$HEAD_APK"

          python3 - "$HEAD_APK" <<'PY'
          import hashlib
          import json
          import sys
          import zipfile
          from pathlib import Path

          apk = Path(sys.argv[1])
          with zipfile.ZipFile(apk) as zf:
              entries = [
                  info for info in zf.infolist()
                  if "/nameplate_" in info.filename and info.filename.endswith(".webp")
              ]
              names = [Path(info.filename).name for info in entries]
              expected = {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in Path("head/app/src/main/res/drawable-nodpi").glob("nameplate_*.webp")
              }
              actual = {Path(i.filename).name: hashlib.sha256(zf.read(i)).hexdigest() for i in entries}
              legacy = sorted(
                  info.filename for info in zf.infolist()
                  if "nameplate_" in info.filename and (
                      info.filename.endswith("_master.svg")
                      or info.filename.endswith("_normal.webp")
                      or "_overlay" in info.filename
                  )
              )
              duplicate_names = sorted({n for n in names if names.count(n) > 1})
              payload = {
                  "apk": apk.name,
                  "runtime_webp_entries": len(entries),
                  "final_rank_title_entries": len(expected),
                  "duplicate_runtime_names": duplicate_names,
                  "legacy_packaged_entries": legacy,
                  "packaged_nameplate_uncompressed_bytes": sum(i.file_size for i in entries),
                  "packaged_nameplate_compressed_bytes": sum(i.compress_size for i in entries),
              }

          assert len(expected) == 12, payload
          assert len(entries) == 12, payload
          assert actual == expected, "Installed artwork differs from exact final source bytes"
          assert not duplicate_names, payload
          assert not legacy, payload
          Path("nameplate-v2-packaging-audit.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2))
          PY

      - name: Record consistent APK size baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE_APK="$(find base/app/build/outputs/apk/preview -type f -name '*.apk' | sort | head -n1)"
          HEAD_APK="$(find head/app/build/outputs/apk/preview -type f -name '*.apk' | sort | head -n1)"
          test -n "$BASE_APK"
          test -n "$HEAD_APK"

          BASE_BYTES="$(stat -c%s "$BASE_APK")"
          HEAD_BYTES="$(stat -c%s "$HEAD_APK")"
          DELTA_BYTES="$((HEAD_BYTES - BASE_BYTES))"

          python3 - "$BASE_SHA" "$HEAD_SHA" "$BASE_BYTES" "$HEAD_BYTES" "$DELTA_BYTES" <<'PY'
          import json
          import sys

          base_sha, head_sha, base_bytes, head_bytes, delta_bytes = sys.argv[1:]
          base_bytes = int(base_bytes)
          head_bytes = int(head_bytes)
          delta_bytes = int(delta_bytes)
          delta_percent = (delta_bytes / base_bytes * 100.0) if base_bytes else 0.0

          payload = {
              "build_type": "preview",
              "base_sha": base_sha,
              "head_sha": head_sha,
              "base_apk_bytes": base_bytes,
              "head_apk_bytes": head_bytes,
              "delta_bytes": delta_bytes,
              "delta_percent": round(delta_percent, 4),
          }
          with open("reader-journey-theme-size-baseline.json", "w", encoding="utf-8") as fp:
              json.dump(payload, fp, indent=2)
              fp.write("\n")

          def mib(value):
              return value / 1024 / 1024

          print(f"Base Preview APK: {mib(base_bytes):.3f} MiB")
          print(f"Head Preview APK: {mib(head_bytes):.3f} MiB")
          print(f"Delta: {mib(delta_bytes):+.3f} MiB ({delta_percent:+.3f}%)")
          PY

          {
            echo "## Reader Journey Theme — Preview APK size"
            echo
            echo "| Measurement | Value |"
            echo "| --- | ---: |"
            printf '| Base beta Preview APK | %.3f MiB |\n' "$(awk "BEGIN {print $BASE_BYTES/1024/1024}")"
            printf '| Feature Preview APK | %.3f MiB |\n' "$(awk "BEGIN {print $HEAD_BYTES/1024/1024}")"
            printf '| Delta | %+.3f MiB |\n' "$(awk "BEGIN {print $DELTA_BYTES/1024/1024}")"
            echo
            echo "Build type, runner class, JDK, Gradle setup, and build command are identical for base and head."
            echo "No pass/fail size budget is imposed here; this records the actual baseline for later budget decisions."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload size evidence
        uses: actions/upload-artifact@v4
        with:
          name: reader-journey-theme-preview-size
          path: |
            reader-journey-theme-size-baseline.json
            nameplate-v2-packaging-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Nameplate V2 Preview candidate
        uses: actions/upload-artifact@v4
        with:
          name: nameplate-v2-preview-candidate
          path: head/app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
          retention-days: 14
