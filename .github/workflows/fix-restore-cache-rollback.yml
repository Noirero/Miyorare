name: Fix Restore Cache Rollback Safety

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/fix-restore-cache-rollback.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Make restored manga cache transaction safe
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          git diff --check
      - name: Commit rollback-safe restore cache
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-restore-cache-rollback.yml
          git add app/src/main/kotlin/org/koitharu/kotatsu/backup/local/data/LocalBackupRepository.kt
          git commit -m "Make restore manga cache rollback safe"
          git push origin HEAD:beta
