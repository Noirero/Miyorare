name: Fix download notification state v2

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/fix-download-notification-state-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused download fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/download/ui/worker/DownloadWorker.kt')
          text = p.read_text()
          old = 'publishState(DownloadState(manga = manga, isIndeterminate = true).also { lastPublishedState = it })'
          if old not in text:
              raise SystemExit('DownloadWorker initial-state anchor not found')
          text = text.replace(old, 'publishState(DownloadState(manga = manga, isIndeterminate = true))', 1)
          old_fg = '''\toverride suspend fun getForegroundInfo() = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {\n\t\tForegroundInfo(\n\t\t\tid.hashCode(),\n\t\t\tnotificationFactory.create(lastPublishedState),\n\t\t\tServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC,\n\t\t)\n\t} else {\n\t\tForegroundInfo(id.hashCode(), notificationFactory.create(lastPublishedState))\n\t}\n'''
          new_fg = '''\toverride suspend fun getForegroundInfo(): ForegroundInfo {\n\t\t// Hydrate the first foreground card from the manga snapshot stored before enqueue.\n\t\t// DownloadNotificationFactory remains responsible for Private-only redaction.\n\t\tval initialState = lastPublishedState ?: mangaDataRepository\n\t\t\t.findMangaById(task.mangaId, withChapters = false)\n\t\t\t?.let { manga ->\n\t\t\t\tDownloadState(\n\t\t\t\t\tmanga = manga,\n\t\t\t\t\tisIndeterminate = true,\n\t\t\t\t\tisPaused = task.isPaused,\n\t\t\t\t).also { lastPublishedState = it }\n\t\t\t}\n\t\tval notification = notificationFactory.create(initialState)\n\t\treturn if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {\n\t\t\tForegroundInfo(\n\t\t\t\tid.hashCode(),\n\t\t\t\tnotification,\n\t\t\t\tServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC,\n\t\t\t)\n\t\t} else {\n\t\t\tForegroundInfo(id.hashCode(), notification)\n\t\t}\n\t}\n'''
          if old_fg not in text:
              raise SystemExit('DownloadWorker foreground anchor not found')
          text = text.replace(old_fg, new_fg, 1)
          old_publish = '''\tprivate suspend fun publishState(state: DownloadState) = statePublishMutex.withLock {\n\t\tval previousState = currentState\n\t\tlastPublishedState = state\n\t\tif (previousState.isParticularProgress && state.isParticularProgress) {'''
          new_publish = '''\tprivate suspend fun publishState(state: DownloadState) = statePublishMutex.withLock {\n\t\tval previousState = lastPublishedState\n\t\tlastPublishedState = state\n\t\tif (previousState?.isParticularProgress == true && state.isParticularProgress) {'''
          if old_publish not in text:
              raise SystemExit('DownloadWorker publishState anchor not found')
          text = text.replace(old_publish, new_publish, 1)
          p.write_text(text)

          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/download/ui/worker/DownloadNotificationFactory.kt')
          text = p.read_text()
          old_paused = '''\t\t\tstate.isPaused -> {\n\t\t\t\tbuilder.setProgress(state.max, state.progress, false)\n\t\t\t\tval percent = if (state.percent >= 0) {\n\t\t\t\t\tcontext.getString(R.string.percent_string_pattern, (state.percent * 100).format())\n\t\t\t\t} else {\n\t\t\t\t\tnull\n\t\t\t\t}\n\t\t\t\tif (state.errorMessage != null) {\n\t\t\t\t\tbuilder.setContentText(\n\t\t\t\t\t\tif (isPrivateOnly) {\n\t\t\t\t\t\t\tcontext.getString(R.string.error)\n\t\t\t\t\t\t} else {\n\t\t\t\t\t\t\tcontext.getString(R.string.download_summary_pattern, percent, state.errorMessage)\n\t\t\t\t\t\t},\n\t\t\t\t\t)\n\t\t\t\t} else {\n\t\t\t\t\tbuilder.setContentText(percent)\n\t\t\t\t}\n'''
          new_paused = '''\t\t\tstate.isPaused -> {\n\t\t\t\tbuilder.setProgress(state.max, state.progress, false)\n\t\t\t\tval progressText = getProgressString(state.copy(eta = -1L, isStuck = false))\n\t\t\t\tif (state.errorMessage != null) {\n\t\t\t\t\tbuilder.setContentText(\n\t\t\t\t\t\tif (isPrivateOnly) {\n\t\t\t\t\t\t\tcontext.getString(R.string.error)\n\t\t\t\t\t\t} else if (progressText != null) {\n\t\t\t\t\t\t\tcontext.getString(R.string.download_summary_pattern, progressText, state.errorMessage)\n\t\t\t\t\t\t} else {\n\t\t\t\t\t\t\tstate.errorMessage\n\t\t\t\t\t\t},\n\t\t\t\t\t)\n\t\t\t\t} else {\n\t\t\t\t\tbuilder.setContentText(progressText)\n\t\t\t\t}\n'''
          if old_paused not in text:
              raise SystemExit('DownloadNotificationFactory paused anchor not found')
          text = text.replace(old_paused, new_paused, 1)
          old_running = 'builder.setContentText(getProgressString(state.percent, state.eta, state.isStuck))'
          if old_running not in text:
              raise SystemExit('DownloadNotificationFactory running anchor not found')
          text = text.replace(old_running, 'builder.setContentText(getProgressString(state))', 1)
          start = text.find('\tprivate fun getProgressString(')
          end = text.find('\n\tprivate fun createMangaIntent', start)
          if start < 0 or end < 0:
              raise SystemExit('DownloadNotificationFactory helper anchor not found')
          helper = '''\tprivate fun getProgressString(state: DownloadState): CharSequence? {\n\t\tval parts = ArrayList<CharSequence>(4)\n\t\tif (state.totalChapters > 0) {\n\t\t\tparts += context.getString(\n\t\t\t\tR.string.download_chapter_progress,\n\t\t\t\t(state.currentChapter + 1).coerceIn(1, state.totalChapters),\n\t\t\t\tstate.totalChapters,\n\t\t\t)\n\t\t}\n\t\tif (state.totalPages > 0) {\n\t\t\tparts += context.getString(\n\t\t\t\tR.string.download_page_progress,\n\t\t\t\t(state.currentPage + 1).coerceIn(1, state.totalPages),\n\t\t\t\tstate.totalPages,\n\t\t\t)\n\t\t}\n\t\tif (state.percent >= 0f) {\n\t\t\tparts += context.getString(R.string.percent_string_pattern, (state.percent * 100).format())\n\t\t}\n\t\tval etaString = when {\n\t\t\tstate.eta <= 0L -> null\n\t\t\tstate.isStuck -> context.getString(R.string.stuck)\n\t\t\telse -> DateUtils.getRelativeTimeSpanString(\n\t\t\t\tstate.eta,\n\t\t\t\tSystem.currentTimeMillis(),\n\t\t\t\tDateUtils.SECOND_IN_MILLIS,\n\t\t\t)\n\t\t}\n\t\tif (etaString != null) parts += etaString\n\t\treturn parts.takeIf { it.isNotEmpty() }?.joinToString(" • ")\n\t}\n'''
          text = text[:start] + helper + text[end:]
          p.write_text(text)

          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/download/ui/list/DownloadsViewModel.kt')
          text = p.read_text()
          if 'private const val EMPTY_STATE_GRACE_MS = 350L' not in text:
              raise SystemExit('DownloadsViewModel grace anchor not found')
          text = text.replace('private const val EMPTY_STATE_GRACE_MS = 350L', 'private const val EMPTY_STATE_GRACE_MS = 900L', 1)
          anchor = 'private const val UI_ACTION_TTL_MS = 5000L\n'
          if anchor not in text:
              raise SystemExit('DownloadsViewModel constants anchor not found')
          text = text.replace(anchor, anchor + 'private const val ACTIVE_WORK_HYDRATION_RETRIES = 4\nprivate const val ACTIVE_WORK_HYDRATION_RETRY_DELAY_MS = 75L\n', 1)
          old_get = '''\tprivate suspend fun getManga(mangaId: Long): Manga? {\n\t\tmangaCache[mangaId]?.let {\n\t\t\treturn it\n\t\t}\n\t\treturn cacheMutex.withLock {\n\t\t\tmangaCache.getOrElse(mangaId) {\n\t\t\t\tmangaDataRepository.findMangaById(mangaId, withChapters = true)?.also {\n\t\t\t\t\tmangaCache[mangaId] = it\n\t\t\t\t} ?: return null\n\t\t\t}\n\t\t}\n\t}\n'''
          new_get = '''\tprivate suspend fun getManga(mangaId: Long): Manga? {\n\t\tmangaCache[mangaId]?.let { return it }\n\n\t\tvar resolved: Manga? = null\n\t\tfor (attempt in 0 until ACTIVE_WORK_HYDRATION_RETRIES) {\n\t\t\tresolved = mangaDataRepository.findMangaById(mangaId, withChapters = true)\n\t\t\tif (resolved != null) break\n\t\t\tif (attempt + 1 < ACTIVE_WORK_HYDRATION_RETRIES) {\n\t\t\t\tdelay(ACTIVE_WORK_HYDRATION_RETRY_DELAY_MS)\n\t\t\t}\n\t\t}\n\t\tval manga = resolved ?: return null\n\t\treturn cacheMutex.withLock {\n\t\t\tmangaCache[mangaId] ?: manga.also { mangaCache[mangaId] = it }\n\t\t}\n\t}\n'''
          if old_get not in text:
              raise SystemExit('DownloadsViewModel getManga anchor not found')
          text = text.replace(old_get, new_get, 1)
          p.write_text(text)

          # Base resource owns the non-translatable summary; Indonesian gets only the new labels.
          p = Path('app/src/main/res/values/strings.xml')
          text = p.read_text()
          if 'name="download_chapter_progress"' not in text:
              match = re.search(r'(^\s*<string name="download_summary_pattern"[^\n]*</string>\s*$)', text, flags=re.M)
              if not match:
                  raise SystemExit('values/strings.xml summary anchor not found')
              insertion = match.group(1) + '\n    <string name="download_chapter_progress">Chapter %1$d/%2$d</string>\n    <string name="download_page_progress">Page %1$d/%2$d</string>'
              text = text[:match.start()] + insertion + text[match.end():]
              p.write_text(text)

          p = Path('app/src/main/res/values-in/strings.xml')
          text = p.read_text()
          if 'name="download_chapter_progress"' not in text:
              anchor = '    <string name="download">Unduh</string>'
              if anchor not in text:
                  raise SystemExit('values-in/strings.xml download anchor not found')
              text = text.replace(anchor, anchor + '\n    <string name="download_chapter_progress">Bab %1$d/%2$d</string>\n    <string name="download_page_progress">Halaman %1$d/%2$d</string>', 1)
              p.write_text(text)

      - name: Commit focused download fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-download-notification-state.yml
          git rm .github/workflows/fix-download-notification-state-v2.yml
          git add app/src/main/kotlin/org/koitharu/kotatsu/download/ui/worker/DownloadWorker.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/download/ui/worker/DownloadNotificationFactory.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/download/ui/list/DownloadsViewModel.kt \
                  app/src/main/res/values/strings.xml \
                  app/src/main/res/values-in/strings.xml
          git commit -m "Fix download notification and initial queue state"
          git push
