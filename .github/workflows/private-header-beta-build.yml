name: Private Header Beta Verify

on:
  push:
    branches:
      - beta

permissions:
  contents: read

concurrency:
  group: private-header-beta-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build beta APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Require beta branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "beta"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Require stable beta signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Pre-warm JitPack dependency
        run: |
          set -euo pipefail
          PARSERS_VERSION=$(grep 'parsers = ' gradle/libs.versions.toml | sed 's/.*= "\(.*\)"/\1/')
          POM_URL="https://jitpack.io/com/github/YakaTeam/kotatsu-parsers/${PARSERS_VERSION}/kotatsu-parsers-${PARSERS_VERSION}.pom"
          for i in $(seq 1 10); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$POM_URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              exit 0
            fi
            echo "Attempt $i: JitPack HTTP ${HTTP_STATUS}; waiting 30s"
            sleep 30
          done
          echo "::error::JitPack dependency unavailable"
          exit 1

      - name: Run Private header unit check
        run: ./gradlew :app:testDebugUnitTest --tests org.koitharu.kotatsu.core.ui.PrivateFavouritesVisualResolverTest --no-daemon --stacktrace

      - name: Build signed beta APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assemblePreview --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=../release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Verify beta identity and collect APK
        id: apk
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('app/build/outputs/apk/preview/output-metadata.json')
          data = json.loads(p.read_text())
          if data.get('applicationId') != 'org.noirero.miyorare.beta':
              raise SystemExit(f"Wrong applicationId: {data.get('applicationId')!r}")
          PY
          APK=$(find app/build/outputs/apk/preview -name '*.apk' | head -n1)
          test -n "$APK"
          SHORT_SHA=$(git rev-parse --short HEAD)
          DEST="Miyorare-Beta-private-header-${SHORT_SHA}.apk"
          cp "$APK" "$DEST"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"
          sha256sum "$DEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30
