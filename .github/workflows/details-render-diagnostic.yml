name: Details DAO Contention Experiment
run-name: DAO contention experiment HP-only · ${{ github.sha }}

on:
  push:
    branches: [experiment/details-dao-favourites-contention]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: details-dao-contention-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build isolated diagnostic APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require diagnostic branch and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = experiment/details-dao-favourites-contention
          test "$(git merge-base HEAD c22517f2b8c9ecf81e98cbb28ce1f2675f473f01)" = c22517f2b8c9ecf81e98cbb28ce1f2675f473f01
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Prepare diagnostic build identity and signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          text = p.read_text()
          assert text.count("versionName = '1.2.0'") == 1
          p.write_text(text.replace("versionName = '1.2.0'", "versionName = '1.4.7'"))
          PY
      - name: Validate targeted regressions and diagnostic timeline
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests 'org.koitharu.kotatsu.core.diagnostics.DiagnosticTimelineTest' \
            --tests 'org.koitharu.kotatsu.core.diagnostics.FavouritesWorkloadGateTest' \
            --tests 'org.koitharu.kotatsu.details.domain.DetailsHotPathOrderingTest' \
            --tests 'org.koitharu.kotatsu.details.domain.DetailsChapterRoomFlowRegressionTest' \
            --tests 'org.koitharu.kotatsu.favourites.ui.list.FavouritesPaginationRegressionTest'
      - name: Build debuggable diagnostic Preview
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assemblePreview --no-daemon --stacktrace \
            -PDETAILS_DIAGNOSTIC=true -PDETAILS_DIAGNOSTIC_SHA="$GITHUB_SHA" \
            -PRELEASE_STORE_FILE=../release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
      - name: Verify APK identity, debuggability and signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/preview/output-metadata.json').read_text())
          assert metadata['applicationId'] == 'org.noirero.miyorare.daocontentiontest', metadata
          PY
          APK=$(find app/build/outputs/apk/preview -name '*.apk' -type f | head -n1)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          mkdir -p build/details-diagnostic
          "$BUILD_TOOLS/aapt" dump badging "$APK" > build/diagnostic-apk-badging.txt
          grep -Fq "package: name='org.noirero.miyorare.daocontentiontest'" build/diagnostic-apk-badging.txt
          grep -Fq "application-label:'Miyorare DAO Contention Test'" build/diagnostic-apk-badging.txt
          grep -Fq 'application-debuggable' build/diagnostic-apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify "$APK"
          cp "$APK" "build/details-diagnostic/Miyorare-DAO-Contention-Test-${GITHUB_SHA:0:8}.apk"
          sha256sum build/details-diagnostic/*.apk > build/details-diagnostic/SHA256SUMS.txt
          cp build/diagnostic-apk-badging.txt build/details-diagnostic/
          cp docs/diagnostics/details-dao-favourites-contention.md build/details-diagnostic/OWNER-INSTRUCTIONS.md
          printf 'Head: %s\nBaseline: c22517f2b8c9ecf81e98cbb28ce1f2675f473f01\n' "$GITHUB_SHA" > build/details-diagnostic/BUILD.txt
      - name: Preserve exact generated DAO and Room path for cancellation verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import re
          from pathlib import Path
          source = Path('app/build/generated/ksp/preview')
          output = Path('build/details-diagnostic/generated-room')
          output.mkdir(parents=True, exist_ok=True)
          for name in ['MangaDao_Impl.kt', 'FavouritesDao_Impl.kt', 'MangaDatabase_Impl.kt']:
              candidates = list(source.rglob(name))
              assert len(candidates) == 1, (name, candidates)
              text = candidates[0].read_text()
              (output / name).write_text(text)
              if name == 'MangaDao_Impl.kt':
                  begin = text.index('override suspend fun find(')
                  end = text.index('override ', begin + 10)
                  assert re.search(r'performSuspending\(__db,\s*true,\s*true', text[begin:end]), text[begin:end]
              if name == 'FavouritesDao_Impl.kt':
                  begin = text.index('override fun observeAllImpl(')
                  end = text.find('override ', begin + 10)
                  method = text[begin:end] if end >= 0 else text[begin:]
                  assert re.search(r'createFlow\(__db,\s*true', method), method
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Miyorare-DAO-Contention-Test-${{ github.sha }}
          path: build/details-diagnostic/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-test-reports-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
