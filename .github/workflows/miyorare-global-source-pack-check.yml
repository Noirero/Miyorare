name: Miyorare Global Source Pack Check

on:
  push:
    branches:
      - beta
    paths:
      - 'extensions/miyorare-sources/**'
      - '.github/workflows/miyorare-global-source-pack-check.yml'
  pull_request:
    branches:
      - beta
    paths:
      - 'extensions/miyorare-sources/**'
      - '.github/workflows/miyorare-global-source-pack-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miyorare-global-source-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-global:
    name: Build Miyorare-Global
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Miyorare
        uses: actions/checkout@v5

      - name: Checkout pinned Gekkoushi source
        uses: actions/checkout@v5
        with:
          repository: Gekkoushi/plugin-source
          ref: 9aa770b7cb699c6385f574f13710990e17ef5517
          path: _upstream/gekkoushi
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Apply Miyorare Global parser overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          root = Path('extensions/miyorare-sources/overlays/gekkoushi/all')
          if not root.is_dir():
              raise SystemExit(0)
          for file in root.rglob('*.kt'):
              rel = file.relative_to(root)
              target = Path('_upstream/gekkoushi/src/main/kotlin/tsuki/site/all') / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(file, target)
              print(f'overlay: {file} -> {target}')
          PY

      - name: Prepare global Gekkoushi shard
        run: |
          python3 extensions/miyorare-sources/tools/prepare_global_gekkoushi_shard.py \
            --manifest extensions/miyorare-sources/packs.json \
            --gekkoushi-upstream _upstream/gekkoushi \
            --pack global

      - name: Build global Gekkoushi shard
        working-directory: _upstream/gekkoushi
        run: |
          set -o pipefail
          mkdir -p ../../build/miyorare-source-packs/logs
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon --stacktrace 2>&1 | \
            tee ../../build/miyorare-source-packs/logs/global-gekkoushi-gradle.log

      - name: Finalize global Gekkoushi shard
        run: |
          python3 extensions/miyorare-sources/tools/finalize_global_shard.py \
            --manifest extensions/miyorare-sources/packs.json \
            --upstream _upstream/gekkoushi \
            --output build/miyorare-source-packs/global

      - name: Finalize logical global pack
        run: |
          python3 extensions/miyorare-sources/tools/finalize_global_pack.py \
            --manifest extensions/miyorare-sources/packs.json \
            --pack global \
            --gekkoushi-metadata _upstream/gekkoushi/miyorare-pack.json \
            --output build/miyorare-source-packs/global

      - name: Verify Global ownership and complete E-Hentai family preset
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          output = Path('build/miyorare-source-packs/global')
          logical = json.loads((output / 'miyorare-global-pack.json').read_text(encoding='utf-8'))
          shard = json.loads((output / 'miyorare-global-pack-shard.json').read_text(encoding='utf-8'))

          expected_sources = {'EXHENTAI', 'GELBOORU'}
          logical_names = set(logical['sourceNames'])
          shard_names = set(shard['sourceNames'])
          assert logical_names == expected_sources, sorted(logical_names)
          assert logical.get('sourceCount') == len(expected_sources), logical.get('sourceCount')
          assert shard_names == expected_sources, sorted(shard_names)
          assert shard.get('dedupeAuthority') == 'global-single-owner', shard.get('dedupeAuthority')

          presets = shard.get('sourcePresets', {}).get('EXHENTAI', {})
          assert presets.get('identity') == 'ehentai-gallery-id', presets
          expected_languages = {
              'all', 'en', 'ja', 'zh', 'ko', 'de', 'es', 'fr', 'it', 'hu',
              'nl', 'pl', 'pt-BR', 'ru', 'th', 'vi', 'none', 'other',
          }
          actual_languages = set(presets.get('languages', []))
          assert actual_languages == expected_languages, sorted(actual_languages)
          PY

      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miyorare-global-gradle-diagnostics
          path: build/miyorare-source-packs/logs/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload staging pack
        uses: actions/upload-artifact@v4
        with:
          name: miyorare-global-staging
          path: build/miyorare-source-packs/global/
          if-no-files-found: error
          retention-days: 7
