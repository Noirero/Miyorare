name: Exclusive Badge Animation V2 Evidence

on:
  push:
    branches:
      - fix/beta-badge-v2-static-20260927
    paths:
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/ui/ExclusiveBadge.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/ui/ReaderJourneyExclusiveCollection.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/ui/StatsScreen.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/stats/ui/BadgeV2AnimationEvidenceTest.kt'
      - '.github/workflows/exclusive-badge-animation-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: badge-v2-animation-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  animation-evidence:
    name: Record 01-12 preview profile reduce-motion battery-saver
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify V2 payload provenance
        run: python3 tools/regenerate_badge_v2_payload.py --check

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("gradle/libs.versions.toml").read_text(encoding="utf-8"))
          print(str(data["versions"]["parsers"]).strip())
          PY
          )"
          POM_URL="https://jitpack.io/com/github/Gekkoushi/plugin-source/${PARSERS_VERSION}/plugin-source-${PARSERS_VERSION}.pom"
          for i in $(seq 1 12); do
            HTTP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$POM_URL" || true)"
            if [ "$HTTP_STATUS" = "200" ]; then exit 0; fi
            sleep 20
          done
          exit 1

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true

      - name: Build and record Animation V2 evidence on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb shell wm size 864x1536
            adb shell wm density 320
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night yes
            adb shell cmd power set-mode 0 || true
            adb shell rm -rf /sdcard/Download/miyorare-badge-v2-animation

            ./gradlew :app:assemblePreview :app:assemblePreviewAndroidTest --no-daemon --stacktrace \
              -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview \
              -PMIYORARE_VISUAL_TEST_SIGNING=true

            APP_APK="$(find app/build/outputs/apk/preview -type f -name '*.apk' | head -n 1)"
            TEST_APK="$(find app/build/outputs/apk/androidTest/preview -type f -name '*.apk' | head -n 1)"
            test -s "$APP_APK"
            test -s "$TEST_APK"
            adb install -r "$APP_APK"
            adb install -r "$TEST_APK"

            INSTRUMENTATION="$(adb shell pm list instrumentation | tr -d '\r' | grep 'org.koitharu.kotatsu.HiltTestRunner' | head -n 1 | sed 's/^instrumentation://' | awk '{print $1}')"
            test -n "$INSTRUMENTATION"

            mkdir -p badge-v2-animation-videos badge-v2-animation-files

            record_test() {
              local METHOD="$1"
              local OUT="$2"
              local LIMIT="$3"
              local LOG="$4"
              adb shell rm -f "/sdcard/$OUT"
              adb shell am instrument -w -r \
                -e class "org.koitharu.kotatsu.stats.ui.BadgeV2AnimationEvidenceTest#$METHOD" \
                "$INSTRUMENTATION" > "$LOG" 2>&1 &
              local TEST_PID=$!
              sleep 1
              adb shell screenrecord \
                --size 720x1280 \
                --bit-rate 6000000 \
                --time-limit "$LIMIT" \
                "/sdcard/$OUT" || true
              wait "$TEST_PID"
              grep -q "OK (1 test)" "$LOG"
              adb pull "/sdcard/$OUT" "badge-v2-animation-videos/$OUT"
              test -s "badge-v2-animation-videos/$OUT"
            }

            # 12 badges x 5.5 seconds, plus warm-up/transition headroom.
            record_test largePreviewSignatureSequence \
              badge-v2-large-preview-01-12.mp4 78 large-preview-instrumentation.txt

            adb shell cmd power set-mode 0 || true
            record_test equippedProfileIdleEvidence \
              badge-v2-profile-equipped.mp4 18 profile-instrumentation.txt

            adb shell cmd power set-mode 0 || true
            record_test reduceMotionEvidence \
              badge-v2-reduce-motion.mp4 12 reduce-motion-instrumentation.txt

            adb shell cmd power set-mode 1
            sleep 1
            adb shell dumpsys power | grep -i -E 'mIsPowered|mBatteryLevel|mLowPower|Power Save|battery saver' > battery-saver-state.txt || true
            record_test batterySaverEvidence \
              badge-v2-battery-saver.mp4 12 battery-saver-instrumentation.txt
            adb shell cmd power set-mode 0 || true

            adb pull /sdcard/Download/miyorare-badge-v2-animation/. badge-v2-animation-files/

            test -s badge-v2-animation-videos/badge-v2-large-preview-01-12.mp4
            test -s badge-v2-animation-videos/badge-v2-profile-equipped.mp4
            test -s badge-v2-animation-videos/badge-v2-reduce-motion.mp4
            test -s badge-v2-animation-videos/badge-v2-battery-saver.mp4
            test -s badge-v2-animation-files/large-preview-sequence.json
            test -s badge-v2-animation-files/profile-equipped.json
            test -s badge-v2-animation-files/reduce-motion-metrics.json
            test -s badge-v2-animation-files/battery-saver-metrics.json

      - name: Validate motion suppression evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("badge-v2-animation-files")
          preview=json.loads((root/"large-preview-sequence.json").read_text())
          profile=json.loads((root/"profile-equipped.json").read_text())
          rm=json.loads((root/"reduce-motion-metrics.json").read_text())
          bs=json.loads((root/"battery-saver-metrics.json").read_text())

          assert preview["animation"] is True
          assert preview["selectorGridAnimation"] is False
          assert len(preview["order"]) == 12
          assert preview["secondsPerBadge"] >= 5.0

          assert profile["state"] == "EQUIPPED"
          assert profile["animation"] is True
          assert profile["profileMode"] is True

          assert rm["animationRequested"] is True
          assert rm["reduceMotion"] is True
          assert rm["postRevealPixelDelta"] < 0.003, rm

          assert bs["animationRequested"] is True
          assert bs["batterySaver"] is True
          assert bs["postRevealPixelDelta"] < 0.003, bs
          PY

      - name: Upload Animation V2 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badge-v2-animation-review-evidence
          path: |
            badge-v2-animation-videos/
            badge-v2-animation-files/
            *-instrumentation.txt
            battery-saver-state.txt
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
