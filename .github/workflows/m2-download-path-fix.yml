name: Apply M2 Tsuki download path fix

on:
  push:
    branches:
      - "feature/miyorare-source-m2"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/miyorare-source-m2
          fetch-depth: 0

      - name: Patch Tsuki download source directory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/org/koitharu/kotatsu/local/data/output/LocalMangaOutput.kt')
          text = path.read_text()

          old_import = 'import org.koitharu.kotatsu.mihon.model.MihonMangaSource\n'
          new_import = old_import + 'import org.koitharu.kotatsu.tsuki.model.TsukiMangaSource\n'
          if text.count(old_import) != 1:
              raise SystemExit('Expected Mihon import exactly once')
          text = text.replace(old_import, new_import, 1)

          old_block = '''\t\t/** Returns a readable source directory, e.g. `Doujindesu (ID)` or `KDT Novels (JP)`. */
\t\tfun getSourceDirectory(root: File, manga: Manga): File {
\t\t\tval source = manga.source.unwrap()
\t\t\tif (source !is MihonMangaSource) {
\t\t\t\treturn root
\t\t\t}
\t\t\treturn File(root, mihonSourceDirectoryName(source.displayName, source.language).toReadableFileName())
\t\t}
'''
          new_block = '''\t\t/**
\t\t * Returns a readable source directory, e.g. `Doujindesu (ID)` or `BatCave (EN)`.
\t\t *
\t\t * Mihon/Keiyoushi and Tsuki/Usagi are both external source runtimes. Keep their new downloads
\t\t * under the same source-folder layout while [findLegacy] continues to discover older Tsuki
\t\t * downloads that were written directly beneath `downloads/`. No existing file is moved.
\t\t */
\t\tfun getSourceDirectory(root: File, manga: Manga): File {
\t\t\tval source = manga.source.unwrap()
\t\t\tval directoryName = when (source) {
\t\t\t\tis MihonMangaSource -> externalSourceDirectoryName(source.displayName, source.language)
\t\t\t\tis TsukiMangaSource -> externalSourceDirectoryName(source.displayName, source.language)
\t\t\t\telse -> return root
\t\t\t}
\t\t\treturn File(root, directoryName.toReadableFileName())
\t\t}

\t\tinternal fun externalSourceDirectoryName(displayName: String, language: String): String {
\t\t\treturn "${mihonSourceBaseName(displayName, language)} (${stableSourceLanguageCode(language)})"
\t\t}
'''
          if text.count(old_block) != 1:
              raise SystemExit('Expected getSourceDirectory block exactly once')
          text = text.replace(old_block, new_block, 1)

          old_name_fn = '''\t\tinternal fun mihonSourceDirectoryName(displayName: String, language: String): String {
\t\t\treturn "${mihonSourceBaseName(displayName, language)} (${stableSourceLanguageCode(language)})"
\t\t}
'''
          new_name_fn = '''\t\tinternal fun mihonSourceDirectoryName(displayName: String, language: String): String =
\t\t\texternalSourceDirectoryName(displayName, language)
'''
          if text.count(old_name_fn) != 1:
              raise SystemExit('Expected Mihon directory-name helper exactly once')
          text = text.replace(old_name_fn, new_name_fn, 1)

          path.write_text(text)
          PY

      - name: Commit focused fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Noirero"
          git config user.email "149634319+Noirero@users.noreply.github.com"
          git rm .github/workflows/m2-download-path-fix.yml
          git add app/src/main/kotlin/org/koitharu/kotatsu/local/data/output/LocalMangaOutput.kt
          git commit -m "Align Tsuki downloads with source folders"
          git push origin HEAD:feature/miyorare-source-m2
