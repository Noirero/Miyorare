name: Runtime Acceptance Harness

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      signed_build_run_id:
        required: true
        type: string
      signed_artifact_id:
        required: true
        type: string
      candidate_apk_sha256:
        required: true
        type: string
    secrets:
      KEYSTORE_BASE64:
        required: true
      RELEASE_STORE_PASSWORD:
        required: true
      RELEASE_KEY_ALIAS:
        required: true
      RELEASE_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  library-sync-persistence:
    name: Exact-candidate LibrarySyncPersistenceTest
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Initialize harness paths outside checkout
        shell: bash
        run: |
          set -euo pipefail
          harness_tools="$RUNNER_TEMP/runtime-harness"
          acceptance_evidence="$RUNNER_TEMP/library-sync-evidence"
          mkdir -p "$harness_tools" "$acceptance_evidence"
          {
            printf 'HARNESS_TOOLS=%s\n' "$harness_tools"
            printf 'ACCEPTANCE_EVIDENCE=%s\n' "$acceptance_evidence"
          } >> "$GITHUB_ENV"
      - name: Checkout harness
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Preserve harness tools and check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HARNESS_TOOLS" "$ACCEPTANCE_EVIDENCE"
          cp .github/acceptance/*.sh .github/acceptance/runtime-probe.init.gradle .github/acceptance/SignedUpgradeAcceptanceHarnessTest.kt "$HARNESS_TOOLS/"
          cp .github/scripts/runtime_acceptance_evidence.py "$HARNESS_TOOLS/"
          for script in "$HARNESS_TOOLS"/*.sh; do
            bash -n "$script"
            printf 'PASS bash -n %s\n' "$(basename "$script")" >> "$ACCEPTANCE_EVIDENCE/shell-checks.txt"
          done
          python3 -m py_compile "$HARNESS_TOOLS/runtime_acceptance_evidence.py"
          printf 'harness_sha=%s\ncandidate_sha=%s\nshell_syntax=pass\n' "$GITHUB_SHA" "$CANDIDATE_SHA" > "$ACCEPTANCE_EVIDENCE/run-identity.txt"
      - name: Checkout exact candidate source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "8be228346e0bb0127a938b21e90bf54af50e8aa3"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true
      - name: Run LibrarySyncPersistenceTest on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 13823996
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$HARNESS_TOOLS/library-sync.sh"
      - name: Record sync job status even without JUnit
        if: always()
        shell: bash
        run: |
          mkdir -p "$ACCEPTANCE_EVIDENCE"
          printf 'job_status=%s\n' '${{ job.status }}' > "$ACCEPTANCE_EVIDENCE/job-status.txt"
      - name: Upload LibrarySyncPersistenceTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-sync-persistence-${{ inputs.candidate_sha }}
          path: ${{ env.ACCEPTANCE_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    name: Signed v1.4.4 to candidate runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      SIGNED_BUILD_RUN_ID: ${{ inputs.signed_build_run_id }}
      SIGNED_ARTIFACT_ID: ${{ inputs.signed_artifact_id }}
      EXPECTED_CANDIDATE_APK_SHA256: ${{ inputs.candidate_apk_sha256 }}
      STABLE_SHA256: 9e4b84998107b9f7dda99d884c48c5125e5fb4273abe4596a3cc8d1477650a4e
      STABLE_TAG: v1.4.4
      STABLE_COMMIT: a2db74e301b525da74bed5b2a96776f85c14c76a
      PACKAGE: org.noirero.miyorare
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Initialize harness paths outside checkout
        shell: bash
        run: |
          set -euo pipefail
          harness_tools="$RUNNER_TEMP/runtime-harness"
          acceptance_evidence="$RUNNER_TEMP/runtime-acceptance"
          mkdir -p "$harness_tools" "$acceptance_evidence"
          {
            printf 'HARNESS_TOOLS=%s\n' "$harness_tools"
            printf 'ACCEPTANCE_EVIDENCE=%s\n' "$acceptance_evidence"
          } >> "$GITHUB_ENV"
      - name: Capture harness and verify immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "HARNESS_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          test "$CANDIDATE_SHA" = "8be228346e0bb0127a938b21e90bf54af50e8aa3"
          test "$SIGNED_BUILD_RUN_ID" = "37136536606"
          test "$SIGNED_ARTIFACT_ID" = "11278218884"
          test "$EXPECTED_CANDIDATE_APK_SHA256" = "da08a003472f39cd649eb7cc4d1247c6d9e10c6fb4b468151c98ce4916e5b5e7"

      - name: Checkout harness
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preserve harness tools and check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HARNESS_TOOLS" "$ACCEPTANCE_EVIDENCE"
          cp .github/acceptance/*.sh .github/acceptance/runtime-probe.init.gradle .github/acceptance/SignedUpgradeAcceptanceHarnessTest.kt "$HARNESS_TOOLS/"
          cp .github/scripts/runtime_acceptance_evidence.py "$HARNESS_TOOLS/"
          for script in "$HARNESS_TOOLS"/*.sh; do
            bash -n "$script"
            printf 'PASS bash -n %s\n' "$(basename "$script")" >> "$ACCEPTANCE_EVIDENCE/shell-checks.txt"
          done
          python3 -m py_compile "$HARNESS_TOOLS/runtime_acceptance_evidence.py"
          printf 'harness_sha=%s\ncandidate_sha=%s\nshell_syntax=pass\n' "$GITHUB_SHA" "$CANDIDATE_SHA" > "$ACCEPTANCE_EVIDENCE/run-identity.txt"

      - name: Download exact signed candidate artifact
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.signed_build_run_id }}
          path: /tmp/candidate

      - name: Verify exact signed candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_APK="$(find /tmp/candidate -type f -path '*/release/*.apk' -print -quit)"
          test -n "$CANDIDATE_APK"
          cp "$CANDIDATE_APK" /tmp/candidate.apk
          echo "$EXPECTED_CANDIDATE_APK_SHA256  /tmp/candidate.apk" | sha256sum -c -
          grep -Fx "source_sha=$CANDIDATE_SHA" /tmp/candidate/build/candidate-evidence/provenance.txt
          grep -Fx 'version_name=1.4.5' /tmp/candidate/build/candidate-evidence/provenance.txt
          grep -Fx 'version_code=212453409' /tmp/candidate/build/candidate-evidence/provenance.txt

      - name: Download official stable v1.4.4 APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_url="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STABLE_TAG" --jq '.assets[] | select(.name=="Miyorare-v1.4.4.apk") | .url')"
          test -n "$asset_url"
          gh api -H 'Accept: application/octet-stream' "$asset_url" > /tmp/stable.apk
          echo "$STABLE_SHA256  /tmp/stable.apk" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Prepare test-only release signing outside evidence
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/runtime-probe-signing"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/runtime-probe-signing/release.keystore"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/runtime-probe-signing/release.keystore" >> "$GITHUB_ENV"

      - name: Build and verify both isolated Release probe classpaths
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: bash "$HARNESS_TOOLS/build-probes.sh"

      - name: Verify probe signatures and Release target compatibility
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          printf 'path=%s\n' "$APKSIGNER" > "$ACCEPTANCE_EVIDENCE/apksigner-tool.txt"
          "$APKSIGNER" version >> "$ACCEPTANCE_EVIDENCE/apksigner-tool.txt" 2>&1
          cert_digest() {
            local label="$1" apk="$2"
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "$ACCEPTANCE_EVIDENCE/$label-signature.txt" 2>&1 || return "$?"
            python3 "$HARNESS_TOOLS/runtime_acceptance_evidence.py" certificate \
              --file "$ACCEPTANCE_EVIDENCE/$label-signature.txt" \
              --output "$ACCEPTANCE_EVIDENCE/$label-certificate-summary.json"
          }
          stable_cert="$(cert_digest stable /tmp/stable.apk)"
          candidate_cert="$(cert_digest candidate /tmp/candidate.apk)"
          stable_test_cert="$(cert_digest stable-probe /tmp/stable-test.apk)"
          candidate_test_cert="$(cert_digest candidate-probe /tmp/candidate-test.apk)"
          test -n "$stable_cert"
          test "$candidate_cert" = "$stable_cert"
          test "$stable_test_cert" = "$stable_cert"
          test "$candidate_test_cert" = "$stable_cert"
          for label in stable candidate; do
            "$AAPT" dump xmltree "/tmp/$label-test.apk" AndroidManifest.xml > "$ACCEPTANCE_EVIDENCE/$label-probe-manifest.txt"
            python3 "$HARNESS_TOOLS/runtime_acceptance_evidence.py" manifest \
              --file "$ACCEPTANCE_EVIDENCE/$label-probe-manifest.txt" \
              --package "$PACKAGE" --runner org.koitharu.kotatsu.HiltTestRunner
            "$AAPT" dump badging "/tmp/$label.apk" > "$ACCEPTANCE_EVIDENCE/$label-package.txt"
            package_id="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$ACCEPTANCE_EVIDENCE/$label-package.txt")"
            test "$package_id" = "$PACKAGE"
          done
          printf '%s\n' "stable=$stable_cert" "candidate=$candidate_cert" "stable_probe=$stable_test_cert" "candidate_probe=$candidate_test_cert" > "$ACCEPTANCE_EVIDENCE/probe-certificates.txt"

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true

      - name: Run Android 15 acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 13823996
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$HARNESS_TOOLS/upgrade-release.sh"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/runtime-probe-signing"

      - name: Record APK hashes and package metadata
        if: always()
        shell: bash
        run: |
          mkdir -p "$ACCEPTANCE_EVIDENCE"
          for apk in /tmp/stable.apk /tmp/candidate.apk; do
            if test -f "$apk"; then sha256sum "$apk"; else echo "missing=$apk"; fi
          done > "$ACCEPTANCE_EVIDENCE/apk-sha256.txt"
          {
            echo "harness_sha=${HARNESS_SHA:-$GITHUB_SHA}"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "signed_build_run_id=$SIGNED_BUILD_RUN_ID"
            echo "signed_artifact_id=$SIGNED_ARTIFACT_ID"
            echo "api_level=35"
            echo "job_status=${{ job.status }}"
          } > "$ACCEPTANCE_EVIDENCE/run-identity.txt"

      - name: Upload runtime acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-acceptance-v3-${{ inputs.candidate_sha }}
          path: ${{ env.ACCEPTANCE_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 14
