name: Runtime Acceptance Harness

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      signed_build_run_id:
        required: true
        type: string
      signed_artifact_id:
        required: true
        type: string
      candidate_apk_sha256:
        required: true
        type: string
    secrets:
      KEYSTORE_BASE64:
        required: true
      RELEASE_STORE_PASSWORD:
        required: true
      RELEASE_KEY_ALIAS:
        required: true
      RELEASE_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  library-sync-persistence:
    name: Exact-candidate LibrarySyncPersistenceTest
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "8be228346e0bb0127a938b21e90bf54af50e8aa3"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true
      - name: Run LibrarySyncPersistenceTest on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 13823996
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace \\
              -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.sync.library.LibrarySyncPersistenceTest
      - name: Upload LibrarySyncPersistenceTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-sync-persistence-${{ inputs.candidate_sha }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    name: Signed v1.4.4 to candidate runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      SIGNED_BUILD_RUN_ID: ${{ inputs.signed_build_run_id }}
      SIGNED_ARTIFACT_ID: ${{ inputs.signed_artifact_id }}
      EXPECTED_CANDIDATE_APK_SHA256: ${{ inputs.candidate_apk_sha256 }}
      STABLE_SHA256: 9e4b84998107b9f7dda99d884c48c5125e5fb4273abe4596a3cc8d1477650a4e
      STABLE_TAG: v1.4.4
      STABLE_COMMIT: a2db74e301b525da74bed5b2a96776f85c14c76a
      PACKAGE: org.noirero.miyorare
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Capture harness and verify immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "HARNESS_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          test "$CANDIDATE_SHA" = "8be228346e0bb0127a938b21e90bf54af50e8aa3"
          test "$SIGNED_BUILD_RUN_ID" = "37136536606"
          test "$SIGNED_ARTIFACT_ID" = "11278218884"
          test "$EXPECTED_CANDIDATE_APK_SHA256" = "da08a003472f39cd649eb7cc4d1247c6d9e10c6fb4b468151c98ce4916e5b5e7"

      - name: Checkout harness
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preserve harness probe
        run: cp .github/acceptance/SignedUpgradeAcceptanceHarnessTest.kt /tmp/SignedUpgradeAcceptanceHarnessTest.kt

      - name: Download exact signed candidate artifact
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.signed_build_run_id }}
          path: /tmp/candidate

      - name: Verify exact signed candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_APK="$(find /tmp/candidate -type f -path '*/release/*.apk' -print -quit)"
          test -n "$CANDIDATE_APK"
          cp "$CANDIDATE_APK" /tmp/candidate.apk
          echo "$EXPECTED_CANDIDATE_APK_SHA256  /tmp/candidate.apk" | sha256sum -c -
          grep -Fx "source_sha=$CANDIDATE_SHA" /tmp/candidate/build/candidate-evidence/provenance.txt
          grep -Fx 'version_name=1.4.5' /tmp/candidate/build/candidate-evidence/provenance.txt
          grep -Fx 'version_code=212453409' /tmp/candidate/build/candidate-evidence/provenance.txt

      - name: Download official stable v1.4.4 APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_url="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STABLE_TAG" --jq '.assets[] | select(.name=="Miyorare-v1.4.4.apk") | .url')"
          test -n "$asset_url"
          gh api -H 'Accept: application/octet-stream' "$asset_url" > /tmp/stable.apk
          echo "$STABLE_SHA256  /tmp/stable.apk" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Prepare test-only release signing and R8 classpath
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          cat > /tmp/runtime-probe.init.gradle <<'GRADLE'
          allprojects {
              if (path == ':app') {
                  afterEvaluate {
                      dependencies.add('androidTestImplementation', 'androidx.concurrent:concurrent-futures-ktx:1.3.0')
                      dependencies.add('androidTestImplementation', 'com.google.auto.value:auto-value-annotations:1.11.0')
                  }
              }
          }
          GRADLE

      - name: Build stable and candidate instrumentation probes without rebuilding tested APKs
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_probe() {
            local source_sha="$1" output_apk="$2"
            git checkout --force "$source_sha"
            test "$(git rev-parse HEAD)" = "$source_sha"
            mkdir -p app/src/androidTest/kotlin/org/koitharu/kotatsu/acceptance
            cp /tmp/SignedUpgradeAcceptanceHarnessTest.kt app/src/androidTest/kotlin/org/koitharu/kotatsu/acceptance/
            chmod +x gradlew
            ./gradlew -I /tmp/runtime-probe.init.gradle :app:assembleReleaseAndroidTest --no-daemon --stacktrace \\
              -PMIYORARE_ANDROID_TEST_BUILD_TYPE=release \\
              -PRELEASE_STORE_FILE=../release.keystore \\
              -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \\
              -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \\
              -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            test_apk="$(find app/build/outputs/apk/androidTest -type f -name '*.apk' -print -quit)"
            test -n "$test_apk"
            cp "$test_apk" "$output_apk"
          }
          build_probe "$STABLE_COMMIT" /tmp/stable-test.apk
          build_probe "$CANDIDATE_SHA" /tmp/candidate-test.apk
          git checkout --force "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Verify probe signatures and Release target compatibility
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          cert_digest() {
            "$APKSIGNER" verify --verbose --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1
          }
          stable_cert="$(cert_digest /tmp/stable.apk)"
          candidate_cert="$(cert_digest /tmp/candidate.apk)"
          stable_test_cert="$(cert_digest /tmp/stable-test.apk)"
          candidate_test_cert="$(cert_digest /tmp/candidate-test.apk)"
          test -n "$stable_cert"
          test "$candidate_cert" = "$stable_cert"
          test "$stable_test_cert" = "$stable_cert"
          test "$candidate_test_cert" = "$stable_cert"
          "$AAPT" dump xmltree /tmp/stable-test.apk AndroidManifest.xml | grep -Fq "$PACKAGE"
          "$AAPT" dump xmltree /tmp/candidate-test.apk AndroidManifest.xml | grep -Fq "$PACKAGE"
          mkdir -p runtime-acceptance
          printf '%s\n' "stable=$stable_cert" "candidate=$candidate_cert" "stable_probe=$stable_test_cert" "candidate_probe=$candidate_test_cert" > runtime-acceptance/probe-certificates.txt

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true

      - name: Run Android 15 acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 13823996
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p runtime-acceptance
            adb shell settings put system screen_off_timeout 1800000
            adb shell settings put system accelerometer_rotation 0

            echo '=== stable v1.4.4 install and representative state seed ==='
            adb uninstall "$PACKAGE" >/dev/null 2>&1 || true
            adb install /tmp/stable.apk
            adb install /tmp/stable-test.apk
            adb shell am instrument -w -r               -e class org.koitharu.kotatsu.acceptance.SignedUpgradeAcceptanceHarnessTest#seedStableRepresentativeState               "$PACKAGE.test/org.koitharu.kotatsu.HiltTestRunner" | tee runtime-acceptance/stable-seed.txt
            grep -q 'OK (1 test)' runtime-acceptance/stable-seed.txt
            adb pull "/sdcard/Android/data/$PACKAGE/files/runtime-acceptance-baseline.txt" runtime-acceptance/

            echo '=== immutable signed candidate in-place update: no uninstall, no clear, no downgrade ==='
            adb uninstall "$PACKAGE.test" >/dev/null 2>&1 || true
            adb install -r /tmp/candidate.apk | tee runtime-acceptance/update-install.txt
            grep -q 'Success' runtime-acceptance/update-install.txt
            adb install /tmp/candidate-test.apk
            adb shell am instrument -w -r               -e class org.koitharu.kotatsu.acceptance.SignedUpgradeAcceptanceHarnessTest#verifyCandidateMigrationAndPreservation               "$PACKAGE.test/org.koitharu.kotatsu.HiltTestRunner" | tee runtime-acceptance/candidate-verify.txt
            grep -q 'OK (1 test)' runtime-acceptance/candidate-verify.txt
            adb pull "/sdcard/Android/data/$PACKAGE/files/runtime-acceptance-candidate.txt" runtime-acceptance/

            echo '=== signed Release cold-start / force-stop / reopen / offline smoke ==='
            adb logcat -c
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 | tee runtime-acceptance/launch.txt
            sleep 5
            adb shell pidof "$PACKAGE"
            adb exec-out screencap -p > runtime-acceptance/release-launch.png
            adb shell am force-stop "$PACKAGE"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell pidof "$PACKAGE"
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell am force-stop "$PACKAGE"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell pidof "$PACKAGE"
            adb exec-out screencap -p > runtime-acceptance/release-offline.png
            adb logcat -d > runtime-acceptance/release-logcat.txt
            if grep -A4 -B2 'FATAL EXCEPTION' runtime-acceptance/release-logcat.txt | grep -q "Process: $PACKAGE"; then
              echo '::error::Signed Release crashed during smoke'
              exit 1
            fi

      - name: Record APK hashes and package metadata
        if: always()
        shell: bash
        run: |
          mkdir -p runtime-acceptance
          sha256sum /tmp/stable.apk /tmp/candidate.apk > runtime-acceptance/apk-sha256.txt
          {
            echo "harness_sha=$HARNESS_SHA"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "signed_build_run_id=$SIGNED_BUILD_RUN_ID"
            echo "signed_artifact_id=$SIGNED_ARTIFACT_ID"
            echo "api_level=35"
          } > runtime-acceptance/run-identity.txt

      - name: Upload runtime acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-acceptance-v3-${{ inputs.candidate_sha }}
          path: runtime-acceptance/
          if-no-files-found: warn
          retention-days: 14
