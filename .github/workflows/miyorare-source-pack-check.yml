name: Miyorare Source Pack Check

on:
  pull_request:
    branches:
      - beta
      - Amain2
    paths:
      - 'extensions/miyorare-sources/**'
      - '.github/workflows/miyorare-source-pack-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miyorare-source-packs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pack:
    if: >-
      github.event_name != 'pull_request' || github.base_ref == 'Amain2' || (!startsWith(github.head_ref, 'fix/') && !startsWith(github.head_ref, 'bugfix/') && !startsWith(github.head_ref, 'hotfix/'))
    name: Build Miyorare-${{ matrix.pack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: [id, en]

    steps:
      - name: Checkout Miyorare
        uses: actions/checkout@v5

      - name: Resolve provider pins from pack manifest
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path("extensions/miyorare-sources/packs.json").read_text(encoding="utf-8"))
          uma = data.get("upstream", {}).get("commit")
          gekkoushi = data.get("additionalUpstreams", {}).get("gekkoushi", {}).get("commit")
          for name, value in (("uma", uma), ("gekkoushi", gekkoushi)):
              if not isinstance(value, str) or len(value) != 40:
                  raise SystemExit(f"invalid {name} commit in packs.json")
              print(f"{name}={value}")
          PY

      - name: Checkout pinned UMA source
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: ${{ steps.pins.outputs.uma }}
          path: _upstream/uma
          fetch-depth: 1

      - name: Checkout pinned Gekkoushi source
        uses: actions/checkout@v5
        with:
          repository: Gekkoushi/plugin-source
          ref: ${{ steps.pins.outputs.gekkoushi }}
          path: _upstream/gekkoushi
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Apply Miyorare ID parser overlays
        if: matrix.pack == 'id'
        shell: bash
        run: |
          set -euo pipefail
          install -Dm644 \
            extensions/miyorare-sources/overlays/gekkoushi/id/Holotoon.kt \
            _upstream/gekkoushi/src/main/kotlin/tsuki/site/id/Holotoon.kt

      - name: Prepare curated UMA shard
        run: |
          python3 extensions/miyorare-sources/tools/prepare_pack.py \
            --manifest extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}'

      - name: Checkout deterministic VoraToon fixture
        if: matrix.pack == 'id'
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare-Source-Packs
          ref: a88f541a3e486dd5e7660ad2c9b1d00c971a4b56
          path: _voratoon-fixtures
          persist-credentials: false

      - name: Test VoraToon in prepared Miyorare-ID sources
        if: matrix.pack == 'id'
        run: |
          mkdir -p _upstream/uma/src/test/kotlin/compatibilityfarm
          cp _voratoon-fixtures/compatibility/harness/candidates/voratoon/*.kt _upstream/uma/src/test/kotlin/compatibilityfarm/
          (cd _upstream/uma && bash ./gradlew test --no-daemon --tests compatibilityfarm.VoraToonCandidateContractTest)

      - name: Build UMA shard with UMA build system
        working-directory: _upstream/uma
        run: |
          set -o pipefail
          mkdir -p ../../build/miyorare-source-packs/logs
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon --stacktrace 2>&1 | \
            tee ../../build/miyorare-source-packs/logs/${{ matrix.pack }}-uma-gradle.log

      - name: Finalize UMA shard
        run: |
          python3 extensions/miyorare-sources/tools/finalize_pack.py \
            --manifest extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}' \
            --output build/miyorare-source-packs/${{ matrix.pack }}

      - name: Prepare Gekkoushi shard
        run: |
          python3 extensions/miyorare-sources/tools/prepare_gekkoushi_shard.py \
            --manifest extensions/miyorare-sources/packs.json \
            --uma-upstream _upstream/uma \
            --gekkoushi-upstream _upstream/gekkoushi \
            --pack '${{ matrix.pack }}'

      - name: Build Gekkoushi shard with Gekkoushi build system
        working-directory: _upstream/gekkoushi
        run: |
          set -o pipefail
          mkdir -p ../../build/miyorare-source-packs/logs
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon --stacktrace 2>&1 | \
            tee ../../build/miyorare-source-packs/logs/${{ matrix.pack }}-gekkoushi-gradle.log

      - name: Finalize Gekkoushi shard
        run: |
          python3 extensions/miyorare-sources/tools/finalize_pack.py \
            --manifest extensions/miyorare-sources/packs.json \
            --upstream _upstream/gekkoushi \
            --pack '${{ matrix.pack }}' \
            --output build/miyorare-source-packs/${{ matrix.pack }}

      - name: Finalize logical Miyorare pack manifest
        run: |
          python3 extensions/miyorare-sources/tools/finalize_logical_pack.py \
            --manifest extensions/miyorare-sources/packs.json \
            --pack '${{ matrix.pack }}' \
            --uma-metadata _upstream/uma/miyorare-pack.json \
            --gekkoushi-metadata _upstream/gekkoushi/miyorare-pack.json \
            --output build/miyorare-source-packs/${{ matrix.pack }}

      - name: Verify HoloToon placement
        env:
          PACK: ${{ matrix.pack }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          pack = os.environ['PACK']
          data = json.loads(
              (Path('build/miyorare-source-packs') / pack / f'miyorare-{pack}-pack.json').read_text(encoding='utf-8')
          )
          names = set(data['sourceNames'])
          if pack == 'id':
              assert 'HOLOTOON' in names, sorted(names)
              owners = [shard for shard in data['shards'] if 'VORATOON' in shard['sourceNames']]
              assert len(owners) == 1 and owners[0]['pluginId'] == 'miyorare-id', owners
          else:
              assert 'HOLOTOON' not in names, sorted(names)
          PY

      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miyorare-${{ matrix.pack }}-gradle-diagnostics
          path: build/miyorare-source-packs/logs/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload staging pack
        uses: actions/upload-artifact@v4
        with:
          name: miyorare-${{ matrix.pack }}-staging
          path: build/miyorare-source-packs/${{ matrix.pack }}/
          if-no-files-found: error
          retention-days: 7

  verify-id-upgrade:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/voratoon-id-first-party'
    needs: build-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: miyorare-id-staging
          path: candidate-id
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44069004111
          name: miyorare-id-staging
          path: old-id
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Build isolated validation APK
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          dir=app/src/debug/assets/global-validation
          mkdir -p "$dir/old"
          for asset in miyorare-id-uma.jar miyorare-id-gekkoushi.jar; do
            (cd candidate-id && sha256sum -c "$asset.sha256")
            (cd old-id && sha256sum -c "$asset.sha256")
            cp "candidate-id/$asset" "$dir/"
            cp "old-id/$asset" "$dir/old/"
          done
          git rev-parse HEAD > "$dir/revision"
          bash gradlew :app:assembleDebug -PMIYORARE_GLOBAL_VALIDATION=true --max-workers=2 --no-daemon
      - run: sudo chmod 666 /dev/kvm
      - name: Exercise official ID updater on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash .github/scripts/verify-voratoon-id-update.sh
      - uses: actions/upload-artifact@v4
        with:
          name: miyorare-id-update-validation
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/voratoon-id-update-proof.txt
          if-no-files-found: error
          retention-days: 7
