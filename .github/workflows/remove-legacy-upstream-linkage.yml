name: Remove legacy upstream linkage

on:
  push:
    branches:
      - remove-legacy-upstream-linkage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'Noirero/Miyorare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-legacy-upstream-linkage
          fetch-depth: 0

      - name: Remove legacy upstream integration and branding
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f .github/workflows/sync-upstream.yml

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          needle = "Drop" + "Sauce"
          pattern = re.compile(re.escape(needle), re.IGNORECASE)

          def replacement(match):
              value = match.group(0)
              if value.isupper():
                  return "MIYORARE"
              if value.islower():
                  return "miyorare"
              return "Miyorare"

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [p for p in tracked if p]

          for raw in tracked:
              if raw in {".github/workflows/sync-upstream.yml", ".github/workflows/remove-legacy-upstream-linkage.yml"}:
                  continue
              path = Path(raw)
              try:
                  data = path.read_bytes()
                  text = data.decode("utf-8")
              except (UnicodeDecodeError, FileNotFoundError, IsADirectoryError):
                  continue
              updated = pattern.sub(replacement, text)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          # Rename tracked paths too, deepest first, so the legacy name is absent from filenames.
          renamed = []
          for raw in sorted(tracked, key=lambda p: p.count("/"), reverse=True):
              if not pattern.search(raw):
                  continue
              new = pattern.sub(replacement, raw)
              if raw == new:
                  continue
              target = Path(new)
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "mv", raw, new], check=True)
              renamed.append((raw, new))
          PY

          # This helper is intentionally temporary; remove it from the resulting branch.
          git rm -f .github/workflows/remove-legacy-upstream-linkage.yml

          # Remove the obsolete quarantine ref if it still exists. Failure means it is already absent.
          git push origin --delete sync/dropsauce-candidate || true

          # Fail closed if the working tree still contains any legacy name in tracked text/path state.
          if git grep -ni -I -e 'dropsauce' -- . ':!*.lock'; then
            echo "Legacy name still present in tracked content" >&2
            exit 1
          fi
          if git ls-files | grep -i 'dropsauce'; then
            echo "Legacy name still present in tracked path" >&2
            exit 1
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes found"
            exit 0
          fi
          git commit -m "Remove legacy upstream linkage"
          git push origin HEAD:remove-legacy-upstream-linkage
