name: Temporary Settings Language Audit

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/tmp-settings-language-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
      - name: Audit Indonesian Settings language coverage
        shell: python
        run: |
          from collections import defaultdict
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          settings_root = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings')
          default_dir = Path('app/src/main/res/values')
          id_dir = Path('app/src/main/res/values-in')

          def read_locale(directory):
              values = {}
              locations = defaultdict(list)
              for path in sorted(directory.glob('*.xml')):
                  try:
                      root = ET.parse(path).getroot()
                  except ET.ParseError as exc:
                      raise SystemExit(f'Invalid XML {path}: {exc}')
                  for node in root:
                      if node.tag != 'string' or not node.attrib.get('name'):
                          continue
                      name = node.attrib['name']
                      text = ''.join(node.itertext()).strip()
                      locations[name].append(str(path))
                      if name not in values:
                          values[name] = text
              duplicates = {k: v for k, v in locations.items() if len(v) > 1}
              return values, duplicates

          default, default_duplicates = read_locale(default_dir)
          indonesian, id_duplicates = read_locale(id_dir)

          source = '\n'.join(p.read_text(encoding='utf-8') for p in settings_root.rglob('*.kt'))
          keys = sorted(set(re.findall(r'R\.string\.([A-Za-z0-9_]+)', source)))

          missing_default = []
          missing_id = []
          same = []
          for key in keys:
              en = default.get(key)
              idv = indonesian.get(key)
              if en is None:
                  missing_default.append(key)
                  continue
              if idv is None:
                  missing_id.append((key, en))
              elif re.sub(r'\s+', ' ', en).strip() == re.sub(r'\s+', ' ', idv).strip():
                  same.append((key, en))

          literal_hits = []
          patterns = [
              re.compile(r'\b(?:title|summary|subtitle|label|text|message|placeholder|name)\s*=\s*"([^"\\]*(?:\\.[^"\\]*)*)"'),
              re.compile(r'\bText\(\s*"([^"\\]*(?:\\.[^"\\]*)*)"'),
          ]
          for p in settings_root.rglob('*.kt'):
              text = p.read_text(encoding='utf-8')
              for rx in patterns:
                  for m in rx.finditer(text):
                      value = m.group(1)
                      if not value.strip() or value.startswith('%'):
                          continue
                      if re.fullmatch(r'[A-Z0-9_./:+-]+', value) or value.startswith(('http://', 'https://')):
                          continue
                      literal_hits.append((str(p), value))

          print('=== SETTINGS LANGUAGE AUDIT (ALL RESOURCE FILES) ===')
          print(f'Default string resources: {len(default)}')
          print(f'Indonesian string resources: {len(indonesian)}')
          print(f'Settings resource keys referenced: {len(keys)}')
          print(f'Missing default resources referenced by Settings: {len(missing_default)}')
          for key in missing_default:
              print(f'MISSING_DEFAULT|{key}')
          print(f'TRUE missing Indonesian translations: {len(missing_id)}')
          for key, en in missing_id:
              print(f'MISSING_ID|{key}|{en}')
          print(f'Identical EN/ID values: {len(same)}')
          for key, en in same:
              print(f'SAME|{key}|{en}')
          print(f'Potential hardcoded user-visible literals: {len(literal_hits)}')
          for path, value in literal_hits:
              print(f'LITERAL|{path}|{value}')
          print(f'Duplicate default string names across XML files: {len(default_duplicates)}')
          for key, files in sorted(default_duplicates.items()):
              print(f'DUP_DEFAULT|{key}|{";".join(files)}')
          print(f'Duplicate Indonesian string names across XML files: {len(id_duplicates)}')
          for key, files in sorted(id_duplicates.items()):
              print(f'DUP_ID|{key}|{";".join(files)}')

          if missing_default:
              raise SystemExit('Settings references missing default resources')
