name: Temporary Settings Language Audit

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/tmp-settings-language-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
      - name: Audit Indonesian Settings language coverage
        shell: python
        run: |
          from collections import defaultdict
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          settings_root = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings')
          default_dir = Path('app/src/main/res/values')
          id_dir = Path('app/src/main/res/values-in')
          external_or_generated = {'cancel', 'not_set', 'ok', 'selectAll'}

          def read_locale(directory):
              values = {}
              locations = defaultdict(list)
              for path in sorted(directory.glob('*.xml')):
                  root = ET.parse(path).getroot()
                  for node in root:
                      if node.tag != 'string' or not node.attrib.get('name'):
                          continue
                      name = node.attrib['name']
                      locations[name].append(str(path))
                      values.setdefault(name, ''.join(node.itertext()).strip())
              return values, {k: v for k, v in locations.items() if len(v) > 1}

          default, default_duplicates = read_locale(default_dir)
          indonesian, id_duplicates = read_locale(id_dir)
          source = '\n'.join(p.read_text(encoding='utf-8') for p in settings_root.rglob('*.kt'))
          keys = sorted(set(re.findall(r'R\.string\.([A-Za-z0-9_]+)', source)))

          missing_default = [k for k in keys if k not in default and k not in external_or_generated]
          missing_id = [(k, default[k]) for k in keys if k in default and k not in indonesian]
          same = [(k, default[k]) for k in keys if k in default and k in indonesian and re.sub(r'\s+', ' ', default[k]).strip() == re.sub(r'\s+', ' ', indonesian[k]).strip()]

          literal_hits = []
          patterns = [
              re.compile(r'\b(?:title|summary|subtitle|label|text|message|placeholder|name)\s*=\s*"([^"\\]*(?:\\.[^"\\]*)*)"'),
              re.compile(r'\bText\(\s*"([^"\\]*(?:\\.[^"\\]*)*)"'),
          ]
          for p in settings_root.rglob('*.kt'):
              text = p.read_text(encoding='utf-8')
              for rx in patterns:
                  for m in rx.finditer(text):
                      value = m.group(1)
                      if not value.strip() or value.startswith('%'):
                          continue
                      if re.fullmatch(r'[A-Z0-9_./:+-]+', value) or value.startswith(('http://', 'https://')):
                          continue
                      literal_hits.append((str(p), value))

          print('=== SETTINGS LANGUAGE AUDIT (ALL RESOURCE FILES) ===')
          print(f'Settings resource keys referenced: {len(keys)}')
          print(f'TRUE missing Indonesian translations: {len(missing_id)}')
          for key, en in missing_id:
              print(f'MISSING_ID|{key}|{en}')
          print(f'Identical EN/ID values: {len(same)}')
          for key, en in same:
              print(f'SAME|{key}|{en}')
          print(f'Potential hardcoded user-visible literals: {len(literal_hits)}')
          for path, value in literal_hits:
              print(f'LITERAL|{path}|{value}')
          print(f'Duplicate default names: {len(default_duplicates)}')
          print(f'Duplicate Indonesian names: {len(id_duplicates)}')

          failures = []
          if missing_default:
              failures.append('missing app-default resources: ' + ', '.join(missing_default))
          if missing_id:
              failures.append(f'{len(missing_id)} Settings strings still lack Indonesian resources')
          if default_duplicates:
              failures.append('duplicate default string resources')
          if id_duplicates:
              failures.append('duplicate Indonesian string resources')
          if failures:
              raise SystemExit(' | '.join(failures))
          print('ALL SETTINGS RESOURCE COVERAGE CHECKS PASSED')
