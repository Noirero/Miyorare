name: Import Nameplate V2 Runtime Assets

on:
  push:
    branches:
      - feat/beta-exclusive-nameplates-12-20260927
    paths:
      - '.github/workflows/import-nameplate-v2-runtime.yml'
      - '.tmp/nameplate-v2-runtime/**'

permissions:
  contents: write

concurrency:
  group: import-nameplate-v2-runtime
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: feat/beta-exclusive-nameplates-12-20260927
          fetch-depth: 0

      - name: Reconstruct and verify exact supplied ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/nameplate-v2-runtime/part_*.txt | base64 --decode > /tmp/miyorare_nameplate_v2_runtime_optimized.zip
          echo "3d4781a8d9ede536557dd93ca12b7bd3811ba302bbd9bcc29897a346d44eb265  /tmp/miyorare_nameplate_v2_runtime_optimized.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path('/tmp/miyorare_nameplate_v2_runtime_optimized.zip')
          with zipfile.ZipFile(archive) as zf:
              files = [i for i in zf.infolist() if not i.is_dir()]
              assert len(files) == 24, len(files)
              assert sum(i.file_size for i in files) == 1_143_416
              for info in files:
                  name = info.filename
                  assert name.startswith('nameplate_')
                  assert name.endswith(('_base.webp', '_thumb.webp'))
                  assert '/' not in name
          PY

      - name: Replace production runtime resources without re-encoding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path('/tmp/miyorare_nameplate_v2_runtime_optimized.zip')
          out = Path('app/src/main/res/drawable-nodpi')
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  if info.is_dir():
                      continue
                  (out / info.filename).write_bytes(zf.read(info.filename))
          PY

          # Remove the old production candidates/source masters so they cannot be packaged
          # alongside the approved V2 runtime set.
          rm -f app/src/main/res/drawable/nameplate_*_base.xml
          rm -f app/src/main/res/drawable/nameplate_*_overlay.xml
          rm -f app/src/main/res/drawable/nameplate_*_normal.webp
          rm -f app/src/main/res/raw/nameplate_*_master.svg

          # The transfer payload is temporary repository plumbing, never production source.
          rm -rf .tmp/nameplate-v2-runtime
          rm -f .github/workflows/import-nameplate-v2-runtime.yml

      - name: Verify only the approved runtime set remains
        shell: bash
        run: |
          set -euo pipefail
          test "$(find app/src/main/res/drawable-nodpi -maxdepth 1 -type f -name 'nameplate_*_base.webp' | wc -l)" -eq 12
          test "$(find app/src/main/res/drawable-nodpi -maxdepth 1 -type f -name 'nameplate_*_thumb.webp' | wc -l)" -eq 12
          test -z "$(find app/src/main/res/drawable -maxdepth 1 -type f \( -name 'nameplate_*_base.xml' -o -name 'nameplate_*_overlay.xml' -o -name 'nameplate_*_normal.webp' \) -print)"
          test -z "$(find app/src/main/res/raw -maxdepth 1 -type f -name 'nameplate_*_master.svg' -print)"

          python3 - <<'PY'
          from pathlib import Path
          assets = sorted(Path('app/src/main/res/drawable-nodpi').glob('nameplate_*.webp'))
          assert len(assets) == 24
          total = sum(p.stat().st_size for p in assets)
          assert total == 1_143_416, total
          print(f'Approved Nameplate V2 runtime assets: {len(assets)} files / {total} bytes')
          PY

      - name: Commit exact runtime replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "assets: replace Nameplate production runtime with approved V2 WebPs"
          git push origin HEAD:feat/beta-exclusive-nameplates-12-20260927
