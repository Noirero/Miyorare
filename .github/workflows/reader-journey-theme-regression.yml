name: Reader Journey Theme Regression

on:
  pull_request:
    branches:
      - beta
    paths:
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/ui/MiyorareColorScheme.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/settings/developer/**'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/ui/StatsViewModel.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/readerjourney/**'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/core/ui/RankThemeMiyorareBridgeTest.kt'
      - '.github/workflows/reader-journey-theme-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-journey-theme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Reader Journey theme contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          echo "Theme regression head: $actual"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("gradle/libs.versions.toml").read_text(encoding="utf-8"))
          value = str(data.get("versions", {}).get("parsers", "")).strip()
          if not value:
              raise SystemExit("Missing versions.parsers in gradle/libs.versions.toml")
          print(value)
          PY
          )"
          POM_URL="https://jitpack.io/com/github/Gekkoushi/plugin-source/${PARSERS_VERSION}/plugin-source-${PARSERS_VERSION}.pom"
          for i in $(seq 1 12); do
            HTTP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$POM_URL" || true)"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Parser artifact is ready (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: parser artifact returned HTTP ${HTTP_STATUS:-000}"
            sleep 20
          done
          echo "::error::Parser artifact ${PARSERS_VERSION} is not ready on JitPack"
          exit 1

      - name: Run Reader Journey theme tests
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests org.koitharu.kotatsu.readerjourney.domain.ReaderJourneyRulesTest
          --tests org.koitharu.kotatsu.readerjourney.domain.ReaderJourneyCosmeticsRegressionTest
          --tests org.koitharu.kotatsu.readerjourney.domain.ReaderJourneyCosmeticSnapshotCodecTest
          --tests org.koitharu.kotatsu.readerjourney.domain.ReaderJourneyCosmeticPolicyTest
          --tests org.koitharu.kotatsu.readerjourney.domain.ReaderJourneyThemeCollectionRegressionTest
          --tests org.koitharu.kotatsu.readerjourney.theme.RankThemeFoundationTest
          --tests org.koitharu.kotatsu.readerjourney.theme.ReaderJourneyThemePresentationResolverTest
          --tests org.koitharu.kotatsu.core.ui.RankThemeMiyorareBridgeTest
          --tests org.koitharu.kotatsu.settings.developer.RankThemeGalleryRegressionTest
          --tests org.koitharu.kotatsu.readerjourney.theme.ReferenceRankThemeVisualsTest
          --tests org.koitharu.kotatsu.readerjourney.theme.ReferenceRankThemeVisualsRegressionTest
          --tests org.koitharu.kotatsu.readerjourney.theme.ReaderContentIsolationRegressionTest
          --tests org.koitharu.kotatsu.readerjourney.theme.RankThemeVisualRegistryTest
          --tests org.koitharu.kotatsu.readerjourney.theme.RankThemeVisualsRegressionTest
          --no-daemon --stacktrace

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-journey-theme-regression
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
