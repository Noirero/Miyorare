name: Exclusive Navigation Golden Visual

on:
  pull_request:
    branches:
      - beta
    paths:
      - 'app/src/main/kotlin/org/koitharu/kotatsu/main/ui/nav/ExclusiveBottomNavigation.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/main/ui/nav/FloatingNavBar.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/ui/widgets/FloatingBottomNavigationView.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/ui/MiyorareColorScheme.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/theme/ExclusiveBottomNavigationSpec.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/theme/ExclusiveBottomNavigationOrnamentRegistry.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/theme/ExclusiveThemeContract.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/theme/ExclusiveThemeMixer.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/ui/ReaderJourneyExclusiveCollection.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/main/ui/nav/ExclusiveNavigationGoldenVisualTest.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/main/ui/nav/ExclusiveNavigationMotionRuntimeTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/readerjourney/theme/ExclusiveNavigationGuideContractTest.kt'
      - '.github/workflows/exclusive-navigation-golden.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exclusive-navigation-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: 12-theme production visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          echo "Exclusive navigation golden head: $actual"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("gradle/libs.versions.toml").read_text(encoding="utf-8"))
          value = str(data.get("versions", {}).get("parsers", "")).strip()
          if not value:
              raise SystemExit("Missing versions.parsers in gradle/libs.versions.toml")
          print(value)
          PY
          )"
          POM_URL="https://jitpack.io/com/github/Gekkoushi/plugin-source/${PARSERS_VERSION}/plugin-source-${PARSERS_VERSION}.pom"
          for i in $(seq 1 12); do
            HTTP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$POM_URL" || true)"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Parser artifact is ready (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: parser artifact returned HTTP ${HTTP_STATUS:-000}"
            sleep 20
          done
          echo "::error::Parser artifact ${PARSERS_VERSION} is not ready on JitPack"
          exit 1

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Capture responsive 12-theme static navigation evidence on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb shell wm density 320
            adb shell cmd uimode night yes
            # Static capture performs several long instrumentation invocations on one emulator.
            # Keep Android 15 awake/unlocked and verify ADB before each pass.
            adb shell svc power stayon true || true
            adb shell settings put system screen_off_timeout 2147483647 || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell settings put global hide_error_dialogs 1 || true
            ensure_adb_ready() {
              for attempt in 1 2 3 4 5; do
                adb wait-for-device >/dev/null 2>&1 || true
                state="$(adb get-state 2>/dev/null || true)"
                if [ "$state" = "device" ]; then
                  adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
                  adb shell wm dismiss-keyguard >/dev/null 2>&1 || true
                  return 0
                fi
                echo "ADB state '${state:-unavailable}' before static golden pass; recovery attempt $attempt"
                adb reconnect >/dev/null 2>&1 || true
                sleep 2
              done
              echo "::error::Android emulator did not return to online ADB state"
              return 1
            }
            ensure_adb_ready
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell rm -rf /sdcard/Download/miyorare-exclusive-navigation-golden
            rm -f /tmp/miyorare-nav-gesture /tmp/miyorare-nav-threebutton
            if adb shell cmd overlay list --user 0 2>/dev/null | tr -d '\r' | grep -Fq 'com.android.internal.systemui.navbar.gestural'; then touch /tmp/miyorare-nav-gesture; adb shell cmd overlay enable-exclusive --user 0 --category com.android.internal.systemui.navbar.gestural >/dev/null 2>&1 || adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.gestural >/dev/null 2>&1 || true; fi
            ensure_adb_ready
            adb shell wm size 720x1536
            adb shell settings put system font_scale 1.0
            adb shell am force-stop org.noirero.miyorare.beta || true
            if [ -f /tmp/miyorare-nav-gesture ]; then ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.main.ui.nav.ExclusiveNavigationGoldenVisualTest -Pandroid.testInstrumentationRunnerArguments.navEvidenceCase=w360-gesture-font100 -Pandroid.testInstrumentationRunnerArguments.expectedWidthPx=720 -Pandroid.testInstrumentationRunnerArguments.expectedFontScale=1.0 -Pandroid.testInstrumentationRunnerArguments.navigationMode=gesture; else ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.main.ui.nav.ExclusiveNavigationGoldenVisualTest -Pandroid.testInstrumentationRunnerArguments.navEvidenceCase=w360-default-font100 -Pandroid.testInstrumentationRunnerArguments.expectedWidthPx=720 -Pandroid.testInstrumentationRunnerArguments.expectedFontScale=1.0 -Pandroid.testInstrumentationRunnerArguments.navigationMode=default; fi
            ensure_adb_ready
            adb shell wm size 800x1536
            adb shell settings put system font_scale 1.0
            adb shell am force-stop org.noirero.miyorare.beta || true
            if [ -f /tmp/miyorare-nav-gesture ]; then ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.main.ui.nav.ExclusiveNavigationGoldenVisualTest -Pandroid.testInstrumentationRunnerArguments.navEvidenceCase=w400-gesture-font100 -Pandroid.testInstrumentationRunnerArguments.expectedWidthPx=800 -Pandroid.testInstrumentationRunnerArguments.expectedFontScale=1.0 -Pandroid.testInstrumentationRunnerArguments.navigationMode=gesture; else ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.main.ui.nav.ExclusiveNavigationGoldenVisualTest -Pandroid.testInstrumentationRunnerArguments.navEvidenceCase=w400-default-font100 -Pandroid.testInstrumentationRunnerArguments.expectedWidthPx=800 -Pandroid.testInstrumentationRunnerArguments.expectedFontScale=1.0 -Pandroid.testInstrumentationRunnerArguments.navigationMode=default; fi
            ensure_adb_ready
            adb shell wm size 864x1536
            adb shell settings put system font_scale 1.0
            adb shell am force-stop org.noirero.miyorare.beta || true
            if [ -f /tmp/miyorare-nav-gesture ]; then ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.main.ui.nav.ExclusiveNavigationGoldenVisualTest -Pandroid.testInstrumentationRunnerArguments.navEvidenceCase=w432-gesture-font100 -Pandroid.testInstrumentationRunnerArguments.expectedWidthPx=864 -Pandroid.testInstrumentationRunnerArguments.expectedFontScale=1.0 -Pandroid.testInstrumentationRunnerArguments.navigationMode=gesture; else ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.main.ui.nav.ExclusiveNavigationGoldenVisualTest -Pandroid.testInstrumentationRunnerArguments.navEvidenceCase=w432-default-font100 -Pandroid.testInstrumentationRunnerArguments.expectedWidthPx=864 -Pandroid.testInstrumentationRunnerArguments.expectedFontScale=1.0 -Pandroid.testInstrumentationRunnerArguments.navigationMode=default; fi
            ensure_adb_ready
            adb shell wm size 800x1536
            adb shell settings put system font_scale 1.2
            adb shell am force-stop org.noirero.miyorare.beta || true
            if [ -f /tmp/miyorare-nav-gesture ]; then ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.main.ui.nav.ExclusiveNavigationGoldenVisualTest -Pandroid.testInstrumentationRunnerArguments.navEvidenceCase=w400-gesture-font120 -Pandroid.testInstrumentationRunnerArguments.expectedWidthPx=800 -Pandroid.testInstrumentationRunnerArguments.expectedFontScale=1.2 -Pandroid.testInstrumentationRunnerArguments.navigationMode=gesture; else ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.main.ui.nav.ExclusiveNavigationGoldenVisualTest -Pandroid.testInstrumentationRunnerArguments.navEvidenceCase=w400-default-font120 -Pandroid.testInstrumentationRunnerArguments.expectedWidthPx=800 -Pandroid.testInstrumentationRunnerArguments.expectedFontScale=1.2 -Pandroid.testInstrumentationRunnerArguments.navigationMode=default; fi
            if adb shell cmd overlay list --user 0 2>/dev/null | tr -d '\r' | grep -Fq 'com.android.internal.systemui.navbar.threebutton'; then touch /tmp/miyorare-nav-threebutton; adb shell cmd overlay enable-exclusive --user 0 --category com.android.internal.systemui.navbar.threebutton >/dev/null 2>&1 || adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.threebutton >/dev/null 2>&1 || true; fi
            ensure_adb_ready
            adb shell wm size 800x1536
            adb shell settings put system font_scale 1.0
            adb shell am force-stop org.noirero.miyorare.beta || true
            if [ -f /tmp/miyorare-nav-threebutton ]; then ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.main.ui.nav.ExclusiveNavigationGoldenVisualTest -Pandroid.testInstrumentationRunnerArguments.navEvidenceCase=w400-threebutton-font100 -Pandroid.testInstrumentationRunnerArguments.expectedWidthPx=800 -Pandroid.testInstrumentationRunnerArguments.expectedFontScale=1.0 -Pandroid.testInstrumentationRunnerArguments.navigationMode=threebutton; fi
            mkdir -p exclusive-navigation-golden-evidence
            adb pull /sdcard/Download/miyorare-exclusive-navigation-golden/. exclusive-navigation-golden-evidence/
            python3 -c 'import json,os,pathlib; pathlib.Path("exclusive-navigation-golden-evidence/navigation-mode-availability.json").write_text(json.dumps({"gestureAvailable":os.path.exists("/tmp/miyorare-nav-gesture"),"threeButtonAvailable":os.path.exists("/tmp/miyorare-nav-threebutton")}))'
      - name: Capture runtime navigation motion on fresh Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            set -eu
            ensure_adb_ready
            adb shell wm size 864x1536
            adb shell wm density 320
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night yes
            # Motion proof is intentionally isolated from the long static-golden pass.
            # Keep the fresh emulator awake/unlocked for the full 12-theme runtime loop.
            adb shell svc power stayon true || true
            adb shell settings put system screen_off_timeout 2147483647 || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell settings put global window_animation_scale 1
            adb shell settings put global transition_animation_scale 1
            adb shell settings put global animator_duration_scale 1
            test "$(adb shell settings get global window_animation_scale | tr -d '\r')" = "1"
            test "$(adb shell settings get global transition_animation_scale | tr -d '\r')" = "1"
            test "$(adb shell settings get global animator_duration_scale | tr -d '\r')" = "1"
            adb shell am force-stop org.noirero.miyorare.beta || true
            adb shell rm -rf /sdcard/Download/miyorare-exclusive-navigation-motion
            mkdir -p exclusive-navigation-motion-evidence
            adb logcat -c
            ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.main.ui.nav.ExclusiveNavigationMotionRuntimeTest
            adb logcat -d -v brief -s ExclusiveNav:D '*:S' > exclusive-navigation-motion-evidence/exclusive-nav-logcat.txt
            adb pull /sdcard/Download/miyorare-exclusive-navigation-motion/. exclusive-navigation-motion-evidence/
            test -s exclusive-navigation-motion-evidence/motion-evidence.json
            test -s exclusive-navigation-motion-evidence/exclusive-nav-logcat.txt
            grep -q 'renderer=EXCLUSIVE' exclusive-navigation-motion-evidence/exclusive-nav-logcat.txt
            grep -q 'palette.isModern=true' exclusive-navigation-motion-evidence/exclusive-nav-logcat.txt

      - name: Validate responsive 12-theme visual evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("exclusive-navigation-golden-evidence")
          evidence_files = sorted(root.glob("*/evidence.json"))
          assert len(evidence_files) >= 4, evidence_files

          cases = [json.loads(path.read_text()) for path in evidence_files]
          normal = [case for case in cases if abs(float(case["fontScale"]) - 1.0) < 0.06]
          normal_widths = {int(round(float(case["widthDp"]))) for case in normal}
          assert {360, 400, 432}.issubset(normal_widths), normal_widths
          assert any(abs(float(case["widthDp"]) - 400.0) < 0.1 and float(case["fontScale"]) >= 1.15 for case in cases)

          availability = json.loads((root / "navigation-mode-availability.json").read_text())
          modes = {str(case["navigationMode"]) for case in cases}
          if availability.get("gestureAvailable"):
              assert "gesture" in modes, modes
          if availability.get("threeButtonAvailable"):
              assert "threebutton" in modes, modes

          for path, evidence in zip(evidence_files, cases):
              themes = evidence.get("themes", [])
              assert len(themes) == 12, (path, len(themes))
              assert len({t["silhouette"] for t in themes}) >= 7
              assert len({t["activeShape"] for t in themes}) >= 9
              assert themes[10]["silhouette"] == "PRISM"
              assert themes[11]["silhouette"] == "CELESTIAL"
              assert themes[10]["activeShape"] == "PRISM_DOUBLE_RING"
              assert themes[11]["activeShape"] == "LUMINOUS_ORB"

              pngs = list(path.parent.glob("*.png"))
              assert len(pngs) == 26, (path.parent, len(pngs))
              assert (path.parent / "00-contact-sheet-first.png").is_file()
              assert (path.parent / "00-contact-sheet-last.png").is_file()
              assert len([p for p in pngs if p.name.endswith("-first.png")]) == 13
              assert len([p for p in pngs if p.name.endswith("-last.png")]) == 13

          press = json.loads(Path("exclusive-navigation-motion-evidence/press-evidence.json").read_text())
          assert press["theme"] == "NEWCOMER_FIRST_PAGE"
          assert press["pressDelta"] > 0.0001

          battery = json.loads(Path("exclusive-navigation-motion-evidence/battery-saver-evidence.json").read_text())
          assert battery["theme"] == "BOOKWORM_CYAN_CODEX"
          assert battery["selectionDelta"] > 0.001
          assert battery["ambientDelta"] < 0.0001

          reduced = json.loads(Path("exclusive-navigation-motion-evidence/reduce-motion-evidence.json").read_text())
          assert reduced["theme"] == "BOOKWORM_CYAN_CODEX"
          assert reduced["selectionDelta"] > 0.001
          assert reduced["ambientDelta"] < 0.0001

          live_apply = json.loads(Path("exclusive-navigation-motion-evidence/apply-runtime-evidence.json").read_text())
          assert live_apply["theme"] == "BOOKWORM_CYAN_CODEX"
          assert live_apply["applyDelta"] > 0.001
          assert live_apply["selectionDelta"] > 0.001
          assert live_apply["ambientDelta"] > 0.0003

          motion = json.loads(Path("exclusive-navigation-motion-evidence/motion-evidence.json").read_text())
          selection = motion["selection"]
          assert len(selection) == 12, f"Expected selection evidence for 12 themes, got {len(selection)}"
          for theme_id, delta in selection.items():
              assert delta > 0.001, (theme_id, delta)
          ambient = motion["ambient"]
          for theme_id in (
              "BOOKWORM_CYAN_CODEX",
              "GRAND_IMPERIAL_AURORA",
              "LEGEND_ETERNAL_LIBRARY",
          ):
              assert ambient[theme_id] > 0.0003, (theme_id, ambient[theme_id])
          PY
      - name: Upload 12-theme visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exclusive-navigation-golden-evidence
          path: |
            exclusive-navigation-golden-evidence/
            exclusive-navigation-motion-evidence/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
