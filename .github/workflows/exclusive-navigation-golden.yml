name: Exclusive Navigation Golden Visual

on:
  pull_request:
    branches:
      - beta
    paths:
      - 'app/src/main/kotlin/org/koitharu/kotatsu/main/ui/nav/ExclusiveBottomNavigation.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/main/ui/nav/FloatingNavBar.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/ui/widgets/FloatingBottomNavigationView.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/ui/MiyorareColorScheme.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/theme/ExclusiveBottomNavigationSpec.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/theme/ExclusiveThemeContract.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/theme/ExclusiveThemeMixer.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/ui/ReaderJourneyExclusiveCollection.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/main/ui/nav/ExclusiveNavigationGoldenVisualTest.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/main/ui/nav/ExclusiveNavigationMotionRuntimeTest.kt'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/readerjourney/theme/ExclusiveNavigationGuideContractTest.kt'
      - '.github/workflows/exclusive-navigation-golden.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exclusive-navigation-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: 12-theme production visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          echo "Exclusive navigation golden head: $actual"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("gradle/libs.versions.toml").read_text(encoding="utf-8"))
          value = str(data.get("versions", {}).get("parsers", "")).strip()
          if not value:
              raise SystemExit("Missing versions.parsers in gradle/libs.versions.toml")
          print(value)
          PY
          )"
          POM_URL="https://jitpack.io/com/github/Gekkoushi/plugin-source/${PARSERS_VERSION}/plugin-source-${PARSERS_VERSION}.pom"
          for i in $(seq 1 12); do
            HTTP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$POM_URL" || true)"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Parser artifact is ready (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: parser artifact returned HTTP ${HTTP_STATUS:-000}"
            sleep 20
          done
          echo "::error::Parser artifact ${PARSERS_VERSION} is not ready on JitPack"
          exit 1

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Capture all 12 navigation concepts on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb shell wm size 864x1536
            adb shell wm density 320
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night yes
            # Keep the static golden pass deterministic without asking emulator-runner to own
            # animation scale for the whole job. The runtime-motion pass below must be able to
            # restore a real Compose MotionDurationScale in a fresh app process.
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell rm -rf /sdcard/Download/miyorare-exclusive-navigation-golden
            ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace               -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview               -PMIYORARE_VISUAL_TEST_SIGNING=true               -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.main.ui.nav.ExclusiveNavigationGoldenVisualTest
            mkdir -p exclusive-navigation-golden-evidence
            adb pull /sdcard/Download/miyorare-exclusive-navigation-golden/. exclusive-navigation-golden-evidence/
            test -s exclusive-navigation-golden-evidence/00-contact-sheet.png
            test -s exclusive-navigation-golden-evidence/evidence.json

            # The golden pass above is intentionally static. Re-enable Android animation scales
            # and run a second production-path test that must observe intermediate motion frames.
            adb shell settings put global window_animation_scale 1
            adb shell settings put global transition_animation_scale 1
            adb shell settings put global animator_duration_scale 1
            test "$(adb shell settings get global window_animation_scale | tr -d '\r')" = "1"
            test "$(adb shell settings get global transition_animation_scale | tr -d '\r')" = "1"
            test "$(adb shell settings get global animator_duration_scale | tr -d '\r')" = "1"
            adb shell am force-stop org.noirero.miyorare.beta
            adb shell rm -rf /sdcard/Download/miyorare-exclusive-navigation-motion
            ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.main.ui.nav.ExclusiveNavigationMotionRuntimeTest || true
            mkdir -p exclusive-navigation-motion-evidence
            adb pull /sdcard/Download/miyorare-exclusive-navigation-motion/. exclusive-navigation-motion-evidence/
            test -s exclusive-navigation-motion-evidence/motion-evidence.json

      - name: Validate 12-theme visual evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(find exclusive-navigation-golden-evidence -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "13"
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("exclusive-navigation-golden-evidence/evidence.json").read_text())
          themes = evidence.get("themes", [])
          assert len(themes) == 12, f"Expected 12 themes, got {len(themes)}"
          assert len({t["silhouette"] for t in themes}) >= 7
          assert len({t["activeShape"] for t in themes}) >= 9
          assert themes[10]["silhouette"] == "PRISM"
          assert themes[11]["silhouette"] == "CELESTIAL"
          assert themes[10]["activeShape"] == "PRISM_DOUBLE_RING"
          assert themes[11]["activeShape"] == "LUMINOUS_ORB"

          motion = json.loads(Path("exclusive-navigation-motion-evidence/motion-evidence.json").read_text())
          selection = motion["selection"]
          assert len(selection) == 12, f"Expected selection evidence for 12 themes, got {len(selection)}"
          for theme_id, delta in selection.items():
              assert delta > 0.001, (theme_id, delta)
          ambient = motion["ambient"]
          for theme_id in ("cyan_codex", "imperial_aurora", "eternal_library"):
              assert ambient[theme_id] > 0.0003, (theme_id, ambient[theme_id])
          PY

      - name: Upload 12-theme visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exclusive-navigation-golden-evidence
          path: |
            exclusive-navigation-golden-evidence/
            exclusive-navigation-motion-evidence/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
