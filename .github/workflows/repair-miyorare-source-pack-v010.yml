name: Repair Miyorare Source Pack v0.1.0

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/repair-miyorare-source-pack-v010.yml'

permissions:
  contents: write
  actions: read

jobs:
  restore:
    if: github.ref_name == 'beta'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: miyorare-sources-v0.1.0
      SOURCE_RUN: '34688814171'
      SOURCE_COMMIT: ea7e8002b1f48c1e8f4f09cbcdd2a7bdeb5a5224
      ID_SHA256: eb5ab04727fca229fcf80c3041349198ecd75cd9edfb5d6c29175082a55f66b9
      EN_SHA256: 89602856dc3a5dc9413371a29d7de5f44fdd618ecc87de9ee8c63d5724b66b95

    steps:
      - name: Download previously verified source-pack artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/id work/en dist
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name miyorare-id-release --dir work/id
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name miyorare-en-release --dir work/en
          cp "$(find work/id -type f -name 'miyorare-id.jar' -print -quit)" dist/miyorare-id.jar
          cp "$(find work/en -type f -name 'miyorare-en.jar' -print -quit)" dist/miyorare-en.jar
          cp "$(find work/id -type f -name 'miyorare-id.jar.sha256' -print -quit)" dist/miyorare-id.jar.sha256
          cp "$(find work/en -type f -name 'miyorare-en.jar.sha256' -print -quit)" dist/miyorare-en.jar.sha256

      - name: Verify exact published payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum dist/miyorare-id.jar | awk '{print $1}')" = "$ID_SHA256"
          test "$(sha256sum dist/miyorare-en.jar | awk '{print $1}')" = "$EN_SHA256"
          (cd dist && sha256sum -c miyorare-id.jar.sha256)
          (cd dist && sha256sum -c miyorare-en.jar.sha256)
          git_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          test "$git_ref" = "$SOURCE_COMMIT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to repair."
            exit 2
          fi

      - name: Recreate release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          packs = []
          for language in ('id', 'en'):
              asset = Path('dist') / f'miyorare-{language}.jar'
              data = asset.read_bytes()
              packs.append({
                  'pluginId': f'miyorare-{language}',
                  'language': language,
                  'assetName': asset.name,
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          manifest = {
              'schema': 1,
              'version': '0.1.0',
              'tag': os.environ['TAG'],
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'packs': packs,
          }
          Path('dist/miyorare-source-packs.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Restore official GitHub release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/miyorare-id.jar \
            dist/miyorare-en.jar \
            dist/miyorare-id.jar.sha256 \
            dist/miyorare-en.jar.sha256 \
            dist/miyorare-source-packs.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Miyorare Source Packs v0.1.0" \
            --notes "Official Miyorare-ID and Miyorare-EN source packs. Restored byte-for-byte from verified workflow run ${SOURCE_RUN}; source commit ${SOURCE_COMMIT}."
