name: PF5 Final Source Fix

on:
  push:
    branches:
      - pf5

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Apply verified privacy boundary fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Auto Fix: preserve the source classification across ID migration and classify the replacement at build time.
          path = "app/src/main/kotlin/org/koitharu/kotatsu/alternatives/ui/AutoFixService.kt"
          replace(path,
              "\t\tfor (mangaId in ids) {\n\t\t\tpowerManager.withPartialWakeLock(TAG) {\n\t\t\t\tval result = runCatchingCancellable { autoFixUseCase.invoke(mangaId) }\n",
              "\t\tfor (mangaId in ids) {\n\t\t\tpowerManager.withPartialWakeLock(TAG) {\n\t\t\t\t// Auto Fix may migrate membership to a replacement id before the result notification is built.\n\t\t\t\t// Preserve the pre-migration classification so a Private source can never become public merely\n\t\t\t\t// because its old id was removed from private_favourites during a successful migration.\n\t\t\t\tval privateBeforeFix = isPrivateOnly(mangaId)\n\t\t\t\tval result = runCatchingCancellable { autoFixUseCase.invoke(mangaId) }\n")
          replace(path,
              "\t\t\t\t\tval notification = buildNotification(notificationId, mangaId, result)\n",
              "\t\t\t\t\tval notification = buildNotification(notificationId, mangaId, result, privateBeforeFix)\n")
          replace(path,
              "\t\tresult: Result<Pair<Manga, Manga?>>,\n\t): Notification {\n\t\tval isPrivateOnly = mangaId?.let { id -> isPrivateOnly(id) } == true\n",
              "\t\tresult: Result<Pair<Manga, Manga?>>,\n\t\tprivateBeforeFix: Boolean = false,\n\t): Notification {\n\t\tval privacyMangaId = result.getOrNull()?.second?.id ?: mangaId\n\t\tval privateNotification = privateBeforeFix || privacyMangaId?.let { id -> isPrivateOnly(id) } == true\n")
          text = Path(path).read_text()
          text = text.replace("if (isPrivateOnly) notification.setVisibility", "if (privateNotification) notification.setVisibility")
          text = text.replace("\t\t\tif (isPrivateOnly) {", "\t\t\tif (privateNotification) {")
          text = text.replace("\t\t\t\t\tif (isPrivateOnly) {", "\t\t\t\t\tif (privateNotification) {")
          text = text.replace("\t\tif (mangaId != null && isPrivateOnly(mangaId)) {", "\t\tif (privateBeforeFix || (privacyMangaId != null && isPrivateOnly(privacyMangaId))) {")
          Path(path).write_text(text)

          # Migration is already committed at this point; a best-effort progress refresh must not turn a successful migration into a failure result.
          path = "app/src/main/kotlin/org/koitharu/kotatsu/alternatives/domain/MigrateUseCase.kt"
          replace(path,
              "\t\tprogressUpdateUseCase(newManga)\n",
              "\t\trunCatchingCancellable { progressUpdateUseCase(newManga) }\n\t\t\t.onFailure { it.printStackTraceDebug() }\n")

          # Launcher usage reporting is an OS disclosure boundary too, not only shortcut creation/update.
          path = "app/src/main/kotlin/org/koitharu/kotatsu/core/os/AppShortcutManager.kt"
          replace(path,
              "\tfun notifyMangaOpened(mangaId: Long) {\n\t\tShortcutManagerCompat.reportShortcutUsed(context, mangaId.toString())\n\t}\n",
              "\tsuspend fun notifyMangaOpened(mangaId: Long) {\n\t\tif (isPrivateOnly(mangaId)) return\n\t\tShortcutManagerCompat.reportShortcutUsed(context, mangaId.toString())\n\t}\n")

          # Details deep-link classification must be a single DB snapshot to avoid Private/Normal TOCTOU.
          path = "app/src/main/kotlin/org/koitharu/kotatsu/details/ui/DetailsExpressiveActivity.kt"
          replace(path,
              "import org.koitharu.kotatsu.R\n",
              "import org.koitharu.kotatsu.R\nimport org.koitharu.kotatsu.core.db.MangaDatabase\n")
          replace(path,
              "\t@Inject lateinit var settings: AppSettings\n",
              "\t@Inject lateinit var settings: AppSettings\n\t@Inject lateinit var database: MangaDatabase\n")
          replace(path,
              "\t\t\t} else {\n\t\t\t\tval isPrivate = favouritesRepository.isFavorite(manga.id, FavouriteSpace.PRIVATE)\n\t\t\t\tisPrivate && !favouritesRepository.isFavorite(manga.id, FavouriteSpace.NORMAL)\n\t\t\t}\n",
              "\t\t\t} else {\n\t\t\t\t// One SQL snapshot classifies Private-only vs dual membership atomically. This flow owns\n\t\t\t\t// FLAG_SECURE/AssistContent for deep-links whose original Intent may not contain a manga id.\n\t\t\t\tdatabase.getPrivateFavouritesDao().isPrivateOnly(manga.id)\n\t\t\t}\n")

          # Tracker metadata fetched while Normal must not be returned after a mid-flight switch to Private-only.
          path = "app/src/main/kotlin/org/koitharu/kotatsu/scrobbling/common/domain/Scrobbler.kt"
          replace(path,
              "\t\t\tinfoCache.put(targetId, mangaInfo)\n\t\t}\n\t\treturn ScrobblingInfo(\n",
              "\t\t\tinfoCache.put(targetId, mangaInfo)\n\t\t}\n\t\tif (checkPrivacy && isPrivateOnly(mangaId)) return toLocalScrobblingInfo()\n\t\treturn ScrobblingInfo(\n")

          # Cover proxying itself is outbound; re-check immediately before proxy I/O, not only before Discord presence publication.
          path = "app/src/main/kotlin/org/koitharu/kotatsu/scrobbling/discord/ui/DiscordRpc.kt"
          replace(path,
              "\t\t\t\t\t\tlargeImage = it.largeImage?.toMediaProxyUrl(),\n",
              "\t\t\t\t\t\tlargeImage = it.largeImage?.toMediaProxyUrl(mangaId),\n")
          replace(path,
              "\tsuspend fun String.toMediaProxyUrl(): String? {\n\t\tif (repository.isMediaProxyUrl(this)) return this\n\t\tmpCache[this]?.let { return it }\n\t\treturn runCatchingCancellable {\n",
              "\tsuspend fun String.toMediaProxyUrl(mangaId: Long? = null): String? {\n\t\tif (mangaId != null && isPrivateOnly(mangaId)) return null\n\t\tif (repository.isMediaProxyUrl(this)) return this\n\t\tmpCache[this]?.let { return it }\n\t\tif (mangaId != null && isPrivateOnly(mangaId)) return null\n\t\treturn runCatchingCancellable {\n")
          PY

          git diff --check
          git status --short
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin
          git commit -m "Close final Private runtime disclosure races"
          git push origin HEAD:pf5
