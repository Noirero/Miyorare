name: Temporary Finalizer Assertion Fix

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/tmp-fix-settings-finalizer.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
      - name: Relax move-only callback assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/tmp-settings-finalize.yml')
          text = path.read_text(encoding='utf-8')
          old = """          callbacks_after = (downloads.count('onRebuildDownloadsIndex'), downloads.count('onIgnoreDoze'))
          if prefs_before != prefs_after:
              raise RuntimeError('Downloads preference-key wiring changed unexpectedly')
          if callbacks_before != callbacks_after:
              raise RuntimeError('Downloads maintenance callbacks changed unexpectedly')
"""
          new = """          callbacks_after = (downloads.count('onRebuildDownloadsIndex'), downloads.count('onIgnoreDoze'))
          if prefs_before != prefs_after:
              raise RuntimeError('Downloads preference-key wiring changed unexpectedly')
          if 'onClick = onRebuildDownloadsIndex' not in downloads or 'onClick = onIgnoreDoze' not in downloads:
              raise RuntimeError('Downloads maintenance callbacks were disconnected')
"""
          if text.count(old) != 1:
              raise SystemExit('Expected finalizer assertion block was not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit assertion fix
        run: |
          git config user.name 'LatishaLIFE'
          git config user.email '149634319+Noirero@users.noreply.github.com'
          git add .github/workflows/tmp-settings-finalize.yml
          git commit -m 'Relax temporary settings move assertion'
          git push origin HEAD:beta
