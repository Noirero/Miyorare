name: PF5 Download Privacy Refresh

on:
  push:
    branches:
      - pf5

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/pf5_download_privacy_refresh_patch.py
          git diff --check

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION=$(grep 'parsers = ' gradle/libs.versions.toml | sed 's/.*= "\(.*\)"/\1/')
          POM_URL="https://jitpack.io/com/github/YakaTeam/kotatsu-parsers/${PARSERS_VERSION}/kotatsu-parsers-${PARSERS_VERSION}.pom"
          for i in $(seq 1 10); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$POM_URL")
            if [ "$HTTP_STATUS" = "200" ]; then exit 0; fi
            sleep 15
          done
          exit 1

      - name: Compile all JVM unit tests
        run: ./gradlew :app:compileDebugUnitTestKotlin --no-daemon --stacktrace

      - name: Run affected privacy tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests org.koitharu.kotatsu.main.ui.protect.ScreenshotPolicyHelperTest \
            --tests org.koitharu.kotatsu.reader.ui.tts.ReaderTtsPrivacyPolicyTest \
            --tests org.koitharu.kotatsu.history.data.TrackingProgressPolicyTest

      - name: Check changed-file lint
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintPreview --no-daemon --stacktrace
          set -e
          REPORT="app/build/intermediates/lint_intermediate_text_report/preview/lintReportPreview/lint-results-preview.txt"
          test -f "$REPORT"
          if grep -E 'DownloadWorker\.kt:.*Error:' "$REPORT"; then
            echo 'Lint regression found in DownloadWorker'
            exit 1
          fi

      - name: Assemble Preview APK
        run: ./gradlew :app:assemblePreview --no-daemon --stacktrace

      - name: Commit source hardening to pf5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/org/koitharu/kotatsu/download/ui/worker/DownloadWorker.kt
          git commit -m 'Refresh download notification on Private membership changes'
          git push origin HEAD:pf5
