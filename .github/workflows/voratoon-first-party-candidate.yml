name: VoraToon first-party candidate
on:
  pull_request:
    branches: [Amain2]
    paths:
      - 'extensions/miyorare-sources/first-party/voratoon/**'
      - 'extensions/miyorare-sources/tools/finalize_voratoon_candidate.py'
      - 'extensions/miyorare-sources/tools/assemble_voratoon_global_staging.py'
      - '.github/workflows/miyorare-global-source-pack-check.yml'
      - '.github/workflows/voratoon-first-party-candidate.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: InvalidDavid/UMA
          ref: 52185ec4faada143f57dcfb41c6fa49aa346b4db
          path: _baseline
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Noirero/Miyorare-Source-Packs
          ref: a88f541a3e486dd5e7660ad2c9b1d00c971a4b56
          path: _fixtures
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: |
            11
            17
      - name: Stage local parser and fixtures on exact baseline
        run: |
          test "$(git -C _baseline rev-parse HEAD)" = 52185ec4faada143f57dcfb41c6fa49aa346b4db
          test "$(git -C _fixtures rev-parse HEAD)" = a88f541a3e486dd5e7660ad2c9b1d00c971a4b56
          cp -R extensions/miyorare-sources/first-party/voratoon/src/. _baseline/src/main/kotlin/
          mkdir -p _baseline/src/test/kotlin/compatibilityfarm
          cp _fixtures/compatibility/harness/candidates/voratoon/*.kt _baseline/src/test/kotlin/compatibilityfarm/
      - name: Test local parser on existing Tsuki build baseline
        working-directory: _baseline
        run: bash ./gradlew test --no-daemon --tests compatibilityfarm.VoraToonCandidateContractTest
      - name: Set up Android SDK for D8
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'
      - name: Stage only the local VoraToon parser
        run: |
          PYTHONPATH=extensions/miyorare-sources/tools python3 - <<'PY'
          import shutil
          from pathlib import Path
          from prepare_pack import (
              assert_only_requested_parsers_remain,
              prune_unselected_parser_files,
          )

          site = Path('_baseline/src/main/kotlin/tsuki/site')
          language = site / 'id'
          if not (language / 'VoraToon.kt').is_file():
              raise SystemExit('Staged local parser is missing')
          for child in site.iterdir():
              if child != language:
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()
          requested = ['VoraToon.kt']
          prune_unselected_parser_files(language, requested)
          assert_only_requested_parsers_remain(language, requested)
          PY
      - name: Build single-source dex JAR
        working-directory: _baseline
        run: bash ./gradlew buildJar --rerun-tasks --no-daemon
      - name: Verify generated key, dex, and checksum
        run: |
          python3 extensions/miyorare-sources/tools/finalize_voratoon_candidate.py \
            --upstream _baseline --output build/voratoon-candidate
      - name: Upload build-only candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voratoon-dex-candidate-not-for-install
          path: build/voratoon-candidate/
          if-no-files-found: error
  gekkoushi-staging:
    uses: ./.github/workflows/miyorare-global-source-pack-check.yml
    with:
      staging-only: true

  assemble-global-staging:
    needs: [contract, gekkoushi-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: miyorare-global-staging
          path: _artifacts/global
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: voratoon-dex-candidate-not-for-install
          path: _artifacts/voratoon
      - name: Verify and assemble both Global shards
        run: |
          python3 extensions/miyorare-sources/tools/assemble_voratoon_global_staging.py \
            --global _artifacts/global --voratoon _artifacts/voratoon \
            --output build/global-voratoon-staging --revision "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: miyorare-global-voratoon-staging
          path: build/global-voratoon-staging/
          if-no-files-found: error
