name: Apply novel reader profiles

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/apply-novel-reader-profiles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded patch
        run: |
          sed -i 's/"settings.isEpubBionicReadingEnabled", "activeBionicReading", minimum=2/"settings.isEpubBionicReadingEnabled", "activeBionicReading", minimum=1/' .github/scripts/apply_novel_reader_profiles.py
          python3 .github/scripts/apply_novel_reader_profiles.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt \
                  app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/config/ReaderConfigSheet.kt \
                  app/src/main/res/values/strings_novel_reader_settings.xml \
                  app/src/main/res/values-in/strings_novel_reader_settings.xml
          git diff --cached --check
          git commit -m "Apply per-novel reader profiles and sampled EPUB images"
          git push
