name: M2 Preview Build

on:
  push:
    branches:
      - feature/miyorare-source-m2

permissions:
  contents: read

concurrency:
  group: m2-preview-feature
  cancel-in-progress: true

jobs:
  build:
    name: Build Miyorare M2 debug APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout M2 branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify M2 source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "feature/miyorare-source-m2" ]; then
            echo "::error::This temporary build may only run on feature/miyorare-source-m2."
            exit 1
          fi
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "${GITHUB_SHA}" ]; then
            echo "::error::Checked out $ACTUAL, expected ${GITHUB_SHA}."
            exit 1
          fi
          echo "Building M2 branch at $ACTUAL"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pre-warm JitPack dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION=$(grep 'parsers = ' gradle/libs.versions.toml | sed 's/.*= "\(.*\)"/\1/')
          POM_URL="https://jitpack.io/com/github/YakaTeam/kotatsu-parsers/${PARSERS_VERSION}/kotatsu-parsers-${PARSERS_VERSION}.pom"
          for i in $(seq 1 10); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$POM_URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "JitPack artifact is ready."
              exit 0
            fi
            echo "Attempt $i: JitPack returned HTTP ${HTTP_STATUS}; retrying..."
            sleep 15
          done
          echo "::error::JitPack dependency was not ready after 10 attempts."
          exit 1

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify debug identity and collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/debug/output-metadata.json').read_text())
          expected = 'org.noirero.miyorare.debug'
          actual = metadata.get('applicationId')
          if actual != expected:
              raise SystemExit(f'Built applicationId is {actual!r}, expected {expected!r}')
          print(f'Verified M2 debug applicationId: {actual}')
          PY

          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)
          test -n "$APK" || { echo "::error::No debug APK found"; exit 1; }
          SHORT_SHA=$(git rev-parse --short HEAD)
          DEST="Miyorare-M2-Debug-${SHORT_SHA}.apk"
          cp "$APK" "$DEST"
          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          SIZE=$(du -h "$DEST" | cut -f1)
          echo "apk_name=$DEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Miyorare M2 Debug"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source branch | \`feature/miyorare-source-m2\` |"
            echo "| Commit | \`${SHORT_SHA}\` |"
            echo "| Application ID | \`org.noirero.miyorare.debug\` |"
            echo "| APK | \`${DEST}\` |"
            echo "| Size | ${SIZE} |"
            echo "| SHA-256 | \`${SHA256}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload M2 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 7
