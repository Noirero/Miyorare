name: Miyorare Main Build
run-name: Miyorare Main Build · ${{ github.ref_name }}

# Manual-only stable build entry point for the main branch.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'MAIN ONLY: optional stable version (e.g. 1.4.0). Leave empty for the next monotonic stable version.'
        required: false
        type: string

concurrency:
  group: release-workflow
  cancel-in-progress: false

jobs:
  outside-main:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip stable release outside main
        shell: bash
        run: |
          echo "::notice::Stable Miyorare release skipped because branch '${GITHUB_REF_NAME}' is not main. Use the 'Beta Build' workflow for beta APKs."
          {
            echo "### Stable release skipped"
            echo
            echo "Branch \`${GITHUB_REF_NAME}\` is not allowed to produce a stable Miyorare release."
            echo "Use the **Beta Build** workflow on branch \`beta\` for Miyorare Beta APKs."
            echo "No APK or GitHub Release was created by this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Require final identity
      shell: bash
      run: |
        set -euo pipefail
        grep -Fq "applicationId = 'org.noirero.miyorare'" app/build.gradle || {
          echo "::error::Miyorare final applicationId is missing."
          exit 1
        }
        grep -Fq '<string name="github_updates_repo" translatable="false">Noirero/Miyorare</string>' app/src/main/res/values/constants.xml || {
          echo "::error::Miyorare update repository guard failed."
          exit 1
        }

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Determine release version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        REQUESTED="${{ inputs.version_name }}"
        BUILD_GRADLE="app/build.gradle"
        TAGS_FILE="build/stable-release-tags.txt"

        BASE_VERSION=$(grep -E "versionName = '[0-9]+\.[0-9]+\.[0-9]+([^']*)?'" "$BUILD_GRADLE" | head -n1 | sed -E "s/.*versionName = '([0-9]+\.[0-9]+\.[0-9]+)[^']*'.*/\1/")
        if [ -z "$BASE_VERSION" ]; then
          echo "::error::Could not read a three-part numeric versionName from app/build.gradle."
          exit 1
        fi

        mkdir -p build
        git tag --list 'v*' > "$TAGS_FILE"
        if ! VERSION_NAME="$(python3 .github/scripts/release_version.py \
          --base-version "$BASE_VERSION" \
          --tags-file "$TAGS_FILE" \
          --requested "$REQUESTED")"; then
          echo "::error::Stable release version resolution failed."
          exit 1
        fi

        # Monotonic across workflow replacements: seconds since 2020-01-01 UTC.
        # This avoids GITHUB_RUN_NUMBER resets when a workflow file is replaced.
        VERSION_CODE=$(( $(date -u +%s) - 1577836800 ))
        LEGACY_VERSION_CODE_FLOOR=100181
        if [ "$VERSION_CODE" -le "$LEGACY_VERSION_CODE_FLOOR" ]; then
          VERSION_CODE=$((LEGACY_VERSION_CODE_FLOOR + 1))
        fi
        if [ "$VERSION_CODE" -gt 2100000000 ]; then
          echo "::error::Generated Android versionCode is too large."
          exit 1
        fi

        echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "Release version: $VERSION_NAME (versionCode $VERSION_CODE)"

    - name: Require compatible stable Source Pack
      id: source_pack_readiness
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MIYORARE_VERSION_CODE: ${{ steps.version.outputs.code }}
        SOURCE_PACK_REPOSITORY: Noirero/Miyorare-Source-Packs
      run: |
        set -euo pipefail
        mkdir -p build/source-pack-readiness
        releases=build/source-pack-readiness/releases.json
        gh api "repos/$SOURCE_PACK_REPOSITORY/releases?per_page=100" > "$releases"

        mapfile -t tags < <(
          python3 .github/scripts/source_pack_readiness.py list-tags \
            --releases "$releases"
        )
        if [[ ${#tags[@]} -eq 0 ]]; then
          echo "::error::No public stable Miyorare Source Pack releases were found."
          exit 1
        fi

        selected=""
        selected_readiness=""
        for tag in "${tags[@]}"; do
          candidate="build/source-pack-readiness/$tag"
          rm -rf "$candidate"
          mkdir -p "$candidate"

          echo "Checking Source Pack $tag for Miyorare versionCode $MIYORARE_VERSION_CODE"

          if ! gh api "repos/$SOURCE_PACK_REPOSITORY/releases/tags/$tag" > "$candidate/release.json"; then
            echo "::warning::Could not resolve release metadata for $tag"
            continue
          fi

          if ! gh release download "$tag" \
            --repo "$SOURCE_PACK_REPOSITORY" \
            --dir "$candidate" \
            --pattern miyorare-source-packs.json \
            --pattern miyorare-release-lock.json \
            --pattern miyorare-release-lock.sha256; then
            echo "::warning::Required readiness metadata is incomplete for $tag"
            continue
          fi

          if python3 .github/scripts/source_pack_readiness.py validate \
            --release "$candidate/release.json" \
            --manifest "$candidate/miyorare-source-packs.json" \
            --lock "$candidate/miyorare-release-lock.json" \
            --lock-sha256 "$candidate/miyorare-release-lock.sha256" \
            --contract compatibility/miyorare-source-pack-contract.v1.json \
            --app-version-code "$MIYORARE_VERSION_CODE" \
            > "$candidate/readiness.json"; then
            selected="$tag"
            selected_readiness="$candidate/readiness.json"
            cat "$selected_readiness"
            break
          fi
          echo "::notice::Source Pack $tag is not compatible/ready for this stable Miyorare build."
        done

        if [[ -z "$selected" ]]; then
          echo "::error::No compatible, sealed, public stable Source Pack exists for Miyorare versionCode $MIYORARE_VERSION_CODE."
          exit 1
        fi

        snapshot_id="$(python3 - "$selected_readiness" <<'PY'
        import json, sys
        data = json.load(open(sys.argv[1], encoding='utf-8'))
        print(data['compatibilitySnapshotId'])
        PY
        )"
        farm_commit="$(python3 - "$selected_readiness" <<'PY'
        import json, sys
        data = json.load(open(sys.argv[1], encoding='utf-8'))
        print(data['farmCommit'])
        PY
        )"
        [[ "$snapshot_id" =~ ^[0-9a-f]{64}$ ]]
        [[ "$farm_commit" =~ ^[0-9a-f]{40}$ ]]

        echo "tag=$selected" >> "$GITHUB_OUTPUT"
        echo "compatibility_snapshot_id=$snapshot_id" >> "$GITHUB_OUTPUT"
        echo "farm_commit=$farm_commit" >> "$GITHUB_OUTPUT"
        {
          echo "### Stable Source Pack readiness"
          echo
          echo "Compatible release: `$selected`"
          echo "Target Miyorare versionCode: `$MIYORARE_VERSION_CODE`"
          echo "Compatibility snapshot ID: `$snapshot_id`"
          echo "Compatibility Farm commit: `$farm_commit`"
          echo "Manifest, logical packs, GitHub SHA-256 metadata, compatibility snapshot, release lock, and compatibility range validated."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Require stable release signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        missing=0
        for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
          if [ -z "${!name:-}" ]; then
            echo "::error::Missing required repository secret: $name"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "::error::A permanent signing key is required so future APKs can update the installed fork."
          exit 1
        fi

    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

    - name: Apply build-only version
      env:
        VERSION_NAME: ${{ steps.version.outputs.name }}
        VERSION_CODE: ${{ steps.version.outputs.code }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os
        import re
        from pathlib import Path

        path = Path('app/build.gradle')
        text = path.read_text()
        text, count_name = re.subn(r"versionName = '[^']+'", f"versionName = '{os.environ['VERSION_NAME']}'", text, count=1)
        text, count_code = re.subn(r'versionCode = \d+', f"versionCode = {os.environ['VERSION_CODE']}", text, count=1)
        if count_name != 1 or count_code != 1:
            raise SystemExit('Could not update versionName/versionCode exactly once')
        path.write_text(text)
        PY

    - name: Build Release APK
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        ./gradlew assembleRelease --no-daemon --stacktrace \
          -PRELEASE_STORE_FILE=../release.keystore \
          -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
          -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
          -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

    - name: Generate changelog
      id: changelog
      shell: bash
      run: |
        set -euo pipefail
        CHANGELOG=$(cat .github/release-notes.md)
        {
          echo "changelog<<EOF"
          echo "$CHANGELOG"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Collect Release APKs
      env:
        VERSION_NAME: ${{ steps.version.outputs.name }}
      run: |
        set -euo pipefail
        mkdir -p release
        shopt -s nullglob
        APK_FILES=(app/build/outputs/apk/release/*.apk)
        if [ ${#APK_FILES[@]} -eq 0 ]; then
          echo "::error::No release APK file found"
          exit 1
        fi

        for apk in "${APK_FILES[@]}"; do
          if [ ${#APK_FILES[@]} -eq 1 ]; then
            target="release/Miyorare-v${VERSION_NAME}.apk"
          else
            original_apk_name=$(basename "$apk" .apk)
            target="release/Miyorare-v${VERSION_NAME}-${original_apk_name}.apk"
          fi
          cp "$apk" "$target"
        done

    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Miyorare-v${{ steps.version.outputs.name }}
        path: release/*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION_NAME: ${{ steps.version.outputs.name }}
        CHANGELOG: ${{ steps.changelog.outputs.changelog }}
      run: |
        set -euo pipefail
        TAG="v${VERSION_NAME}"
        NOTES_FILE="release_notes.md"

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "::error::Release $TAG already exists. Run the workflow again to generate a new automatic version."
          exit 1
        fi

        {
          echo "## Miyorare v${VERSION_NAME}"
          echo
          printf '%s\n' "$CHANGELOG"
        } > "$NOTES_FILE"

        gh release create "$TAG" release/*.apk \
          --title "$TAG" \
          --target "${{ github.sha }}" \
          --notes-file "$NOTES_FILE"

    - name: Update README release verification through protected main
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION_NAME: ${{ steps.version.outputs.name }}
      shell: bash
      run: |
        set -euo pipefail

        git restore app/build.gradle
        git fetch origin main
        git checkout -B release-readme-base origin/main

        python3 - <<'PY'
        import hashlib
        import os
        from pathlib import Path

        readme = Path('README.md')
        start = '<!-- RELEASE_README_START -->'
        end = '<!-- RELEASE_README_END -->'
        text = readme.read_text()
        if text.count(start) != 1 or text.count(end) != 1:
            raise SystemExit('README release verification markers are missing or duplicated')

        repo = os.environ['GITHUB_REPOSITORY']
        version = os.environ['VERSION_NAME']
        commit = os.environ['GITHUB_SHA']
        run_id = os.environ['GITHUB_RUN_ID']
        apk_files = sorted(Path('release').glob('*.apk'))
        if not apk_files:
            raise SystemExit('No collected release APKs found while updating README')

        apk_lines = []
        for apk in apk_files:
            digest = hashlib.sha256(apk.read_bytes()).hexdigest()
            apk_lines.append(f'  - `{apk.name}` — `{digest}`')

        block = '\n'.join([
            start,
            f'- **Versi:** [v{version}](https://github.com/{repo}/releases/tag/v{version})',
            f'- **Commit:** [`{commit}`](https://github.com/{repo}/commit/{commit})',
            f'- **GitHub Actions:** [run {run_id}](https://github.com/{repo}/actions/runs/{run_id})',
            '- **APK dan SHA-256:**',
            *apk_lines,
            end,
        ])

        before, remainder = text.split(start, 1)
        _, after = remainder.split(end, 1)
        readme.write_text(before + block + after)
        PY

        if git diff --quiet -- README.md; then
          echo "README release verification is already current."
          exit 0
        fi

        mapfile -t stale < <(
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/release-readme-")) | .number'
        )
        for pr in "${stale[@]}"; do
          gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch || true
        done

        branch="automation/release-readme-v${VERSION_NAME}-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
        git switch -c "$branch"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -m "Update README release verification"
        git push origin "HEAD:$branch"
        head_sha="$(git rev-parse HEAD)"

        url="$(gh pr create \
          --repo "$GITHUB_REPOSITORY" \
          --base main \
          --head "$branch" \
          --title "Update README for v${VERSION_NAME}" \
          --body "Automated post-release verification metadata for v${VERSION_NAME}. The release was produced from commit ${GITHUB_SHA} by Actions run ${GITHUB_RUN_ID}.")"
        pr_number="$(gh pr view "$url" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"

        gh workflow run identity-guard.yml \
          --repo "$GITHUB_REPOSITORY" \
          --ref "$branch"

        identity_run=""
        for attempt in $(seq 1 60); do
          identity_run="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow identity-guard.yml \
            --branch "$branch" \
            --event workflow_dispatch \
            --limit 20 \
            --json databaseId,headSha \
            --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" \
            | head -n 1)"
          if [[ -n "$identity_run" ]]; then
            break
          fi
          sleep 2
        done
        if [[ -z "$identity_run" ]]; then
          echo "::error::Could not resolve Identity Guard for README PR head $head_sha."
          exit 1
        fi

        gh run watch "$identity_run" \
          --repo "$GITHUB_REPOSITORY" \
          --exit-status \
          --interval 10

        live_sha="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
        [[ "$live_sha" == "$head_sha" ]]
        gh pr merge "$pr_number" \
          --repo "$GITHUB_REPOSITORY" \
          --squash \
          --delete-branch
        merged="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json mergedAt --jq '.mergedAt')"
        [[ -n "$merged" && "$merged" != "null" ]]

