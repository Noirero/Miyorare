name: Exclusive Badge Golden Visual

on:
  pull_request:
    branches:
      - beta
    paths:
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/theme/ReferenceRankThemeVisuals.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/ui/ExclusiveBadge*.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/ui/ExclusiveProfileFrame.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/ui/ReferenceRankThemeVisuals.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/ui/ReaderJourneyExclusiveCollection.kt'
      # Shared host: the classify job gates profile changes before any Gradle/emulator work.
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/ui/StatsScreen.kt'
      - 'app/src/main/res/drawable*/badge_*'
      - 'app/src/main/res/raw*/badge_*'
      - 'app/src/main/badge-assets/**'
      - 'tools/regenerate_badge_v2_payload.py'
      - 'app/build.gradle'
      - 'app/src/test/kotlin/org/koitharu/kotatsu/readerjourney/ui/ExclusiveBadgeGuideContractTest.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/readerjourney/ui/ExclusiveBadgeGoldenVisualTest.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/readerjourney/ui/ExclusiveBadgeBatterySaverTest.kt'
      - 'app/src/androidTest/kotlin/org/koitharu/kotatsu/stats/ui/BadgeV2ActualUiSmokeTest.kt'
      - '.github/workflows/exclusive-badge-golden.yml'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/theme/RankTheme.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/theme/ExclusiveThemeQa.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/ui/ExclusivePowerSaveModeRuntime.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/domain/ReaderJourneyCosmetic*.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/domain/ReaderProfile.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/domain/ReaderJourney.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/readerjourney/domain/ReaderJourneyRewardAccess.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/stats/ui/StatsComponents.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/core/prefs/AppSettings.kt'
      - 'app/src/main/kotlin/org/koitharu/kotatsu/settings/compose/SettingsState.kt'
      - 'app/src/main/res/drawable*/ic_lock.*'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/scripts/exclusive_visual_paths.py'
      - '.github/scripts/test_exclusive_visual_paths.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exclusive-badge-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Badge visual inputs
    runs-on: ubuntu-latest
    outputs:
      run_visual: ${{ steps.classify.outputs.run_visual }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify visual routing policy
        run: python3 .github/scripts/test_exclusive_visual_paths.py

      - name: Classify visual changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_visual=true
          else
            run_visual="$(python3 .github/scripts/exclusive_visual_paths.py --kind badge --base "$BASE_SHA" --head "$HEAD_SHA")"
          fi
          echo "run_visual=$run_visual" >> "$GITHUB_OUTPUT"
          echo "Badge golden emulator required: $run_visual" >> "$GITHUB_STEP_SUMMARY"

  payload:
    needs: classify
    if: needs.classify.outputs.run_visual == 'true'
    name: Verify V2 payload provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify generated payload is current
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/regenerate_badge_v2_payload.py --check
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  golden:
    needs: payload
    name: V2 static production-renderer evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout exact static candidate
        uses: actions/checkout@v5
        with:
          # Build the exact finalized correction commit, without merging Beta.
          ref: ${{ needs.payload.outputs.candidate }}
          fetch-depth: 0

      - name: Verify V2 payload provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/regenerate_badge_v2_payload.py --check
          mkdir -p exclusive-badge-golden-evidence
          git rev-parse HEAD > exclusive-badge-golden-evidence/commit.txt
          cp app/src/main/badge-assets/v2-source-manifest.json exclusive-badge-golden-evidence/
          sha256sum app/src/main/badge-assets/exclusive_badge_material_payload.b64 > exclusive-badge-golden-evidence/payload.sha256

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pre-warm parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSERS_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("gradle/libs.versions.toml").read_text(encoding="utf-8"))
          value = str(data.get("versions", {}).get("parsers", "")).strip()
          if not value:
              raise SystemExit("Missing versions.parsers in gradle/libs.versions.toml")
          print(value)
          PY
          )"
          POM_URL="https://jitpack.io/com/github/Gekkoushi/plugin-source/${PARSERS_VERSION}/plugin-source-${PARSERS_VERSION}.pom"
          for i in $(seq 1 12); do
            HTTP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$POM_URL" || true)"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Parser artifact is ready (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: parser artifact returned HTTP ${HTTP_STATUS:-000}"
            sleep 20
          done
          echo "::error::Parser artifact ${PARSERS_VERSION} is not ready on JitPack"
          exit 1

      - name: Run badge guide contract tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests org.koitharu.kotatsu.readerjourney.ui.ExclusiveBadgeGuideContractTest

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Capture 12 V2 badges in three static contexts on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35

          emulator-build: 13823996
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 864x1536
            adb shell wm density 320
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night yes
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell rm -rf /sdcard/Download/miyorare-exclusive-badge-golden
            ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.readerjourney.ui.ExclusiveBadgeGoldenVisualTest#captureV2StaticThreeContexts
            adb pull /sdcard/Download/miyorare-exclusive-badge-golden/. exclusive-badge-golden-evidence/
            adb shell rm -rf /sdcard/Download/miyorare-badge-v2-ui-smoke
            ./gradlew :app:connectedPreviewAndroidTest --no-daemon --stacktrace -PMIYORARE_ANDROID_TEST_BUILD_TYPE=preview -PMIYORARE_VISUAL_TEST_SIGNING=true -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.stats.ui.BadgeV2ActualUiSmokeTest
            mkdir -p badge-v2-ui-smoke
            adb pull /sdcard/Download/miyorare-badge-v2-ui-smoke/. badge-v2-ui-smoke/
            test -s badge-v2-ui-smoke/actual-badge-selector-static.png
            test -s badge-v2-ui-smoke/actual-large-preview-static.png
            test -s badge-v2-ui-smoke/actual-profile-equipped-static.png
            test -s badge-v2-ui-smoke/actual-ui-smoke.json

      - name: Validate evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("exclusive-badge-golden-evidence")
          evidence = json.loads((root / "v2-static-evidence.json").read_text())
          manifest = json.loads((root / "v2-source-manifest.json").read_text())
          checksums = {a["name"]: a["sha256"] for a in manifest["assets"]}
          assert evidence["badgeCount"] == 12
          assert [c["context"] for c in evidence["contexts"]] == ["large-preview", "selector-grid", "mini-profile"]
          assert [c["badgeSizeDp"] for c in evidence["contexts"]] == [148, 44, 34]
          for context in evidence["contexts"]:
              assert context["animate"] is False
              assert len(context["badges"]) == 12
              assert {b["index"] for b in context["badges"]} == set(range(1, 13))
              assert (root / context["contactSheet"]).stat().st_size > 0
              for badge in context["badges"]:
                  assert badge["assetSha256"] == checksums[badge["resource"]], badge
                  assert badge["staticDelta"] < 0.001, badge
                  assert badge["captureWidthPx"] == badge["captureHeightPx"]
                  for field in ["render", "screen"]:
                      assert (root / badge[field]).stat().st_size > 0
          PY

      - name: Validate actual production UI smoke contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("badge-v2-ui-smoke")
          evidence = json.loads((root / "actual-ui-smoke.json").read_text())
          assert evidence["animation"] is False
          assert evidence["selectorStaticDelta"] < 0.001, evidence
          assert evidence["profileBadgeStaticDelta"] < 0.003, evidence
          for name in evidence["screens"]:
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, name
          PY

      - name: Upload exclusive badge golden evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exclusive-badge-golden-evidence
          path: |
            exclusive-badge-golden-evidence/
            badge-v2-ui-smoke/
            app/build/outputs/apk/preview/
            app/build/outputs/apk/androidTest/preview/
            app/build/reports/tests/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
